  .bar .title small{font-weight:400;color:var(--muted);font-size:.72rem}

  .chip{cursor:pointer;font-size:.74rem;padding:5px 9px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--ink);user-select:none;display:inline-flex;align-items:center;gap:6px}

  .chip.off{opacity:.35;text-decoration:line-through}
  .sep{width:1px;height:22px;background:var(--line);margin:0 2px}
  .spacer{flex:1}
  .hint{color:var(--muted);font-size:.72rem}

    background-image:radial-gradient(var(--grid) 1px, transparent 1px);background-size:26px 26px}
  .stage.grabbing{cursor:grabbing}
  svg{width:100%;height:100%;display:block}

  .edge{fill:none;stroke:var(--wire);stroke-width:1.6;transition:stroke .15s,stroke-width .15s}
  .edge.sub{stroke:var(--co)}
  .edge.gap{stroke:var(--tg);stroke-width:2.2}
  .edge.hot{stroke:var(--hot);stroke-width:2.9}

  .n{cursor:pointer}
  .n rect{rx:9;ry:9;fill:var(--node);stroke:var(--c);stroke-width:1.7;transition:fill .15s,stroke-width .15s,opacity .15s;

  .n .lbl{fill:var(--ink);font-size:12.5px;font-weight:600;dominant-baseline:middle}
  .n .sub{fill:var(--muted);font-size:10px;font-family:ui-monospace,monospace;dominant-baseline:middle}
  .n.sys rect{fill:var(--c);stroke:var(--c)}
  .n.sys .lbl{fill:#06101f;font-weight:800;font-size:14px}
  .n.root rect{fill:var(--node2)}
  .n.group rect{fill:var(--node2);stroke-dasharray:0}
  .n.gap rect{stroke:var(--tg);stroke-width:2.4;fill:color-mix(in srgb,var(--tg) 16%,var(--node))}
  .n.hassub rect{stroke:var(--co)}
  .n:hover rect{stroke-width:3}
  .n.hit rect{stroke:var(--hot);stroke-width:3.4;filter:drop-shadow(0 0 7px var(--hot))}
  .n.dim{opacity:.18}
  .badge circle{fill:var(--c);stroke:var(--bg);stroke-width:2}
  .badge text{fill:#06101f;font-size:10px;font-weight:800;text-anchor:middle;dominant-baseline:central}

  /* detail panel */
  #info{position:absolute;top:12px;right:12px;width:300px;max-height:calc(100% - 24px);overflow:auto;
    background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.4);

  #info .meta{font-size:.74rem;color:var(--muted);margin-bottom:10px;font-family:ui-monospace,monospace}
  #info .tag{display:inline-block;font-size:.68rem;padding:2px 7px;border-radius:999px;border:1px solid var(--line);margin-right:5px}
  #info ul{margin:8px 0 0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:3px}
  #info li{font-family:ui-monospace,monospace;font-size:.76rem;color:var(--ink);padding:3px 8px;background:var(--bg);border-radius:6px}
  #info .x{position:absolute;top:10px;right:12px;cursor:pointer;color:var(--muted);font-size:1.1rem;border:none;background:none}
  .legendline{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;font-size:.72rem;color:var(--muted)}

function measure(n){
  ctx.font='600 12.5px system-ui'; let w=ctx.measureText(n.label).width;
  if(n.sub){ ctx.font='500 10px ui-monospace'; w=Math.max(w,ctx.measureText(n.sub).width); }
  return Math.min(244, Math.max(86, Math.ceil(w)+28));
}

let VIS=[];
function layout(){
  VIS=[]; let cur=0;
  (function walk(n){
    if(n._hidden) return;
    n.w=measure(n); n.h=n.sub?46:32; VIS.push(n);
    const kids=(n.c||[]).filter(c=>!c._hidden);
    const leaf = n._c || kids.length===0;
    if(ORIENT==='TB'){ n.cy = n.depth*YSTEP + n.h/2; if(leaf){ n.cx=cur+n.w/2; cur+=n.w+HGAP; } }
    else            { n.cx = n.depth*XSTEP + n.w/2; if(leaf){ n.cy=cur+n.h/2; cur+=n.h+VGAP; } }
    if(leaf) return;
    kids.forEach(walk);
    if(ORIENT==='TB'){ n.cx=(kids[0].cx+kids[kids.length-1].cx)/2; }
    else            { n.cy=(kids[0].cy+kids[kids.length-1].cy)/2; }
  })(DATA);
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
const NS='http://www.w3.org/2000/svg';
function mkNode(n){ const g=document.createElementNS(NS,'g'); g.setAttribute('data-id',n.id); nodesG.appendChild(g); nodeEls[n.id]=g; return g; }
function nodeContent(g,n){
  const col=COL[n.col]||COL.root, hh=n.h, ww=n.w;
  const cls=['n',n.t||'leaf']; if(n.tag) cls.push(n.tag); if(n._hit) cls.push('hit');
  g.setAttribute('class',cls.join(' ')); g.style.setProperty('--c',col);
  const sub=n.sub?`<text class="sub" x="13" y="${hh/2+9}">${esc(n.sub)}</text>`:'';
  const ly=n.sub?hh/2-6:hh/2;
  let badge='';
  if(n._c && n.c && n.c.length){ const bx=ORIENT==='TB'?ww/2:ww, by=ORIENT==='TB'?hh:hh/2;
    badge=`<g class="badge"><circle cx="${bx}" cy="${by}" r="9"/><text x="${bx}" y="${by}">${n.c.length}</text></g>`; }
  g.innerHTML=`<rect width="${ww}" height="${hh}"/><text class="lbl" x="13" y="${ly}">${esc(n.label)}</text>${sub}${badge}`;
}
function placeNode(id){ const c=cur[id],n=idx[id],g=nodeEls[id]; if(!g||!n||!c)return;
  g.setAttribute('transform',`translate(${c.x},${c.y}) scale(${c.s}) translate(${-n.w/2},${-n.h/2})`); g.style.opacity=c.o; }
function mkEdge(n){ const p=document.createElementNS(NS,'path');
  p.setAttribute('data-s',n.parent.id); p.setAttribute('data-t',n.id);
  let cls='edge'; const base = n.tag==='gap'?.9:(n.parent.tag==='hassub'?.85:.5);
  if(n.tag==='gap')cls+=' gap'; else if(n.parent.tag==='hassub')cls+=' sub';
  p.setAttribute('class',cls); p.dataset.base=base; p.dataset.o='0'; p.style.opacity='0';
  edgesG.appendChild(p); edgeEls[n.id]=p; return p; }
function edgeD(cid){ const n=idx[cid], pc=cur[n.parent.id], cc=cur[cid], p=idx[n.parent.id]; if(!pc||!cc)return '';
  if(ORIENT==='TB'){ const x1=pc.x,y1=pc.y+p.h/2,x2=cc.x,y2=cc.y-n.h/2,dy=Math.max(16,(y2-y1)/2);
    return `M${x1},${y1} C${x1},${y1+dy} ${x2},${y2-dy} ${x2},${y2}`; }
  const x1=pc.x+p.w/2,y1=pc.y,x2=cc.x-n.w/2,y2=cc.y,dx=Math.max(18,(x2-x1)/2);
  return `M${x1},${y1} C${x1+dx},${y1} ${x2-dx},${y2} ${x2},${y2}`; }

function render(instant, panTo){
  const animate = !instant && !firstDraw; firstDraw=false;
  const panFrom = (panTo && animate) ? {x:tx,y:ty} : null;
  const vis={}; VIS.forEach(n=>vis[n.id]=n);
  const tg={};
  VIS.forEach(n=>{
    if(!nodeEls[n.id]){ mkNode(n); const ps=(n.parent&&cur[n.parent.id])?cur[n.parent.id]:{x:n.cx,y:n.cy};
      cur[n.id]={x:ps.x,y:ps.y,o:0,s:.62}; }
    nodeContent(nodeEls[n.id],n);
    tg[n.id]={x:n.cx,y:n.cy,o:(n._dim?0.16:1),s:1};
  });
  Object.keys(nodeEls).forEach(id=>{ if(vis[id])return;
    const dn=idx[id]; let a=dn?dn.parent:null; while(a&&!vis[a.id])a=a.parent;
    const t=a?{x:a.cx,y:a.cy}:(cur[id]||{x:0,y:0});
    if(!cur[id])cur[id]={x:t.x,y:t.y,o:0,s:.62};
    tg[id]={x:t.x,y:t.y,o:0,s:.55,remove:true};
  });
  VIS.forEach(n=>{ if(n.parent&&vis[n.parent.id] && !edgeEls[n.id]) mkEdge(n); });
  const edgeTO={}; Object.keys(edgeEls).forEach(cid=>{ const n=idx[cid];
    edgeTO[cid]= (vis[cid] && n.parent && vis[n.parent.id]) ? (tg[cid]?tg[cid].o:1) : 0; });

  cancelAnimationFrame(anim);
  const start={}; Object.keys(tg).forEach(id=>{ const c=cur[id]||tg[id]; start[id]={x:c.x,y:c.y,o:c.o,s:c.s==null?1:c.s}; });
  const eStart={}; Object.keys(edgeEls).forEach(cid=>{ eStart[cid]=parseFloat(edgeEls[cid].dataset.o||'0'); });
  Object.keys(tg).forEach(id=>placeNode(id));   // ilk yerleşim (flash önle)
  const t0=performance.now(), D=animate?340:0;
  function frame(now){
    const t=D?Math.min(1,(now-t0)/D):1, e=t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
    Object.keys(tg).forEach(id=>{ const s=start[id],q=tg[id],c=cur[id];
      c.x=s.x+(q.x-s.x)*e; c.y=s.y+(q.y-s.y)*e; c.o=s.o+(q.o-s.o)*e; c.s=s.s+((q.s==null?1:q.s)-s.s)*e; placeNode(id); });
    Object.keys(edgeEls).forEach(cid=>{ const p=edgeEls[cid], base=parseFloat(p.dataset.base)||.5;
      const oo=eStart[cid]+((edgeTO[cid]||0)*base-eStart[cid])*e; p.dataset.o=oo; p.style.opacity=oo;
      const d=edgeD(cid); if(d) p.setAttribute('d',d); });
    if(panFrom){ tx=panFrom.x+(panTo.x-panFrom.x)*e; ty=panFrom.y+(panTo.y-panFrom.y)*e; apply(); }
    if(t<1){ anim=requestAnimationFrame(frame); }
    else{
      Object.keys(tg).forEach(id=>{ if(tg[id].remove){ if(nodeEls[id])nodeEls[id].remove(); delete nodeEls[id]; delete cur[id]; }});
      Object.keys(edgeEls).forEach(cid=>{ if((edgeTO[cid]||0)===0){ edgeEls[cid].remove(); delete edgeEls[cid]; }});
    }
  }
  anim=requestAnimationFrame(frame);
}
function isSubAgentEdge(n){ return n.parent && n.parent.tag==='hassub'; }

function apply(){ view.setAttribute('transform',`translate(${tx},${ty}) scale(${k})`); }
function findNode(id){ let r=null; (function w(n){ if(n.id===id){r=n;return;} (n.c||[]).forEach(w); })(DATA); return r; }

function fit(){
  if(!VIS.length) return;
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  VIS.forEach(n=>{ x0=Math.min(x0,n.cx-n.w/2); x1=Math.max(x1,n.cx+n.w/2); y0=Math.min(y0,n.cy-n.h/2); y1=Math.max(y1,n.cy+n.h/2); });
  const pad=50, W=stage.clientWidth, H=stage.clientHeight, bw=x1-x0+pad*2, bh=y1-y0+pad*2;
  k=Math.min(W/bw, H/bh, 1.15); k=Math.max(k,0.1);
  tx = (W - (x0+x1)*k)/2; ty = (H - (y0+y1)*k)/2; apply();
}
function redraw(keepView){ layout(); render(); if(!keepView) {} apply(); }

/* ---- interactions ---- */
view.addEventListener('click', ev=>{
  if(dragMoved) return;
  const g=ev.target.closest('.n'); if(!g) return;
  const n=findNode(g.dataset.id); if(!n) return;
  if(n.c && n.c.length){
    const c=cur[n.id], sx=(c?c.x:n.cx)*k+tx, sy=(c?c.y:n.cy)*k+ty;  // tıklanan düğümün ekran konumu
    n._c=!n._c; layout();
    AUTOFIT ? (render(false), fit()) : render(false, {x: sx - n.cx*k, y: sy - n.cy*k});               // o konumu sabit tut (üst sabit kalır)
  }
  showInfo(n);
});
view.addEventListener('mouseover', ev=>{
  const g=ev.target.closest('.n'); if(!g) return; const id=g.dataset.id;
  view.querySelectorAll(`path[data-t="${id}"],path[data-s="${id}"]`).forEach(p=>p.classList.add('hot'));
});
view.addEventListener('mouseout', ev=>{
  const g=ev.target.closest('.n'); if(!g) return; const id=g.dataset.id;
  view.querySelectorAll(`path[data-t="${id}"],path[data-s="${id}"]`).forEach(p=>p.classList.remove('hot'));
});

let drag=false,dragMoved=false,sx,sy,stx,sty;
stage.addEventListener('pointerdown',ev=>{
  if(ev.target.closest('.n')) { drag=false; return; }
  drag=true; dragMoved=false; sx=ev.clientX; sy=ev.clientY; stx=tx; sty=ty;
  stage.classList.add('grabbing'); stage.setPointerCapture(ev.pointerId);
});
stage.addEventListener('pointermove',ev=>{
  if(!drag) return; const dx=ev.clientX-sx, dy=ev.clientY-sy;
  if(Math.abs(dx)+Math.abs(dy)>4) dragMoved=true;
  tx=stx+dx; ty=sty+dy; apply();
});
stage.addEventListener('pointerup',ev=>{ drag=false; stage.classList.remove('grabbing'); setTimeout(()=>dragMoved=false,0); });
stage.addEventListener('wheel',ev=>{
  ev.preventDefault();
  const r=stage.getBoundingClientRect(), mx=ev.clientX-r.left, my=ev.clientY-r.top;
  const k2=Math.min(2.6, Math.max(0.12, k*(ev.deltaY<0?1.12:0.893)));
  tx=mx-(mx-tx)*(k2/k); ty=my-(my-ty)*(k2/k); k=k2; apply();
},{passive:false});

/* ---- detail panel ---- */
const info=document.getElementById('info'), infobody=document.getElementById('infobody');
document.getElementById('infox').onclick=()=>info.classList.remove('open');
function showInfo(n){
  const kids=(n.c||[]).map(c=>`<li>${esc(c.label)}</li>`).join('');
  const tags = (n.t?`<span class="tag" style="border-color:${COL[n.col]};color:${COL[n.col]}">${n.t}</span>`:'')
             + (n.tag==='gap'?'<span class="tag" style="border-color:var(--tg);color:var(--tg)">eksik / eklenecek</span>':'')
             + (n.tag==='hassub'?'<span class="tag" style="border-color:var(--co);color:var(--co)">sub-agent\'lı</span>':'');
  infobody.innerHTML = `<h3>${esc(n.label)}</h3>`
    + `<div class="meta">${n.sub?('model: '+esc(n.sub)+' · '):''}${(n.c&&n.c.length)?n.c.length+' alt-düğüm':'yaprak'}</div>`
    + tags + (kids?`<ul>${kids}</ul>`:'');
  info.classList.add('open');
}

/* ---- toolbar ---- */
function setAll(c){ (function w(n){ if(n.c&&n.c.length && n.depth>=1) n._c=c; (n.c||[]).forEach(w); })(DATA); layout(); render(); apply(); }
document.getElementById('expand').onclick=()=>{ setAll(false); fit(); };
document.getElementById('collapse').onclick=()=>{ (function w(n){ if(n.c&&n.c.length) n._c=n.depth>=2; (n.c||[]).forEach(w);})(DATA); layout();render();apply(); fit(); };
document.getElementById('fit').onclick=fit;
document.getElementById('autofit').onclick=function(){ AUTOFIT=!AUTOFIT; this.classList.toggle('on',AUTOFIT); if(AUTOFIT) fit(); };
document.getElementById('theme').onclick=()=>{ const r=document.documentElement; r.dataset.theme=r.dataset.theme==='dark'?'light':'dark'; };
document.getElementById('orient').onclick=()=>{ ORIENT = ORIENT==='TB'?'LR':'TB'; layout(); render(true); fit(); };

document.querySelectorAll('.chip[data-sys]').forEach(ch=>{
  ch.onclick=()=>{ const sys=DATA.c.find(s=>s.label===ch.dataset.sys); if(!sys)return;
    sys._hidden=!sys._hidden; ch.classList.toggle('off',sys._hidden); layout(); render(); if(AUTOFIT) fit(); else apply(); };
});

const q=document.getElementById('q');
q.addEventListener('input',()=>{
  const v=q.value.trim().toLowerCase();
  // clear flags
  (function w(n){ n._hit=false; n._keep=false; n._dim=false; (n.c||[]).forEach(w); })(DATA);
  if(v){
    (function w(n){
      if((n.label||'').toLowerCase().includes(v)){ n._hit=true; let p=n; while(p){ p._keep=true; if(p.parent)p.parent._c=false; p=p.parent; } }
      (n.c||[]).forEach(w);
    })(DATA);
    (function w(n){ if(!n._hit && !n._keep) n._dim=true; (n.c||[]).forEach(w); })(DATA);
  }
  layout(); render();
});

let gapOn=false;
document.getElementById('hlgap').onclick=function(){
  gapOn=!gapOn; this.classList.toggle('on',gapOn);
  (function w(n){ n._dim=false; (n.c||[]).forEach(w); })(DATA);
  if(gapOn){ // Hedef'i aç + gap olmayanları soluklaştır
    DATA.c.forEach(s=>{ if(s.label==='④ Hedef Nexus'){ (function o(n){n._c=false;(n.c||[]).forEach(o);})(s);} });
    (function w(n){ if(n.tag!=='gap' && n.t!=='root' && n.t!=='sys') n._dim=true; (n.c||[]).forEach(w); })(DATA);
  }
  layout(); render();
};

/* ---- boot ---- */
function boot(){ layout(); render(true); fit(); }
window.addEventListener('resize',()=>{ render(true); if(AUTOFIT) fit(); else apply(); });
if(document.fonts && document.fonts.ready){ document.fonts.ready.then(boot); } else boot();
boot();
</script>
</body>
