gates:
- id: strategy_question_bounded
  set: always
- id: option_set_complete
  set: always
- id: market_evidence_sourced
  set: always
- id: risks_and_tradeoffs_recorded
  set: always
- id: recommendation_reviewed
  set: always
- id: decision_recorded_or_owner_deferred
  set: always
- id: no_blocking_policy_failure
  set: always
- id: regulatory_review_if_market_regulated
  set: conditional
- id: financial_model_if_investment_decision
  set: conditional
evidence:
  required_evidence:
  - STRATEGY_BRIEF
  - OPTION_SET
  - MARKET_EVIDENCE_REPORT
  - STRATEGY_RISK_REGISTER
  - DECISION_RECOMMENDATION
  - STRATEGY_COMPLETION_REPORT
  required_trace:
  - strategy_framing_trace
  - market_evidence_trace
  - risk_tradeoff_trace
  - owner_decision_trace
  - stage_gate_decision_trace
stages:
- strategy_intake
- option_framing
- evidence_and_market_analysis
- risk_and_financial_assessment
- strategy_decision_closeout
