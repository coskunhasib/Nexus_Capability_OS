id: operational_learning_evidence_schema
name: Operational Learning Evidence Schema
type: evidence_schema
status: candidate
purpose: Decision-proof record for operational learnings derived from an incident
  (learning update, follow-up backlog).
owner_domain: operations_reliability
allowed_usage:
- Record operational-learning decision-proof evidence (operations pipeline).
forbidden_usage:
- Used to record process history (trace_schema).
- Confused with the SDLC learning_record_schema (different pipeline/lifecycle).
governance_profiles:
- evidence_required_policy
- operations_pipeline_governance
audit_schemas:
- postmortem_evidence_schema
- stage_gate_trace_schema
notes: NEW (operations). Stage learning_update. Operations-scoped learning; distinct
  from SDLC refraction learning_record_schema.
applies_to:
- operations_pipeline
- operations_stage:learning_update
required_fields:
- evidence_id
- type
- produced_by
- related_stage
- incident_id
- learning_items
- follow_up_backlog
- status
- created_at
producer: operational_learning_agent
consumer: policy_and_evidence_engine
retention: retain_with_postmortem
redaction_rules:
- no_raw_secret_exposure
used_by:
  pipelines:
  - operations_pipeline
  stages:
  - learning_update
  agents:
  - operational_learning_agent
