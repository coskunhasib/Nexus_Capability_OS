gates:
- id: support_request_captured
  set: always
- id: severity_and_account_context_classified
  set: always
- id: resolution_plan_complete
  set: always
- id: response_reviewed
  set: always
- id: escalation_recorded_if_required
  set: always
- id: learning_update_complete
  set: always
- id: no_blocking_policy_failure
  set: always
- id: incident_escalation_if_production_issue
  set: conditional
- id: knowledge_update_if_reusable_answer
  set: conditional
evidence:
  required_evidence:
  - SUPPORT_REQUEST_RECORD
  - SUPPORT_TRIAGE_REPORT
  - RESOLUTION_PLAN
  - CUSTOMER_RESPONSE_RECORD
  - ESCALATION_RECORD_IF_REQUIRED
  - SUPPORT_COMPLETION_REPORT
  required_trace:
  - support_triage_trace
  - escalation_decision_trace
  - customer_response_trace
  - learning_update_trace
  - stage_gate_decision_trace
stages:
- support_intake
- triage_and_classification
- resolution_plan
- response_and_escalation
- support_completion_learning
