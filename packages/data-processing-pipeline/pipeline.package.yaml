gates:
- id: source_data_registered
  set: always
- id: schema_profile_complete
  set: always
- id: quality_thresholds_defined
  set: always
- id: transformation_plan_reviewed
  set: always
- id: processing_validation_passed
  set: always
- id: delivery_package_complete
  set: always
- id: no_blocking_policy_failure
  set: always
- id: privacy_redaction_if_sensitive_data
  set: conditional
- id: rollback_plan_if_destructive_transform
  set: conditional
evidence:
  required_evidence:
  - DATA_PROCESSING_REQUEST
  - DATA_QUALITY_PROFILE
  - TRANSFORMATION_PLAN
  - PROCESSING_VALIDATION_REPORT
  - DATASET_DELIVERY_PACKAGE
  - DATA_PROCESSING_COMPLETION_REPORT
  required_trace:
  - data_processing_trace
  - validation_execution_trace
  - rollback_readiness_trace
  - stage_gate_decision_trace
stages:
- data_intake
- schema_and_quality_profile
- transform_and_validation_plan
- processing_execution
- data_processing_completion
