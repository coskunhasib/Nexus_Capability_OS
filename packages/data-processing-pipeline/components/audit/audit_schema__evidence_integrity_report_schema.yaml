id: evidence_integrity_report_schema
name: Evidence Integrity Report Schema
type: evidence_schema
status: canonical
purpose: Decision-proof record attesting evidence integrity / non-tampering (EVIDENCE_INTEGRITY_REPORT).
owner_domain: sdlc
allowed_usage:
- Record an attestation that the evidence chain is intact and untampered.
forbidden_usage:
- Used to record process history (trace_schema).
governance_profiles:
- evidence_required
- evidence_integrity_gate
audit_schemas:
- agentic_eval_evidence_schema
- stage_gate_trace_schema
notes: Stage 18 evidence schema. Backs the evidence_integrity_gate governance profile.
applies_to:
- sdlc_stage:ai_agent_safety_evaluation
required_fields:
- evidence_id
- type
- produced_by
- related_stage
- integrity_status
- source_artifacts
- summary
- status
- created_at
producer: ai_safety_agent
consumer: evidence_graph_agent
retention: retain_with_release_evidence
redaction_rules:
- no_raw_secret_exposure
used_by:
  pipelines:
  - sdlc_pipeline
  stages:
  - ai_agent_safety_evaluation
  agents:
  - ai_safety_agent
