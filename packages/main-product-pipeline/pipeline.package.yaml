package_schema_version: '0.1'
pipeline_id: main_product_pipeline
name: Main Product Pipeline
description: Take an owner-approved product intent from idea/readiness check through
  planning, production, verification, hardening, release-candidate preparation, optional
  activation handoff, and learning/memory update. This is the primary user-facing
  product journey; specialist pipelines are delegated execution units, not separate
  user-visible journeys by default.
