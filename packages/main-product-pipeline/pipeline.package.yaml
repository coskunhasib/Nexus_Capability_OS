gates:
- id: owner_approved_main_product_pipeline_entry
  set: always
- id: idea_maturity_state_recorded
  set: always
- id: mature_idea_not_forced_through_unneeded_discovery
  set: always
- id: product_brief_validated_or_discovery_completed
  set: always
- id: specialist_pipeline_routing_plan_complete
  set: always
- id: production_plan_approved
  set: always
- id: build_or_delivery_execution_complete
  set: always
- id: verification_hardening_pass_or_owned_exception
  set: always
- id: release_candidate_or_delivery_handoff_complete
  set: always
- id: learning_memory_update_complete
  set: always
- id: no_blocking_policy_failure
  set: always
- id: discovery_required_if_idea_immature
  set: conditional
- id: research_required_if_claims_or_market_questions_unresolved
  set: conditional
- id: activation_required_if_public_or_staged_rollout_requested
  set: conditional
- id: skill_governance_required_if_new_or_changed_skill_in_scope
  set: conditional
- id: operations_required_if_runbook_monitoring_or_incident_scope_needed
  set: conditional
evidence:
  required_evidence:
  - OWNER_APPROVAL_RECORD
  - IDEA_MATURITY_ASSESSMENT
  - PRODUCT_INTENT_BRIEF
  - PRODUCT_BRIEF
  - PRODUCT_DELIVERY_PLAN
  - SPECIALIST_PIPELINE_ROUTING_PLAN
  - BUILD_OR_IMPLEMENTATION_HANDOFF
  - VERIFICATION_HARDENING_REPORT
  - RELEASE_CANDIDATE_OR_DELIVERY_HANDOFF
  - ACTIVATION_HANDOFF_IF_REQUESTED
  - LEARNING_MEMORY_UPDATE_REPORT
  - MAIN_PRODUCT_COMPLETION_REPORT
  required_trace:
  - owner_decision_trace
  - stage_gate_decision_trace
  - specialist_pipeline_routing_trace
  - rework_routing_trace
  - handoff_trace
  - learning_update_trace
stages:
- entry_readiness_and_owner_approval_check
- idea_shaping_if_needed
- product_discovery_or_brief_validation
- production_plan_and_pipeline_routing
- build_execution
- verification_hardening_and_revision
- release_candidate_preparation
- activation_or_handoff
- learning_memory_update
