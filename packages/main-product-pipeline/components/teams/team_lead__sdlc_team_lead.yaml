team_lead_id: sdlc_team_lead
team_id: sdlc_team
pipeline_id: sdlc_pipeline
mission: 'Orchestrate the 31-stage SDLC Pipeline end to end under no-human governance:
  select the domain/risk profile, assign each stage to its owner Agent, produce handoff
  packets, coordinate skill activation, enforce routing and rework, and verify governance/evidence/gate
  state — without authoring product artifacts or bypassing any gate. Additionally
  acts as the independent no-self-approval reviewer for the requirements_review and
  architecture_review gate stages, because no dedicated reviewer Agent role exists
  for them.'
responsibilities:
- Take the product/user goal and select the applicable domain + risk profile.
- Initialize the SDLC pipeline graph and assign each stage to its owner Agent.
- Produce per-stage handoff packets and coordinate skill activation.
- Enforce stage routing (on_pass / on_fail) and choose rework routes on failure.
- Query governance/policy state and inspect evidence/trace completeness at each gate.
- Own the requirements_review and architecture_review review gates as the independent
  reviewer (author of the reviewed artifact is a different Agent), producing the review
  report + gate result without mutating the reviewed artifact.
- Assemble the final review checklist into development_completion / release_candidate
  readiness.
may_assign_agents:
- product_requirements_agent
- domain_risk_agent
- skill_librarian_agent
- architecture_agent
- security_privacy_agent
- risk_agent
- planning_agent
- engineering_agent
- code_reviewer_agent
- qa_agent
- security_validation_agent
- supply_chain_agent
- agentic_safety_agent
- privacy_agent
- contract_validation_agent
- compliance_agent
- data_migration_agent
- ux_accessibility_agent
- performance_resilience_agent
- cost_resource_agent
- operations_readiness_agent
- evidence_graph_agent
- release_manager_agent
- memory_curator_agent
may_call_direct_sub_agents: []
may_use_core_abilities:
- Supervisor
- Memory
- Web
may_use_skills:
- prompt-fidelity
- gap-audit
- calibrate
- llm-council
- sentinel
may_call_tools:
- evidence_reader
- policy_query
- requirements_trace_checker
- artifact_writer
- evidence_writer
uses_governance_profiles:
- sdlc_pipeline_governance
- sdlc_team_governance
- no_self_approval
- evidence_required
- no_policy_bypass
- requirements_review_governance
- architecture_review_gate
- prompt_fidelity_gate
uses_audit_schemas:
- sdlc_pipeline_evidence_schema
- stage_gate_trace_schema
- requirements_review_evidence_schema
- architecture_review_evidence_schema
- gate_decision_trace_schema
uses_context_memory_profiles:
- sdlc_run_context
- requirements_context_pack
- architecture_context_pack
- release_context_pack
owns_review_gate_stages:
- requirements_review
- architecture_review
forbidden_actions:
- - cannot_author_then_approve_same_artifact
  - cannot_bypass_a_failed_governance_gate
  - cannot_mutate_an_artifact_it_reviews
  - cannot_act_as_the_supervisor_core_ability
  - cannot_be_listed_as_a_core_ability
  - cannot_implement_or_write_product_code
  - cannot_read_secrets
  - cannot_perform_production_deploy_or_destructive_tool_actions
  - cannot_reintroduce_a_plugin_concept
- cannot_author_the_requirements_or_architecture_artifact_it_then_reviews
- cannot_pass_a_failed_sdlc_mandatory_gate_to_release_candidate
blocking_limits:
- - cannot_close_a_run_with_an_open_blocking_gate
  - cannot_advance_past_a_stage_whose_required_evidence_is_missing
  - cannot_skip_a_mandatory_stage_or_gate_for_the_pipeline
  - cannot_route_rework_outside_the_pipeline_allowed_rework_routes
- cannot_produce_a_release_candidate_before_development_completion_passes
- cannot_mark_development_completion_with_an_unevaluated_mandatory_or_applicable_gate
