gates:
- id: requirements_complete
  set: always
- id: nfr_coverage_complete
  set: always
- id: architecture_complete
  set: always
- id: adr_coverage_complete
  set: always
- id: security_privacy_design_complete
  set: always
- id: risk_register_reviewed
  set: always
- id: implementation_scope_clean
  set: always
- id: code_review_pass
  set: always
- id: tests_pass
  set: always
- id: verification_loop_bug_finding_pass
  set: always
- id: security_validation_pass
  set: always
- id: supply_chain_pass
  set: always
- id: license_pass
  set: always
- id: sbom_present
  set: always
- id: performance_resilience_pass_or_accepted
  set: always
- id: agentic_safety_eval_pass
  set: always
- id: operations_readiness_pass
  set: always
- id: evidence_graph_complete
  set: always
- id: no_blocking_policy_failure
  set: always
- id: accessibility_pass_if_applicable
  set: conditional
- id: data_migration_pass_if_applicable
  set: conditional
- id: privacy_lifecycle_pass_if_applicable
  set: conditional
- id: api_contract_compatibility_pass_if_applicable
  set: conditional
- id: backup_restore_dr_pass_if_applicable
  set: conditional
- id: compliance_pass_if_applicable
  set: conditional
- id: cost_resource_governance_pass_if_applicable
  set: conditional
