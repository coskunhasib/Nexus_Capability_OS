#   invariant; no sdlc_team_lead override is required here.

stage_id: security_validation
name: Security Validation
purpose: >-
  Run and interpret the application security scanner suite (SAST/SCA, secret, container and IaC
  scans) against the implemented changeset, normalize raw findings into a deduplicated,
  severity-classified SECURITY_FINDINGS_NORMALIZED set, and decide — under no-human governance —
  whether the build clears the security gate: zero unaccepted critical findings, no high findings
  without an owned acceptance, and no leaked secrets.

owner_team: sdlc_team
team_lead: sdlc_team_lead
owner_agent: security_validation_agent
sub_agents:
  - security_scan_interpreter_subagent

# Shared Registry + Usage Mapping (all 7 categories present)
uses_core_abilities:
  - Coder     # reason over code/dependency findings and map them to changed code
  - Memory    # recall threat model, security requirements and prior accepted findings
  - OS        # invoke scanner tooling over the repository/build

uses_skills:
  - calibrate                # calibrate severity / true-positive confidence of raw findings
  - gap-audit                # find scan-coverage gaps (unscanned paths, missing scanner classes)
  - scanner-result-normalizer  # NON-CANONICAL (legacy doc 05): normalize/dedupe raw scanner output

uses_tools:
  - scanner_runner       # run SAST/SCA/secret/container/IaC scans (side-effect: governance + trace)
  - dependency_scanner   # dependency/SCA vulnerability findings (side-effect: governance + trace)
  - evidence_reader      # read upstream evidence (changeset, threat model, test report)
  - artifact_writer      # write SECURITY_SCAN_REPORT / findings (side-effect: governance + trace)
  - evidence_writer      # write stage evidence (side-effect: governance + trace)

uses_governance_profiles:
  - sdlc_pipeline_governance
  - no_self_approval_policy
  - evidence_required_policy
  - security_validation_gate   # stage-specific gate profile
  - no_secret_leak_gate        # stage-specific gate profile

uses_audit_schemas:
  - security_scan_evidence_schema   # evidence schema (distinct from trace)
  - stage_gate_trace_schema         # trace schema (distinct from evidence)
  - security_finding_trace_schema   # trace schema: per-finding lineage (distinct from evidence)

uses_model_provider_profiles:
  - security_analysis_model

uses_context_memory_profiles:
  - sdlc_run_context
  - security_context_pack

inputs:
  - CODE_CHANGESET_SUMMARY
  - IMPLEMENTATION_NOTES
  - TEST_EXECUTION_REPORT
  - THREAT_MODEL
  - SECURITY_REQUIREMENTS

outputs:
  - SECURITY_SCAN_REPORT
  - SECURITY_FINDINGS_NORMALIZED
  - SECURITY_VALIDATION_GATE_RESULT

evidence:
  - SECURITY_SCAN_REPORT
  - SECURITY_FINDINGS_NORMALIZED
  - SECURITY_VALIDATION_GATE_RESULT

trace:
  - security_validation_stage_trace
  - scanner_runner_tool_trace
  - dependency_scanner_tool_trace
  - security_finding_normalization_trace
  - scanner_result_normalizer_skill_activation_trace

gates:
  - security_scan_coverage_complete
  - no_critical_security_finding
  - no_high_security_finding_without_acceptance
  - no_secret_leak
  - security_validation_pass

on_pass: supply_chain_sbom_license
on_fail: implementation
rework_route: implementation

blocking_conditions:
  - critical_security_finding_present
  - high_security_finding_without_owned_acceptance
  - secret_leak_detected
  - security_scan_coverage_incomplete

optional_conditions: []

conditional_required_gates: []

max_iterations: 3
