id: sdlc_pipeline_evidence_schema
name: SDLC Pipeline Evidence Schema
type: evidence_schema
status: canonical
purpose: Canonical base Evidence record shape for the SDLC pipeline — the decision-proof
  record that binds an artifact to a stage/agent/gate decision. Decision proof, never
  process history.
owner_domain: sdlc
allowed_usage:
- Record decision-proof evidence for any SDLC stage that has no more specific stage
  evidence schema.
- Serve as the base shape every stage-specific SDLC evidence schema extends.
forbidden_usage:
- Used to record operation/process history (that is a trace_schema).
- Merged with stage_gate_trace_schema or any trace record.
governance_profiles:
- evidence_required
- sdlc_development_completion_governance
audit_schemas:
- stage_gate_trace_schema
notes: Field set is taken verbatim from configs/nexus-ai/schemas/ evidence_item.schema.json
  (07 §11). Base evidence schema reused by the most SDLC stages.
aliases:
- requirements_evidence_schema
applies_to:
- sdlc_pipeline
- sdlc_stage_evidence
required_fields:
- evidence_id
- type
- produced_by
- related_pipeline
- related_run
- related_stage
- related_agent
- related_sub_agent
- related_gate
- source_artifacts
- summary
- status
- created_at
producer: stage_owner_agent
consumer: evidence_graph_agent
retention: retain_with_release_evidence
redaction_rules:
- no_raw_secret_exposure
- raw_credential_redaction
- redact_pii_in_source_artifacts
used_by:
  pipelines:
  - sdlc_pipeline
  stages:
  - intake
  - requirements
  - planning
  - supply_chain_sbom_license
  - cost_resource_governance
  - evidence_graph_build
  - development_completion
  - refraction_learning
  agents:
  - product_requirements_agent
  - release_manager_agent
  - evidence_graph_agent
