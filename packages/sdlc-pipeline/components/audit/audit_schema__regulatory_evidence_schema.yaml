id: regulatory_evidence_schema
name: Regulatory Evidence Schema
type: evidence_schema
status: canonical
purpose: Decision-proof record for regulatory traceability (REGULATORY_TRACEABILITY_REPORT_IF_APPLICABLE).
owner_domain: sdlc
allowed_usage:
- Record regulatory-traceability decision-proof evidence.
forbidden_usage:
- Used to record process history (trace_schema).
governance_profiles:
- evidence_required
audit_schemas:
- compliance_matrix_schema
- stage_gate_trace_schema
notes: Stage 21 evidence schema (conditional stage). Also declared at SDLC pipeline
  level (sdlc_pipeline.yaml uses_audit_schemas).
applies_to:
- sdlc_pipeline
- sdlc_stage:domain_regulatory_compliance_validation_if_applicable
required_fields:
- evidence_id
- type
- produced_by
- related_stage
- regulation_ref
- source_artifacts
- summary
- status
- created_at
producer: compliance_agent
consumer: evidence_graph_agent
retention: retain_with_release_evidence
redaction_rules:
- no_raw_secret_exposure
used_by:
  pipelines:
  - sdlc_pipeline
  stages:
  - domain_regulatory_compliance_validation_if_applicable
  agents:
  - compliance_agent
