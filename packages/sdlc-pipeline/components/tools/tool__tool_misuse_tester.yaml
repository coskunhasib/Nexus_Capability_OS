id: tool_misuse_tester
name: Tool Misuse Tester
type: tool
category: tool
status: canonical
purpose: Test for tool-permission misuse / privilege-escalation paths; emit TOOL_MISUSE_TEST_REPORT.
owner_domain: ai_safety
provided_by_core_ability: null
input_schema:
  tool_permission_map: object
output_schema:
  misuse_findings:
  - object
side_effects: executes_adversarial_probes_in_sandbox
risk_level: high
requires_sandbox: true
governance_profiles:
- tool_call_governance
- sandbox_execution_governance
- high_risk_action_default_deny
audit_schemas:
- tool_call_trace_schema
- evidence_item_schema
allowed_callers:
- agentic_safety_agent
allowed_usage:
- Probe for tool misuse / least-privilege violations inside the sandbox.
forbidden_usage:
- Exercising real privileged tools outside the sandbox.
used_by:
  pipelines:
  - sdlc_pipeline
  sdlc_stages:
  - ai_agent_safety_evaluation
notes: Consumes the TOOL_PERMISSION_MAP emitted by implementation (stage 11).
