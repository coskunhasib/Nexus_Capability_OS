team_id: sdlc_team
team_type: sdlc_team
pipeline_id: sdlc_pipeline
purpose: 'Own and execute the end-to-end 31-stage SDLC pipeline: intake, domain/risk
  profiling, skill semantic extraction, requirements + review, architecture + review,
  security/privacy design, premortem/FMEA, planning, implementation, code review,
  test generation/execution, verification-loop bug finding, and the full validation
  gate chain (security, supply chain, agentic safety, privacy, API contract, compliance,
  data migration, accessibility/UX, performance/resilience, cost/resource, backup/restore/DR,
  operations readiness), evidence graph build, development completion, release candidate,
  and refraction/learning. No merge, no deploy: the team produces a governed, fully-traceable
  release candidate plus evidence.'
