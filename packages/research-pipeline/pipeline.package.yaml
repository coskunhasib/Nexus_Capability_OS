package_schema_version: '0.1'
pipeline_id: research_pipeline
name: Research Pipeline
description: 'Run sourced research with no-human governance: discover sources, score
  source reliability, extract claims, map claims to evidence, cross-validate findings
  with a separate role, report uncertainty, and synthesize a cited research output.

  '
package_version: 1.0.0
