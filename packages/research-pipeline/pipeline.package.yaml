gates:
- id: all_research_questions_addressed_or_flagged
  set: always
- id: every_load_bearing_claim_has_mapped_evidence
  set: always
- id: every_used_source_has_reliability_score
  set: always
- id: validator_role_distinct_from_producer
  set: always
- id: cross_validation_completed_by_separate_role
  set: always
- id: uncertainty_report_present
  set: always
- id: citation_required_gate_pass
  set: always
- id: research_evidence_graph_complete
  set: always
- id: no_blocking_policy_failure
  set: always
evidence:
  required_evidence:
  - RESEARCH_BRIEF
  - RESEARCH_QUESTION_SET
  - SOURCE_INVENTORY
  - SOURCE_RELIABILITY_REPORT
  - CLAIM_REGISTER
  - CLAIM_EVIDENCE_MAP
  - CROSS_VALIDATION_REPORT
  - UNCERTAINTY_REPORT
  - RESEARCH_SYNTHESIS
  - CITATION_INDEX
  - RESEARCH_EVIDENCE_GRAPH
  - RESEARCH_COMPLETION_REPORT
  required_trace:
  - web_search_tool_trace
  - web_fetch_tool_trace
  - source_reliability_checker_tool_trace
  - claim_mapper_tool_trace
  - skill_activation_trace
  - cross_validation_role_handoff_trace
  - gate_decision_trace
stages:
- research_intake
- scope_and_questions
- source_discovery
- source_reliability_assessment
- claim_extraction
- claim_evidence_mapping
- cross_validation
- uncertainty_reporting
- synthesis
- research_completion
