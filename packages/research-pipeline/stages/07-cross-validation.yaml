# Nexus AI Orchestration Model — Research Pipeline
# Stage #7 of 10: cross_validation
# Machine-readable stage contract. Transcribed (not invented) from
#   docs/nexus-ai-orchestration-model/legacy/pipeline-catalog/research-pipeline.md §2.7.
# Field set mirrors configs/nexus-ai/stages/sdlc/ stage contracts.
# Pipeline: research_pipeline. NO-SELF-APPROVAL (structural): owner_agent is a DISTINCT
#   cross_validation_agent, separate from source_reliability_agent / claim_extraction_agent /
#   claim_evidence_agent. A researcher must not be the sole validator of their own source.
#   llm-council is used here for cross-checked, multi-perspective adjudication (NOT
#   verification-loop, which is intentionally not used in the Research Pipeline).
version: draft-0.1
stage_id: cross_validation
name: Cross-Validation
purpose: >-
  Independent verification by a different role: re-check source reliability scores and
  claim->evidence mappings, surface single-source claims, and resolve or escalate
  conflicts. This stage enforces the no-self-approval rule — a researcher must not solely
  validate their own source. llm-council is used here for cross-checked, multi-perspective
  adjudication.
owner_team: research_team
team_lead: research_team_lead
owner_agent: cross_validation_agent
sub_agents: []

uses_core_abilities:
  - Memory
uses_skills:
  - llm-council   # cross-checked, multi-perspective adjudication
  - calibrate
uses_tools:
  - source_reliability_checker
  - evidence_reader
  - artifact_writer
uses_governance_profiles:
  - no_self_approval_policy
  - research_source_governance
  - evidence_required_policy
uses_audit_schemas:
  - claim_evidence_schema
  - source_evidence_schema
  - stage_gate_trace_schema
uses_model_provider_profiles:
  - source_evaluation_model
uses_context_memory_profiles:
  - research_run_context
  - claim_evidence_context_pack

inputs:
  - CLAIM_EVIDENCE_MAP
  - SOURCE_RELIABILITY_REPORT
outputs:
  - CROSS_VALIDATION_REPORT

evidence:
  - CROSS_VALIDATION_REPORT
trace:
  - agent_invocation_trace
  - cross_validation_role_handoff_trace
  - source_reliability_checker_tool_trace
  - skill_activation_trace
  - gate_decision_trace

gates:
  - validator_role_distinct_from_producer
  - single_source_claims_identified
  - no_unresolved_critical_source_conflict

on_pass: uncertainty_reporting
on_fail: claim_evidence_mapping
rework_route: claim_evidence_mapping

blocking_conditions:
  - producer_role_is_sole_validator_of_own_source == true
  - critical_source_reliability_conflict_unresolved == true
optional_conditions: []
conditional_required_gates: []

max_iterations: 3
