# Nexus AI Orchestration Model — Research Pipeline
# Stage #6 of 10: claim_evidence_mapping
# Machine-readable stage contract. Transcribed (not invented) from
#   docs/nexus-ai-orchestration-model/legacy/pipeline-catalog/research-pipeline.md §2.6.
# Field set mirrors configs/nexus-ai/stages/sdlc/ stage contracts.
# Pipeline: research_pipeline. owner_agent is a snake_case Agent role under research_team.
version: draft-0.1
stage_id: claim_evidence_mapping
name: Claim-Evidence Mapping
purpose: >-
  Map every claim to its supporting and contradicting evidence across sources; record
  support strength and any conflicts. Produces CLAIM_EVIDENCE_MAP.
owner_team: research_team
team_lead: research_team_lead
owner_agent: claim_evidence_agent
sub_agents: []

uses_core_abilities:
  - Memory
uses_skills:
  - gap-audit
uses_tools:
  - claim_mapper
  - evidence_writer
  - evidence_reader
uses_governance_profiles:
  - research_source_governance
  - evidence_required_policy
uses_audit_schemas:
  - claim_evidence_schema
  - stage_gate_trace_schema
uses_model_provider_profiles:
  - research_reasoning_profile
uses_context_memory_profiles:
  - research_run_context
  - claim_evidence_context_pack

inputs:
  - CLAIM_REGISTER
outputs:
  - CLAIM_EVIDENCE_MAP

evidence:
  - CLAIM_EVIDENCE_MAP
trace:
  - agent_invocation_trace
  - claim_mapper_tool_trace
  - skill_activation_trace
  - gate_decision_trace

gates:
  - every_load_bearing_claim_has_mapped_evidence
  - contradictions_recorded
  - unsupported_claims_flagged

on_pass: cross_validation
on_fail: claim_evidence_mapping
rework_route: claim_evidence_mapping

blocking_conditions: []
optional_conditions: []
conditional_required_gates: []

max_iterations: 3
