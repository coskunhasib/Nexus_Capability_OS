# Nexus AI Orchestration Model — Research Pipeline
# Stage #3 of 10: source_discovery
# Machine-readable stage contract. Transcribed (not invented) from
#   docs/nexus-ai-orchestration-model/legacy/pipeline-catalog/research-pipeline.md §2.3.
# Field set mirrors configs/nexus-ai/stages/sdlc/ stage contracts.
# Pipeline: research_pipeline. owner_agent is a snake_case Agent role under research_team.
version: draft-0.1
stage_id: source_discovery
name: Source Discovery
purpose: >-
  Find candidate sources for each research question via web search and fetch; record
  provenance (URL, publisher, date, access timestamp) for every candidate.
owner_team: research_team
team_lead: research_team_lead
owner_agent: source_discovery_agent
sub_agents: []

uses_core_abilities:
  - Web
  - Memory
uses_skills: []
uses_tools:
  - web_search
  - web_fetch
  - artifact_writer
uses_governance_profiles:
  - research_source_governance
  - evidence_required_policy
uses_audit_schemas:
  - source_evidence_schema
  - stage_gate_trace_schema
uses_model_provider_profiles:
  - research_reasoning_profile
uses_context_memory_profiles:
  - research_run_context
  - source_corpus_context_pack

inputs:
  - RESEARCH_QUESTION_SET
outputs:
  - SOURCE_INVENTORY

evidence:
  - SOURCE_INVENTORY
trace:
  - agent_invocation_trace
  - web_search_tool_trace
  - web_fetch_tool_trace
  - gate_decision_trace

gates:
  - each_question_has_candidate_sources
  - source_provenance_recorded
  - minimum_source_diversity_met

on_pass: source_reliability_assessment
on_fail: source_discovery
rework_route: source_discovery

blocking_conditions: []
optional_conditions: []
conditional_required_gates: []

max_iterations: 3
