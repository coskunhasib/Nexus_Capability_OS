allowed_usage:
- source reliability/credibility scoring in the research pipeline
forbidden_usage:
- being listed/used as a Core Ability, Agent, Skill or Tool
used_by:
  pipelines:
  - research_pipeline
  stages:
  - source_reliability_assessment
  - source_discovery
  core_abilities: []
aliases: []
overlap:
