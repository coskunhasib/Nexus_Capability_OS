  recommendation: No canonical equivalent — source-reliability scoring is a genuinely
    new specialisation. Keep as its own profile; ratify in Phase E.
notes: Markdown research-pipeline.md §1 + §3 ("Model/Provider profiles introduced
  ... to be registered in phase C").
