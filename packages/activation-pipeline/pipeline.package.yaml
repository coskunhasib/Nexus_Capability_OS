gates:
- id: release_candidate_evidence_present
  set: always
- id: activation_scope_defined
  set: always
- id: rollback_owner_assigned
  set: always
- id: blast_radius_limit_defined
  set: always
- id: abort_criteria_defined
  set: always
- id: preview_required_gate
  set: always
- id: preview_behaves_as_expected
  set: always
- id: telemetry_observable_in_preview
  set: always
- id: health_baseline_captured
  set: always
- id: blast_radius_within_limit
  set: always
- id: pilot_health_within_canary_thresholds
  set: always
- id: no_abort_condition_breached
  set: always
- id: activation_evidence_complete
  set: always
- id: post_activation_health_within_baseline
  set: always
- id: activation_stable_over_monitoring_window
  set: always
- id: all_required_gates_passed
  set: always
- id: no_blocking_policy_failure
  set: always
- id: pilot_evidence_gate_if_public_scope
  set: conditional
- id: owner_activation_decision_gate_if_public_scope
  set: conditional
- id: rollback_required_gate_if_public_scope
  set: conditional
- id: extended_monitoring_window_if_public_scope
  set: conditional
evidence:
  required_evidence:
  - ACTIVATION_REQUEST
  - ABORT_CRITERIA
  - BLAST_RADIUS_LIMIT
  - PREVIEW_RESULT
  - HEALTH_BASELINE
  - PILOT_RESULT
  - CANARY_HEALTH_REPORT
  - PILOT_EVIDENCE_REVIEW_REPORT
  - ROLLBACK_PLAN
  - ROLLBACK_READINESS_REPORT
  - ROLLBACK_DRILL_REPORT
  - ACTIVATION_DECISION
  - ACTIVATION_COMPLETION_REPORT
  - POST_ACTIVATION_MONITORING_REPORT
  required_trace:
  - activation_transition_trace
  - preview_activation_trace
  - pilot_activation_trace
  - pilot_evidence_review_handoff_trace
  - rollback_drill_trace
  - owner_decision_trace
  - post_activation_monitoring_trace
  - gate_aggregation_decision_trace
  - stage_gate_decision_trace
  - policy_evaluation_trace
stages:
- activation_intake
- superadmin_preview
- pilot_activation
- pilot_evidence_review
- public_activation_decision
- rollback_readiness
- activation_completion
- post_activation_monitoring
