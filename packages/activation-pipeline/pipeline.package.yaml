package_schema_version: '0.1'
pipeline_id: activation_pipeline
name: Activation Pipeline
description: Staged activation of a feature, capability, or pipeline through preview
  -> pilot -> public, with mandatory rollback readiness and a human/owner decision
  gate before any public activation. Promotes an already release-candidate artifact
  (produced by the SDLC Pipeline) into progressively wider exposure under no-self-approval
  governance.
