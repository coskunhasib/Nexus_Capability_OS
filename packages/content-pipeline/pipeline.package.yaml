gates:
- id: content_goal_bounded
  set: always
- id: audience_and_channel_defined
  set: always
- id: content_plan_approved
  set: always
- id: sources_or_claims_grounded
  set: always
- id: draft_reviewed
  set: always
- id: completion_report_emitted
  set: always
- id: no_blocking_policy_failure
  set: always
- id: legal_or_regulatory_review_if_high_risk
  set: conditional
- id: localization_review_if_requested
  set: conditional
evidence:
  required_evidence:
  - CONTENT_BRIEF
  - CONTENT_PLAN
  - CONTENT_SOURCE_MAP
  - CONTENT_DRAFT
  - CONTENT_REVIEW_REPORT
  - CONTENT_COMPLETION_REPORT
  required_trace:
  - content_planning_trace
  - source_grounding_trace
  - draft_review_trace
  - stage_gate_decision_trace
stages:
- content_intake
- content_plan
- source_and_claim_grounding
- draft_and_review
- content_completion
