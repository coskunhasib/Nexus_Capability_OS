gates:
- id: inference_goal_bounded
  set: always
- id: routing_policy_defined
  set: always
- id: evaluation_harness_ready
  set: always
- id: quality_threshold_met_or_exception
  set: always
- id: cost_latency_budget_respected
  set: always
- id: monitoring_trace_complete
  set: always
- id: no_blocking_policy_failure
  set: always
- id: fallback_policy_if_external_provider
  set: conditional
- id: safety_review_if_high_risk_output
  set: conditional
evidence:
  required_evidence:
  - INFERENCE_REQUEST
  - ROUTING_POLICY
  - MODEL_EVALUATION_PLAN
  - INFERENCE_RUN_REPORT
  - QUALITY_COST_REPORT
  - INFERENCE_COMPLETION_REPORT
  required_trace:
  - model_invocation_trace_schema
  - routing_decision_trace
  - monitoring_trace
  - stage_gate_decision_trace
stages:
- inference_request_intake
- routing_and_provider_plan
- evaluation_harness_setup
- inference_execution_monitoring
- inference_completion
