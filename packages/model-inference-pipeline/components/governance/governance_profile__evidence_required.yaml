id: evidence_required
name: Evidence Required
type: global_governance_policy
status: canonical
purpose: 'Every gate decision must be backed by machine-readable evidence: no pass/approve/release
  without an evidence record (06 §3 every_gate_decision_requires_evidence). Bound
  by all 31 SDLC stages and all 5 new pipelines.'
owner_domain: nexus_global_governance
allowed_usage:
- Require an evidence record for every gate decision before it can pass.
- Block approval/release that rests on LLM output alone with no evidence.
forbidden_usage:
- Producing an approval/gate-pass with no evidence record (evidence != trace; evidence
  required).
- Treating any arbitrary artifact AS evidence without a gate/decision linkage (11
  §1).
governance_profiles: []
