gates:
- id: intake_metadata_complete
  set: always
- id: provenance_seed_recorded
  set: always
- id: target_scope_declared
  set: always
- id: source_trust_tier_assigned
  set: always
- id: sensitivity_classified
  set: always
- id: sensitive_content_detection_complete
  set: always
- id: summary_grounded_in_source
  set: always
- id: no_unsupported_claim_in_summary
  set: always
- id: corpus_conflict_scan_complete
  set: always
- id: duplicate_resolution_recorded
  set: always
- id: contradiction_resolution_recorded
  set: always
- id: no_unresolved_contradiction_admitted
  set: always
- id: validity_window_present
  set: always
- id: update_bound_to_validity_window
  set: always
- id: sensitivity_exposure_consistent
  set: always
- id: expiration_outcome_recorded
  set: always
- id: memory_provenance_evidence_complete
  set: always
- id: team_lead_cannot_self_approve_or_bypass_gate
  set: always
- id: redaction_applied_if_required
  set: conditional
- id: superseded_memory_removed_from_retrieval
  set: conditional
- id: expired_memory_retired_from_retrieval
  set: conditional
- id: right_to_be_forgotten_honored_if_requested
  set: conditional
evidence:
  required_evidence:
  - MEMORY_INTAKE_RECORD
  - SOURCE_CLASSIFICATION_REPORT
  - SENSITIVE_CONTENT_DETECTION_REPORT
  - MEMORY_SUMMARY
  - SUMMARY_GROUNDING_REPORT
  - CONFLICT_RESOLUTION_REPORT
  - VALIDITY_WINDOW_DECISION
  - RETRIEVAL_PROFILE_UPDATE_REPORT
  - MEMORY_EXPIRATION_REVIEW_REPORT
  - MEMORY_LIFECYCLE_PROVENANCE_AUDIT
  - MEMORY_PROVENANCE_RECORD
  required_trace:
