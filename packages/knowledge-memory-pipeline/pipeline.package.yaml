package_schema_version: '0.1'
pipeline_id: knowledge_memory_pipeline
name: Knowledge / Memory Pipeline
description: 'Govern the knowledge / memory lifecycle for Nexus AI: ingest candidate
  memory, classify its source, summarize it, assign a validity window, update the
  affected retrieval profile, and review expiration. Memory remains a Core Ability;
  this pipeline curates what that ability is allowed to remember, for how long, and
  how it is retrieved. It does not turn Memory into an agent.

  '
