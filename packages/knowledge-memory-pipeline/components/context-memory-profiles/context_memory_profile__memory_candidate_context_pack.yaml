id: memory_candidate_context_pack
name: Memory Candidate Context Pack
type: context_pack
status: candidate
scope: stage_pack
purpose: 'Candidate-memory working context: the normalized candidate record, its source
  classification (origin type, trust tier, sensitivity, redaction need), the grounded
  summary, and the assigned validity window with rationale. Consumed by memory intake,
  source classification, summary generation, validity-window assignment, and expiration
  review.'
owner_domain: knowledge_management
allowed_usage:
- read_by_intake_classification_summary_validity_and_expiration_review
- carry_the_candidate_record_classification_summary_and_window
forbidden_usage:
- store_or_summarize_unredacted_sensitive_content
- retain_a_memory_item_with_no_validity_window
- omit_the_provenance_record
- exposed_as_an_agent_team_skill_or_tool
source_priority:
- candidate_memory_item
- knowledge_run_context
- durable_memory_existing_entries
retention: run_scoped
validity_window: per_item_assigned_validity_window
retrieval_rules:
- scoped_to_one_candidate_memory_item
- summary_must_be_grounded_in_classified_source
- no_window_is_not_an_allowed_state
redaction_rules:
- no_raw_secrets
- redact_sensitive_content_before_summarization_or_storage
- provenance_record_required
governance_profiles:
- memory_source_governance
- validity_window_required_gate
- redaction_required_gate
- context_access_governance
audit_schemas:
- memory_provenance_schema
- stage_gate_trace_schema
used_by:
- knowledge_memory_pipeline
- stage:memory_intake@knowledge_memory_pipeline
- stage:source_classification@knowledge_memory_pipeline
- stage:summary_generation@knowledge_memory_pipeline
- stage:validity_window_assignment@knowledge_memory_pipeline
- stage:memory_expiration_review@knowledge_memory_pipeline
aliases:
- memory_corpus_context_pack
notes: New (draft-0.1, knowledge-memory-pipeline.md §1, name authoritative). The pre-R9
  pipeline_catalog.yaml definition_contract used `memory_corpus_context_pack`; markdown
  `memory_candidate_context_pack` is canonical. After R9 collapsed pipeline_catalog.yaml
  into a summary-only catalog, the authoritative per-pipeline source is the markdown
  definition_doc and the YAML name is retained as an alias only (review F-1).
