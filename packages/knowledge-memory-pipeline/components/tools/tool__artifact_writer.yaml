id: artifact_writer
name: Artifact Writer
type: tool
category: tool
status: canonical
purpose: Persist a named pipeline artifact (canonical UPPER_SNAKE artifact id per
  configs/nexus-ai/artifact_registry.yaml) produced by a stage — e.g. PRODUCT_BRIEF,
  CODE_CHANGESET_SUMMARY, COMPLIANCE_MATRIX, RELEASE_CANDIDATE_REPORT.
owner_domain: shared_platform
provided_by_core_ability: null
input_schema:
  artifact_id: string
  content: object
  related_pipeline: string
  related_run: string
  related_stage: string
output_schema:
  artifact_ref: string
  written: boolean
side_effects: writes_artifact_store
risk_level: medium
requires_sandbox: true
governance_profiles:
- tool_call_governance
- sandbox_execution_governance
- global_no_secret_policy
audit_schemas:
- tool_call_trace_schema
- evidence_item_schema
allowed_callers:
- any_stage_owner_agent
allowed_usage:
- Persist canonical-named artifacts under a stage's own scope with provenance.
forbidden_usage:
- Writing outside the sandboxed artifact store.
- Emitting raw secrets/credentials into an artifact (global_no_secret_policy).
used_by:
  pipelines:
  - sdlc_pipeline
  - research_pipeline
  - activation_pipeline
  - operations_pipeline
  - skill_governance_pipeline
  - knowledge_memory_pipeline
  sdlc_stages:
  - intake
  - domain_risk_profile
  - skill_semantic_extraction
  - requirements
  - requirements_review
  - architecture
  - architecture_review
  - security_privacy_design
  - premortem_fmea
  - planning
  - implementation
  - code_review
  - test_generation
  - test_execution
  - verification_loop_bug_finding
  - security_validation
  - supply_chain_sbom_license
  - ai_agent_safety_evaluation
  - privacy_data_lifecycle_validation
  - api_contract_compatibility_validation
  - domain_regulatory_compliance_validation_if_applicable
  - data_migration_validation_if_applicable
  - accessibility_ux_validation_if_applicable
  - performance_resilience
  - cost_resource_governance
  - backup_restore_dr_validation_if_applicable
  - operations_readiness
  - evidence_graph_build
  - development_completion
  - release_candidate
  - refraction_learning
notes: 'Present in all 31 SDLC stage contracts and every pipeline catalog entry. Distinct
  from evidence_writer: artifact_writer persists the deliverable; evidence_writer
  persists the decision evidence about it (Evidence != Trace and artifact != evidence
  boundaries).'
