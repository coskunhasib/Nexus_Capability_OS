id: redaction_required_gate
name: Redaction Required Gate
type: stage_gate_profile
status: candidate
purpose: 'Knowledge/Memory gate: sensitive content must be redacted before summarization,
  storage, or retrieval exposure (knowledge-memory-pipeline.md §3.2). Conditional:
  required_when sensitivity_requires_redaction == true.'
owner_domain: knowledge_management
allowed_usage:
- Gate redaction of sensitive content before it is summarized/stored/exposed.
forbidden_usage:
- Used outside the Knowledge/Memory Pipeline.
- Confused with the global raw_credential_redaction (credential masking in outputs).
governance_profiles:
- memory_source_governance
- evidence_required
audit_schemas:
- memory_provenance_schema
- stage_gate_trace_schema
scope: stage
applies_to:
- source_classification
severity_default: blocker
used_by:
- source_classification
aliases:
- memory_expiration_gate
notes: NEW (pipeline-catalog-review.md §4.1). Knowledge/Memory Pipeline gate. Distinct
  from the global raw_credential_redaction policy (which masks credentials in any
  output/evidence). The pre-R9 catalog-YAML definition_contract variant `memory_expiration_gate`
  (the third knowledge/memory gate token, per OQ-GOV-4) is retained under aliases
  only as the historical reconciliation record; after R9 collapsed pipeline_catalog.yaml
  into a summary-only catalog, the authoritative per-pipeline source is the markdown
  definition_doc.
