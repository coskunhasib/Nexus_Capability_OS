id: memory_search
name: Memory Search
type: tool
category: tool
status: canonical
purpose: Read-only recall query over the Memory ability's store for relevant prior
  run/project memory items.
owner_domain: knowledge_memory
provided_by_core_ability: Memory
input_schema:
  query: object
output_schema:
  memory_items:
  - object
side_effects: none
risk_level: low
requires_sandbox: false
governance_profiles:
- tool_call_governance
audit_schemas:
- tool_call_trace_schema
allowed_callers:
- all_sdlc_agents
- research_intake_agent
- knowledge_memory_agents
- operations_agents
- skill_librarian_agent
allowed_usage:
- Read-only recall query of stored memory within the requested scope.
forbidden_usage:
- Mutating memory (that is memory_write).
- Surfacing raw secrets from stored memory (no_secret_read on the Memory ability).
used_by:
  pipelines:
  - sdlc_pipeline
  - research_pipeline
  - activation_pipeline
  - operations_pipeline
  - skill_governance_pipeline
  - knowledge_memory_pipeline
  sdlc_stages:
  - intake
  - domain_risk_profile
  - skill_semantic_extraction
  - requirements
  - requirements_review
  - architecture
  - architecture_review
  - security_privacy_design
  - premortem_fmea
  - planning
  - implementation
  - code_review
  - test_generation
  - test_execution
  - verification_loop_bug_finding
  - security_validation
  - supply_chain_sbom_license
  - ai_agent_safety_evaluation
  - privacy_data_lifecycle_validation
  - api_contract_compatibility_validation
  - domain_regulatory_compliance_validation_if_applicable
  - data_migration_validation_if_applicable
  - accessibility_ux_validation_if_applicable
  - performance_resilience
  - cost_resource_governance
  - backup_restore_dr_validation_if_applicable
  - operations_readiness
  - evidence_graph_build
  - development_completion
  - release_candidate
  - refraction_learning
notes: Exposed_tool of the canonical Memory Core Ability (core_abilities.yaml memory.exposed_tools;
  K-011/D-014). Read-only recall primitive; Memory is bound by all 31 SDLC stages
  + all 6 pipelines, so used_by mirrors that binding. Distinct from context_recall
  (working context) and from the Context/Memory Profiles registry.
