package_schema_version: '0.1'
pipeline_id: product_discovery_pipeline
name: Product Discovery Pipeline
description: 'Run cheap, kill-friendly product discovery under no-human governance:
  pre-register the kill-criteria, validate the problem with sourced evidence, falsify
  the riskiest assumptions, assess feasibility with cost bounds, assemble a business
  case with a complete decision-option set, then record an explicit OWNER GO / NO_GO
  / PIVOT decision. On GO, hand a pre-authored PRODUCT_BRIEF off to the SDLC pipeline.
  NO_GO is a valid, honorable terminal whose deliverable is a learning report; PIVOT
  is a decision-driven re-entry. No GO may be authorized without a recorded human/owner
  decision and no agent may self-approve the discovery decision.

  '
