  set: always
- id: idea_brief_bounded
  set: always
- id: problem_evidence_sourced
  set: always
- id: target_user_segment_evidenced
  set: always
- id: every_critical_assumption_tested_or_flagged
  set: always
- id: feasibility_assessed_within_cost_bounds
  set: always
- id: business_case_internally_consistent
  set: always
- id: decision_options_complete
  set: always
- id: owner_decision_recorded
  set: always
- id: no_self_approval_of_discovery_decision
  set: always
- id: discovery_evidence_graph_complete
  set: always
- id: no_blocking_policy_failure
  set: always
- id: regulatory_scan_if_regulated_domain
  set: conditional
- id: handoff_package_complete_if_go
  set: conditional
evidence:
