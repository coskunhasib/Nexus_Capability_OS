gates:
- id: incident_record_present
  set: always
- id: affected_capability_identified
  set: always
- id: severity_assigned
  set: always
- id: mitigation_plan_present
  set: always
- id: rollback_or_fix_executed
  set: always
- id: runbook_or_rollback_evidence_present
  set: always
- id: operational_learning_record_present
  set: always
- id: no_blocking_policy_failure
  set: always
- id: postmortem_present_if_required_severity
  set: conditional
evidence:
  required_evidence:
  - INCIDENT_RECORD
  - SEVERITY_CLASSIFICATION_REPORT
  - MITIGATION_PLAN
  - ROLLBACK_OR_FIX_REPORT
  - POSTMORTEM_REPORT
  - OPERATIONAL_LEARNING_RECORD
  required_trace:
  - incident_intake_trace
  - severity_classification_trace
  - mitigation_plan_trace
  - rollback_or_fix_trace
  - postmortem_trace
  - learning_update_trace
  - stage_gate_decision_trace
stages:
- incident_intake
- severity_classification
- mitigation_plan
- rollback_or_fix
- postmortem
- learning_update
