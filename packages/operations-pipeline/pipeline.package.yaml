package_schema_version: '0.1'
pipeline_id: operations_pipeline
name: Operations Pipeline
description: 'Live-operations lifecycle for released Nexus AI capabilities: detect
  and intake incidents, classify severity, build a mitigation plan, decide and execute
  rollback-or-fix, run a mandatory postmortem, and feed operational learning back
  into memory and the SDLC. Consumes SDLC operations-readiness artifacts (RUNBOOK,
  ROLLBACK_PLAN, OBSERVABILITY_PLAN, INCIDENT_RESPONSE_PLAN); does not regenerate
  the SDLC Pipeline.'
