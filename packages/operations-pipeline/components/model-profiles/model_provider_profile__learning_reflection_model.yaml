  in the operations pipeline learning_update stage.
owner_domain: operations_reliability
provider_type: reasoning_llm
model_family: general_reasoning
capability_scope:
- operational_learning_synthesis
- reflection_and_calibration
- knowledge_update_reasoning
resource_limits:
