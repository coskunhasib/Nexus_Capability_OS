id: severity_classification_evidence_schema
name: Severity Classification Evidence Schema
type: evidence_schema
status: candidate
purpose: Decision-proof record for incident severity classification (severity level
  + rationale).
owner_domain: operations_reliability
allowed_usage:
- Record incident severity-classification decision-proof evidence.
forbidden_usage:
- Used to record process history (trace_schema).
governance_profiles:
- evidence_required_policy
- incident_severity_required_gate
audit_schemas:
- incident_evidence_schema
- stage_gate_trace_schema
notes: NEW (operations). Stage severity_classification. Severity classification is
  mandatory (incident_severity_required_gate).
applies_to:
- operations_pipeline
- operations_stage:severity_classification
required_fields:
- evidence_id
- type
- produced_by
- related_stage
- incident_id
- severity_level
- severity_rationale
- status
- created_at
producer: severity_classification_agent
consumer: mitigation_planning_agent
retention: retain_with_postmortem
redaction_rules:
- no_raw_secret_exposure
used_by:
  pipelines:
  - operations_pipeline
  stages:
  - severity_classification
  agents:
  - severity_classification_agent
