id: postmortem_evidence_schema
name: Postmortem Evidence Schema
type: evidence_schema
status: candidate
purpose: Decision-proof record for the incident postmortem (root cause, timeline,
  corrective actions).
owner_domain: operations_reliability
allowed_usage:
- Record postmortem decision-proof evidence.
forbidden_usage:
- Used to record process history (trace_schema).
governance_profiles:
- evidence_required_policy
- postmortem_required_gate
audit_schemas:
- operational_learning_evidence_schema
- stage_gate_trace_schema
notes: NEW (operations). Stage postmortem. Postmortem is mandatory (postmortem_required_gate).
applies_to:
- operations_pipeline
- operations_stage:postmortem
required_fields:
- evidence_id
- type
- produced_by
- related_stage
- incident_id
- root_cause
- timeline
- corrective_actions
- source_artifacts
- status
- created_at
producer: postmortem_agent
consumer: operational_learning_agent
retention: retain_with_postmortem
redaction_rules:
- no_raw_secret_exposure
- redact_pii_in_timeline
used_by:
  pipelines:
  - operations_pipeline
  stages:
  - postmortem
  agents:
  - postmortem_agent
