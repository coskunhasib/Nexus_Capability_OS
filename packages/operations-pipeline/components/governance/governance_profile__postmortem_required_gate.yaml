owner_domain: operations_reliability
allowed_usage:
- Gate presence of a postmortem (blocking for required severities).
forbidden_usage:
- Used outside the Operations Pipeline.
governance_profiles:
- operations_pipeline_governance
- no_self_approval
- evidence_required
audit_schemas:
- postmortem_evidence_schema
- stage_gate_trace_schema
scope: stage
applies_to:
- postmortem
severity_default: blocker
used_by:
- postmortem
notes: 'NEW (pipeline-catalog-review.md §4.1). Operations Pipeline gate. Conditional:
  blocker for severity >= major OR rollback_executed == true; otherwise the POSTMORTEM_REPORT
  must still exist.'
