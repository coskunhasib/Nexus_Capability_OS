- type
- produced_by
- related_stage
- source_artifacts
- summary
- status
- created_at
producer: ai_safety_agent
consumer: evidence_graph_agent
retention: retain_with_release_evidence
redaction_rules:
- no_raw_secret_exposure
- redact_injection_payload_secrets
used_by:
  pipelines:
  - sdlc_pipeline
  stages:
  - ai_agent_safety_evaluation
  agents:
  - ai_safety_agent
