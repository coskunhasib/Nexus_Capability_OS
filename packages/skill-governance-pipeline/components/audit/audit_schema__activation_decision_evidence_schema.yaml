id: activation_decision_evidence_schema
name: Activation Decision Evidence Schema
type: decision_record_schema
status: candidate
purpose: Decision-record (decision proof) for the public-activation go/no-go decision
  (ACTIVATION_DECISION). Evidence family, NOT trace.
owner_domain: activation_and_release_operations
allowed_usage:
- Record the public-activation owner decision as a decision-proof record.
forbidden_usage:
- Used to record stage-transition history (that is activation_transition_trace_schema).
- Self-approved by the proposing agent (the authorizing actor is the human owner;
  no_self_approval).
governance_profiles:
- evidence_required_policy
- no_self_approval_policy
- owner_activation_decision_gate
audit_schemas:
- activation_evidence_schema
- activation_transition_trace_schema
- stage_gate_trace_schema
notes: NEW (activation). type decision_record_schema = a recorded decision PROOF (Evidence
  family), kept strictly distinct from the transition trace. The authorizing actor
  is the human owner (recorded/routed by activation_owner_decision_agent), not an
  autonomous agent.
applies_to:
- activation_pipeline
- activation_stage:public_activation_decision
required_fields:
- evidence_id
- type
- produced_by
- related_stage
- related_gate
- decision
- decision_rationale
- authorizing_actor
- source_artifacts
- status
- created_at
producer: activation_owner_decision_agent
consumer: policy_and_evidence_engine
retention: retain_with_activation_record
redaction_rules:
- no_raw_secret_exposure
used_by:
  pipelines:
  - activation_pipeline
  stages:
  - public_activation_decision
  agents:
  - activation_owner_decision_agent
