id: skill_semantic_extract_schema
name: Skill Semantic Extract Schema
type: evidence_schema
status: candidate
purpose: Decision-proof record for skill semantic extraction (semantic category, primary
  purpose, allowed/forbidden usage).
owner_domain: skill_governance
allowed_usage:
- Record skill semantic-extraction decision-proof evidence in the skill-governance
  pipeline.
forbidden_usage:
- Used to record process history (that is skill_governance_trace_schema).
governance_profiles:
- evidence_required_policy
- skill_semantic_required_gate
- no_unread_skill_binding
audit_schemas:
- skill_governance_evidence_schema
- skill_governance_trace_schema
notes: 'NEW (skill governance). Stage skill_semantic_extraction; owner skill_semantic_extractor_subagent
  (parent skill_librarian_agent). Pipeline analogue of the SDLC skill_semantic_evidence_schema
  (kept distinct: SDLC stage-scoped vs skill-governance-pipeline-scoped).'
aliases:
- skill_extraction_evidence_schema
applies_to:
- skill_governance_pipeline
- skill_governance_stage:skill_semantic_extraction
required_fields:
- evidence_id
- type
- produced_by
- related_stage
- skill_id
- semantic_category
- primary_purpose
- allowed_usage
- forbidden_usage
- status
- created_at
producer: skill_semantic_extractor_subagent
consumer: skill_runtime_safety_agent
retention: retain_with_skill_registry_entry
redaction_rules:
- no_raw_secret_exposure
used_by:
  pipelines:
  - skill_governance_pipeline
  stages:
  - skill_semantic_extraction
  agents:
  - skill_librarian_agent
  sub_agents:
  - skill_semantic_extractor_subagent
