id: rollback_validation_schema
name: Rollback Validation Schema
type: evidence_schema
status: canonical
purpose: Decision-proof record for rollback validation (ROLLBACK_VALIDATION_REPORT)
  in the backup/restore/DR stage.
owner_domain: sdlc
allowed_usage:
- Record rollback-validation decision-proof evidence (SDLC pre-release).
forbidden_usage:
- Used to record process history (trace_schema).
- Confused with rollback_readiness_evidence_schema (Activation) or rollback_fix_evidence_schema
  (Operations) — those are different pipelines.
governance_profiles:
- evidence_required
audit_schemas:
- backup_restore_evidence_schema
- stage_gate_trace_schema
notes: Stage 26 evidence schema (conditional stage). SDLC-scoped rollback validation;
  distinct from the activation/operations rollback schemas.
applies_to:
- sdlc_stage:backup_restore_dr_validation_if_applicable
required_fields:
- evidence_id
- type
- produced_by
- related_stage
- source_artifacts
- summary
- status
- created_at
producer: operations_readiness_agent
consumer: evidence_graph_agent
retention: retain_with_release_evidence
redaction_rules:
- no_raw_secret_exposure
used_by:
  pipelines:
  - sdlc_pipeline
  stages:
  - backup_restore_dr_validation_if_applicable
  agents:
  - operations_readiness_agent
