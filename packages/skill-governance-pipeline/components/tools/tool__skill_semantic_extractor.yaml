id: skill_semantic_extractor
name: Skill Semantic Extractor
type: tool
category: tool
status: candidate
purpose: Extract a skill's primary_purpose, semantic_category, trigger_phrases, not_for,
  inputs/outputs, handoffs, and draft misuse_warnings (mandatory before any binding).
owner_domain: skill_governance
provided_by_core_ability: null
input_schema:
  package_manifest: object
output_schema:
  skill_semantic_extract: object
side_effects: writes_artifact_store
risk_level: medium
requires_sandbox: true
governance_profiles:
- tool_call_governance
- sandbox_execution_governance
audit_schemas:
- tool_call_trace_schema
- evidence_item_schema
allowed_callers:
- skill_semantic_extractor_subagent
allowed_usage:
- Produce SKILL_SEMANTIC_EXTRACT (skill_semantic_extraction).
forbidden_usage:
- Altering locked semantics (locked_semantics_enforcement_policy): prism=divergence,
    verification-loop=defect-finding.
- Producing a binding (this extracts semantics only; binding is skill_binding_proposer).
used_by:
  pipelines:
  - skill_governance_pipeline
  pipeline_stages:
  - skill_governance_pipeline.skill_semantic_extraction
notes: NEW (skill governance) per review §4.3. Owner is a sub-agent (parent skill_librarian_agent).
