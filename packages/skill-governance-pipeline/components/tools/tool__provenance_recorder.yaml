id: provenance_recorder
name: Provenance Recorder
type: tool
category: tool
status: candidate
purpose: Record/extend the MEMORY_PROVENANCE_RECORD (origin reference, classification,
  summary linkage, validity window, retrieval changes, expiration outcome) across
  the memory lifecycle.
owner_domain: knowledge_management
provided_by_core_ability: Memory
input_schema:
  memory_ref: string
  provenance_event: object
output_schema:
  memory_provenance_record_ref: string
side_effects: writes_evidence_store
risk_level: medium
requires_sandbox: true
governance_profiles:
- tool_call_governance
- sandbox_execution_governance
audit_schemas:
- tool_call_trace_schema
- evidence_item_schema
allowed_callers:
- knowledge_intake_agent
- source_classification_agent
- memory_summarization_agent
- knowledge_reconciliation_agent
- validity_window_agent
- retrieval_profile_agent
- memory_expiration_agent
allowed_usage:
- Seed and extend the memory provenance record at every lifecycle stage.
forbidden_usage:
- Proceeding past intake without a provenance seed (provenance_seed_recorded / provenance_record_missing).
used_by:
  pipelines:
  - knowledge_memory_pipeline
  pipeline_stages:
  - knowledge_memory_pipeline.memory_intake
  - knowledge_memory_pipeline.source_classification
  - knowledge_memory_pipeline.summary_generation
  - knowledge_memory_pipeline.knowledge_conflict_resolution
  - knowledge_memory_pipeline.validity_window_assignment
  - knowledge_memory_pipeline.retrieval_profile_update
  - knowledge_memory_pipeline.memory_expiration_review
notes: NEW (knowledge/memory) per review §4.3. Records provenance evidence (uses memory_provenance_schema
  in the Audit registry); the MEMORY_PROVENANCE_RECORD is evidence, distinct from
  the *_trace items.
