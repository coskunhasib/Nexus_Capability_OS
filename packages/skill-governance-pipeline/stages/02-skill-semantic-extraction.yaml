# Skill Governance Pipeline — Stage Contract 02: skill_semantic_extraction
# Transcribed from: docs/nexus-ai-orchestration-model/legacy/pipeline-catalog/skill-governance-pipeline.md (§2.2)
# Format mirror: configs/nexus-ai/stages/sdlc/04-requirements.yaml
# Conforms to: docs/nexus-ai-orchestration-model/legacy/07-pipeline-contract-standard.md §4 (Stage Contract)
# Pipeline: skill_governance_pipeline. Stage #2 of 7. Stage class: always-on.
# MANDATORY: this stage must precede any binding (anti-pattern: binding without semantics).
# Locked semantics verified here: prism = divergence, verification-loop = verification_defect_discovery.
version: draft-0.1
stage_id: skill_semantic_extraction
name: Skill Semantic Extraction
purpose: >-
  Skill'in primary_purpose, semantic_category, trigger_phrases, not_for,
  inputs/outputs, explicit/implicit_handoffs ve ilk misuse_warnings taslağını
  çıkarır. Bu stage zorunludur ve her binding'den önce gelmelidir. prism yalnız
  brainstorming/divergence amacıyla (kategori/handoff seçenek alanını genişletmek
  için) kullanılır — karar vermez; calibrate confidence üretir. Locked semantics
  burada doğrulanır: prism=divergence, verification-loop=verification_defect_discovery
  olarak kaydedilmelidir.
owner_team: skill_governance_team
team_lead: skill_governance_team_lead
owner_agent: skill_semantic_extractor_subagent
parent_agent: skill_librarian_agent
sub_agents: []

uses_core_abilities:
  - Memory
  - OS

uses_skills:
  - prism       # divergence only (expand category/handoff option space), NOT bug finding
  - calibrate   # produce semantic confidence score
  - gap-audit   # detect missing semantic fields / missing misuse warnings

uses_tools:
  - skill_semantic_extractor
  - artifact_writer
  - evidence_writer

uses_governance_profiles:
  - skill_governance_pipeline_governance
  - skill_semantic_required_gate
  - locked_semantics_enforcement_policy
  - evidence_required_policy

uses_audit_schemas:
  - skill_semantic_extract_schema
  - skill_misuse_warning_schema
  - skill_governance_trace_schema

uses_model_provider_profiles:
  - skill_semantic_extraction_model

uses_context_memory_profiles:
  - skill_semantic_context_pack
  - skill_registry_context_pack

inputs:
  - SKILL_INVENTORY_ENTRY
outputs:
  - SKILL_SEMANTIC_EXTRACT

evidence:
  - SKILL_SEMANTIC_EXTRACT
trace:
  - skill_semantic_extraction_trace
  - gate_evaluation_trace

# key gates: skill_semantic_required_gate (blocker) — semantic_category, primary_purpose,
# not_for, used_by_agents, used_in_stages and confidence >= threshold required;
# locked_semantics_enforcement_policy (blocker) — fail if prism/verification-loop semantics changed.
gates:
  - skill_semantic_required_gate
  - locked_semantics_enforcement_policy

on_pass: script_reference_audit
on_fail: skill_intake
rework_route: skill_intake

blocking_conditions:
  - skill_semantics_unknown
  - locked_semantics_violation
optional_conditions: []
conditional_required_gates: []

max_iterations: 3
