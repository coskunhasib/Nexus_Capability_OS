package_schema_version: '0.1'
pipeline_id: skill_governance_pipeline
name: Skill Governance Pipeline
description: 'Skill paketlerinin keşfi ve KAYNAK DOĞRULAMASI (provenance + sürüm/hash
  pin), zorunlu semantic extraction, script/reference güvenlik denetimi (supply-chain
  + sandbox/least-privilege scope dahil), adversarial misuse/abuse red-team, misuse-warning
  üretimi, skill-stage binding önerisi, aktivasyon kararı ve deprecation/revocation/rollback
  yönetimini no-human governance ile yürütmek. Hiçbir skill, semantic extraction tamamlanmadan,
  red-team''i geçmeden ve misuse-warning üretilmeden binding''e veya aktivasyona geçemez;
  binding''i öneren ile aktivasyonu onaylayan ayrışır (no self-approval). prism =
  brainstorming, verification-loop = bug-finding olarak locked semantics enforce edilir.

  '
