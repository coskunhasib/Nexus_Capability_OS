package_schema_version: '0.1'
pipeline_id: skill_governance_pipeline
name: Skill Governance Pipeline
description: 'Skill paketlerinin keşfi, zorunlu semantic extraction, script/reference
  güvenlik denetimi, misuse-warning üretimi, skill-stage binding önerisi, aktivasyon
  kararı ve deprecation/update yönetimini no-human governance ile yürütmek. Hiçbir
  skill, semantic extraction tamamlanmadan ve misuse-warning üretilmeden binding''e
  veya aktivasyona geçemez. prism = brainstorming, verification-loop = bug-finding
  olarak locked semantics enforce edilir.

  '
