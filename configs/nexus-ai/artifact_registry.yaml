version: draft-0.1
registry_id: nexus_ai_artifact_registry
purpose: Canonical artifact names for Nexus AI pipeline evidence and traceability.

naming_rules:
  case: UPPER_SNAKE_CASE
  conditional_suffix: _IF_APPLICABLE
  gate_result_suffix: _GATE_RESULT
  applicability_suffix: _APPLICABILITY_DECISION
  report_suffix: _REPORT

artifact_groups:
  product_and_scope:
    - PRODUCT_BRIEF
    - INITIAL_SCOPE
    - SUCCESS_METRICS
    - DOMAIN_PROFILE_DECISION
    - RISK_PROFILE
  skill_semantics:
    - SKILL_SEMANTIC_CATALOG
    - SKILL_MISUSE_WARNINGS
    - SKILL_STAGE_BINDING_PROPOSAL
  requirements:
    - REQUIREMENTS_SPEC
    - NFR_CATALOG
    - ACCEPTANCE_CRITERIA
    - REQUIREMENTS_TRACE_START
    - REQUIREMENTS_REVIEW_REPORT
  architecture:
    - ARCHITECTURE_DOC
    - SYSTEM_CONTEXT_DIAGRAM
    - ADR_INDEX
    - ARCHITECTURE_REVIEW_REPORT
  security_privacy_design:
    - THREAT_MODEL
    - SECURITY_REQUIREMENTS
    - DATA_INVENTORY
    - PRIVACY_RISK_REGISTER
  risk_planning:
    - SENTINEL_PREMORTEM
    - FMEA_RISK_REGISTER
    - IMPLEMENTATION_PLAN
    - TASK_BREAKDOWN
    - HANDOFF_PACKETS
    - EXECUTOR_WORKPACKAGE_DRAFTS
    - OPERATIONAL_READINESS_DRAFTS
    - RUNBOOK_DRAFT
    - ROLLBACK_PLAN_DRAFT
  implementation_review:
    - CODE_CHANGESET_SUMMARY
    - IMPLEMENTATION_NOTES
    - LOCAL_BUILD_RESULT
    - DATA_MODEL_CHANGE_REPORT_IF_APPLICABLE
    - MIGRATION_FILES_IF_APPLICABLE
    - API_CONTRACTS_IF_APPLICABLE
    - UI_CHANGESET_SUMMARY_IF_APPLICABLE
    - RESOURCE_USAGE_DATA_IF_APPLICABLE
    - TOOL_PERMISSION_MAP
    - CONTEXT_POLICY
    - CODE_REVIEW_REPORT
  test_bugfinding:
    - TEST_PLAN
    - GENERATED_TESTS_SUMMARY
    - TEST_EXECUTION_REPORT
    - COVERAGE_REPORT
    - BUG_FINDING_REPORT
    - BUG_FINDING_GATE_RESULT
  security_supply_chain_agentic:
    - SECURITY_SCAN_REPORT
    - SECURITY_FINDINGS_NORMALIZED
    - SBOM
    - LICENSE_REPORT
    - DEPENDENCY_RISK_REPORT
    - SUPPLY_CHAIN_GATE_RESULT
    - AGENTIC_SAFETY_EVAL_REPORT
    - PROMPT_INJECTION_TEST_REPORT
    - TOOL_MISUSE_TEST_REPORT
    - CONTEXT_POISONING_TEST_REPORT
    - EVIDENCE_INTEGRITY_REPORT
  product_gates:
    - COMPLIANCE_APPLICABILITY_DECISION
    - COMPLIANCE_MATRIX_IF_APPLICABLE
    - REGULATORY_TRACEABILITY_REPORT_IF_APPLICABLE
    - COMPLIANCE_GATE_RESULT_IF_APPLICABLE
    - DATA_LIFECYCLE_REPORT
    - RETENTION_POLICY_REPORT
    - TENANT_ISOLATION_REPORT
    - PRIVACY_GATE_RESULT
    - API_CONTRACT_REPORT
    - BREAKING_CHANGE_REPORT
    - CONTRACT_TEST_REPORT
    - COMPATIBILITY_GATE_RESULT
    - MIGRATION_VALIDATION_REPORT
    - ROLLBACK_VALIDATION_REPORT
    - DATA_INTEGRITY_REPORT
    - ACCESSIBILITY_REPORT
    - UX_VALIDATION_REPORT
    - UI_RELEASE_GATE_RESULT
    - PERFORMANCE_REPORT
    - RESILIENCE_REPORT
    - COST_ESTIMATE_REPORT
    - RESOURCE_BUDGET_REPORT
    - QUOTA_POLICY_REPORT
    - RESOURCE_GATE_RESULT
    - BACKUP_PLAN
    - RESTORE_TEST_REPORT
    - DR_READINESS_REPORT
  completion_release:
    - RUNBOOK
    - ROLLBACK_PLAN
    - OBSERVABILITY_PLAN
    - INCIDENT_RESPONSE_PLAN
    - EVIDENCE_GRAPH
    - TRACEABILITY_MATRIX
    - DEVELOPMENT_COMPLETION_REPORT
    - DEVELOPMENT_COMPLETION_GATE_RESULT
    - RELEASE_CANDIDATE_REPORT
    - RELEASE_EVIDENCE
  learning:
    - LESSONS_LEARNED
    - MEMORY_UPDATE_PROPOSAL
    - FUTURE_IMPROVEMENT_BACKLOG

release_evidence_required:
  core:
    - REQUIREMENTS_SPEC
    - NFR_CATALOG
    - ARCHITECTURE_DOC
    - ADR_INDEX
    - THREAT_MODEL
    - FMEA_RISK_REGISTER
    - CODE_REVIEW_REPORT
    - TEST_EXECUTION_REPORT
    - BUG_FINDING_REPORT
    - SECURITY_SCAN_REPORT
    - SBOM
    - LICENSE_REPORT
    - AGENTIC_SAFETY_EVAL_REPORT
    - RUNBOOK
    - ROLLBACK_PLAN
    - OBSERVABILITY_PLAN
    - EVIDENCE_GRAPH
    - DEVELOPMENT_COMPLETION_REPORT
    - RELEASE_CANDIDATE_REPORT
  conditional:
    - COMPLIANCE_MATRIX_IF_APPLICABLE
    - REGULATORY_TRACEABILITY_REPORT_IF_APPLICABLE
    - DATA_LIFECYCLE_REPORT
    - API_CONTRACT_REPORT
    - MIGRATION_VALIDATION_REPORT
    - ACCESSIBILITY_REPORT
    - COST_ESTIMATE_REPORT
    - RESTORE_TEST_REPORT

evidence_item_schema:
  required_fields:
    - evidence_id
    - artifact_id
    - related_pipeline
    - related_run
    - related_stage
    - related_gate
    - producer
    - status
    - summary
    - trace_refs
