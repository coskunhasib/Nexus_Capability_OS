# Nexus AI Orchestration Model — Runtime Workpackage Execution Contract
#
# Scope: blueprint/config only. No runtime implementation is authorized by this file.

runtime_workpackage_execution_contract_id: nexus_ai_runtime_workpackage_execution_contract
runtime_workpackage_execution_contract_version: draft-0.1
status: draft
scope: blueprint_only
no_runtime_code_authorized: true

purpose: >-
  Define the minimum contract required before any implementation workpackage can be executed.
  This prevents planning handoff approval from being mistaken for runtime execution approval.

required_before_execution:
  - selected_workpackage
  - assigned_executor
  - reviewer
  - owner_decision_ref
  - isolated_workspace
  - forbidden_actions_acknowledged
  - expected_outputs
  - required_evidence
  - required_trace
  - validation_commands
  - rollback_or_revert_plan
  - completion_report_path

required_owner_decision_template: |
  OWNER_DECISION: APPROVE_RUNTIME_WORKPACKAGE_EXECUTION
  SCOPE: WP-XX only
  EXECUTOR: <assigned executor>
  REVIEWER: ChatGPT
  BRANCH/WORKSPACE: isolated under nexus; no main merge

workpackage_execution_rules:
  - one_workpackage_per_owner_decision
  - assigned_executor_must_match_handoff_or_override_decision
  - reviewer_must_be_separate_from_executor
  - completion_report_required
  - evidence_required_for_done_claims
  - trace_required_for_commands_and_tool_calls
  - forbidden_actions_must_remain_blocked
  - no_main_merge
  - no_deploy
  - no_connector_integration_unless_scope_explicitly_allows_it
  - no_plugin_reintroduction
  - no_production_readiness_claim

completion_report_required_fields:
  - workpackage_id
  - executor
  - reviewer
  - scope
  - summary
  - files_changed
  - commands_run
  - command_exit_codes
  - tests_run
  - validation_results
  - evidence_refs
  - trace_refs
  - known_risks
  - deviations
  - forbidden_actions_check
  - next_recommended_action
  - verdict

valid_completion_verdicts:
  - COMPLETE_PASS
  - COMPLETE_PASS_WITH_FINDINGS
  - BLOCKED
  - FAILED
  - HOLD_FOR_REVIEW

forbidden_patterns:
  - executing_from_planning_approval_only
  - executing_multiple_workpackages_from_one_scope_limited_decision
  - executor_self_review
  - completion_without_evidence
  - hidden_commands
  - hidden_file_changes
  - runtime_work_without_owner_decision
