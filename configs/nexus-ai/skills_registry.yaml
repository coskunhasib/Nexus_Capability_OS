      reasoning skills — this is the meta-skill that produces the semantic record
      the registry rule (doc 03 §7, doc 06 no_unread_skill_binding) depends on.
      Recommend RATIFY as canonical under semantic_category skill_governance rather
      than remap (no canonical equivalent exists). Resolve stage-03 open_question.

