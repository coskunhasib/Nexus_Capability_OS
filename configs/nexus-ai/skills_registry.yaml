# =============================================================================
# Nexus AI — Skills Registry
# Phase C / doc 17 §5 — Shared Registry Formalization
# Output of: docs/nexus-ai-orchestration-model/legacy/17-shared-registry-formalization-plan.md
# =============================================================================
#
# WHAT THIS FILE IS
#   The canonical "what skills exist in the system" registry. It answers the
#   Shared-Registry question (doc 05 §3 "Sistemde ne var?"). Usage relationships
#   ("kim neyi kullanıyor?") are mirrored here via each item's `used_by` list so
#   the usage-mapping rule is enforceable from registry data alone (doc 17 §13).
#
# LOCKED DECISIONS HONORED
#   - Plugin cancelled: there is NO plugin registry and no skill is a plugin.
#   - Core Abilities [Supervisor, Coder, Vision, Audio, Creative, Memory, Web, OS]
#     are NOT skills and NEVER appear here. Skill != Tool. A skill is a reasoning
#     method/package referenced by name; tools live in tools_registry.yaml.
#   - Skill appears by NAME ONLY. Package internals (SKILL.md, scripts/**,
#     references/**, assets/**) stay out of this registry; they live in the skill
#     inventory / semantic-extraction audit docs (doc 03; doc 05 §7).
#   - Governance != Audit; Evidence != Trace (kept distinct in governance_profiles
#     vs audit_schemas below).
#   - LOCKED SKILL SEMANTICS (doc 03 §1/§5; sdlc_pipeline_runtime_rules.yaml):
#       * prism            = brainstorming / divergence ONLY (NOT bug finding).
#       * verification-loop = bug/defect finding ONLY (NOT a general readiness
#                             checklist; NOT a replacement for test_execution).
#
# ITEM CONTRACT (doc 17 §3) — every item carries:
#   id, name, type, status, purpose, owner_domain, allowed_usage,
#   forbidden_usage, governance_profiles, audit_schemas, notes
# PLUS category-specific fields (doc 17 §5): semantic_category, primary_purpose
#   (allowed_usage / forbidden_usage are shared between §3 and the category set).
# PLUS used_by (pipelines/stages/agents that reference it) and aliases.
#
# STATUS VOCABULARY
#   canonical  — locked/established (the canonical 12).
#   candidate  — referenced in a contract/pipeline but not yet ratified into the
#                canonical skills list (the 6 undeclared skills, each self-flagged
#                in-file; see claude-code-skill-agent-review.md §8).
#   deprecated — retired (none yet).
#
# SEMANTIC-CATEGORY VOCABULARY (doc 03 §4): divergence, multi_perspective_review,
#   premortem_risk, verification_defect_discovery, failure_mode_analysis,
#   architecture_decision, completeness_audit, intent_fidelity,
#   editing_refinement, skill_governance, confidence_calibration, belief_update,
#   learning_refraction, argument_analysis, counterargument_strengthening,
#   problem_decomposition.
#
# NAMING RECONCILIATION
#   Where a contract referenced a *_policy variant of a canonical governance id
#   (no_self_approval_policy -> no_self_approval; evidence_required_policy ->
#   evidence_required), the canonical id is used in governance_profiles and the
#   variant is recorded under `aliases`. No SKILL itself has a *_policy variant;
#   per-skill `aliases` is therefore empty unless a remap applies.
# =============================================================================

version: draft-0.1
registry_id: nexus_ai_skills_registry
category: skill
purpose: >-
  Canonical inventory of Nexus AI Skills (reasoning methods / skill packages)
  referenced by pipelines, stages, agents and sub-agents — with locked semantic
  boundaries and registry-enforceable usage mapping.

# ---------------------------------------------------------------------------
# Provenance — sources scanned to build this registry (doc 17 §5 task scope).
# ---------------------------------------------------------------------------
sources_scanned:
  - configs/nexus-ai/stages/sdlc/*.yaml                 # 31 SDLC stage contracts (richest source; inline NON-CANONICAL annotations)
  - configs/nexus-ai/sdlc_pipeline.yaml                 # pipeline-level uses_skills (canonical 12)
  - configs/nexus-ai/sdlc_pipeline_runtime_rules.yaml   # locked anti-patterns for prism / verification-loop / skill binding
  - configs/nexus-ai/pipeline_catalog.yaml              # catalog summaries (markdown is authoritative per review F-1)
  - docs/nexus-ai-orchestration-model/legacy/pipeline-catalog/*.md          # 5 non-SDLC pipelines (research, activation, operations, skill-governance, knowledge-memory)
  - docs/nexus-ai-orchestration-model/reviews/pipeline-catalog-review.md       # §4 consolidated newly-introduced names
  - docs/nexus-ai-orchestration-model/reviews/claude-code-skill-agent-review.md # §8 the 6 undeclared skills
  - docs/nexus-ai-orchestration-model/legacy/03-skill-semantic-extraction.md          # canonical semantic_category / primary_purpose / not_for model
  - docs/nexus-ai-orchestration-model/legacy/03-governance-and-audit-layering.md      # §8 skill-level governance profiles
  - docs/nexus-ai-orchestration-model/legacy/05-shared-registry-and-usage-mapping.md  # the dual registry+usage rule
  - docs/nexus-ai-orchestration-model/legacy/06-governance-policy-evidence.md         # no_unread_skill_binding rule
  - docs/nexus-ai-orchestration-model/legacy/11-artifact-registry-standard.md         # evidence/trace separation

# ---------------------------------------------------------------------------
# Registry-wide invariants (enforce the locked rules from registry data).
# ---------------------------------------------------------------------------
invariants:
  - No item here is a Core Ability (Supervisor, Coder, Vision, Audio, Creative, Memory, Web, OS).
  - No item here is a Tool, an Agent, a Sub-agent, or a Plugin.
  - Every item has a status and at least one used_by entry, OR status == candidate.
  - prism.semantic_category == divergence and 'bug_finding' is in prism.forbidden_usage.
  - verification-loop.semantic_category == verification_defect_discovery and both
    'general_readiness_checklist' and 'replacing_test_execution' are in its forbidden_usage.
  - A skill may only be bound to a stage after skill_semantic_extraction (doc 06 no_unread_skill_binding).

# Skill-class governance/audit defaults that apply to every skill regardless of
# its individual entry (each item also lists its own governance_profiles/audit_schemas).
skill_class_defaults:
  governance_profiles:
    - skill_governance                                   # doc 17 §7 type: skill-level governance
    - skill_must_have_semantic_extraction_before_binding # doc 06 §: no_unread_skill_binding rule
    - locked_semantics_enforcement_policy                # skill-governance pipeline: a pipeline may record but not alter skill semantics
  audit_schemas:
    - skill_activation_trace_schema                      # doc 03 §12: "skill activation trace" (trace, NOT evidence)

# =============================================================================
# SKILLS
# =============================================================================
skills:

  # -------------------------------------------------------------------------
  # CANONICAL 12 (status: canonical) — the locked shared skills list.
  # =========================================================================

  - id: prism
    name: Prism
    type: skill
    status: canonical
    semantic_category: divergence
    primary_purpose: brainstorming / ideation / divergent thinking
    purpose: >-
      Multi-lens divergent ideation: expand the option space (goal framing,
      requirement elicitation, candidate architectures, failure-mode/abuse-case
      ideation, sequencing/handoff-partition options). Produces options, never
      decisions.
    owner_domain: reasoning_methods
    allowed_usage:
      - divergent_exploration
      - option_space_expansion
      - brainstorming
      - requirement_elicitation
      - candidate_architecture_generation
      - failure_mode_and_abuse_case_ideation   # paired with sentinel + fmea at stage 09
      - subskill_of_llm_council_or_sentinel
    forbidden_usage:
      - bug_finding                  # LOCKED: prism is NOT a defect-finding skill
      - final_release_approval       # prism is not a release gate
      - general_readiness_gate       # prism does not gate readiness
      - decision_making              # prism widens the option space; it does not decide
    governance_profiles:
      - brainstorming_skill_governance             # doc 03 §8: prism brainstorming-only governance
      - locked_semantics_enforcement_policy
      - skill_must_have_semantic_extraction_before_binding
    audit_schemas:
      - skill_activation_trace_schema
    used_by:
      pipelines:
        - sdlc_pipeline
        - research_pipeline
        - skill_governance_pipeline
      stages:
        - sdlc:01-intake                 # divergent goal/problem framing & scope boundaries
        - sdlc:04-requirements           # divergent requirement elicitation
        - sdlc:06-architecture           # divergent candidate architecture options
        - sdlc:09-premortem-fmea         # divergent failure-mode / abuse-case / edge-case ideation
        - sdlc:10-planning               # diverge over sequencing / handoff-partitioning options
        - research:scope_and_questions   # divergence over scope/questions
        - skill_governance:skill_semantic_extraction  # widen category/handoff option space (does not decide)
        - skill_governance:skill_binding_proposal     # multiply candidate binding options (divergence)
      agents:
        - requirements_agent
        - architecture_agent
        - llm_council_agent
        - security_risk_agent
    aliases: []
    notes: >-
      Enforced by sdlc_pipeline_runtime_rules anti-pattern `prism_as_non_divergence`.
      Correctly ABSENT from every review/validation/execution/readiness stage.
      In skill_governance it only expands options and never adjudicates.

  - id: verification-loop
    name: Verification-loop
    type: skill
    status: canonical
    semantic_category: verification_defect_discovery
    primary_purpose: bug / defect finding and verification sweep
    purpose: >-
      Rigorous multi-lens defect sweep (invariant / mutation / regression
      red-teaming) over a changeset and its test results to surface real defects
      beyond what the executed suite caught, triaged by severity. Produces a
      defect report + a blocking gate result; emits residual risk, never a
      bug-free guarantee.
    owner_domain: reasoning_methods
    allowed_usage:
      - bug_finding
      - defect_finding
      - verification_sweep
      - adversarial_defect_discovery     # e.g. prompt-injection / tool-misuse / poisoning defect sweep (stage 18)
      - migration_defect_finding         # lossy/irreversible/ordering/idempotency defects (stage 22)
      - script_defect_sweep              # skill-governance script_reference_audit
      - post_fix_regression_review
    forbidden_usage:
      - general_readiness_checklist      # LOCKED: NOT a readiness checklist
      - replacing_test_execution         # LOCKED: NOT a substitute for stage 14 test_execution
      - ideation                         # not a brainstorming skill
      - architecture_brainstorming
      - bug_free_guarantee               # it produces residual risk, not a guarantee
    governance_profiles:
      - defect_finding_skill_governance            # doc 03 §8: verification-loop defect-finding governance
      - locked_semantics_enforcement_policy
      - skill_must_have_semantic_extraction_before_binding
    audit_schemas:
      - skill_activation_trace_schema
      - bug_finding_evidence_schema                # evidence (defects found) — distinct from trace
    used_by:
      pipelines:
        - sdlc_pipeline
        - operations_pipeline            # conditional forward-fix confirmation
        - skill_governance_pipeline      # script defect sweep
      stages:
        - sdlc:15-verification-loop-bug-finding          # the dedicated defect sweep
        - sdlc:18-ai-agent-safety-evaluation             # adversarial defect sweep
        - sdlc:22-data-migration-validation-if-applicable # migration defect finding
        - operations:forward_fix_confirmation            # confirm a fix removed the defect
        - skill_governance:script_reference_audit        # defect/bug-finding semantics over scripts/**
      agents:
        - qa_agent
        - bug_hunter_subagent
        - code_reviewer_agent
    aliases: []
    notes: >-
      Enforced by sdlc_pipeline_runtime_rules anti-patterns
      `verification_loop_replaces_test_execution` and (boundary) `concept_boundary_collapse`.
      DELIBERATELY EXCLUDED from 12 code_review, 13 test_generation, 14 test_execution,
      16 security_validation, 20, 21, 23, 24, 26, 27, 28, 29, 30 (most carry an explicit
      exclusion comment). Stage 29 explicitly refuses to reuse it as a general readiness checklist.

  - id: sentinel
    name: Sentinel
    type: skill
    status: canonical
    semantic_category: premortem_risk
    primary_purpose: decision stress test / premortem / adversarial foresight
    purpose: >-
      Pre-commitment stress test: surface hidden assumptions, premortem failure
      paths and early-warning signals for designs, risk surfaces and readiness/
      validation gates. May call prism during premortem/mirror/counterfactual phases.
    owner_domain: reasoning_methods
    allowed_usage:
      - premortem
      - risk_surfacing
      - hidden_assumption_surfacing
      - adversarial_foresight
      - pre_commitment_review
      - misuse_scenario_premortem        # skill-governance misuse_warning_generation
    forbidden_usage:
      - implementation
      - final_approval_by_itself         # sentinel informs a gate; it is not the sole approver
      - bug_finding                      # defect discovery is verification-loop's job
    governance_profiles:
      - skill_governance
      - locked_semantics_enforcement_policy
      - skill_must_have_semantic_extraction_before_binding
    audit_schemas:
      - skill_activation_trace_schema
    used_by:
      pipelines:
        - sdlc_pipeline
        - activation_pipeline
        - operations_pipeline
        - skill_governance_pipeline
      stages:
        - sdlc:06-architecture
        - sdlc:07-architecture-review
        - sdlc:08-security-privacy-design
        - sdlc:09-premortem-fmea
        - sdlc:18-ai-agent-safety-evaluation
        - sdlc:19-privacy-data-lifecycle-validation
        - sdlc:23-accessibility-ux-validation-if-applicable
        - sdlc:26-backup-restore-dr-validation-if-applicable
        - sdlc:27-operations-readiness
        - skill_governance:misuse_warning_generation     # premortem of misuse scenarios
      agents:
        - architecture_agent
        - security_privacy_agent
        - operations_readiness_agent
    aliases: []
    notes: >-
      9 SDLC stages — all design/risk/pre-commitment surfaces (review §3, CLEAN).
      Activation binds it as premortem/foresight; prism and verification-loop are
      intentionally NOT bound in activation.

  - id: llm-council
    name: LLM Council
    type: skill
    status: canonical
    semantic_category: multi_perspective_review
    primary_purpose: multi-perspective decision review and verdict synthesis
    purpose: >-
      Multi-model deliberation/adjudication for genuinely hard or contested
      judgement contexts: architecture option scoring, architecture review,
      agentic-safety severity, ambiguous regulatory interpretation. May call prism
      before decision review.
    owner_domain: reasoning_methods
    allowed_usage:
      - multi_perspective_review
      - verdict_synthesis
      - contested_judgement_adjudication
      - option_scoring
      - severity_adjudication
      - binding_proposal_review          # skill-governance skill_binding_proposal
    forbidden_usage:
      - direct_code_execution
      - policy_bypass
      - replacing_a_single_owner_decision_record   # it informs the decision; the gate still records an owner
    governance_profiles:
      - skill_governance
      - locked_semantics_enforcement_policy
      - skill_must_have_semantic_extraction_before_binding
    audit_schemas:
      - skill_activation_trace_schema
      - decision_trace_schema            # multi-perspective decision history (trace)
    used_by:
      pipelines:
        - sdlc_pipeline
        - research_pipeline
        - activation_pipeline
        - skill_governance_pipeline
      stages:
        - sdlc:06-architecture
        - sdlc:07-architecture-review
        - sdlc:18-ai-agent-safety-evaluation
        - sdlc:21-domain-regulatory-compliance-validation-if-applicable
        - research:cross_validation
        - skill_governance:skill_binding_proposal        # multi-perspective review of the proposed binding
      agents:
        - llm_council_agent
        - architecture_agent
        - compliance_agent
    aliases: []
    notes: 4 SDLC stages — all genuinely hard/contested judgement contexts (review §3, CLEAN).

  - id: fmea
    name: FMEA
    type: skill
    status: canonical
    semantic_category: failure_mode_analysis
    primary_purpose: structured failure-mode and effects analysis
    purpose: >-
      Structured failure-mode-and-effects analysis over failure-relevant surfaces
      (security, risk register, data-leak/tenant isolation, data migration,
      performance/resilience, data-loss/DR), producing a ranked failure-mode register.
    owner_domain: reasoning_methods
    allowed_usage:
      - failure_mode_analysis
      - effects_and_severity_ranking
      - risk_register_construction
      - script_failure_mode_analysis     # skill-governance script_reference_audit
    forbidden_usage:
      - brainstorming_only               # fmea is structured analysis, not free ideation (that is prism)
      - defect_discovery_in_code         # finding live code defects is verification-loop
    governance_profiles:
      - skill_governance
      - locked_semantics_enforcement_policy
      - skill_must_have_semantic_extraction_before_binding
    audit_schemas:
      - skill_activation_trace_schema
    used_by:
      pipelines:
        - sdlc_pipeline
        - operations_pipeline
        - skill_governance_pipeline
      stages:
        - sdlc:08-security-privacy-design
        - sdlc:09-premortem-fmea
        - sdlc:19-privacy-data-lifecycle-validation
        - sdlc:22-data-migration-validation-if-applicable
        - sdlc:24-performance-resilience
        - sdlc:26-backup-restore-dr-validation-if-applicable
        - skill_governance:script_reference_audit        # script failure modes
      agents:
        - security_privacy_agent
        - data_migration_agent
        - performance_resilience_agent
    aliases: []
    notes: 6 SDLC stages — all failure-mode-relevant surfaces (review §3, CLEAN).

  - id: adr-builder
    name: ADR Builder
    type: skill
    status: canonical
    semantic_category: architecture_decision
    primary_purpose: author architecture decision records (ADRs)
    purpose: >-
      Capture architecture/contract decisions as structured ADRs (context,
      decision, consequences, alternatives) for the ADR index and for
      API-contract decision rationale.
    owner_domain: reasoning_methods
    allowed_usage:
      - architecture_decision_recording
      - adr_authoring
      - api_contract_decision_recording
    forbidden_usage:
      - making_the_decision_unilaterally  # it records a decision; it does not replace review/council
      - bug_finding
    governance_profiles:
      - skill_governance
      - skill_must_have_semantic_extraction_before_binding
    audit_schemas:
      - skill_activation_trace_schema
      - decision_trace_schema
    used_by:
      pipelines:
        - sdlc_pipeline
      stages:
        - sdlc:06-architecture
        - sdlc:20-api-contract-compatibility-validation
      agents:
        - architecture_agent
    aliases: []
    notes: 2 SDLC stages; produces ADR_INDEX-class evidence.

  - id: gap-audit
