      extract its semantic identity — primary_purpose, semantic_category,
      trigger_phrases, not_for, inputs/outputs, handoffs and misuse_warnings —
      so it can be safely bound. Drives the skill_semantic_extraction stage.
    owner_domain: skill_governance
    allowed_usage:
      - skill_semantic_extraction
      - skill_package_classification
      - misuse_warning_drafting
    forbidden_usage:
      - binding_a_skill_without_extraction   # it performs extraction; binding is a later, separate decision
      - altering_locked_skill_semantics      # may record but never change prism/verification-loop semantics
      - bug_finding
    governance_profiles:
      - skill_governance
      - skill_semantic_required_gate
      - locked_semantics_enforcement_policy
      - skill_must_have_semantic_extraction_before_binding
    audit_schemas:
