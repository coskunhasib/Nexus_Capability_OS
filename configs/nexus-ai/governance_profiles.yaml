# Nexus AI Orchestration Model — Shared Registry: GOVERNANCE PROFILES
#
# Phase C / doc 17 (17-shared-registry-formalization-plan.md §7). Machine-readable
# documentation/blueprint ONLY — NO runtime code, NO merge, NO deploy.
#
# Governance != Audit (locked). This file holds the GOVERNANCE family only:
#   Policy | Gates | Permissions | Risk Rules (per 03-governance-and-audit-layering.md §1).
# Audit (Evidence + Trace) schemas live in configs/nexus-ai/audit_schemas.yaml — NOT here.
# Therefore *_trace / *_trace_schema / *_evidence_schema names are deliberately ABSENT below;
# only governance profiles (policies + gates + governance umbrellas) are registered here.
#
# Shared Registry + Usage Mapping rule (05-shared-registry-and-usage-mapping.md):
#   A governance profile appears ONCE here (registry = "what exists") and is RE-SHOWN under
#   each pipeline/stage/team/agent/core_ability/skill/tool that uses it (usage mapping). The
#   `used_by` list on every item below makes that usage mapping enforceable from registry data
#   (doc 17 §13 exit criterion: "Usage mapping rule is enforceable from registry data").
#
# LOCKED CONTEXT (.memory/0002-locked-decisions.md):
#   - Plugin is CANCELLED and NEVER reintroduced (no plugin registry, ever). The global
#     profile `plugin_absent` ENFORCES this; it does not create a plugin concept.
#   - Core Abilities [Supervisor, Coder, Vision, Audio, Creative, Memory, Web, OS] are NOT agents
#     and NOT team members; owner_agent / Agent roles are NEVER a Core Ability. Supervisor is NOT
#     any *_team_lead.
#   - Skill != Tool ; Governance != Audit ; Evidence != Trace.
#
# CATEGORY CONTRACT (doc 17 §3 item contract + §7 governance-specific fields). Every item carries:
#   id, name, type, status, purpose, owner_domain, allowed_usage, forbidden_usage,
#   governance_profiles, audit_schemas, notes,            # §3 common item contract
#   scope, applies_to, severity_default,                  # §7 governance-specific fields
#   used_by                                               # usage-mapping enforcement (§13)
#   (+ aliases where a pipeline used a *_policy variant of a canonical id — naming reconciliation)
#
# STATUS vocabulary (doc 17): canonical (locked/established) | candidate (referenced, not yet
#   ratified) | deprecated. NEW pipeline-introduced profiles are marked `candidate`. Every item
#   has a status AND at least one used_by entry (or status: candidate).
#
# NAMING RECONCILIATION: the 5 new catalog pipelines reference `no_self_approval_policy` and
#   `evidence_required_policy`, which are naming variants of the canonical core policies
#   `no_self_approval` / `evidence_required` (06-governance-policy-evidence.md §2–§3;
#   pipeline-catalog-review.md §4.7). The canonical bare id is registered; the `_policy` variant
#   is recorded under `aliases`. (Per pipeline-catalog-review.md §4 note, where the catalog
#   markdown doc and the catalog YAML disagree, the MARKDOWN name is authoritative.)
#
# SCOPE taxonomy (doc 17 §7 / 03-governance-and-audit-layering.md §2), 7 layers — items are
# GROUPED by scope below:
#   global | pipeline | team | stage | core_ability | skill | tool
#
# severity_default vocabulary mirrors the policy severities in 06-governance-policy-evidence.md
#   (blocker | advisory) plus the stage-contract gate severities (major) where a profile defaults
#   a gate that is blocking-on-applicability or advisory->blocker. Values used: blocker | major |
#   advisory.

registry_id: nexus_ai_governance_profiles
registry_name: Nexus AI Orchestration Model — Governance Profiles Registry
registry_version: draft-0.1
registry_status: draft
category: governance_profiles
top_structure: nexus_ai_orchestration_model
no_plugin: true

# Provenance — sources scanned to extract every governance profile below.
canonical_sources:
  - docs/nexus-ai-orchestration-model/legacy/03-governance-and-audit-layering.md          # scope layers + GLOBAL governance set
  - docs/nexus-ai-orchestration-model/legacy/05-shared-registry-and-usage-mapping.md      # registry + usage-mapping rule
  - docs/nexus-ai-orchestration-model/legacy/06-governance-policy-evidence.md             # canonical blocker/advisory policies
  - docs/nexus-ai-orchestration-model/legacy/11-artifact-registry-standard.md             # artifact/evidence vs gate-result naming
  - docs/nexus-ai-orchestration-model/legacy/17-shared-registry-formalization-plan.md     # §3 item contract + §7 governance fields
  - configs/nexus-ai/sdlc_pipeline.yaml                               # SDLC pipeline-level uses_governance_profiles
  - configs/nexus-ai/sdlc_pipeline_runtime_rules.yaml                 # locked-decision guards (no_self_approval, no plugin)
  - configs/nexus-ai/stages/sdlc/*.yaml                               # 31 SDLC stage uses_governance_profiles (richest source)
  - configs/nexus-ai/pipeline_catalog.yaml                            # pre-R9 catalog definition_contract variant names (now summary-only; recorded as aliases)
  - docs/nexus-ai-orchestration-model/legacy/pipeline-catalog/research-pipeline.md        # research governance (markdown authoritative)
  - docs/nexus-ai-orchestration-model/legacy/pipeline-catalog/activation-pipeline.md      # activation governance (markdown authoritative)
  - docs/nexus-ai-orchestration-model/legacy/pipeline-catalog/operations-pipeline.md      # operations governance (markdown authoritative)
  - docs/nexus-ai-orchestration-model/legacy/pipeline-catalog/skill-governance-pipeline.md# skill-governance governance (markdown authoritative)
  - docs/nexus-ai-orchestration-model/legacy/pipeline-catalog/knowledge-memory-pipeline.md# knowledge/memory governance (markdown authoritative)
  - docs/nexus-ai-orchestration-model/reviews/pipeline-catalog-review.md           # §4 consolidated newly-introduced governance names
  - docs/nexus-ai-orchestration-model/reviews/claude-code-skill-agent-review.md    # §8 undeclared skills (cross-ref for skill-scope governance)
  # Reconciliation sweep (post-Phase G/H): intra-registry references resolved to first-class items or aliases.
  - configs/nexus-ai/tools_registry.yaml                              # tool_call_governance + global_no_secret_policy (referenced_governance_profiles)
  - configs/nexus-ai/model_provider_profiles.yaml                     # model_invocation_governance / global_governance / research_pipeline_governance refs
  - configs/nexus-ai/context_memory_profiles.yaml                     # context_access_governance + per-domain context-pack governance refs
  - configs/nexus-ai/core_abilities.yaml                              # orchestration/vision/audio/creative core-ability governance refs
  - configs/nexus-ai/skills_registry.yaml                             # skill_must_have_semantic_extraction_before_binding (skill_class_defaults)
  - configs/nexus-ai/audit_schemas.yaml                               # audit-side governance refs (variant names + blocker_bug_zero / residual_risk_recorded)

status_vocabulary: [canonical, candidate, deprecated]
scope_vocabulary: [global, pipeline, team, stage, core_ability, skill, tool]
severity_vocabulary: [blocker, major, advisory]
# type vocabulary additions (reconciliation): stage_risk_rule (named SDLC risk rules referenced by audit
# evidence schemas, e.g. blocker_bug_zero / residual_risk_recorded). No new SCOPE was introduced: model
# invocation and context access are cross-cutting dimensions registered at `global` scope (the 7-layer
# taxonomy in 03 §3–§9 has no model/context layer; cf. the model/context "trace" dimensions in 03 §12).

# =====================================================================================
# Governance profiles, GROUPED by the 7 scopes (doc 17 §7).
# =====================================================================================
governance_profiles:

  # -----------------------------------------------------------------------------------
  # SCOPE: global — apply to ALL of Nexus AI (03-governance-and-audit-layering.md §3).
  # Includes the 6 task-mandated GLOBAL profiles + the 2 cross-cutting canonical core
  # policies (no_self_approval / evidence_required) that every pipeline binds (and which
  # the new catalog pipelines reference via *_policy aliases — reconciled here).
  # -----------------------------------------------------------------------------------
  global:

    - id: plugin_absent
      name: Plugin Absent (No Plugin Anywhere)
      type: global_governance_policy
      status: canonical
      purpose: >-
        Enforce the locked decision that Plugin is cancelled and never reintroduced: no plugin
        concept, field, stage, or registry may exist anywhere in Nexus AI. Documentation/blueprint
        guardrail — asserts absence, does not create a plugin concept.
      owner_domain: nexus_global_governance
      allowed_usage:
        - Reject any pipeline/stage/registry that introduces a plugin concept, field, or stage.
        - Be referenced by every pipeline as a standing global guard.
      forbidden_usage:
        - Used to (re)introduce, gate, or "manage" any plugin — there is no plugin to govern.
      governance_profiles: []            # global profiles are not themselves governed by another profile
      audit_schemas:
        - stage_gate_trace_schema        # cross-pipeline canonical trace for the guard's evaluation
      scope: global
      applies_to:
        - all_pipelines
        - all_stages
        - shared_registry
      severity_default: blocker
      used_by:
        - sdlc_pipeline
        - research_pipeline
        - activation_pipeline
        - operations_pipeline
        - skill_governance_pipeline
        - knowledge_memory_pipeline
      aliases:
        - no_plugin_core      # 06-governance-policy-evidence.md §3 (plugin_must_not_be_required_by_core_pipeline)
        - no_plugin           # pipeline_catalog.yaml `no_plugin: true`
      notes: >-
        Corresponds to 06 §3 `no_plugin_core` (plugin_must_not_be_required_by_core_pipeline) and the
        `plugin_stage` anti-pattern in sdlc_pipeline_runtime_rules.yaml. LOCKED: no plugin registry, ever.

    - id: no_secret_exposure
      name: No Secret Exposure
      type: global_governance_policy
      status: canonical
      purpose: >-
        Agents/LLMs must never read, emit, log, or leak raw secrets/credentials. Distinct from
        raw_credential_redaction (which governs masking in outputs/evidence): this profile forbids
        the read/exposure itself.
      owner_domain: nexus_global_governance
      allowed_usage:
        - Block any stage/tool path that would read or surface a raw secret.
        - Bind to security-sensitive stages (e.g. security_validation no_secret_leak_gate).
      forbidden_usage:
        - Granting an agent raw-secret read access "for convenience".
      governance_profiles: []
      audit_schemas:
        - stage_gate_trace_schema
      scope: global
      applies_to:
        - all_pipelines
        - all_stages
        - all_tools
      severity_default: blocker
      used_by:
        - sdlc_pipeline
        - research_pipeline
        - activation_pipeline
        - operations_pipeline
        - skill_governance_pipeline
        - knowledge_memory_pipeline
        - security_validation        # stage 16 no_secret_leak_gate is the stage-scope expression of this global rule
      aliases:
        - no_secret_read             # 06 §3 (agents_cannot_read_raw_secrets)
        - global_no_secret_policy    # R4: spelling used in tools_registry.yaml (global no-secret/no raw-credential exposure, 03 §3)
        - no_secret_read_policy      # R4: _policy spelling used in context_memory_profiles.yaml (canonical: no_secret_exposure)
      notes: >-
        06 §3 `no_secret_read`. The stage-scope `no_secret_leak_gate` (stage 16) enforces the
        leak-detection expression of this global policy. R4 naming reconciliation: tools_registry.yaml
        spells it `global_no_secret_policy` and context_memory_profiles.yaml spells it
        `no_secret_read_policy`; both recorded here as aliases of canonical `no_secret_exposure`.

    - id: no_policy_bypass
      name: No Policy Bypass
      type: global_governance_policy
      status: canonical
      purpose: >-
        No actor — including any *_team_lead orchestrator, LLM council, or prompt — may override,
        skip, or "pass" a blocking governance gate. Prompt does not replace policy; Team Lead does
        not replace policy; LLM council does not replace policy (06 §1).
      owner_domain: nexus_global_governance
      allowed_usage:
        - Reject any run where a blocking gate was overridden without satisfying it.
        - Stand as the invariant behind every *_team_lead's "cannot bypass a gate" constraint.
      forbidden_usage:
        - Team Lead override to force release/pass; prompt-engineered gate bypass.
      governance_profiles: []
      audit_schemas:
        - stage_gate_trace_schema
      scope: global
      applies_to:
        - all_pipelines
        - all_team_leads
        - all_gates
      severity_default: blocker
      used_by:
        - sdlc_pipeline
        - research_pipeline
        - activation_pipeline
        - operations_pipeline
        - skill_governance_pipeline
        - knowledge_memory_pipeline
      notes: >-
        06 §3 `no_policy_bypass` (team_lead_cannot_override_blocking_gate). Reinforced by the
        `release_candidate_without_policy_gate` and `self_approval_gate` anti-patterns in
        sdlc_pipeline_runtime_rules.yaml.

    - id: trace_required
      name: Trace Required
      type: global_governance_policy
      status: canonical
      purpose: >-
        Every governed action (agent/sub-agent/skill/tool/core-ability invocation, handoff, policy
        evaluation, pipeline transition) must emit a trace record. GOVERNANCE rule that MANDATES
        trace; the trace record SHAPES themselves are audit schemas (Governance != Audit, kept
        distinct — this profile points at trace schemas but is not one).
      owner_domain: nexus_global_governance
      allowed_usage:
        - Require a trace for every tool call / skill activation / gate decision.
        - Bind globally so no governed action is untraced.
      forbidden_usage:
        - Treating this profile AS the trace schema (it requires trace; audit_schemas defines trace).
        - Environment/repo mutation without an accompanying trace (see notes).
      governance_profiles: []
      audit_schemas:
        - stage_gate_trace_schema
        - stage_gate_decision_trace
      scope: global
      applies_to:
        - all_pipelines
        - all_stages
        - all_tools
        - all_skills
        - all_core_abilities
      severity_default: blocker
      used_by:
        - sdlc_pipeline
        - research_pipeline
        - activation_pipeline
        - operations_pipeline
        - skill_governance_pipeline
        - knowledge_memory_pipeline
      aliases:
        - no_silent_mutation         # 06 §3 (no_environment_or_repo_mutation_without_explicit_tool_and_trace)
        - global_trace_required_policy  # R4: _policy spelling used in audit_schemas.yaml (canonical: trace_required)
        - no_silent_mutation_policy     # R4: _policy spelling used in context_memory_profiles.yaml (the no_silent_mutation sub-rule)
      notes: >-
        Global "trace zorunlu" (03 §3). Encompasses 06 §3 `no_silent_mutation` (no mutation without
        explicit tool AND trace). Evidence != Trace: this MANDATES trace; it is not an evidence rule.
        R4 naming reconciliation: audit_schemas.yaml spells the global form `global_trace_required_policy`
        and context_memory_profiles.yaml spells the mutation sub-rule `no_silent_mutation_policy`; both
        are recorded here as aliases of canonical `trace_required` (matching the no_self_approval/_policy pattern).

    - id: raw_credential_redaction
      name: Raw Credential Redaction
      type: global_governance_policy
      status: canonical
      purpose: >-
        Any credential/secret material that would otherwise appear in an output, log, artifact, or
        evidence record MUST be redacted/masked. Complements no_secret_exposure: that forbids the
        read; this forbids the un-redacted surfacing.
      owner_domain: nexus_global_governance
      allowed_usage:
        - Require masking of credential-like tokens in all emitted artifacts/evidence/traces.
        - Bind to any stage/tool that handles secret-adjacent material.
      forbidden_usage:
        - Emitting raw credentials in any artifact or trace "because it was only internal".
      governance_profiles: []
      audit_schemas:
        - stage_gate_trace_schema
      scope: global
      applies_to:
        - all_pipelines
        - all_stages
        - all_tools
      severity_default: blocker
      used_by:
        - sdlc_pipeline
        - research_pipeline
        - activation_pipeline
        - operations_pipeline
        - skill_governance_pipeline
        - knowledge_memory_pipeline
      notes: >-
        Global "raw credential gösterme yok" (03 §3). Distinct from the redaction_required_gate
        (knowledge/memory stage scope), which governs sensitive-content redaction before
        summarization/storage rather than credential masking in outputs.

    - id: high_risk_action_default_deny
      name: High-Risk Action Default Deny
      type: global_governance_policy
      status: canonical
      purpose: >-
        High-risk / destructive actions are DENIED by default and require an explicit enabling
        policy + evidence + gate before they may execute. The default posture for any high-risk
        action is deny (03 §3 "high-risk action default deny").
      owner_domain: nexus_global_governance
      allowed_usage:
        - Deny destructive/high-risk tool actions unless an explicit policy+gate+evidence permits them.
        - Back stage gates such as rollback_required_gate / disaster_recovery_gate that gate risky ops.
      forbidden_usage:
        - Allowing a destructive tool to run with no explicit policy/gate (see notes).
      governance_profiles: []
      audit_schemas:
        - stage_gate_trace_schema
      scope: global
      applies_to:
        - all_pipelines
        - all_tools
        - high_risk_actions
      severity_default: blocker
      used_by:
        - sdlc_pipeline
        - research_pipeline
        - activation_pipeline
        - operations_pipeline
        - skill_governance_pipeline
        - knowledge_memory_pipeline
      aliases:
        - no_destructive_action_without_gate   # 06 §3 (destructive_tools_require_explicit_policy_and_evidence)
      notes: >-
        Encompasses 06 §3 `no_destructive_action_without_gate`. Tool-scope expressions
        (sandbox_execution_governance, etc.) belong in the tools registry; this is the global default.

    - id: no_self_approval
      name: No Self-Approval
      type: global_governance_policy
      status: canonical
      purpose: >-
        A producing agent may not be the sole approver/validator of its own output: producer_agent_id
        != approver_agent_id for any gate decision (06 §2–§3, §6 no-self-approval matrix). The single
        most-referenced cross-cutting policy in the repo (every SDLC review/validation gate + all 5
        new pipelines bind it).
      owner_domain: nexus_global_governance
      allowed_usage:
        - Require a review/validation/decision gate's owner to differ from the reviewed artifact's author.
        - Fall back to *_team_lead as the gate owner where no dedicated reviewer role fits (SDLC 05/07).
        - Enforce producer-role != validator-role structurally (research cross_validation; skill activation).
      forbidden_usage:
        - A review/gate stage whose owner_agent equals the author of the artifact it adjudicates.
        - Used to authorize a HUMAN/owner gate — owner_activation_decision_gate is a distinct human gate.
      governance_profiles: []
      audit_schemas:
        - stage_gate_trace_schema
      scope: global
      applies_to:
        - all_review_and_validation_gates
        - all_decision_gates
      severity_default: blocker
      used_by:
        # SDLC stages that bind no_self_approval_policy (extracted from stage uses_governance_profiles):
        - skill_semantic_extraction      # 03
        - requirements_review            # 05
        - architecture_review            # 07
        - security_privacy_design        # 08
        - premortem_fmea                 # 09
        - code_review                    # 12
        - test_execution                 # 14 (standing guard)
        - verification_loop_bug_finding  # 15
        - security_validation            # 16
        - supply_chain_sbom_license      # 17
        - ai_agent_safety_evaluation     # 18
        - privacy_data_lifecycle_validation        # 19
        - api_contract_compatibility_validation    # 20
        - domain_regulatory_compliance_validation_if_applicable   # 21
        - data_migration_validation_if_applicable                 # 22
        - accessibility_ux_validation_if_applicable               # 23
        - performance_resilience         # 24
        - cost_resource_governance       # 25
        - backup_restore_dr_validation_if_applicable              # 26
        - operations_readiness           # 27
        - evidence_graph_build           # 28
        - development_completion         # 29
        - release_candidate              # 30
        - refraction_learning            # 31
        - sdlc_pipeline                  # declared at SDLC pipeline level
        # New catalog pipelines (markdown authoritative) that bind it:
        - research_pipeline              # cross_validation + research_completion
        - activation_pipeline            # public_activation_decision (autonomous-agent self-approval guard)
        - operations_pipeline            # mitigation_plan / rollback_or_fix / postmortem
        - skill_governance_pipeline      # skill_activation_decision (proposer != decider)
        - knowledge_memory_pipeline      # bound at pipeline level (catalog YAML)
      aliases:
        - no_self_approval_policy        # naming variant used by all 5 new pipelines + every SDLC stage file
      notes: >-
        Canonical id is `no_self_approval` (06 §2 example). The repo and all 5 new pipelines spell it
        `no_self_approval_policy`; recorded under aliases per the naming-reconciliation rule. DISTINCT
        from owner_activation_decision_gate, which is a HUMAN/owner authority gate, not autonomous
        agent self-approval.

    - id: evidence_required
      name: Evidence Required
      type: global_governance_policy
      status: canonical
      purpose: >-
        Every gate decision must be backed by machine-readable evidence: no pass/approve/release
        without an evidence record (06 §3 every_gate_decision_requires_evidence). Bound by all 31
        SDLC stages and all 5 new pipelines.
      owner_domain: nexus_global_governance
      allowed_usage:
        - Require an evidence record for every gate decision before it can pass.
        - Block approval/release that rests on LLM output alone with no evidence.
      forbidden_usage:
        - Producing an approval/gate-pass with no evidence record (evidence != trace; evidence required).
        - Treating any arbitrary artifact AS evidence without a gate/decision linkage (11 §1).
      governance_profiles: []
      audit_schemas:
        - sdlc_pipeline_evidence_schema   # SDLC decision-evidence schema this policy requires be populated
        - stage_gate_trace_schema
      scope: global
      applies_to:
        - all_gates
        - all_decisions
      severity_default: blocker
      used_by:
        # Bound by ALL 31 SDLC stages (every stage file lists evidence_required_policy):
        - intake
        - domain_risk_profile
        - skill_semantic_extraction
        - requirements
        - requirements_review
        - architecture
        - architecture_review
        - security_privacy_design
        - premortem_fmea
        - planning
        - implementation
        - code_review
        - test_generation
        - test_execution
        - verification_loop_bug_finding
        - security_validation
        - supply_chain_sbom_license
        - ai_agent_safety_evaluation
        - privacy_data_lifecycle_validation
        - api_contract_compatibility_validation
        - domain_regulatory_compliance_validation_if_applicable
        - data_migration_validation_if_applicable
        - accessibility_ux_validation_if_applicable
        - performance_resilience
        - cost_resource_governance
        - backup_restore_dr_validation_if_applicable
        - operations_readiness
        - evidence_graph_build
        - development_completion
        - release_candidate
        - refraction_learning
        - sdlc_pipeline
        # New catalog pipelines (markdown authoritative):
        - research_pipeline
        - activation_pipeline
        - operations_pipeline
        - skill_governance_pipeline
        - knowledge_memory_pipeline    # bound implicitly via evidence_required across stages; see notes
      aliases:
        - evidence_required_policy       # naming variant used by all SDLC stages + the new pipelines
      notes: >-
        Canonical id is `evidence_required` (06 §3). Spelled `evidence_required_policy` in every stage
        file and the new pipelines; recorded under aliases. Knowledge/Memory lists no explicit
        `evidence_required_policy` token but is governed by it via memory_provenance evidence
        completeness exit criteria — flagged in open_questions for Phase E confirmation.

    - id: global_governance
      name: Global Governance (All-Pipeline Umbrella)
      type: global_governance_policy
      status: candidate
      purpose: >-
        Aggregate global umbrella that binds the standing global policies (plugin_absent,
        no_secret_exposure, no_policy_bypass, trace_required, raw_credential_redaction,
        high_risk_action_default_deny, no_self_approval, evidence_required) as one reference. Used where
        a profile wants to assert "all global governance applies" without enumerating each policy
        (e.g. the Supervisor routing model in model_provider_profiles.yaml).
      owner_domain: nexus_global_governance
      allowed_usage:
        - Be referenced as shorthand for the full standing global policy set across pipelines/abilities.
        - Bind at the Supervisor routing/orchestration model level (model_provider_profiles.yaml).
      forbidden_usage:
        - Used to weaken any constituent global policy (it aggregates, it does not relax).
        - Treated as introducing a new scope — it remains a global-scope aggregate.
      governance_profiles:
        - plugin_absent
        - no_secret_exposure
        - no_policy_bypass
        - trace_required
        - raw_credential_redaction
        - high_risk_action_default_deny
        - no_self_approval
        - evidence_required
      audit_schemas:
        - stage_gate_trace_schema
      scope: global
      applies_to:
        - all_pipelines
        - all_core_abilities
      severity_default: blocker
      used_by:
        - supervisor_routing_model     # model_provider_profiles.yaml (Supervisor orchestration model)
      notes: >-
        NEW (reconciliation). Aggregate umbrella referenced by model_provider_profiles.yaml as
        `global_governance`. Does not create a new scope or policy; it re-shows the 8 canonical global
        policies as a single binding. Ratify in Phase E alongside the model-provider governance set.

    - id: model_invocation_governance
      name: Model Invocation Governance
      type: global_governance_policy
      status: candidate
      purpose: >-
        Cross-cutting governance for any model-provider invocation: every model call is bounded by the
        invoking layer's permissions, must not exfiltrate secrets, must not silently downgrade a
        required specialised model, and must emit a model-invocation trace. The governance dimension
        paired with the model_invocation_trace_schema (Governance != Audit: this MANDATES, the schema RECORDS).
      owner_domain: nexus_model_providers
      allowed_usage:
        - Bind to every model_provider_profile so model invocations are governed + traced.
        - Enforce the fallback_policy (no silent downgrade of a required specialised model).
      forbidden_usage:
        - Treating a model provider profile as a Core Ability, Agent, Skill, or Tool.
        - Used as the trace schema itself (it requires the trace; audit_schemas defines it).
      governance_profiles:
        - trace_required
        - no_secret_exposure
      audit_schemas:
        - stage_gate_trace_schema
      scope: global
      applies_to:
        - all_model_provider_profiles
      severity_default: blocker
      used_by:
        # Every model_provider_profile in model_provider_profiles.yaml binds model_invocation_governance:
        - sdlc_reasoning_profile
        - supervisor_routing_model
        - coder_engineering_model
        - architecture_reasoning_model
        - security_analysis_model
        - risk_analysis_model
        - defect_analysis_model
        - vision_model
        - research_reasoning_profile
        - source_evaluation_model
        - knowledge_reasoning_profile
        - summarization_model
        - activation_reasoning_model
        - operations_analysis_model
        - incident_triage_model
        - postmortem_reasoning_model
        - skill_governance_reasoning_profile
        - script_safety_analysis_model
        - skill_semantic_extraction_model
        - learning_reflection_model
        - release_reasoning_model
        - model_invocation_trace_schema   # audit_schemas.yaml binds it as model_provider_governance (via alias)
      aliases:
        - model_provider_governance       # naming variant used in audit_schemas.yaml (Model Invocation Trace Schema)
      notes: >-
        NEW (reconciliation). The 7-layer governance scope taxonomy (03 §3–§9) has no dedicated "model"
        layer; model invocation is a cross-cutting dimension (mirroring the "model invocation trace" in
        03 §12). Registered at global scope as the standing model-invocation policy. audit_schemas.yaml
        spells it `model_provider_governance` on the model-invocation trace schema; recorded as an alias.
        Ratify in Phase E.

    - id: context_access_governance
      name: Context Access Governance
      type: global_governance_policy
      status: candidate
      purpose: >-
        Cross-cutting governance for reading/writing a context/memory profile slice: run-scoped
        isolation (one run cannot read another run's context), prior-run memory is advisory-only and
        may not auto-satisfy a gate, redaction rules apply, and every context read/write emits a
        context-usage trace. Governs how working context is accessed; does NOT turn a context pack into
        an agent/skill/tool, and does NOT make Memory an agent (Memory stays a Core Ability).
      owner_domain: nexus_context_memory
      allowed_usage:
        - Bind to every context/memory profile so context access is scoped, isolated, and traced.
        - Enforce run-scoped isolation + advisory-only prior-run memory across all context packs.
      forbidden_usage:
        - Letting one run read another run's context, or auto-satisfying a gate from prior-run memory.
        - Treating a context pack as an agent/team/skill/tool (locked concept boundary).
      governance_profiles:
        - trace_required
        - raw_credential_redaction
      audit_schemas:
        - stage_gate_trace_schema
      scope: global
      applies_to:
        - all_context_memory_profiles
      severity_default: blocker
      used_by:
        # Every context/memory profile in context_memory_profiles.yaml binds context_access_governance:
        - sdlc_run_context
        - requirements_context_pack
        - architecture_context_pack
        - implementation_context_pack
        - verification_context_pack
        - security_context_pack
        - operations_context_pack
        - release_context_pack
        - domain_risk_context_pack
        - skill_semantic_context_pack
        - research_run_context
        - source_corpus_context_pack
        - claim_evidence_context_pack
        - activation_run_context
        - preview_context_pack
        - pilot_evidence_context_pack
        - activation_decision_context_pack
        - operations_run_context
        - incident_context_pack
        - postmortem_context_pack
        - skill_governance_run_context
        - skill_registry_context_pack
        - knowledge_run_context
        - memory_candidate_context_pack
        - retrieval_profile_context_pack
        - learning_context_pack
      notes: >-
        NEW (reconciliation). The 7-layer governance scope taxonomy (03 §3–§9) has no dedicated
        "context" layer; context access is a cross-cutting dimension (mirroring the "context usage trace"
        in 03 §12). Registered at global scope as the standing context-access policy. Complements (does
        not replace) the Memory core-ability memory_access_governance. Ratify in Phase E.

  # -----------------------------------------------------------------------------------
  # SCOPE: pipeline — umbrella governance for one whole pipeline
  # (03-governance-and-audit-layering.md §4). One per pipeline + release_candidate_governance
  # which spans the development_completion -> release_candidate boundary inside SDLC.
  # -----------------------------------------------------------------------------------
  pipeline:

    - id: sdlc_pipeline_governance
      name: SDLC Pipeline Governance
      type: pipeline_governance_profile
      status: canonical
      purpose: >-
        Pipeline-wide governance for the 31-stage SDLC pipeline: no development_completion without
        code review; no release_candidate with an open blocker bug; no progression with high/critical
        security findings (03 §4). The umbrella under which every SDLC stage-scope gate sits.
      owner_domain: software_delivery
      allowed_usage:
        - Bind at the SDLC pipeline level and be re-shown under each SDLC stage (usage mapping).
        - Govern the cross-stage SDLC invariants (code-review-before-completion, blocker-bug-zero, etc.).
      forbidden_usage:
        - Applied to non-SDLC pipelines (each pipeline has its own umbrella profile).
        - Used to override a blocking stage gate (see global no_policy_bypass).
      governance_profiles:
        - no_self_approval
        - evidence_required
      audit_schemas:
        - sdlc_pipeline_evidence_schema
        - stage_gate_trace_schema
      scope: pipeline
      applies_to:
        - sdlc_pipeline
        - all_31_sdlc_stages
      severity_default: blocker
      used_by:
        # Listed by ALL 31 SDLC stages' uses_governance_profiles + the SDLC pipeline:
        - sdlc_pipeline
        - intake
        - domain_risk_profile             # via domain_risk_governance umbrella; sdlc_pipeline_governance at pipeline level
        - requirements
        - requirements_review
        - architecture
        - architecture_review
        - security_privacy_design
        - premortem_fmea
        - planning
        - implementation
        - code_review
        - test_generation
        - test_execution
        - verification_loop_bug_finding
        - security_validation
        - supply_chain_sbom_license
        - ai_agent_safety_evaluation
        - privacy_data_lifecycle_validation
        - api_contract_compatibility_validation
        - domain_regulatory_compliance_validation_if_applicable
        - data_migration_validation_if_applicable
        - accessibility_ux_validation_if_applicable
        - performance_resilience
        - cost_resource_governance
        - backup_restore_dr_validation_if_applicable
        - operations_readiness
        - evidence_graph_build
        - development_completion
        - release_candidate
        - refraction_learning
      notes: >-
        SDLC pipeline-level umbrella (sdlc_pipeline.yaml uses_governance_profiles). Stages 01/02 list
        sdlc_pipeline_governance / domain_risk_governance explicitly; all other stages list it directly.

    - id: research_source_governance
      name: Research Source Governance
      type: pipeline_governance_profile
      status: candidate
      purpose: >-
        Rules for what counts as an acceptable source, minimum reliability/diversity, and how
        low-reliability sources may be used in the Research Pipeline (research-pipeline.md §3).
        Source reliability scoring is mandatory; uncertainty must be explicit (03 §4).
      owner_domain: research_and_knowledge
      allowed_usage:
        - Govern source admissibility, minimum reliability score, and source diversity in research.
        - Bind at research pipeline level and re-show under source_reliability_assessment.
      forbidden_usage:
        - Used outside the Research Pipeline.
        - Used as a citation gate (that is the separate citation_required_gate).
      governance_profiles:
        - no_self_approval
        - evidence_required
      audit_schemas:
        - source_evidence_schema
        - stage_gate_trace_schema
      scope: pipeline
      applies_to:
        - research_pipeline
        - source_discovery
        - source_reliability_assessment
        - claim_extraction
      severity_default: blocker
      used_by:
        - research_pipeline
        - source_reliability_assessment   # research stage 2.4 (uses governance: research_source_governance)
        - research_reasoning_profile      # model_provider_profiles.yaml binds this as the research umbrella (via alias)
      aliases:
        - research_pipeline_governance    # naming variant used in model_provider_profiles.yaml (umbrella sibling-name); MD authoritative id is research_source_governance
      notes: >-
        NEW (pipeline-catalog-review.md §4.1). Markdown authoritative. Pairs with citation_required_gate.
        model_provider_profiles.yaml refers to the research umbrella as `research_pipeline_governance`
        (consistent with the activation/operations/skill `*_pipeline_governance` naming); recorded as an
        alias here since the authoritative markdown umbrella id is `research_source_governance`.

    - id: activation_pipeline_governance
      name: Activation Pipeline Governance
      type: pipeline_governance_profile
      status: candidate
      purpose: >-
        Umbrella governance for the Activation Pipeline: no pilot activation without a passing
        superadmin preview; no public activation without sufficient pilot evidence; a validated
        rollback plan is mandatory before public completion; public activation is a human/owner gate
        that cannot be self-approved (activation-pipeline.md §3; 03 §4).
      owner_domain: activation_and_release_operations
      allowed_usage:
        - Bind at the Activation Pipeline level and re-show under each activation stage.
        - Govern the preview -> pilot -> public staged-activation invariants.
      forbidden_usage:
        - Used outside the Activation Pipeline.
        - Used to bypass the owner/human activation decision (that gate is human authority).
      governance_profiles:
        - no_self_approval
        - evidence_required
      audit_schemas:
        - activation_evidence_schema
        - stage_gate_trace_schema
      scope: pipeline
      applies_to:
        - activation_pipeline
        - activation_intake
        - superadmin_preview
        - pilot_activation
        - pilot_evidence_review
        - public_activation_decision
        - rollback_readiness
        - activation_completion
      severity_default: blocker
      used_by:
        - activation_pipeline
      notes: >-
        NEW (pipeline-catalog-review.md §4.1). Markdown authoritative. Layered over the gate-style
        profiles preview_required_gate / pilot_evidence_gate / rollback_required_gate /
        owner_activation_decision_gate.

    - id: operations_pipeline_governance
      name: Operations Pipeline Governance
      type: pipeline_governance_profile
      status: candidate
      purpose: >-
        Umbrella governance for the Operations Pipeline: incident severity classification mandatory;
        active incident must have a mitigation plan; rollback/fix must carry runbook or rollback
        evidence; postmortem mandatory (03 §4; operations-pipeline.md §3.2).
      owner_domain: operations_reliability
      allowed_usage:
        - Bind at the Operations Pipeline level and re-show under each operations stage.
        - Govern incident handling -> mitigation -> rollback/fix -> postmortem -> learning invariants.
      forbidden_usage:
        - Used outside the Operations Pipeline.
        - Used to skip a mandatory postmortem for qualifying severities.
      governance_profiles:
        - no_self_approval
        - evidence_required
      audit_schemas:
        - incident_evidence_schema
        - stage_gate_trace_schema
      scope: pipeline
      applies_to:
        - operations_pipeline
        - incident_intake
        - severity_classification
        - mitigation_plan
        - rollback_or_fix
        - postmortem
        - learning_update
      severity_default: blocker
      used_by:
        - operations_pipeline
        - incident_intake            # operations stage 2.1 uses governance: operations_pipeline_governance
        - severity_classification    # 2.2
        - mitigation_plan            # 2.3
        - rollback_or_fix            # 2.4
        - postmortem                 # 2.5
        - learning_update            # 2.6
      aliases:
        - incident_response_governance   # F-1 / OQ-GOV-4: pre-R9 catalog-YAML definition_contract name; MD canonical: operations_pipeline_governance
      notes: >-
        NEW (pipeline-catalog-review.md §4.1). Markdown authoritative. The pre-R9 catalog-YAML
        definition_contract used the divergent name `incident_response_governance` (F-1); markdown
        `operations_pipeline_governance` is canonical-source. After the R9 reconciliation collapsed
        pipeline_catalog.yaml into a summary-only catalog (no per-pipeline definition_contract blocks),
        the authoritative per-pipeline source is the markdown definition_doc; the divergent name is
        retained under aliases only as the historical reconciliation record.

    - id: skill_governance_pipeline_governance
      name: Skill Governance Pipeline Governance
      type: pipeline_governance_profile
      status: candidate
      purpose: >-
        Pipeline-level policy for the Skill Governance Pipeline: no binding/activation without
        mandatory semantic extraction; script/reference safety audit required; misuse-warnings
        required; locked skill semantics enforced (skill-governance-pipeline.md §3.2).
      owner_domain: skill_governance
      allowed_usage:
        - Bind at the Skill Governance Pipeline level and re-show under each of its stages.
        - Govern the skill lifecycle (intake -> semantics -> audit -> misuse -> binding -> activation).
      forbidden_usage:
        - Used outside the Skill Governance Pipeline.
        - Used to alter the locked semantics of prism/verification-loop (that is enforced separately).
      governance_profiles:
        - no_self_approval
        - evidence_required
        - locked_semantics_enforcement_policy
      audit_schemas:
        - skill_governance_evidence_schema
        - skill_governance_trace_schema
      scope: pipeline
      applies_to:
        - skill_governance_pipeline
        - skill_intake
        - skill_semantic_extraction
        - script_reference_audit
        - misuse_warning_generation
        - skill_binding_proposal
        - skill_activation_decision
        - skill_deprecation_update
      severity_default: blocker
      used_by:
        - skill_governance_pipeline
      aliases:
        - skill_governance_profile       # F-1 / OQ-GOV-4: pre-R9 catalog-YAML definition_contract name; MD canonical: skill_governance_pipeline_governance
      notes: >-
        NEW (pipeline-catalog-review.md §4.1). Markdown authoritative. NOTE the SDLC pipeline already
        has a stage 03 `skill_governance` (stage-scope) profile — that is DISTINCT from this whole-
        pipeline umbrella for the dedicated Skill Governance Pipeline. The pre-R9 catalog-YAML
        definition_contract variant `skill_governance_profile` is retained under aliases only as the
        historical reconciliation record; after R9 collapsed pipeline_catalog.yaml into a summary-only
        catalog, the authoritative per-pipeline source is the markdown definition_doc.

    - id: memory_source_governance
      name: Memory Source Governance
      type: pipeline_governance_profile
      status: candidate
      purpose: >-
        Govern source admissibility, trust tiers, and sensitivity handling across the Knowledge /
        Memory lifecycle (knowledge-memory-pipeline.md §3.2). Curates what the Memory Core Ability is
        allowed to remember and how it is classified — does NOT turn Memory into an agent.
      owner_domain: knowledge_management
      allowed_usage:
        - Govern source/trust-tier/sensitivity classification across the knowledge lifecycle.
        - Bind at the Knowledge/Memory Pipeline level and re-show under memory_intake/classification stages.
      forbidden_usage:
        - Used outside the Knowledge/Memory Pipeline.
        - Used to promote the Memory Core Ability into an agent/owner.
      governance_profiles:
        - no_self_approval
        - evidence_required
      audit_schemas:
        - memory_provenance_schema
        - stage_gate_trace_schema
      scope: pipeline
      applies_to:
        - knowledge_memory_pipeline
        - memory_intake
        - source_classification
        - summary_generation
        - retrieval_profile_update
        - memory_expiration_review
      severity_default: blocker
      used_by:
        - knowledge_memory_pipeline
        - memory_intake               # knowledge/memory stage 2.1 governance: memory_source_governance
        - source_classification       # 2.2
        - summary_generation          # 2.3
        - retrieval_profile_update    # 2.5
        - memory_expiration_review    # 2.6
      aliases:
        - memory_governance_profile   # F-1 / OQ-GOV-4: pre-R9 catalog-YAML definition_contract name; MD canonical: memory_source_governance
      notes: >-
        NEW (pipeline-catalog-review.md §4.1). Markdown authoritative. The pre-R9 catalog-YAML
        definition_contract used the divergent name `memory_governance_profile` (F-1); markdown
        `memory_source_governance` is canonical-source. After R9 collapsed pipeline_catalog.yaml into a
        summary-only catalog (no per-pipeline definition_contract blocks), the authoritative per-pipeline
        source is the markdown definition_doc; the divergent name is retained under aliases only as the
        historical reconciliation record.

    - id: release_candidate_governance
      name: Release Candidate Governance
      type: pipeline_governance_profile
      status: canonical
      purpose: >-
        Govern the development_completion -> release_candidate boundary: a release candidate may not
        be produced before development_completion passes, with release evidence complete, no blocking
        policy failure, residual risk recorded, and rollback/runbook present (06 §12). Bridges the
        operations-readiness, completion, and RC stages.
      owner_domain: software_delivery
      allowed_usage:
        - Gate the dev-completion -> RC boundary; be re-shown under stages 27/29/30.
        - Require release evidence + no blocking policy failure before RC.
      forbidden_usage:
        - Producing a release candidate before development_completion passes (anti-pattern).
        - Used by non-SDLC pipelines.
      governance_profiles:
        - no_self_approval
        - evidence_required
      audit_schemas:
        - sdlc_pipeline_evidence_schema
        - stage_gate_trace_schema
      scope: pipeline
      applies_to:
        - sdlc_pipeline
        - operations_readiness
        - development_completion
        - release_candidate
      severity_default: blocker
      used_by:
        - operations_readiness     # stage 27 uses_governance_profiles: release_candidate_governance
        - development_completion   # stage 29
        - release_candidate        # stage 30 (LOCKED canonical governance profile for this stage)
      notes: >-
        Canonical. Spans three SDLC stages (27/29/30). Distinct from the global no_policy_bypass: this
        is the specific dev-completion->RC ordering + release-evidence governance.

  # -----------------------------------------------------------------------------------
  # SCOPE: team — intra-team role/responsibility rules
  # (03-governance-and-audit-layering.md §5). The repo does not yet define standalone
  # team-governance profile IDs; the team-level rules are expressed via the global
  # no_self_approval policy + the per-stage review-gate owner!=author bindings. The two
  # team-governance profiles below are CANDIDATES recording the §5 team rules so the
  # team scope is not described only in prose (doc 17 §13: "No category is only described
  # in prose"). They will be ratified in Phase D (team/agent catalog) / Phase E.
  # -----------------------------------------------------------------------------------
  team:

    - id: sdlc_team_governance
      name: SDLC Team Governance
      type: team_governance_profile
      status: candidate
      purpose: >-
        Intra-team rules for the sdlc_team (03 §5): a developer cannot approve their own code; QA
        cannot manipulate test results; the release agent cannot pass a failed gate; the
        sdlc_team_lead orchestrates but is NOT the Supervisor Core Ability and cannot self-approve.
      owner_domain: software_delivery
      allowed_usage:
        - Govern role separation inside the sdlc_team (producer != approver at the team level).
        - Re-show the global no_self_approval policy in the sdlc_team context (usage mapping).
      forbidden_usage:
        - Treating the sdlc_team (a team) as a stage owner (owner is always an Agent role).
        - Treating Supervisor as sdlc_team_lead.
      governance_profiles:
        - no_self_approval
        - no_policy_bypass
      audit_schemas:
        - stage_gate_trace_schema
      scope: team
      applies_to:
        - sdlc_team
        - sdlc_team_lead
      severity_default: blocker
      used_by:
        - sdlc_pipeline    # the sdlc_team runs the SDLC pipeline; team rules apply across all 31 stages
      notes: >-
        CANDIDATE — records 03 §5 SDLC team rules. The sdlc_team_lead != Supervisor (locked) is the
        team-scope expression of the supervisor_as_team_lead guard in sdlc_pipeline_runtime_rules.yaml.
        Ratify in Phase D team/agent catalog.

    - id: research_team_governance
      name: Research Team Governance
      type: team_governance_profile
      status: candidate
      purpose: >-
        Intra-team rules for the research_team (03 §5): a researcher cannot solely validate their own
        source; source validation is performed by a separate role (cross_validation_agent distinct
        from the producing agents).
      owner_domain: research_and_knowledge
      allowed_usage:
        - Govern producer-role != validator-role separation inside the research_team.
        - Re-show no_self_approval in the research_team context (cross_validation is a distinct owner).
      forbidden_usage:
        - Letting the producing researcher be the sole validator of their own source.
        - Treating research_team_lead as the Supervisor Core Ability.
      governance_profiles:
        - no_self_approval
      audit_schemas:
        - stage_gate_trace_schema
      scope: team
      applies_to:
        - research_team
        - research_team_lead
      severity_default: blocker
      used_by:
        - research_pipeline   # the research_team runs the Research Pipeline; enforced at cross_validation
      notes: >-
        CANDIDATE — records 03 §5 Research team rules; enforced structurally by the
        validator_role_distinct_from_producer gate in research cross_validation. Ratify in Phase D.

  # -----------------------------------------------------------------------------------
  # SCOPE: stage — rules for a single stage within a pipeline
  # (03-governance-and-audit-layering.md §6). Extracted verbatim from each SDLC stage's
  # uses_governance_profiles (the *_governance and *_gate stage profiles) PLUS the NEW
  # per-stage gates introduced by the 5 catalog pipelines.
  # -----------------------------------------------------------------------------------
  stage:

    # ---- SDLC stage-scope governance profiles (status: canonical) ----

    - id: intake_scope_gate
      name: Intake Scope Gate
      type: stage_gate_profile
      status: canonical
      purpose: >-
        Stage-01 gate: product goal present + initial scope bounded + success metrics present before
        intake hands off to domain_risk_profile.
      owner_domain: software_delivery
      allowed_usage:
        - Gate the intake stage outputs (PRODUCT_BRIEF / INITIAL_SCOPE / SUCCESS_METRICS).
      forbidden_usage:
        - Used outside the intake stage.
      governance_profiles:
        - sdlc_pipeline_governance
        - evidence_required
      audit_schemas:
        - sdlc_pipeline_evidence_schema
        - stage_gate_trace_schema
      scope: stage
      applies_to:
        - intake
      severity_default: blocker
      used_by:
        - intake     # stage 01 uses_governance_profiles
      notes: Gates product_goal_present / initial_scope_bounded / success_metrics_present (stage 01).

    - id: domain_risk_governance
      name: Domain Risk Governance
      type: stage_governance_profile
      status: canonical
      purpose: >-
        Stage-02 governance: govern domain classification and risk-profile decision so every
        downstream conditional gate's applicability inherits a governed risk class.
      owner_domain: software_delivery
      allowed_usage:
        - Govern the domain_risk_profile stage (DOMAIN_PROFILE_DECISION / RISK_PROFILE).
      forbidden_usage:
        - Used outside the domain_risk_profile stage.
      governance_profiles:
        - evidence_required
      audit_schemas:
        - sdlc_pipeline_evidence_schema
        - stage_gate_trace_schema
      scope: stage
      applies_to:
        - domain_risk_profile
      severity_default: blocker
      used_by:
        - domain_risk_profile     # stage 02
      notes: Pairs with the domain_risk_profile_gate (stage 02).

    - id: domain_risk_profile_gate
      name: Domain Risk Profile Gate
      type: stage_gate_profile
      status: canonical
      purpose: Stage-02 gate ensuring a domain profile + risk profile decision is recorded with evidence.
      owner_domain: software_delivery
      allowed_usage:
        - Gate the domain_risk_profile stage decision.
      forbidden_usage:
        - Used outside the domain_risk_profile stage.
      governance_profiles:
        - domain_risk_governance
      audit_schemas:
        - sdlc_pipeline_evidence_schema
        - stage_gate_trace_schema
      scope: stage
      applies_to:
        - domain_risk_profile
      severity_default: blocker
      used_by:
        - domain_risk_profile
      notes: Stage 02 gate.

    - id: skill_governance
      name: Skill Governance (SDLC Stage 03)
      type: stage_governance_profile
      status: canonical
      purpose: >-
        Stage-03 governance: govern in-SDLC skill semantic extraction (no skill bound without
        semantics). DISTINCT from the dedicated Skill Governance Pipeline umbrella
        (skill_governance_pipeline_governance).
      owner_domain: software_delivery
      allowed_usage:
        - Govern the SDLC skill_semantic_extraction stage.
      forbidden_usage:
        - Confused with skill_governance_pipeline_governance (whole separate pipeline).
      governance_profiles:
        - evidence_required
        - no_self_approval
      audit_schemas:
        - sdlc_pipeline_evidence_schema
        - stage_gate_trace_schema
      scope: stage
      applies_to:
        - skill_semantic_extraction
      severity_default: blocker
      used_by:
        - skill_semantic_extraction     # SDLC stage 03
      notes: >-
        SDLC stage-03 profile. NOT the same as the Skill Governance Pipeline's pipeline-scope umbrella.

    - id: skill_semantic_extraction_gate
      name: Skill Semantic Extraction Gate
      type: stage_gate_profile
      status: canonical
      purpose: Stage-03 gate ensuring skill semantics are extracted before any skill is bound (no_unread_skill_binding family).
      owner_domain: software_delivery
      allowed_usage:
        - Gate that skill semantic extraction precedes binding in SDLC.
      forbidden_usage:
        - Used outside skill_semantic_extraction.
      governance_profiles:
        - skill_governance
      audit_schemas:
        - sdlc_pipeline_evidence_schema
        - stage_gate_trace_schema
      scope: stage
      applies_to:
        - skill_semantic_extraction
      severity_default: blocker
      used_by:
        - skill_semantic_extraction
      aliases:
        - no_unread_skill_binding   # 06 §3 (skill_must_have_semantic_extraction_before_binding) — the policy this gate enforces
      notes: Stage 03 gate; enforces the no_unread_skill_binding blocker policy from 06 §3.

    - id: requirements_acceptance_gate
      name: Requirements Acceptance Gate
      type: stage_gate_profile
      status: canonical
      purpose: Stage-04 gate ensuring requirements + NFRs + acceptance criteria are present and accepted with evidence.
      owner_domain: software_delivery
      allowed_usage:
        - Gate the requirements stage outputs.
      forbidden_usage:
        - Used outside the requirements stage.
      governance_profiles:
        - sdlc_pipeline_governance
        - evidence_required
