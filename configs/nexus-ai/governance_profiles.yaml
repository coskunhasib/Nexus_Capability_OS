      type: stage_gate_profile
      status: candidate
      purpose: >-
        Activation gate: public activation is impossible without sufficient pilot evidence
        (activation-pipeline.md §2.4; 03 §4 "pilot evidence olmadan public activation yok").
      owner_domain: activation_and_release_operations
      allowed_usage:
        - Gate that sufficient pilot evidence exists before public activation.
      forbidden_usage:
        - Used outside the Activation Pipeline.
      governance_profiles:
        - activation_pipeline_governance
        - no_self_approval
        - evidence_required
      audit_schemas:
        - activation_evidence_schema
        - stage_gate_trace_schema
      scope: stage
      applies_to:
        - pilot_evidence_review
      severity_default: blocker
      used_by:
        - pilot_evidence_review     # activation stage 2.4 (separate-owner review)
      notes: NEW (pipeline-catalog-review.md §4.1). Activation Pipeline gate; reviewer != pilot owner.

    - id: rollback_required_gate
      name: Rollback Required Gate
      type: stage_gate_profile
      status: candidate
      purpose: >-
        A validated, executable rollback path is mandatory before a risky transition completes.
        Introduced by the Activation Pipeline (rollback_readiness, activation-pipeline.md §2.6) and
        ALSO bound in two SDLC stages (data_migration 22, backup_restore_dr 26) as a tested-rollback
        requirement.
      owner_domain: activation_and_release_operations
      allowed_usage:
        - Gate that a validated rollback path exists before public activation / risky migration completes.
        - Be re-shown under each stage that requires a tested rollback.
      forbidden_usage:
        - Completing a risky transition without a validated rollback path.
      governance_profiles:
        - high_risk_action_default_deny
        - evidence_required
      audit_schemas:
        - rollback_readiness_evidence_schema
        - stage_gate_trace_schema
      scope: stage
      applies_to:
        - rollback_readiness                            # activation pipeline
        - data_migration_validation_if_applicable       # SDLC stage 22
        - backup_restore_dr_validation_if_applicable     # SDLC stage 26
      severity_default: blocker
      used_by:
        - rollback_readiness                            # activation stage 2.6 (NEW)
        - data_migration_validation_if_applicable        # SDLC stage 22 (canonical binding)
        - backup_restore_dr_validation_if_applicable      # SDLC stage 26 (canonical binding)
      notes: >-
        Listed in pipeline-catalog-review.md §4.1 as a NEW activation profile, but the SAME id is
        already a canonical SDLC stage gate (stages 22 + 26). Registered once, status candidate
        (pending Phase E ratification of the cross-pipeline shared definition); SDLC usages are
        canonical bindings. Flagged in open_questions.

    - id: owner_activation_decision_gate
      name: Owner Activation Decision Gate (HUMAN/OWNER)
      type: stage_gate_profile
      status: candidate
      purpose: >-
        The public-activation decision is a HUMAN / owner authority gate: the authorizing actor is
        the human owner, NOT an autonomous agent. The owner reviews pilot evidence + validated
        rollback + residual risk and explicitly authorizes general-availability activation
        (activation-pipeline.md §2.5).
      owner_domain: activation_and_release_operations
      allowed_usage:
        - Gate public activation on a recorded human/owner decision (owner decision record).
        - Coexist with no_self_approval (the agent recording the decision is not the authorizer).
      forbidden_usage:
        - Treated as autonomous agent approval — this is HUMAN authority, DISTINCT from no_self_approval.
        - An autonomous agent self-authorizing public activation.
      governance_profiles:
        - activation_pipeline_governance
        - no_self_approval
        - evidence_required
      audit_schemas:
        - activation_decision_evidence_schema
        - stage_gate_trace_schema
      scope: stage
      applies_to:
        - public_activation_decision
      severity_default: blocker
      used_by:
        - public_activation_decision     # activation stage 2.5
      notes: >-
        NEW (pipeline-catalog-review.md §4.1, F-4). HUMAN/owner gate — the one place a pipeline asserts
        human-in-the-loop authority under the otherwise no-human governance framing. EXPLICITLY DISTINCT
        from autonomous-agent no_self_approval. Phase E must sign off the owner/human gate (F-4).

    - id: incident_severity_required_gate
      name: Incident Severity Required Gate
      type: stage_gate_profile
      status: candidate
      purpose: >-
        Operations gate: severity classification is mandatory before any mitigation work may begin
        (operations-pipeline.md §2.2; 03 §4 "incident severity sınıflandırması zorunlu").
      owner_domain: operations_reliability
      allowed_usage:
        - Gate that a severity is assigned before mitigation planning.
      forbidden_usage:
        - Used outside the Operations Pipeline.
      governance_profiles:
        - operations_pipeline_governance
        - evidence_required
      audit_schemas:
        - severity_classification_evidence_schema
        - stage_gate_trace_schema
      scope: stage
      applies_to:
        - severity_classification
      severity_default: blocker
      used_by:
        - severity_classification     # operations stage 2.2
      notes: NEW (pipeline-catalog-review.md §4.1). Operations Pipeline gate (severity_assigned blocker).

    - id: mitigation_plan_required_gate
      name: Mitigation Plan Required Gate
      type: stage_gate_profile
      status: candidate
      purpose: >-
        Operations gate: an active (non-resolved) incident must have a mitigation plan before
        rollback-or-fix execution (operations-pipeline.md §2.3).
      owner_domain: operations_reliability
      allowed_usage:
        - Gate presence of a MITIGATION_PLAN for an active incident.
      forbidden_usage:
        - Used outside the Operations Pipeline.
      governance_profiles:
        - operations_pipeline_governance
        - no_self_approval
        - evidence_required
      audit_schemas:
        - mitigation_plan_evidence_schema
        - stage_gate_trace_schema
      scope: stage
      applies_to:
        - mitigation_plan
      severity_default: blocker
      used_by:
        - mitigation_plan     # operations stage 2.3
      notes: NEW (pipeline-catalog-review.md §4.1). Operations Pipeline gate (mitigation_plan_present blocker).

    - id: rollback_runbook_evidence_gate
      name: Rollback / Runbook Evidence Gate
      type: stage_gate_profile
      status: candidate
      purpose: >-
        Operations gate: any rollback-or-fix must carry runbook OR rollback execution evidence
        (operations-pipeline.md §2.4; 03 §4 "rollback/runbook evidence zorunlu").
      owner_domain: operations_reliability
      allowed_usage:
        - Gate that the rollback_or_fix step is backed by runbook or rollback evidence.
      forbidden_usage:
        - Used outside the Operations Pipeline.
      governance_profiles:
        - operations_pipeline_governance
        - no_self_approval
        - evidence_required
      audit_schemas:
        - rollback_fix_evidence_schema
        - stage_gate_trace_schema
      scope: stage
      applies_to:
        - rollback_or_fix
      severity_default: blocker
      used_by:
        - rollback_or_fix     # operations stage 2.4
      notes: >-
        NEW (pipeline-catalog-review.md §4.1). Operations Pipeline gate. Consumes SDLC RUNBOOK /
        ROLLBACK_PLAN (produced by SDLC operations_readiness) — referenced, not regenerated.

    - id: postmortem_required_gate
      name: Postmortem Required Gate
      type: stage_gate_profile
      status: candidate
      purpose: >-
        Operations gate: postmortem mandatory — always for major_incident / critical_outage_or_safety_event;
        a lightweight POSTMORTEM_REPORT is still produced for lower severities (operations-pipeline.md §2.5).
      owner_domain: operations_reliability
      allowed_usage:
        - Gate presence of a postmortem (blocking for required severities).
      forbidden_usage:
        - Used outside the Operations Pipeline.
      governance_profiles:
        - operations_pipeline_governance
        - no_self_approval
        - evidence_required
      audit_schemas:
        - postmortem_evidence_schema
        - stage_gate_trace_schema
      scope: stage
      applies_to:
        - postmortem
      severity_default: blocker
      used_by:
        - postmortem     # operations stage 2.5
      notes: >-
        NEW (pipeline-catalog-review.md §4.1). Operations Pipeline gate. Conditional: blocker for
        severity >= major OR rollback_executed == true; otherwise the POSTMORTEM_REPORT must still exist.

    - id: skill_semantic_required_gate
      name: Skill Semantic Required Gate
      type: stage_gate_profile
      status: candidate
      purpose: >-
        Skill Governance gate: no progression without skill semantic extraction
        (semantic_category, primary_purpose, not_for, used_by_agents, used_in_stages, confidence >=
        threshold) — binding never precedes semantics (skill-governance-pipeline.md §2.2).
      owner_domain: skill_governance
      allowed_usage:
        - Gate that skill semantics are extracted before binding/activation in the Skill Governance Pipeline.
      forbidden_usage:
        - Used outside the Skill Governance Pipeline (the SDLC in-pipeline equivalent is skill_semantic_extraction_gate).
      governance_profiles:
        - skill_governance_pipeline_governance
        - locked_semantics_enforcement_policy
        - evidence_required
      audit_schemas:
        - skill_semantic_extract_schema
        - skill_governance_trace_schema
      scope: stage
      applies_to:
        - skill_semantic_extraction
      severity_default: blocker
      used_by:
        - skill_semantic_extraction     # skill-governance stage 2.2
      notes: >-
        NEW (pipeline-catalog-review.md §4.1). Skill Governance Pipeline gate. Distinct from the SDLC
        stage-03 skill_semantic_extraction_gate (same intent, different pipeline). Enforces the
        no_unread_skill_binding family.

    - id: script_reference_audit_gate
      name: Script / Reference Audit Gate
      type: stage_gate_profile
      status: candidate
      purpose: >-
        Skill Governance gate: an unsafe skill script may not pass un-mitigated; static safety/
        side-effect audit over scripts/** and references/** (skill-governance-pipeline.md §2.3).
      owner_domain: skill_governance
      allowed_usage:
        - Gate that unsafe skill scripts are mitigated before binding/activation.
      forbidden_usage:
        - Used outside the Skill Governance Pipeline.
      governance_profiles:
        - skill_governance_pipeline_governance
        - evidence_required
      audit_schemas:
        - script_audit_evidence_schema
        - skill_governance_trace_schema
      scope: stage
      applies_to:
        - script_reference_audit
      severity_default: blocker
      used_by:
        - script_reference_audit     # skill-governance stage 2.3
      aliases:
        - skill_safety_gate          # F-1 / OQ-GOV-4: pre-R9 catalog-YAML definition_contract name; MD canonical: script_reference_audit_gate
      notes: >-
        NEW. In pipeline-catalog-review.md §4.1 the consolidated header list names the five gates
        explicitly requested; this gate is part of the same Skill Governance set (review §4.1 lists it).
        verification-loop used here strictly as defect/bug-finding (locked semantics). The pre-R9
        catalog-YAML definition_contract variant `skill_safety_gate` is retained under aliases only as
        the historical reconciliation record; after R9 collapsed pipeline_catalog.yaml into a
        summary-only catalog, the authoritative per-pipeline source is the markdown definition_doc.

    - id: misuse_warning_required_gate
      name: Misuse Warning Required Gate
      type: stage_gate_profile
      status: candidate
      purpose: >-
        Skill Governance gate: a skill cannot proceed to binding/activation with empty or missing
        misuse-warnings; each locked-semantics skill requires at least one `not_for` warning
        (skill-governance-pipeline.md §2.4).
      owner_domain: skill_governance
      allowed_usage:
        - Gate presence/completeness of SKILL_MISUSE_WARNINGS before binding.
      forbidden_usage:
        - Used outside the Skill Governance Pipeline.
      governance_profiles:
        - skill_governance_pipeline_governance
        - evidence_required
      audit_schemas:
        - skill_misuse_warning_schema
        - skill_governance_trace_schema
      scope: stage
      applies_to:
        - misuse_warning_generation
      severity_default: blocker
      used_by:
        - misuse_warning_generation     # skill-governance stage 2.4
      notes: NEW (pipeline-catalog-review.md §4.1). Skill Governance Pipeline gate.

    - id: skill_binding_proposal_gate
      name: Skill Binding Proposal Gate
      type: stage_gate_profile
      status: candidate
      purpose: >-
        Skill Governance gate: binding may not be proposed without upstream semantic + script-audit +
        misuse-warning evidence (anti-pattern: binding without semantics) (skill-governance-pipeline.md §2.5).
      owner_domain: skill_governance
      allowed_usage:
        - Gate that a SKILL_BINDING_PROPOSAL rests on completed semantics/audit/misuse evidence.
      forbidden_usage:
        - Used outside the Skill Governance Pipeline.
      governance_profiles:
        - skill_governance_pipeline_governance
        - evidence_required
      audit_schemas:
        - skill_binding_decision_schema
        - skill_governance_trace_schema
      scope: stage
      applies_to:
        - skill_binding_proposal
      severity_default: blocker
      used_by:
        - skill_binding_proposal     # skill-governance stage 2.5
      aliases:
        - skill_binding_gate         # F-1 / OQ-GOV-4: pre-R9 catalog-YAML definition_contract name; MD canonical: skill_binding_proposal_gate
      notes: >-
        NEW. Part of the Skill Governance set (pipeline-catalog-review.md §4.1). Enforces
        binding_proposed_without_semantics == false. The pre-R9 catalog-YAML definition_contract variant
        `skill_binding_gate` is retained under aliases only as the historical reconciliation record;
        after R9 collapsed pipeline_catalog.yaml into a summary-only catalog, the authoritative
        per-pipeline source is the markdown definition_doc.

    - id: skill_activation_decision_gate
      name: Skill Activation Decision Gate
      type: stage_gate_profile
      status: candidate
      purpose: >-
        Skill Governance gate: the activate/hold/deprecate decision requires evidence and may not be
        self-approved (proposer != decider); locked semantics re-checked
        (skill-governance-pipeline.md §2.6).
      owner_domain: skill_governance
      allowed_usage:
        - Gate the skill activation decision (evidence-backed, no self-approval).
      forbidden_usage:
        - Used outside the Skill Governance Pipeline.
        - Self-approval of the activation decision.
      governance_profiles:
        - skill_governance_pipeline_governance
        - no_self_approval
        - locked_semantics_enforcement_policy
        - evidence_required
      audit_schemas:
        - skill_binding_decision_schema
        - skill_governance_trace_schema
      scope: stage
      applies_to:
        - skill_activation_decision
      severity_default: blocker
      used_by:
        - skill_activation_decision     # skill-governance stage 2.6
      notes: >-
        NEW (pipeline-catalog-review.md §4.1). Skill Governance Pipeline gate. skill_runtime_safety_agent
        decides over skill_librarian_agent's proposal (review independence).

    - id: skill_deprecation_required_gate
      name: Skill Deprecation Required Gate
      type: stage_gate_profile
      status: candidate
      purpose: >-
        Skill Governance conditional gate: on version/hash change, skill_semantic_required_gate is
        re-triggered; manages deprecation/update and registry consistency
        (skill-governance-pipeline.md §2.7).
      owner_domain: skill_governance
      allowed_usage:
        - Gate skill deprecation/update; re-trigger semantic extraction on version/hash change.
      forbidden_usage:
        - Used outside the Skill Governance Pipeline.
      governance_profiles:
        - skill_governance_pipeline_governance
        - evidence_required
      audit_schemas:
        - skill_binding_decision_schema
        - skill_governance_trace_schema
      scope: stage
      applies_to:
        - skill_deprecation_update
      severity_default: major
      used_by:
        - skill_deprecation_update     # skill-governance stage 2.7
      notes: >-
        NEW. Conditional (required_when: deprecation_or_update == true OR version_or_hash_changed).
        Severity major per the stage definition. Not in the §4.1 header but present in the
        skill-governance markdown stage set (the 7th stage).

    - id: validity_window_required_gate
      name: Validity Window Required Gate
      type: stage_gate_profile
      status: candidate
      purpose: >-
        Knowledge/Memory gate: every retained memory must carry an explicit validity window, and
        retrieval-profile updates must be bound to it ("no window" is not allowed)
        (knowledge-memory-pipeline.md §3.2).
      owner_domain: knowledge_management
      allowed_usage:
        - Gate that a validity window exists before retrieval exposure; bind updates to the window.
      forbidden_usage:
        - Used outside the Knowledge/Memory Pipeline.
      governance_profiles:
        - memory_source_governance
        - evidence_required
      audit_schemas:
        - memory_provenance_schema
        - stage_gate_trace_schema
      scope: stage
      applies_to:
        - validity_window_assignment
        - retrieval_profile_update
        - memory_expiration_review
      severity_default: blocker
      used_by:
        - validity_window_assignment   # knowledge/memory stage 2.4
        - retrieval_profile_update      # stage 2.5
        - memory_expiration_review      # stage 2.6
      aliases:
        - memory_validity_gate          # F-1 / OQ-GOV-4: pre-R9 catalog-YAML definition_contract name; MD canonical: validity_window_required_gate
      notes: >-
        NEW (pipeline-catalog-review.md §4.1). Knowledge/Memory Pipeline gate. The pre-R9 catalog-YAML
        definition_contract variant `memory_validity_gate` is retained under aliases only as the
        historical reconciliation record; after R9 collapsed pipeline_catalog.yaml into a summary-only
        catalog, the authoritative per-pipeline source is the markdown definition_doc.

    - id: redaction_required_gate
      name: Redaction Required Gate
      type: stage_gate_profile
      status: candidate
      purpose: >-
        Knowledge/Memory gate: sensitive content must be redacted before summarization, storage, or
        retrieval exposure (knowledge-memory-pipeline.md §3.2). Conditional:
        required_when sensitivity_requires_redaction == true.
      owner_domain: knowledge_management
      allowed_usage:
        - Gate redaction of sensitive content before it is summarized/stored/exposed.
      forbidden_usage:
        - Used outside the Knowledge/Memory Pipeline.
        - Confused with the global raw_credential_redaction (credential masking in outputs).
      governance_profiles:
        - memory_source_governance
        - evidence_required
      audit_schemas:
        - memory_provenance_schema
        - stage_gate_trace_schema
      scope: stage
      applies_to:
        - source_classification
      severity_default: blocker
      used_by:
        - source_classification     # knowledge/memory stage 2.2 (redaction_applied_if_required)
      aliases:
        - memory_expiration_gate    # F-1 / OQ-GOV-4: pre-R9 catalog-YAML definition_contract name — third knowledge/memory gate; MD canonical: redaction_required_gate
      notes: >-
        NEW (pipeline-catalog-review.md §4.1). Knowledge/Memory Pipeline gate. Distinct from the
        global raw_credential_redaction policy (which masks credentials in any output/evidence). The
        pre-R9 catalog-YAML definition_contract variant `memory_expiration_gate` (the third
        knowledge/memory gate token, per OQ-GOV-4) is retained under aliases only as the historical
        reconciliation record; after R9 collapsed pipeline_catalog.yaml into a summary-only catalog,
        the authoritative per-pipeline source is the markdown definition_doc.

    # ---- Context-pack stage-domain governance profiles (status: candidate) ----
    # Referenced by context_memory_profiles.yaml as the per-domain governance that bounds a context
    # pack. DISTINCT from the same-stage review/acceptance gates above: these govern the CONTEXT PACK
    # (what state a stage may see), not the gate decision. Recorded so the context refs resolve.

