      notes: >-
        NEW (reconciliation). Context-pack governance referenced by context_memory_profiles.yaml.
        DISTINCT from operations_readiness_gate (stage-27 gate). Ratify in Phase E.

    - id: release_governance
      name: Release Context Governance
      type: stage_governance_profile
      status: candidate
      purpose: >-
        Govern the release-domain context pack: which evidence-graph / completion / RC state the
        release-boundary stages may see. Bounds release_context_pack. Sits alongside the canonical
        release_candidate_governance (which is the dev-completion -> RC ordering governance).
      owner_domain: software_delivery
      allowed_usage:
