      notes: >-
        NEW (reconciliation). Context-pack governance referenced by context_memory_profiles.yaml.
        Complements (does not replace) the pipeline-scope release_candidate_governance. Ratify in Phase E.

    # ---- SDLC stage risk-rule policies (status: candidate) ----
    # Named risk rules referenced by audit evidence schemas (audit_schemas.yaml) as the policy the
    # schema's gate enforces. Recorded so those governance refs resolve. Risk-rule family per 03 §1.

    - id: blocker_bug_zero
      name: Blocker Bug Zero
      type: stage_risk_rule
      status: candidate
      purpose: >-
        Risk rule: no open blocker-severity bug may remain when the verification-loop bug gate decides
        (open blocker bug count == 0). The named risk rule behind verification_loop_bug_gate (stage 15)
        and the SDLC "no release_candidate with an open blocker bug" pipeline invariant.
      owner_domain: quality_engineering
      allowed_usage:
        - Require open-blocker-bug-count == 0 before the verification-loop bug gate passes.
      forbidden_usage:
        - Used as a general readiness checklist or a test-execution replacement (locked semantics).
      governance_profiles:
