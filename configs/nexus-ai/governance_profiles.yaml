  # -----------------------------------------------------------------------------------
  # SCOPE: skill — Skill usage governance (03-governance-and-audit-layering.md §8).
  # Skill != Tool. These profiles encode the LOCKED skill semantics. The locked-semantics
  # enforcement policy is referenced by the Skill Governance Pipeline (status candidate);
  # the per-skill brainstorming/defect-finding governance profiles are 03 §8 examples,
  # recorded as candidates for the Skills Registry (skills_registry.yaml, Phase C).
  # -----------------------------------------------------------------------------------
  skill:

    - id: locked_semantics_enforcement_policy
      name: Locked Semantics Enforcement Policy
      type: skill_governance_policy
      status: candidate
      purpose: >-
        Enforce the LOCKED skill semantics: prism = brainstorming/divergence ONLY;
        verification-loop = bug/defect finding ONLY. Any extraction/binding that alters these
        semantics fails (skill-governance-pipeline.md §3.2; sdlc_pipeline_runtime_rules.yaml
        prism_as_non_divergence guard + verification_loop_replaces_test_execution anti-pattern).
      owner_domain: skill_governance
      allowed_usage:
        - Block any skill semantic record that reclassifies prism or verification-loop.
        - Bind in the Skill Governance Pipeline (semantic_extraction + activation_decision stages).
      forbidden_usage:
        - Using prism for bug-finding/readiness; using verification-loop as a readiness checklist or test replacement.
      governance_profiles:
        - skill_governance_pipeline_governance
        - evidence_required
      audit_schemas:
        - skill_semantic_extract_schema
        - skill_governance_trace_schema
      scope: skill
      applies_to:
        - prism
        - verification-loop
        - skill_semantic_extraction      # skill-governance pipeline stage
        - skill_activation_decision       # skill-governance pipeline stage
      severity_default: blocker
      used_by:
        - skill_governance_pipeline
        - skill_semantic_extraction       # skill-governance stage 2.2 (blocker)
        - skill_activation_decision        # skill-governance stage 2.6 (re-checked)
      notes: >-
        NEW (pipeline-catalog-review.md §4.1). The repo-wide locked semantics expressed as an
        enforceable governance policy. Cross-referenced by sdlc_pipeline_runtime_rules.yaml guards.

    - id: skill_must_have_semantic_extraction_before_binding
      name: Skill Must Have Semantic Extraction Before Binding
      type: skill_governance_policy
      status: candidate
      purpose: >-
        Skill-class policy: a skill may only be bound to a stage AFTER its semantic extraction has run
        (no_unread_skill_binding, 06 §3). The standing skill-class default applied to every skill in the
        Skills Registry, independent of any single stage. Skill != Tool (locked).
      owner_domain: skill_governance
      allowed_usage:
        - Block any skill binding that lacks a completed semantic-extraction record.
        - Bind as a skill-class default across the entire Skills Registry (skill_class_defaults).
      forbidden_usage:
        - Binding/activating a skill with no semantic extraction (anti-pattern).
        - Used as a tool-call permission profile (Skill != Tool).
      governance_profiles:
        - skill_governance
        - locked_semantics_enforcement_policy
        - evidence_required
      audit_schemas:
        - skill_semantic_extract_schema
        - skill_governance_trace_schema
      scope: skill
      applies_to:
        - all_skills
      severity_default: blocker
      used_by:
        # skills_registry.yaml skill_class_defaults binds this on EVERY skill:
        - prism
        - verification-loop
        - sentinel
        - llm-council
        - fmea
        - adr-builder
        - gap-audit
        - prompt-fidelity
        - calibrate
        - refraction
        - fermi-decompose
        - bayesian-update
        - skill-architect
        - handoff-designer
        - context-pack-builder
        - scanner-result-normalizer
        - evidence-graph-builder
        - release-readiness-judge
      aliases: []
      notes: >-
        NEW (reconciliation). The 06 §3 no_unread_skill_binding rule expressed as a standing skill-class
        policy (referenced in skills_registry.yaml skill_class_defaults + each skill's governance_profiles).
        The SDLC stage-03 gate `skill_semantic_extraction_gate` (which already carries the
        `no_unread_skill_binding` alias) is the stage-scope ENFORCER of this skill-class policy — kept
        distinct (gate vs policy) to avoid a duplicate alias key. Ratify in Phase E.

    - id: skill_activation_governance
      name: Skill Activation Governance
      type: skill_governance_profile
      status: candidate
      purpose: >-
        Standing skill-activation governance (03 §8): every Skill activation must be permission-scoped,
        respect the skill's locked semantics + misuse-warnings, and emit a skill-activation trace. The
        skill-scope governance dimension paired with the skill_activation_trace_schema (Governance !=
        Audit: this MANDATES; the schema RECORDS). Skill != Tool (locked).
      owner_domain: skill_governance
      allowed_usage:
        - Bind as a skill-class default so every skill activation is governed + traced.
        - Enforce locked semantics + misuse-warning presence at activation time.
      forbidden_usage:
        - Activating a skill outside its locked semantics or without a trace.
        - Used as a tool-call governance profile (Skill != Tool).
      governance_profiles:
        - skill_governance
        - locked_semantics_enforcement_policy
        - trace_required
      audit_schemas:
        - skill_activation_trace_schema
        - stage_gate_trace_schema
      scope: skill
      applies_to:
        - all_skills
      severity_default: blocker
      used_by:
        # skills_registry.yaml skill_class_defaults -> every skill activation emits the trace under this:
        - prism
        - verification-loop
        - sentinel
        - llm-council
        - fmea
        - adr-builder
        - gap-audit
        - prompt-fidelity
        - calibrate
        - refraction
        - fermi-decompose
        - bayesian-update
        - skill-architect
        - handoff-designer
        - context-pack-builder
        - scanner-result-normalizer
        - evidence-graph-builder
        - release-readiness-judge
        - skill_activation_trace_schema   # audit_schemas.yaml binds skill_activation_governance on this trace
      notes: >-
        NEW (reconciliation). Standing skill-activation governance referenced by audit_schemas.yaml
        (Skill Activation Trace Schema). Distinct from the SDLC stage-03 `skill_governance` (semantic
        extraction stage) and from skill_must_have_semantic_extraction_before_binding (binding-time
        policy): this governs activation-time. Ratify in Phase E.

    - id: brainstorming_skill_governance
      name: Brainstorming Skill Governance (prism)
      type: skill_governance_profile
      status: candidate
      purpose: >-
        Usage governance for the prism skill (03 §8): used for brainstorming/divergence ONLY; NOT
        for bug finding and NOT as a readiness/coverage checklist.
      owner_domain: skill_governance
      allowed_usage:
        - Govern prism usage as divergence/ideation; be re-shown under prism in the Skills Registry.
      forbidden_usage:
        - Using prism for bug-finding or as a readiness checklist (locked-semantics violation).
      governance_profiles:
        - locked_semantics_enforcement_policy
      audit_schemas:
        - stage_gate_trace_schema
      scope: skill
      applies_to:
        - prism
      severity_default: blocker
      used_by:
        # SDLC stages that bind prism (skill-agent-review §1) — divergence only:
        - intake                 # 01
        - requirements           # 04
        - architecture           # 06
        - premortem_fmea         # 09
        - planning               # 10
        - skill_governance_pipeline   # prism used for divergence in scope/option expansion
      notes: >-
        CANDIDATE — 03 §8 example. prism bindings confirmed divergent in claude-code-skill-agent-review.md
        §1. Ratify in skills_registry.yaml (Phase C) / Phase E.

    - id: defect_finding_skill_governance
      name: Defect-Finding Skill Governance (verification-loop)
      type: skill_governance_profile
      status: candidate
      purpose: >-
        Usage governance for the verification-loop skill (03 §8): used for bug/defect finding ONLY;
        it is NOT a general readiness checklist and NOT a test_execution replacement.
      owner_domain: skill_governance
      allowed_usage:
        - Govern verification-loop usage as defect/bug finding; be re-shown under it in the Skills Registry.
      forbidden_usage:
        - Using verification-loop in place of test_execution or as a readiness checklist (anti-pattern).
      governance_profiles:
        - locked_semantics_enforcement_policy
      audit_schemas:
        - stage_gate_trace_schema
      scope: skill
      applies_to:
        - verification-loop
      severity_default: blocker
      used_by:
        # SDLC stages that bind verification-loop (skill-agent-review §2) — defect finding only:
        - verification_loop_bug_finding             # 15
        - ai_agent_safety_evaluation                # 18
        - data_migration_validation_if_applicable    # 22
        # New pipelines that bind it as defect finding:
        - operations_pipeline                        # rollback_or_fix forward-fix confirmation
        - skill_governance_pipeline                   # script_reference_audit defect sweep
      notes: >-
        CANDIDATE — 03 §8 example. verification-loop bindings confirmed defect-only and correctly
        excluded from test/review/readiness stages in claude-code-skill-agent-review.md §2.

