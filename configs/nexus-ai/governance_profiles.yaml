# Registry-level open questions (carried to Phase E governance/audit readiness, doc 19).
# =====================================================================================
open_questions:
  - id: OQ-GOV-1
    question: >-
      no_self_approval / evidence_required canonical bare ids vs the *_policy variant names. This
      registry registers the canonical id and records `no_self_approval_policy` /
      `evidence_required_policy` under `aliases`. Phase E must decide whether to standardize all
      pipeline references onto the bare canonical id or formally bless the `_policy` binding names
      (pipeline-catalog-review.md §4.7).
  - id: OQ-GOV-2
    question: >-
      owner_activation_decision_gate is a HUMAN/owner authority gate (the authorizing actor is the
      human owner), the one place a pipeline asserts human-in-the-loop authority under the otherwise
      no-human governance framing. Phase E must explicitly sign this off as permitted and confirm it
      is modeled as an owner decision record gate, distinct from autonomous-agent no_self_approval
      (pipeline-catalog-review.md F-4).
  - id: OQ-GOV-3
    question: >-
      rollback_required_gate appears BOTH as a NEW activation-pipeline profile (review §4.1) AND as
      a canonical SDLC stage gate (stages 22 + 26). Registered once with status candidate; SDLC
      usages are canonical bindings. Phase E must ratify a single cross-pipeline shared definition or
