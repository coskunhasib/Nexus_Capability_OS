      name: Requirements Context Governance
      type: stage_governance_profile
      status: candidate
      purpose: >-
        Govern the requirements-domain context pack: which requirements/scope artifacts a stage may
        see, traceability-link resolution, and PII redaction in examples. Bounds requirements_context_pack.
      owner_domain: software_delivery
      allowed_usage:
        - Govern read/write of the requirements context pack across requirements-related stages.
      forbidden_usage:
        - Used as the requirements review/acceptance gate (those are requirements_review_governance / requirements_acceptance_gate).
      governance_profiles:
        - sdlc_pipeline_governance
        - context_access_governance
      audit_schemas:
        - requirements_evidence_schema
        - context_usage_trace_schema
      scope: stage
      applies_to:
        - requirements_context_pack
      severity_default: blocker
      used_by:
        - requirements_context_pack    # context_memory_profiles.yaml binds requirements_governance
      notes: >-
        NEW (reconciliation). Context-pack governance referenced by context_memory_profiles.yaml.
        Distinct from the stage-05 requirements_review_governance gate. Ratify in Phase E.

