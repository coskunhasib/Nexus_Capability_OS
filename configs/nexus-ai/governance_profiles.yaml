      name: Architecture Context Governance
      type: stage_governance_profile
      status: candidate
      purpose: >-
        Govern the architecture-domain context pack: which architecture/ADR/NFR artifacts a stage may
        see when reasoning about design. Bounds architecture_context_pack.
      owner_domain: software_delivery
      allowed_usage:
        - Govern read/write of the architecture context pack across architecture-related stages.
      forbidden_usage:
        - Confused with the stage-06 architecture_design_governance gate (this governs the context pack).
      governance_profiles:
        - sdlc_pipeline_governance
        - context_access_governance
      audit_schemas:
        - architecture_evidence_schema
        - context_usage_trace_schema
      scope: stage
      applies_to:
        - architecture_context_pack
      severity_default: blocker
      used_by:
        - architecture_context_pack    # context_memory_profiles.yaml binds architecture_governance
      notes: >-
        NEW (reconciliation). Context-pack governance referenced by context_memory_profiles.yaml.
        DISTINCT from architecture_design_governance (stage-06 gate). Ratify in Phase E.

    - id: verification_governance
      name: Verification Context Governance
      type: stage_governance_profile
      status: candidate
      purpose: >-
        Govern the verification/defect-finding context pack: which test outputs, failing cases, and
        bug-finding state the verification stages may see. Bounds verification_context_pack. Used with
        verification-loop strictly as defect/bug-finding (locked semantics — not a readiness checklist).
      owner_domain: quality_engineering
      allowed_usage:
        - Govern read/write of the verification context pack across test/bug-finding stages.
      forbidden_usage:
        - Repurposing verification context to drive a readiness checklist (locked-semantics violation).
      governance_profiles:
        - sdlc_pipeline_governance
        - context_access_governance
      audit_schemas:
        - bug_finding_evidence_schema
        - context_usage_trace_schema
      scope: stage
      applies_to:
        - verification_context_pack
      severity_default: blocker
      used_by:
        - verification_context_pack    # context_memory_profiles.yaml binds verification_governance
      notes: >-
        NEW (reconciliation). Context-pack governance referenced by context_memory_profiles.yaml.
        Distinct from verification_loop_bug_gate (stage-15 gate). Ratify in Phase E.

    - id: operations_readiness_governance
      name: Operations Readiness Context Governance
      type: stage_governance_profile
      status: candidate
      purpose: >-
        Govern the operations-readiness context pack: which runbook/observability/backup-DR/cost state
        the operations-readiness family of stages may see. Bounds operations_context_pack.
      owner_domain: operations_reliability
      allowed_usage:
        - Govern read/write of the operations context pack across operations-readiness stages.
      forbidden_usage:
        - Confused with operations_readiness_gate (stage-27 gate) — this governs the context pack.
      governance_profiles:
        - sdlc_pipeline_governance
