  # ---- Research Pipeline -----------------------------------------------------------------------
  - id: research_run_context
    name: Research Run Context
    type: run_context
    status: candidate
    scope: run
    purpose: >-
      Whole-run working context for a Research Pipeline run: research goal, bounded research
      questions (load-bearing flagged), risk profile, the research evidence graph spine, and which
      stages/gates have been evaluated. Lets synthesis/completion confirm every question is
      addressed and every load-bearing claim has mapped evidence.
    owner_domain: research_and_knowledge
    allowed_usage:
      - read_as_run_level_backbone_by_any_research_stage
      - confirm_every_question_addressed_and_every_load_bearing_claim_mapped
    forbidden_usage:
      - used_to_let_a_producer_be_the_sole_validator_of_its_own_source
      - shared_across_different_research_runs
      - exposed_as_an_agent_team_skill_or_tool
    source_priority:
      - current_run_research_evidence_graph    # claim->evidence + source-reliability records
      - current_run_stage_outputs              # RESEARCH_BRIEF / QUESTION_SET / SOURCE_INVENTORY ...
      - durable_memory_prior_research            # advisory (prior research on the topic)
    retention: run_scoped
    validity_window: single_pipeline_run
    retrieval_rules:
      - readable_by_all_research_stages
      - run_scoped_isolation: true
      - load_bearing_claims_must_resolve_to_mapped_evidence
    redaction_rules:
      - no_raw_secrets
      - preserve_source_provenance              # URL/publisher/date/access-timestamp must survive
      - redact_pii_from_quoted_source_material
    governance_profiles:
      - research_source_governance
      - context_access_governance
      - no_self_approval_policy
    audit_schemas:
      - source_evidence_schema
      - claim_evidence_schema
      - stage_gate_trace_schema
    used_by:
      - research_pipeline
    aliases: []
    notes: >-
      New (draft-0.1, research-pipeline.md §1). Cross-validation independence (producer != sole
      validator) is enforced via governance, not by collapsing roles in this context.

  - id: source_corpus_context_pack
    name: Source Corpus Context Pack
    type: context_pack
    status: candidate
    scope: stage_pack
    purpose: >-
      The scored source corpus working context: every candidate source with provenance (URL,
      publisher, date, access timestamp) and its reliability score + rationale. Consumed by source
      discovery, source-reliability assessment, claim extraction, and cross-validation.
    owner_domain: research_and_knowledge
    allowed_usage:
      - read_by_source_discovery_reliability_claim_extraction_and_cross_validation
      - carry_per_source_provenance_and_reliability_score
    forbidden_usage:
      - admit_an_unscored_source_into_synthesis
      - drop_source_provenance
      - exposed_as_an_agent_team_skill_or_tool
    source_priority:
      - current_run_source_inventory           # SOURCE_INVENTORY + SOURCE_RELIABILITY_REPORT
      - web_fetched_source_content             # via Web Core Ability (web_search/web_fetch)
      - research_run_context
    retention: run_scoped
    validity_window: single_pipeline_run
    retrieval_rules:
      - scoped_to_scored_source_corpus
      - unscored_source_must_not_enter_synthesis     # blocking_condition mirror
      - source_provenance_required_for_every_entry
    redaction_rules:
      - no_raw_secrets
      - preserve_source_provenance
      - redact_pii_from_fetched_content
    governance_profiles:
      - research_source_governance
      - context_access_governance
    audit_schemas:
      - source_evidence_schema
      - context_usage_trace_schema
    used_by:
      - research_pipeline
      - stage:source_discovery@research_pipeline
      - stage:source_reliability_assessment@research_pipeline
      - stage:claim_extraction@research_pipeline
      - stage:cross_validation@research_pipeline
    aliases: []
    notes: New (draft-0.1, research-pipeline.md §2.3-§2.7).

  - id: claim_evidence_context_pack
    name: Claim Evidence Context Pack
    type: context_pack
    status: candidate
    scope: stage_pack
    purpose: >-
      Claim->evidence mapping working context: each atomic claim with supporting/contradicting
      evidence, support strength, conflicts, single-source flags, and per-claim uncertainty.
      Consumed by claim extraction, claim->evidence mapping, cross-validation, uncertainty
      reporting, and synthesis.
    owner_domain: research_and_knowledge
    allowed_usage:
      - read_by_claim_mapping_cross_validation_uncertainty_and_synthesis
      - carry_support_strength_conflicts_and_single_source_flags
    forbidden_usage:
      - support_an_uncited_load_bearing_claim_in_final_synthesis
      - hide_contradictions_or_single_source_claims
      - exposed_as_an_agent_team_skill_or_tool
    source_priority:
      - current_run_claim_evidence_map         # CLAIM_REGISTER + CLAIM_EVIDENCE_MAP
      - source_corpus_context_pack             # the scored sources the claims rest on
