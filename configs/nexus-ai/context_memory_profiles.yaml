    retention: run_scoped
    validity_window: single_pipeline_run
    retrieval_rules:
      - scoped_to_claim_evidence_mapping
      - every_load_bearing_claim_must_have_mapped_evidence
      - contradictions_and_single_source_claims_must_be_visible
    redaction_rules:
      - no_raw_secrets
      - redact_pii_from_claim_excerpts
    governance_profiles:
      - citation_required_gate
      - context_access_governance
      - evidence_required_policy
    audit_schemas:
      - claim_evidence_schema
      - context_usage_trace_schema
    used_by:
      - research_pipeline
      - stage:claim_extraction@research_pipeline
      - stage:claim_evidence_mapping@research_pipeline
      - stage:cross_validation@research_pipeline
      - stage:uncertainty_reporting@research_pipeline
      - stage:synthesis@research_pipeline
    aliases: []
    notes: New (draft-0.1, research-pipeline.md §2.6-§2.9). Feeds the citation_required_gate.

  # ---- Activation Pipeline ---------------------------------------------------------------------
  - id: activation_run_context
    name: Activation Run Context
    type: run_context
    status: candidate
    scope: run
    purpose: >-
      Whole-run working context for an Activation Pipeline run: the target release-candidate
      reference and its SDLC release evidence, requested staged scope (preview/pilot/public),
      target cohorts, rollback owner, and which activation gates have been satisfied. Lets the
      owner decision and completion confirm the staged path was honored.
    owner_domain: activation_and_release_operations
    allowed_usage:
      - read_as_run_level_backbone_by_any_activation_stage
      - carry_the_target_release_candidate_reference_and_staged_scope
    forbidden_usage:
      - used_to_skip_the_preview_pilot_public_ordering
      - used_to_self_approve_an_activation_decision
      - regenerate_the_sdlc_pipeline
      - exposed_as_an_agent_team_skill_or_tool
