      - stage:postmortem@operations_pipeline
    aliases: []
    notes: New (draft-0.1, operations-pipeline.md §2.5). Blameless redaction is a defining rule here.

  - id: learning_context_pack
    name: Operational Learning Context Pack
    type: context_pack
    status: candidate
    scope: stage_pack
    purpose: >-
      Operational-learning working context: the postmortem-derived lessons, proposed
      runbook/rollback/observability improvements, and the future-improvement backlog handed back
      toward the SDLC Pipeline (referenced, not regenerated). Consumed by the learning_update stage.
    owner_domain: operations_reliability
    allowed_usage:
      - read_during_operational_learning_update
      - hand_a_future_improvement_backlog_back_to_the_sdlc_as_reference
    forbidden_usage:
      - regenerate_the_sdlc_pipeline
      - persist_learning_inline_instead_of_via_the_memory_core_ability
      - attribute_individual_person_blame
      - exposed_as_an_agent_team_skill_or_tool
    source_priority:
      - postmortem_context_pack                # the postmortem to distill
      - operations_run_context
      - durable_memory_operational_learnings     # the Memory Core Ability target for persistence
    retention: durable_with_review
    validity_window: review_on_related_incident_or_sdlc_change
    retrieval_rules:
      - scoped_to_operational_learning
      - improvement_backlog_handed_off_to_sdlc_as_reference   # does not regenerate SDLC
      - learning_persisted_via_memory_core_ability_not_inline
    redaction_rules:
      - no_raw_secrets
      - blameless_redact_individual_identities
    governance_profiles:
      - operations_pipeline_governance
      - evidence_required_policy
      - context_access_governance
    audit_schemas:
      - operational_learning_evidence_schema
      - stage_gate_trace_schema
    used_by:
      - operations_pipeline
      - stage:learning_update@operations_pipeline
    aliases: []
    notes: >-
      New (draft-0.1, operations-pipeline.md §2.6). NAME COLLISION: SDLC stage 31 had a legacy
      `learning_context_pack` reconciled into release_context_pack (see that item's aliases). This
      candidate is the DISTINCT live-operations learning pack (owner_domain: operations_reliability).
      Recorded in open_questions: Phase E should decide whether to disambiguate this id (e.g.
      operations_learning_context_pack) to remove the shared legacy name. Persistence happens via
      the Memory Core Ability (memory_write), keeping Memory-as-ability vs context-pack distinct.

  # ---- Skill Governance Pipeline ---------------------------------------------------------------
  - id: skill_governance_run_context
    name: Skill Governance Run Context
    type: run_context
    status: candidate
    scope: run
    purpose: >-
      Whole-run working context for a Skill Governance Pipeline run: the run goal, the candidate
      skill source reference (canonical_source or package path/hash), the locked-semantics rules,
      and which governance gates (semantic / script-audit / misuse / binding / activation) have
      passed. Lets the activation decision confirm semantics-before-binding was honored.
    owner_domain: skill_governance
    allowed_usage:
      - read_as_run_level_backbone_by_any_skill_governance_stage
      - confirm_semantics_before_binding_was_honored
    forbidden_usage:
      - allow_binding_before_semantics_are_complete
      - change_locked_prism_or_verification_loop_semantics
      - let_a_proposer_self_approve_its_own_activation_decision
      - exposed_as_an_agent_team_skill_or_tool
    source_priority:
      - candidate_skill_source_reference       # canonical_source or package path + hash
      - current_run_skill_governance_artifacts # SKILL_SEMANTIC_EXTRACT / audit reports / misuse warnings
      - skill_registry_context_pack            # the existing shared registry view
      - locked_skill_semantics_rules
    retention: run_scoped
    validity_window: single_pipeline_run
    retrieval_rules:
      - readable_by_all_skill_governance_stages
      - run_scoped_isolation: true
      - binding_blocked_until_semantics_complete    # anti-pattern guard
      - locked_semantics_immutable
    redaction_rules:
      - no_raw_secrets
      - flag_unsafe_script_calls_do_not_execute
    governance_profiles:
      - skill_governance_pipeline_governance
      - locked_semantics_enforcement_policy
      - no_self_approval_policy
      - context_access_governance
    audit_schemas:
      - skill_governance_evidence_schema
      - skill_governance_trace_schema
      - stage_gate_trace_schema
    used_by:
      - skill_governance_pipeline
    aliases: []
    notes: >-
      New (draft-0.1, skill-governance-pipeline.md §1). Enforces "no binding without semantics"
      at the run level. This pipeline records/validates other skills' semantics; it cannot change
      the locked prism/verification-loop semantics.

  - id: skill_registry_context_pack
    name: Skill Registry Context Pack
    type: context_pack
    status: candidate
    scope: stage_pack
    purpose: >-
      The shared-skills-registry working view: existing skill inventory entries, their semantic
      categories, current bindings, misuse warnings, and activation status — used to place a
      candidate skill consistently and to manage deprecation/version updates. Consumed by skill
      intake, binding proposal, activation decision, and deprecation/update.
    owner_domain: skill_governance
    allowed_usage:
      - read_by_intake_binding_proposal_activation_and_deprecation_update
      - reflect_the_canonical_status_of_each_registered_skill
    forbidden_usage:
      - used_to_propose_a_binding_without_upstream_semantic_evidence
      - treated_as_a_single_packages_semantic_extract
      - exposed_as_an_agent_team_skill_or_tool
    source_priority:
      - shared_skills_registry                 # configs/nexus-ai/skills_registry.yaml (Phase C sibling)
      - current_run_skill_inventory_entry      # SKILL_INVENTORY_ENTRY for the candidate
      - skill_governance_run_context
    retention: registry_lifetime   # tracks the durable registry, not a single run
    validity_window: until_registry_change
    retrieval_rules:
      - scoped_to_skills_registry_view
      - reflects_canonical_status_of_each_skill
    redaction_rules:
      - no_raw_secrets
    governance_profiles:
      - skill_governance_pipeline_governance
      - skill_binding_proposal_gate
      - skill_activation_decision_gate
      - context_access_governance
    audit_schemas:
      - skill_binding_decision_schema
      - skill_governance_trace_schema
    used_by:
      - skill_governance_pipeline
      - stage:skill_intake@skill_governance_pipeline
      - stage:skill_binding_proposal@skill_governance_pipeline
      - stage:skill_activation_decision@skill_governance_pipeline
      - stage:skill_deprecation_update@skill_governance_pipeline
    aliases:
      - skill_inventory_context_pack   # pre-R9 catalog-YAML definition_contract variant (now summary-only); markdown name is canonical (review F-1)
    notes: >-
      New (draft-0.1, skill-governance-pipeline.md §1, name authoritative). The pre-R9 pipeline_catalog.yaml
      definition_contract used `skill_inventory_context_pack`; per review F-1 the markdown name
      `skill_registry_context_pack` is canonical. After R9 collapsed pipeline_catalog.yaml into a
      summary-only catalog (no definition_contract blocks), the authoritative per-pipeline source is the
      markdown definition_doc and the YAML name is retained as an alias only for the historical record.

  # ---- Knowledge / Memory Pipeline -------------------------------------------------------------
  - id: knowledge_run_context
    name: Knowledge Run Context
    type: run_context
    status: candidate
    scope: run
    purpose: >-
      Whole-run working context for a Knowledge / Memory Pipeline run: the candidate memory item,
      its origin reference and target knowledge scope, source classification, validity window, and
      which lifecycle gates (intake / classification / redaction / validity / retrieval) have been
      satisfied. Governs WHAT the Memory Core Ability is allowed to remember — it does not make
      Memory an agent.
    owner_domain: knowledge_management
    allowed_usage:
      - read_as_run_level_backbone_by_any_knowledge_memory_stage
      - govern_what_the_memory_core_ability_may_remember_and_for_how_long
    forbidden_usage:
      - promote_the_memory_core_ability_into_an_agent
      - update_a_retrieval_profile_for_a_memory_with_no_validity_window
      - store_unredacted_sensitive_content
      - exposed_as_an_agent_team_skill_or_tool
    source_priority:
      - candidate_memory_item                  # the item under curation + origin reference
      - current_run_knowledge_artifacts        # MEMORY_INTAKE_RECORD / SOURCE_CLASSIFICATION_REPORT ...
      - durable_memory_existing_knowledge        # the Memory Core Ability's current state
    retention: run_scoped
    validity_window: single_pipeline_run
    retrieval_rules:
      - readable_by_all_knowledge_stages
      - run_scoped_isolation: true
      - retrieval_profile_update_requires_validity_window   # blocking_condition mirror
    redaction_rules:
      - no_raw_secrets
      - redact_sensitive_content_before_summarization_or_storage   # redaction_required_gate
    governance_profiles:
      - memory_source_governance
      - validity_window_required_gate
      - redaction_required_gate
      - context_access_governance
    audit_schemas:
      - memory_provenance_schema
      - stage_gate_trace_schema
    used_by:
      - knowledge_memory_pipeline
    aliases:
      - knowledge_memory_run_context   # pre-R9 catalog-YAML definition_contract variant (now summary-only); markdown name is canonical (review F-1)
    notes: >-
      New (draft-0.1, knowledge-memory-pipeline.md §1, name authoritative). Memory stays a Core
      Ability; this run context curates the knowledge lifecycle (ingest->classify->summarize->
      validity->retrieval->expiry). The pre-R9 pipeline_catalog.yaml definition_contract used
      `knowledge_memory_run_context`; markdown `knowledge_run_context` is canonical. After R9 collapsed
      pipeline_catalog.yaml into a summary-only catalog, the authoritative per-pipeline source is the
      markdown definition_doc and the YAML name is retained as an alias only (review F-1).

  - id: memory_candidate_context_pack
    name: Memory Candidate Context Pack
    type: context_pack
    status: candidate
    scope: stage_pack
    purpose: >-
      Candidate-memory working context: the normalized candidate record, its source classification
      (origin type, trust tier, sensitivity, redaction need), the grounded summary, and the
      assigned validity window with rationale. Consumed by memory intake, source classification,
      summary generation, validity-window assignment, and expiration review.
    owner_domain: knowledge_management
    allowed_usage:
      - read_by_intake_classification_summary_validity_and_expiration_review
      - carry_the_candidate_record_classification_summary_and_window
    forbidden_usage:
      - store_or_summarize_unredacted_sensitive_content
      - retain_a_memory_item_with_no_validity_window
      - omit_the_provenance_record
      - exposed_as_an_agent_team_skill_or_tool
    source_priority:
      - candidate_memory_item                  # MEMORY_INTAKE_RECORD + origin reference
      - knowledge_run_context
      - durable_memory_existing_entries          # advisory (dedupe / supersession)
    retention: run_scoped
    validity_window: per_item_assigned_validity_window   # the pack carries each item's own window
    retrieval_rules:
      - scoped_to_one_candidate_memory_item
      - summary_must_be_grounded_in_classified_source
      - no_window_is_not_an_allowed_state            # every retained item needs a validity window
    redaction_rules:
      - no_raw_secrets
      - redact_sensitive_content_before_summarization_or_storage
      - provenance_record_required                   # MEMORY_PROVENANCE_RECORD must exist
    governance_profiles:
      - memory_source_governance
      - validity_window_required_gate
      - redaction_required_gate
      - context_access_governance
    audit_schemas:
      - memory_provenance_schema
      - stage_gate_trace_schema
    used_by:
      - knowledge_memory_pipeline
      - stage:memory_intake@knowledge_memory_pipeline
      - stage:source_classification@knowledge_memory_pipeline
      - stage:summary_generation@knowledge_memory_pipeline
      - stage:validity_window_assignment@knowledge_memory_pipeline
      - stage:memory_expiration_review@knowledge_memory_pipeline
    aliases:
      - memory_corpus_context_pack   # pre-R9 catalog-YAML definition_contract variant (now summary-only); markdown name is canonical (review F-1)
    notes: >-
      New (draft-0.1, knowledge-memory-pipeline.md §1, name authoritative). The pre-R9 pipeline_catalog.yaml
      definition_contract used `memory_corpus_context_pack`; markdown `memory_candidate_context_pack` is
      canonical. After R9 collapsed pipeline_catalog.yaml into a summary-only catalog, the authoritative
      per-pipeline source is the markdown definition_doc and the YAML name is retained as an alias only (review F-1).

  - id: retrieval_profile_context_pack
    name: Retrieval Profile Context Pack
    type: context_pack
    status: candidate
    scope: stage_pack
    purpose: >-
      Retrieval-profile working context: the affected retrieval profile / context pack to be
      updated so curated memory becomes retrievable under the right scope, with exposure bounded by
      sensitivity and validity window. Consumed by retrieval_profile_update and expiration review
      (to retire expired memory from active retrieval).
    owner_domain: knowledge_management
    allowed_usage:
      - read_during_retrieval_profile_update_and_expiration_review
      - expose_curated_memory_under_scope_bounded_by_sensitivity_and_validity
    forbidden_usage:
      - expose_a_memory_beyond_its_classified_sensitivity
      - update_for_a_memory_with_no_validity_window
      - retain_expired_memory_in_active_retrieval
      - exposed_as_an_agent_team_skill_or_tool
    source_priority:
      - target_retrieval_profile               # the profile/context-pack being updated
      - memory_candidate_context_pack          # the curated item + its validity window + sensitivity
      - knowledge_run_context
    retention: registry_lifetime   # the retrieval profile is durable, updated across runs
    validity_window: bounded_by_each_member_memory_validity_window
    retrieval_rules:
      - update_bound_to_validity_window             # no update for a memory with no window
      - sensitivity_exposure_must_not_exceed_classification
      - expired_memory_retired_from_active_retrieval
    redaction_rules:
      - no_raw_secrets
      - sensitive_memory_not_placed_in_broadly_readable_profile
    governance_profiles:
      - memory_source_governance
      - validity_window_required_gate
      - context_access_governance
    audit_schemas:
      - memory_provenance_schema
      - context_usage_trace_schema
      - stage_gate_trace_schema
    used_by:
      - knowledge_memory_pipeline
      - stage:retrieval_profile_update@knowledge_memory_pipeline
      - stage:memory_expiration_review@knowledge_memory_pipeline
    aliases: []
    notes: >-
      New (draft-0.1, knowledge-memory-pipeline.md §2.5-§2.6). This is the curated, retrievable
      view that the Memory Core Ability exposes under scope; it is governed working context, not the
      ability itself.

# ---------------------------------------------------------------------------------------------
# Registry-level validation hints (doc 17 §11 / §13). For Phase C review tooling.
# ---------------------------------------------------------------------------------------------
validation:
  every_item_has_status: true
  every_item_has_used_by_or_is_candidate: true
  no_plugin_context_pack: true
  memory_core_ability_not_listed_here: true   # Memory lives in core_abilities.yaml, not as a pack
  context_pack_is_not_agent_team_skill_or_tool: true
  canonical_count: 9     # sdlc_run_context + 8 SDLC base packs (requirements, architecture, implementation, verification, security, operations, release, domain_risk)
  candidate_count: 17    # skill_semantic bridge + 16 new per-pipeline profiles (research 3, activation 4, operations 4, skill-governance 2, knowledge 3)
  total_items: 26
  sibling_registries_expected:
    - configs/nexus-ai/core_abilities.yaml
    - configs/nexus-ai/skills_registry.yaml
    - configs/nexus-ai/tools_registry.yaml
    - configs/nexus-ai/governance_profiles.yaml
    - configs/nexus-ai/audit_schemas.yaml
    - configs/nexus-ai/model_provider_profiles.yaml

# ---------------------------------------------------------------------------------------------
# Open questions carried forward to Phase E (governance/audit) and Phase C review.
# ---------------------------------------------------------------------------------------------
open_questions:
  - >-
    NAME COLLISION on `learning_context_pack`: it is BOTH an SDLC stage-31 legacy alias reconciled
    into release_context_pack AND a distinct candidate live-operations learning pack
    (owner_domain: operations_reliability). Decide in Phase E whether to rename the operations item
    to `operations_learning_context_pack` to eliminate the shared legacy name.
  - >-
    `skill_semantic_context_pack` is registered candidate because SDLC stage 03 flags its name as
    NON-CANONICAL vs the locked context list, yet it is also referenced by the (draft) Skill
    Governance Pipeline. Confirm in Phase C/E that the Skill Governance Pipeline is its ratifying
    owner and whether SDLC stage 03 should adopt the same id verbatim (it already does).
  - >-
    `operations_context_pack` (canonical, SDLC operations-readiness, pre-release) is ALSO listed in
    the live Operations Pipeline's uses_context_memory_profiles. Confirm the intended reuse: one
    shared canonical pack used in two lifecycles (SDLC readiness + live ops) vs. splitting into
    operations_readiness_context_pack (SDLC) and an ops-runtime pack. Current registry keeps it as
    one canonical id used_by both, per the SDLC stage 25/26/27 references.
  - >-
    Governance profile names referenced here (e.g. context_access_governance, no_secret_read_policy,
    no_self_approval_policy, evidence_required_policy, no_silent_mutation_policy) and audit schema
    names (e.g. context_usage_trace_schema, *_evidence_schema, *_trace_schema) are the bounding
    profiles/schemas for these packs; they must be reconciled against governance_profiles.yaml /
    audit_schemas.yaml in Phase C/E. Per doc 17 NAMING RECONCILIATION, the *_policy variants
    (no_self_approval_policy, evidence_required_policy) are bindings of the canonical bare policies
    (no_self_approval, evidence_required) — register the canonical id with the _policy variant under
    aliases in governance_profiles.yaml.
  - >-
    `domain_risk_context_pack` (registered canonical, used by SDLC stage 02) was not in doc 17 §10's
    named canonical pack list but is canonical-referenced from disk and used as a first-class pack;
    it is registered here. Confirm in Phase C whether it should be formally added to the locked SDLC
    base-pack set in doc 17 §10.
  - >-
    The `used_by` qualifier syntax `stage:<id>@<pipeline>` (and bare `stage:<id>` for SDLC) is a
    registry convention introduced here to make usage mapping enforceable across pipelines. Confirm
    the convention in the Phase C shared-registry review and align sibling registries to it.
