    scope: stage_pack
    purpose: >-
      Domain/risk-profile working context for the early SDLC: product domain, data sensitivity,
      security/regulatory/availability/performance/autonomy risk signals, the selected risk class
      that calibrates pipeline rigor, and the initialized conditional-gate flags that drive
      downstream applicability decisions. Consumed by the domain_risk_profile stage.
    owner_domain: sdlc
    allowed_usage:
      - read_during_domain_and_risk_profiling
      - seed_the_risk_class_and_conditional_gate_flags_for_the_run
    forbidden_usage:
      - used_as_general_purpose_context_outside_domain_risk_profiling
      - override_a_blocking_gate_via_risk_class
      - exposed_as_an_agent_team_skill_or_tool
    source_priority:
      - product_and_scope_artifacts            # PRODUCT_BRIEF / INITIAL_SCOPE / SUCCESS_METRICS
      - current_run_domain_risk_artifacts      # DOMAIN_PROFILE_DECISION / RISK_PROFILE
      - sdlc_run_context
      - durable_memory_prior_domain_profiles     # advisory (similar prior products)
    retention: run_scoped
    validity_window: single_pipeline_run
    retrieval_rules:
      - scoped_to_domain_and_risk_profiling
      - risk_class_calibrates_rigor_but_does_not_waive_blocking_gates
    redaction_rules:
      - no_raw_secrets
      - redact_customer_or_regulated_data_examples
    governance_profiles:
      - domain_risk_governance
      - context_access_governance
    audit_schemas:
      - domain_risk_evidence_schema
      - context_usage_trace_schema
    used_by:
      - stage:domain_risk_profile
    aliases: []
    notes: >-
      Canonical SDLC pack used by stage 02 (domain_risk_profile). Not named in doc 17 §10's pack
      list but canonical-referenced on disk and used as a first-class pack (not reconciled away),
      so it is registered here to satisfy the "no category described only in prose" exit criterion.
      Flagged in open_questions for confirmation into the locked SDLC base-pack set.

  # ===========================================================================================
  # SECTION C — Skill-semantic bridge pack
  # Referenced by SDLC stage 03 AND the Skill Governance Pipeline. Stage 03 itself flags it as a
  # "canonical-prose name; NON-CANONICAL vs locked list", so it is registered as a candidate that
  # the Skill Governance Pipeline ratifies.
  # ===========================================================================================
  - id: skill_semantic_context_pack
    name: Skill Semantic Context Pack
    type: context_pack
    status: candidate
    scope: stage_pack
    purpose: >-
      Working context for skill semantic extraction: the candidate skill package inventory
      (SKILL.md, scripts/**, references/**, metadata), its canonical_source/version/hash, the
      locked-semantics rules (prism = divergence, verification-loop = bug/defect finding), and the
      draft semantic extract. Consumed by SDLC stage 03 (skill_semantic_extraction) and by the
      Skill Governance Pipeline's semantic-extraction stage.
    owner_domain: skill_governance
    allowed_usage:
      - read_during_skill_semantic_extraction_for_one_candidate_package
      - carry_the_locked_semantics_rules_and_draft_extract
    forbidden_usage:
      - read_for_binding_before_semantics_are_complete
      - used_to_change_locked_prism_or_verification_loop_semantics
      - execute_scripts_found_in_the_candidate_package
      - exposed_as_an_agent_team_skill_or_tool
    source_priority:
      - candidate_skill_package                # SKILL.md + scripts/** + references/** + metadata
      - locked_skill_semantics_rules           # prism/verification-loop locked semantics
      - skill_governance_run_context
      - durable_memory_prior_skill_extracts      # advisory (prior versions of the same skill)
    retention: run_scoped
    validity_window: until_skill_version_or_hash_changes   # re-extract on version/hash change
    retrieval_rules:
      - scoped_to_one_candidate_skill_package
      - locked_semantics_rules_are_authoritative_and_immutable
      - binding_context_must_not_be_read_before_semantics_complete   # anti-pattern: binding without semantics
    redaction_rules:
      - no_raw_secrets
      - flag_secrets_or_unsafe_calls_found_in_scripts_do_not_execute
    governance_profiles:
      - skill_semantic_required_gate
      - locked_semantics_enforcement_policy
      - context_access_governance
    audit_schemas:
      - skill_semantic_extract_schema
      - context_usage_trace_schema
    used_by:
      - stage:skill_semantic_extraction       # SDLC stage 03
      - skill_governance_pipeline
      - stage:skill_semantic_extraction@skill_governance_pipeline
    aliases: []
    notes: >-
      Bridge pack shared by SDLC stage 03 and the Skill Governance Pipeline. Registered candidate
      because SDLC stage 03 flags the name as NON-CANONICAL vs the locked context list; the Skill
      Governance Pipeline (draft) is the ratifying owner. Distinct from skill_registry_context_pack
      (which is the broader registry view, not a single package's semantics).

