      - context_access_governance
      - no_self_approval_policy
    audit_schemas:
      - activation_evidence_schema
      - activation_transition_trace_schema
      - stage_gate_trace_schema
    used_by:
      - activation_pipeline
    aliases: []
    notes: >-
      New (draft-0.1, activation-pipeline.md §1). Consumes the SDLC release candidate as upstream;
      SDLC is referenced, not regenerated. The public_activation_decision is a human/owner gate
      (review F-4) recorded as evidence within this run context.

