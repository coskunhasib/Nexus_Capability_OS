      stage-31 legacy reconciliation only. The Operations Pipeline introduces a DISTINCT candidate
      item also named `learning_context_pack` (Section D) for live-ops learning; they share a
      legacy name but differ in scope/owner_domain. Phase E should confirm whether to keep the
      operations learning pack under a disambiguated id (e.g. operations_learning_context_pack).

  - id: domain_risk_context_pack
