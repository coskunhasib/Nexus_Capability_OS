      - current_run_activation_artifacts       # ACTIVATION_REQUEST / PREVIEW_RESULT / PILOT_RESULT ...
      - durable_memory_prior_activations         # advisory (calibration from past activations)
    retention: run_scoped
    validity_window: single_pipeline_run
    retrieval_rules:
