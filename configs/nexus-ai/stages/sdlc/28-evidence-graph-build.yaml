# No-self-approval: this stage AUTHORS the evidence graph / traceability matrix by reading upstream
#   artifacts; it is not a review-gate adjudicating a single sibling author's artifact, and its
#   owner_agent (evidence_graph_agent) differs from every upstream artifact author and from the
#   downstream gate decider (release_manager_agent). The locked no_self_approval_policy is satisfied
#   with a dedicated role; no sdlc_team_lead override is required.
# Always-on (Required) stage: no applicability_decision block.

stage_id: evidence_graph_build
name: Evidence Graph Build
purpose: >-
  Assemble the end-to-end evidence DAG and traceability matrix that link every requirement and NFR
  through design (architecture/ADRs/threat model), implementation changeset, generated/executed
  tests, bug-finding, security/supply-chain/agentic-safety results, applicable product gates and
  operations-readiness artifacts up to the release-candidate evidence — under no-human governance.
  It verifies the chain is complete, internally consistent and free of orphan critical artifacts or
  broken links, producing the EVIDENCE_GRAPH and TRACEABILITY_MATRIX that development_completion and
  release_candidate consume. This is evidence/trace assembly and integrity auditing — NOT defect
  finding and NOT divergent brainstorming.

owner_team: sdlc_team
team_lead: sdlc_team_lead
owner_agent: evidence_graph_agent
sub_agents:
  - evidence_trace_subagent

# Shared Registry + Usage Mapping (all 7 categories present, even if empty)
uses_core_abilities:
  - Memory   # recall the full run history: requirements, design, gate results, prior evidence
  - OS       # invoke evidence/trace readers, checkers and the graph/diagram generator over artifacts

uses_skills:
  - evidence-graph-builder   # NON-CANONICAL (legacy docs 05/08/team-model): build the requirement->...->release evidence DAG
  - gap-audit                # detect orphan critical artifacts, missing nodes and broken traceability links

uses_tools:
  - evidence_reader               # read all upstream evidence + gate results to build the graph
  - evidence_consistency_checker  # verify graph internal consistency / no contradictory evidence (side-effect: governance + trace)
  - requirements_trace_checker    # verify requirement -> artifact traceability coverage (side-effect: governance + trace)
  - diagram_generator             # render EVIDENCE_GRAPH as a graph artifact (side-effect: governance + trace)
  - artifact_writer               # write EVIDENCE_GRAPH / TRACEABILITY_MATRIX (side-effect: governance + trace)
  - evidence_writer               # write stage evidence + gate result (side-effect: governance + trace)

uses_governance_profiles:
  - sdlc_pipeline_governance
  - no_self_approval_policy        # evidence_graph_agent != upstream artifact authors and != release_manager_agent (downstream decider)
  - evidence_required_policy
  - evidence_graph_gate            # stage-specific gate profile (legacy evidence_graph_governance maps here)
  - traceability_required_gate     # stage-specific gate profile

uses_audit_schemas:
  - sdlc_pipeline_evidence_schema     # evidence schema (distinct from trace)
  - evidence_graph_evidence_schema    # evidence schema: the assembled graph (distinct from trace)
  - traceability_matrix_schema        # evidence schema: requirement->artifact matrix (distinct from trace)
  - stage_gate_trace_schema           # trace schema (distinct from evidence)

uses_model_provider_profiles:
  - release_reasoning_model   # canonical fit: assembles the release evidence chain pre-development_completion

uses_context_memory_profiles:
  - sdlc_run_context
  - release_context_pack

inputs:
  - REQUIREMENTS_SPEC
  - NFR_CATALOG
  - ARCHITECTURE_DOC
  - ADR_INDEX
  - THREAT_MODEL
  - FMEA_RISK_REGISTER
  - CODE_CHANGESET_SUMMARY
  - CODE_REVIEW_REPORT
  - TEST_EXECUTION_REPORT
  - BUG_FINDING_REPORT
  - SECURITY_SCAN_REPORT
  - SUPPLY_CHAIN_GATE_RESULT
  - AGENTIC_SAFETY_EVAL_REPORT
  - RUNBOOK
  - ROLLBACK_PLAN
  - OBSERVABILITY_PLAN
  - INCIDENT_RESPONSE_PLAN

outputs:
  - EVIDENCE_GRAPH
  - TRACEABILITY_MATRIX
  - EVIDENCE_GRAPH_GATE_RESULT

evidence:
  - EVIDENCE_GRAPH
  - TRACEABILITY_MATRIX
  - EVIDENCE_GRAPH_GATE_RESULT

trace:
  - evidence_graph_build_stage_trace
  - evidence_graph_builder_skill_activation_trace
  - evidence_consistency_checker_tool_trace
  - requirements_trace_checker_tool_trace
  - evidence_graph_gate_decision_trace

gates:
  - evidence_graph_complete
  - traceability_matrix_complete
  - no_orphan_critical_artifacts
  - evidence_graph_internally_consistent

on_pass: development_completion
on_fail: relevant_failed_stage
rework_route: relevant_failed_stage

blocking_conditions:
  - missing_required_evidence
  - orphan_critical_artifact
  - broken_traceability_link
  - inconsistent_evidence_graph

optional_conditions: []

conditional_required_gates: []

max_iterations: 3
