#   - tools `benchmark_runner` + `resource_budget_checker` are canonical (side-effect tools -> imply
#     governance + trace). `repo_reader` (read changeset hotspots) and `evidence_reader` (read NFR_CATALOG /
#     architecture / RESOURCE_USAGE_DATA) are canonical side-effect-free readers.

stage_id: performance_resilience
name: Performance / Resilience
purpose: >-
  Validate the implemented changeset against its non-functional requirements — latency,
  throughput, resource budgets, capacity/scalability and failure behavior — by running
  benchmarks and resource-budget checks, reasoning over resilience failure modes (degradation,
  retry/backoff, timeout, failover, graceful shutdown), and deciding the performance/resilience
  gate under no-human governance before cost/resource governance. Performance budget failures
  and unaccepted resilience risks block; this stage does not hunt for functional defects
  (verification_loop_bug_finding) and does not re-run the functional test suite (test_execution).

owner_team: sdlc_team
team_lead: sdlc_team_lead
owner_agent: performance_resilience_agent
sub_agents: []

# Shared Registry + Usage Mapping (all 7 categories present)
uses_core_abilities:
  - Coder    # reason over code-level hotspots, allocations and resource-budget margins
  - Memory   # recall NFR_CATALOG, architecture capacity/failure-mode design and prior perf decisions
  - OS       # run benchmarks, load/soak probes and resource measurement in the build environment

uses_skills:
  - fmea        # reason about performance/resilience failure modes (degradation, retry storm, failover)
  - gap-audit   # find uncovered NFRs / unmeasured performance & failure-behavior surface
  - calibrate   # calibrate benchmark confidence and budget/headroom margins before deciding the gate
  # NOTE: prism (divergent brainstorming) and verification-loop (bug/defect finding) are intentionally
  #       EXCLUDED — locked skill semantics; this stage measures NFRs and reasons over failure behavior.

uses_tools:
  - benchmark_runner          # run latency/throughput/capacity & resilience probes (side-effect: governance + trace)
  - resource_budget_checker   # verify CPU/RAM/IO/resource budgets vs NFR limits (side-effect: governance + trace)
  - repo_reader               # read changeset hotspots / resource-sensitive code (side-effect-free)
  - evidence_reader           # read NFR_CATALOG, architecture & RESOURCE_USAGE_DATA evidence (side-effect-free)
  - artifact_writer           # write PERFORMANCE_REPORT / RESILIENCE_REPORT (side-effect: governance + trace)
  - evidence_writer           # write stage evidence (side-effect: governance + trace)

uses_governance_profiles:
  - sdlc_pipeline_governance
  - no_self_approval_policy
  - evidence_required_policy
  - performance_governance    # stage-specific gate profile (performance budgets)
  - resilience_governance     # stage-specific gate profile (failure-behavior / resilience risks)

uses_audit_schemas:
  - performance_evidence_schema   # evidence schema (distinct from trace)
  - resilience_report_schema      # evidence schema (distinct from trace)
  - stage_gate_trace_schema       # trace schema (gate evaluation provenance; distinct from evidence)

uses_model_provider_profiles:
  - sdlc_reasoning_profile     # reconciled from legacy NON-CANONICAL performance_analysis_model
  - coder_engineering_model    # reason over code-level performance hotspots / budgets

uses_context_memory_profiles:
  - sdlc_run_context
  - architecture_context_pack     # NFRs / capacity / failure-mode design context
  - implementation_context_pack   # changeset + RESOURCE_USAGE_DATA under measurement

inputs:
  - CODE_CHANGESET_SUMMARY              # from implementation: what changed (perf-relevant code)
  - NFR_CATALOG                         # from requirements: latency/throughput/capacity/resilience targets
  - ARCHITECTURE_DOC                    # from architecture: capacity model & failure-behavior design
  - RESOURCE_USAGE_DATA_IF_APPLICABLE   # from implementation (conditional): measured resource usage

outputs:
  - PERFORMANCE_REPORT
  - RESILIENCE_REPORT
  - PERFORMANCE_RESILIENCE_GATE_RESULT

evidence:
  - PERFORMANCE_REPORT
  - RESILIENCE_REPORT
  - PERFORMANCE_RESILIENCE_GATE_RESULT

trace:
  - performance_resilience_stage_trace
  - benchmark_runner_tool_trace
  - resource_budget_check_tool_trace
  - performance_resilience_gate_trace

gates:
  - performance_resilience_pass_or_accepted
  - resilience_risks_accepted_or_mitigated

on_pass: cost_resource_governance
on_fail: architecture
rework_route: architecture

blocking_conditions:
  - performance_budget_failure
  - unaccepted_resilience_risk

optional_conditions: []

conditional_required_gates: []

max_iterations: 3
