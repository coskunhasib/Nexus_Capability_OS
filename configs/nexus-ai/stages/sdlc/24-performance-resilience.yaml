#   - LOCKED SKILL SEMANTICS: prism (divergent brainstorming) and verification-loop (bug/defect finding)
#     are intentionally EXCLUDED. This stage measures latency/throughput/resource/capacity and reasons over
#     failure behavior; it is neither divergent ideation (prism) nor a defect sweep (verification-loop,
#     stage 15) and does NOT replace test_execution's performance smoke (stage 14).
#   - model profile reconciled from legacy NON-CANONICAL `performance_analysis_model` to canonical
