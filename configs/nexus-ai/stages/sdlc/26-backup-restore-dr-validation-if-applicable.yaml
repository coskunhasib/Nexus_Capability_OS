#   - model profile reconciled from legacy `operations_analysis_model` (non-canonical) to canonical
#     `release_reasoning_model` (DR/operational-readiness validation is a release-readiness reasoning task).
#   - context profile reconciled from legacy `backup_restore_context_pack` (non-canonical) to canonical
#     `operations_context_pack` + `sdlc_run_context`.
#   - governance: `backup_restore_governance` / `disaster_recovery_gate` / `rollback_required_gate` are
