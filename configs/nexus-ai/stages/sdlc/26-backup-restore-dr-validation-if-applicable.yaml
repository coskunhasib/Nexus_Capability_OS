# Reconciliation notes (legacy docs 04 / 05 -> Phase A canonical registry):
#   - owner_agent: canonical `operations_readiness_agent` (task-suggested + canonical role). The
#     downstream operations_readiness stage (#27) is owned by the SAME role. This stage does NOT
#     review its own output: the artifacts it consumes/validates are authored upstream by OTHER roles
#     — RUNBOOK_DRAFT / ROLLBACK_PLAN_DRAFT / OPERATIONAL_READINESS_DRAFTS by planning_agent (override §3),
#     DATA_INTEGRITY_REPORT by data_migration_agent — so no_self_approval is not violated on the inputs.
#     The same-owner adjacency of #26 and #27 is flagged in open_questions for review-role confirmation.
#   - tool `rollback_validator` is NON-CANONICAL: it is not in the Phase A canonical shared Tools
#     registry but is named by legacy docs (04 §10, 05 §4.19) and is load-bearing for validating the
#     rollback procedure (ROLLBACK_VALIDATION_REPORT). Carried and flagged in open_questions for
