#   - skills: sentinel (premortem the DR-readiness gate decision), fmea (data-loss / failed-restore /
#     unrecoverable-region failure modes), gap-audit (find uncovered backup/restore/DR/RTO/RPO gaps).
#     prism is deliberately NOT used (this is not divergent brainstorming); verification-loop is
#     deliberately NOT used (this is a DR-readiness validation, not a code bug/defect sweep — that is stage 15).

stage_id: backup_restore_dr_validation_if_applicable
name: Backup / Restore / DR Validation (If Applicable)
purpose: >-
  Validate that the product's backup, restore, disaster-recovery and rollback posture is
  production-ready when it manages production or persistent data — verifying backup-plan adequacy,
  an executable restore test, DR runbook coverage and RTO/RPO targets, plus rollback-procedure
  validity — and decide the backup/restore/DR gate under no-human governance before operations readiness.

# CONDITIONAL stage: applicability_decision (with required_when) appears right after purpose.
applicability_decision:
  decision: BACKUP_RESTORE_DR_APPLICABILITY_DECISION
  required_when: >-
    persistent_data_present == true or production_data_present == true or
    stateful_service == true or recovery_objectives_defined == true or
    rto_rpo_targets_present == true
  produced_by: operations_readiness_agent
  on_not_applicable:
    route: operations_readiness
    record_evidence: BACKUP_RESTORE_DR_APPLICABILITY_DECISION

owner_team: sdlc_team
team_lead: sdlc_team_lead
owner_agent: operations_readiness_agent
sub_agents: []

# Shared Registry + Usage Mapping (all 7 categories present)
uses_core_abilities:
  - OS       # exercise backup/restore + DR runbook steps in the build/recovery environment
  - Memory   # recall recovery objectives (RTO/RPO), DR drafts and prior operational decisions
  - Coder    # inspect backup/restore/rollback scripts and migration-aware recovery logic

uses_skills:
  - sentinel    # premortem the DR-readiness gate decision before committing to pass
  - fmea        # reason about data-loss / failed-restore / unrecoverable-region failure modes
  - gap-audit   # find uncovered backup/restore/DR/RTO/RPO and rollback coverage gaps

uses_tools:
  - backup_plan_checker   # verify backup scope/frequency/retention adequacy vs recovery objectives
  - restore_test_runner   # execute a restore test and capture RESTORE_TEST_REPORT (side-effect: governance + trace)
  - dr_runbook_checker    # verify DR runbook completeness, RTO/RPO coverage and failover steps
  - rollback_validator    # NON-CANONICAL (legacy): validate the rollback procedure -> ROLLBACK_VALIDATION_REPORT
  - evidence_reader       # read upstream drafts (RUNBOOK_DRAFT, ROLLBACK_PLAN_DRAFT) + DATA_INTEGRITY_REPORT
  - artifact_writer       # write backup/restore/DR reports (side-effect: governance + trace)
  - evidence_writer       # write stage evidence (side-effect: governance + trace)

uses_governance_profiles:
  - sdlc_pipeline_governance
  - no_self_approval_policy
  - evidence_required_policy
  - backup_restore_governance     # stage-specific gate profile
  - disaster_recovery_gate        # stage-specific gate profile
  - rollback_required_gate        # stage-specific gate profile

uses_audit_schemas:
  - backup_restore_evidence_schema   # evidence schema
  - dr_validation_schema             # evidence schema
  - rollback_validation_schema       # evidence schema
  - stage_gate_trace_schema          # trace schema (distinct from evidence)

uses_model_provider_profiles:
  - release_reasoning_model

uses_context_memory_profiles:
  - sdlc_run_context
  - operations_context_pack

inputs:
  - BACKUP_RESTORE_DR_APPLICABILITY_DECISION       # this stage's own applicability gate
  - DATA_INTEGRITY_REPORT                          # from data_migration_validation (author: data_migration_agent)
  - RUNBOOK_DRAFT                                  # from planning (author: planning_agent, override §3)
  - ROLLBACK_PLAN_DRAFT                            # from planning (author: planning_agent, override §3)
  - OPERATIONAL_READINESS_DRAFTS                   # from planning (author: planning_agent, override §3)
  - NFR_CATALOG                                    # recovery objectives / RTO / RPO requirements
  - DOMAIN_PROFILE_DECISION                        # determines persistent/production-data applicability

outputs:
  - BACKUP_RESTORE_DR_APPLICABILITY_DECISION
  - BACKUP_PLAN
  - RESTORE_TEST_REPORT
  - DR_READINESS_REPORT
  - ROLLBACK_VALIDATION_REPORT

evidence:
  - BACKUP_RESTORE_DR_APPLICABILITY_DECISION
  - BACKUP_PLAN
  - RESTORE_TEST_REPORT
  - DR_READINESS_REPORT
  - ROLLBACK_VALIDATION_REPORT

trace:
  - backup_restore_validation_trace
  - restore_test_runner_tool_trace
  - dr_runbook_check_tool_trace
  - rollback_validation_tool_trace

gates:
  - backup_restore_dr_pass_if_applicable
  - restore_test_pass_if_applicable
  - rollback_validation_pass_if_applicable

on_pass: operations_readiness
on_fail: planning
rework_route: planning

blocking_conditions:
  - missing_restore_evidence
  - failed_restore_test
  - missing_rollback_validation
  - rto_rpo_target_unmet
  - missing_dr_runbook

optional_conditions:
  - persistent_data_present
  - production_data_present
  - stateful_service
  - recovery_objectives_defined
  - rto_rpo_targets_present

conditional_required_gates:
  - gate_id: backup_restore_dr_pass_if_applicable
    required_when: >-
      persistent_data_present == true or production_data_present == true or
      stateful_service == true
  - gate_id: restore_test_pass_if_applicable
    required_when: persistent_data_present == true or production_data_present == true
  - gate_id: rollback_validation_pass_if_applicable
    required_when: stateful_service == true or recovery_objectives_defined == true

max_iterations: 3
