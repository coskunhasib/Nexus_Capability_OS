#   - docs/ai-sdlc-factory/sdlc-stages/05-completion-release-and-learning.md §1 (downstream
#     operations_readiness consumes DR_READINESS_REPORT + ROLLBACK_VALIDATION_REPORT -> confirms on_pass chain),
#   - docs/ai-sdlc-factory/06-sdlc-coverage-gap-audit.md (operations / DR readiness coverage),
#   - docs/ai-sdlc-factory/07-pipeline-contract-standard.md (stage contract template + conditional gate rule),
#   - docs/ai-sdlc-factory/08-sdlc-pipeline-contract.md (canonical tool names backup_plan_checker /
