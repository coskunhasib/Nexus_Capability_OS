# Nexus AI Orchestration Model — Research Pipeline
# Stage #10 of 11: synthesis
# Machine-readable stage contract. Documentation/blueprint only — no runtime code.
# Source: docs/nexus-ai-orchestration-model/legacy/pipeline-catalog/research-pipeline.md §2.9.
# Field set + rigor mirror the SDLC stage contracts.
# Pipeline: research_pipeline. owner_agent is a snake_case Agent role under research_team.
#
# COVERAGE ADDITION folded in here (calibration exemplar):
#   CITATION INTEGRITY. The prior contract had no_uncited_load_bearing_claim (every load-bearing
#   statement carries a citation) but NOTHING verifying each citation actually resolves to real,
#   matching mapped evidence in the CLAIM_EVIDENCE_MAP — a well-known failure mode where a citation
#   is present but fabricated or mismatched. Added: citations_resolve_to_mapped_evidence gate +
#   CITATION_INTEGRITY_REPORT output + citation_does_not_resolve_to_mapped_evidence blocking_condition.
#   This makes the citation_required_gate a genuine integrity control, not just a presence check.
#
# Depth / reconciliation notes:
#   - citation_required_gate governance profile blocks any uncited load-bearing claim; the new
#     integrity gate additionally blocks any citation that does not resolve to mapped evidence.
#   - gap-audit checks every load-bearing question is addressed-or-flagged and every load-bearing
#     statement is both cited AND traceable to the uncertainty report.
#   - synthesis is the authoritative producer of all_research_questions_addressed_or_flagged
#     (research_pipeline_runtime_rules.yaml required_gate_producers).
#   - No-self-approval: synthesis is authored by research_synthesis_agent and reviewed at
#     research_completion (#11) by the DISTINCT research_completion_agent
#     (agent_roles.yaml research_synthesis_agent.reviewed_by = research_completion_agent).
#   - on_fail routes to claim_evidence_mapping when a synthesis claim is not supported by evidence;
#     a citation gap is re-run in place (rework_route = self) — matches md §2.9.
version: draft-0.1
stage_id: synthesis
name: Synthesis
purpose: >-
  Produce the final cited research synthesis answering the research questions, with every load-bearing
  statement (a) traceable to mapped evidence, (b) carrying a citation that RESOLVES to that mapped
  evidence, and (c) consistent with the explicit uncertainty report. The citation_required_gate blocks
  any uncited load-bearing claim; the citation-integrity gate blocks any citation that does not resolve
  to real mapped evidence. Produces RESEARCH_SYNTHESIS + CITATION_INDEX.

owner_team: research_team
team_lead: research_team_lead
owner_agent: research_synthesis_agent
sub_agents: []

uses_core_abilities:
  - Memory   # recall the claim-evidence map, citation linkages and uncertainty report
  - Web      # re-check a cited source passage where the citation must be verified verbatim
uses_skills:
  - gap-audit   # detect unaddressed load-bearing questions, uncited claims and unresolved citations
uses_tools:
  - artifact_writer   # write RESEARCH_SYNTHESIS / CITATION_INDEX (side-effect: governance + trace)
  - evidence_reader   # read the claim-evidence map to bind each statement to its evidence
uses_governance_profiles:
  - citation_required_gate       # blocks uncited load-bearing claims (and, here, unresolved citations)
  - research_source_governance
  - evidence_required_policy
uses_audit_schemas:
  - claim_evidence_schema
  - stage_gate_trace_schema
uses_model_provider_profiles:
  - research_reasoning_profile
uses_context_memory_profiles:
  - research_run_context
  - claim_evidence_context_pack

inputs:
  - CLAIM_EVIDENCE_MAP
  - UNCERTAINTY_REPORT
  - CONTESTED_POINTS_REGISTER
  - KNOWN_GAPS_REGISTER
  - RESEARCH_QUESTION_SET
  - LOAD_BEARING_QUESTION_SET

outputs:
  - RESEARCH_SYNTHESIS            # the final cited answer to the research questions
  - CITATION_INDEX               # citation -> mapped-evidence linkage for every load-bearing statement
  - CITATION_INTEGRITY_REPORT    # verification that every citation resolves to real mapped evidence
  - QUESTION_RESOLUTION_MAP      # per load-bearing question: answered / partially-answered / flagged
  - SYNTHESIS_GATE_RESULT        # binary gate result for this stage

evidence:
  - RESEARCH_SYNTHESIS
  - CITATION_INDEX
  - CITATION_INTEGRITY_REPORT
  - SYNTHESIS_GATE_RESULT
trace:
  - research_synthesis_agent_trace
  - skill_activation_trace
  - gate_decision_trace

gates:
  - all_research_questions_addressed_or_flagged
  - no_uncited_load_bearing_claim
  - synthesis_consistent_with_uncertainty_report
  - citations_resolve_to_mapped_evidence    # every citation resolves to real, matching mapped evidence

on_pass: research_completion
on_fail: claim_evidence_mapping     # a synthesis claim not supported by evidence
rework_route: synthesis             # a citation gap is re-run in place

blocking_conditions:
  - uncited_claim_in_final_synthesis == true
  - citation_does_not_resolve_to_mapped_evidence == true
  - synthesis_inconsistent_with_uncertainty_report == true
  - load_bearing_question_neither_addressed_nor_flagged == true
optional_conditions: []
conditional_required_gates: []

max_iterations: 3
