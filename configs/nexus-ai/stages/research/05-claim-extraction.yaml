# Nexus AI Orchestration Model — Research Pipeline
# Stage #5 of 10: claim_extraction
# Machine-readable stage contract. Transcribed (not invented) from
#   docs/nexus-ai-orchestration-model/legacy/pipeline-catalog/research-pipeline.md §2.5.
# Field set mirrors configs/nexus-ai/stages/sdlc/ stage contracts.
# Pipeline: research_pipeline. owner_agent is a snake_case Agent role under research_team.
version: draft-0.1
stage_id: claim_extraction
name: Claim Extraction
purpose: >-
  Extract atomic, checkable claims relevant to the research questions from the scored
  source corpus; tag each claim with its asserting source(s).
owner_team: research_team
team_lead: research_team_lead
owner_agent: claim_extraction_agent
sub_agents: []

uses_core_abilities:
  - Memory
uses_skills: []
uses_tools:
  - claim_mapper
  - artifact_writer
uses_governance_profiles:
  - research_source_governance
  - evidence_required_policy
uses_audit_schemas:
  - claim_evidence_schema
  - stage_gate_trace_schema
uses_model_provider_profiles:
  - research_reasoning_profile
uses_context_memory_profiles:
  - research_run_context
  - claim_evidence_context_pack

inputs:
  - SOURCE_RELIABILITY_REPORT
outputs:
  - CLAIM_REGISTER

evidence:
  - CLAIM_REGISTER
trace:
  - agent_invocation_trace
  - claim_mapper_tool_trace
  - gate_decision_trace

gates:
  - claims_are_atomic_and_checkable
  - each_claim_linked_to_asserting_source
  - load_bearing_claims_tagged

on_pass: claim_evidence_mapping
on_fail: source_discovery
rework_route: claim_extraction

blocking_conditions: []
optional_conditions: []
conditional_required_gates: []

max_iterations: 3
