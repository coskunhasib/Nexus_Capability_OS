# Nexus AI Orchestration Model — Knowledge / Memory Pipeline
# Stage #5 of 6: retrieval_profile_update
# Machine-readable stage contract. Transcribed (not invented) from
#   docs/nexus-ai-orchestration-model/legacy/pipeline-catalog/knowledge-memory-pipeline.md §2.5.
# Field set mirrors configs/nexus-ai/stages/sdlc/04-requirements.yaml.
# Pipeline: knowledge_memory_pipeline. owner_agent is a snake_case Agent role under knowledge_team.
# gap-audit is used here to detect retrieval coverage gaps or conflicts after the update (md §2.5).
version: draft-0.1
stage_id: retrieval_profile_update
name: Retrieval Profile Update
purpose: >-
  Update the affected retrieval profile / context pack so the curated memory becomes
  retrievable under the right scope, with exposure bounded by its sensitivity and validity window.
owner_team: knowledge_team
team_lead: knowledge_team_lead
owner_agent: retrieval_profile_agent
sub_agents: []

uses_core_abilities:
  - Memory
uses_skills:
  - gap-audit   # detect retrieval coverage gaps or conflicts after the update
uses_tools:
  - retrieval_profile_writer
  - provenance_recorder
  - evidence_writer
uses_governance_profiles:
  - memory_source_governance
  - validity_window_required_gate
uses_audit_schemas:
  - memory_provenance_schema
  - stage_gate_trace_schema
uses_model_provider_profiles:
  - knowledge_reasoning_profile
uses_context_memory_profiles:
  - retrieval_profile_context_pack

inputs:
  - VALIDITY_WINDOW_DECISION
  - SOURCE_CLASSIFICATION_REPORT
outputs:
  - RETRIEVAL_PROFILE_UPDATE_REPORT

evidence:
  - RETRIEVAL_PROFILE_UPDATE_REPORT
trace:
  - retrieval_profile_update_trace
  - gate_decision_trace

# md §2.5 key gates (both blockers). update_bound_to_validity_window mirrors the
# retrieval_profile_update_without_validity_window blocking condition.
gates:
  - update_bound_to_validity_window
  - sensitivity_exposure_consistent

on_pass: memory_expiration_review
on_fail: validity_window_assignment
rework_route: validity_window_assignment

blocking_conditions:
  - retrieval_profile_update_without_validity_window
  - sensitivity_exposure_inconsistent
optional_conditions: []
conditional_required_gates: []

max_iterations: 3
