# Nexus AI Orchestration Model — Knowledge / Memory Pipeline
# Stage #7 of 7: memory_expiration_review   (TERMINAL — on_pass: done)
# Machine-readable stage contract. Transcribed (not invented) from
#   docs/nexus-ai-orchestration-model/legacy/pipeline-catalog/knowledge-memory-pipeline.md §2.6,
#   then ENRICHED to professional-grade reliability (sdlc / research_pipeline bar). RENUMBERED to #7.
# Field set + rigor mirror configs/nexus-ai/stages/sdlc/29-development-completion.yaml (the terminal
#   aggregate readiness gate) AND .../19-privacy-data-lifecycle-validation.yaml (the
#   applicability_decision / conditional-gate pattern, reused here for on-demand deletion / RTBF).
# Pipeline: knowledge_memory_pipeline. owner_agent is a snake_case Agent role under knowledge_team.
#   on_pass = done (canonical terminal); on_fail routes to validity_window_assignment.
#
# COVERAGE ADDITIONS folded in here (professional-grade calibration):
#   1. DELETION / RIGHT-TO-BE-FORGOTTEN. The md covers EXPIRY (validity-window lifecycle) but NOT an
#      on-demand erasure / right-to-be-forgotten request, which is a DISTINCT trigger (a governance /
#      compliance demand to remove an item regardless of its validity window). Deletion is a terminal
#      retirement outcome like expiry, so it is folded here as a CONDITIONAL applicability path rather
#      than a padded stage: applicability_decision DELETION_REQUEST_APPLICABILITY_DECISION +
#      right_to_be_forgotten_honored_if_requested CONDITIONAL gate (the item AND its retrieval exposure
#      AND its derived summaries are removed, with a deletion provenance record). NOTE: no
#      knowledge-callable deletion tool and no right-to-be-forgotten governance gate currently exist in
#      the shared registries (deletion_flow_checker + data_retention_gate are SDLC-stage-19-locked);
#      this is REPORTED as a missing registry capability. Enforcement here uses retrieval_profile_writer
#      (remove from retrieval) + provenance_recorder (record the erasure) — the registry-real,
#      knowledge-callable subset.
#   2. PROVENANCE-COMPLETENESS / LIFECYCLE-INTEGRITY ROLLUP. The pipeline exit_criterion
#      memory_provenance_evidence_complete and blocking_condition provenance_record_missing had no
#      single producing gate. Since this is the terminal stage (on_pass: done), a rollup gate
#      (memory_provenance_evidence_complete) is added here: it confirms the item's provenance chain is
#      unbroken end-to-end — intake seed -> classification + detection -> summary linkage ->
#      reconciliation disposition -> validity window -> retrieval change -> expiration/deletion outcome.
#      A dedicated memory_lifecycle_audit_subagent assembles + integrity-audits the chain and hands it
#      up; the parent decides the gate (mirrors the SDLC evidence_trace_subagent pattern). This is a
#      lightweight per-item terminal rollup, NOT a separate completion stage (which would be padding
#      for a per-item recurring lifecycle pipeline).
#
# Depth / reconciliation notes:
#   - owner_agent kept as canonical memory_expiration_agent (agent_roles.yaml; owned_stages:
#     [memory_expiration_review]; reviewed_by: knowledge_team_lead).
#   - NO-SELF-APPROVAL: the provenance rollup is an aggregate integrity check over artifacts authored
#     by the OTHER knowledge agents (intake/classification/summary/reconciliation/validity/retrieval);
#     memory_expiration_agent authored none of them. The structural no-self-approval / no-bypass
#     policy gate constrains every gate decision.
#   - refraction = lifecycle/learning reflection on what expired/was deleted and why; bayesian-update =
#     revise staleness expectation (md §2.6). expiration_scanner is caller-locked to
#     memory_expiration_agent; retrieval_profile_writer callers include memory_expiration_agent.
#   - SUB-AGENT memory_lifecycle_audit_subagent REPORTED for registry formalization (parent_agent =
#     memory_expiration_agent).
#   - expired_memory_retired_from_retrieval stays a conditional blocker (required_when: outcome ==
#     expired) per md §2.6 — see conditional_required_gates.
#   - Evidence != Trace kept distinct.
version: draft-0.1
stage_id: memory_expiration_review
name: Memory Expiration Review
purpose: >-
  Review memories whose validity window has reached its horizon — decide refresh, re-validate,
  downgrade, or expire/retire — honor any on-demand deletion / right-to-be-forgotten request, retire
  expired or deleted memory from retrieval, confirm the item's end-to-end provenance chain is
  complete, and feed lifecycle learning back into how windows are set. This is the recurring
  "knowledge does not silently rot" stage and the terminal gate that finalizes provenance evidence.

owner_team: knowledge_team
team_lead: knowledge_team_lead
owner_agent: memory_expiration_agent
sub_agents:
  - memory_lifecycle_audit_subagent   # assembles + integrity-audits the item's end-to-end provenance chain; REPORTED

# CONDITIONAL deletion / right-to-be-forgotten path: applicability_decision (with required_when)
# appears right after sub_agents, mirroring the SDLC privacy stage. Expiry remains the always-on
# review; deletion is the conditional terminal outcome.
applicability_decision:
  decision: DELETION_REQUEST_APPLICABILITY_DECISION
  required_when: >-
    deletion_requested == true or right_to_be_forgotten_requested == true
  produced_by: memory_expiration_agent
  on_not_applicable:
    route: done
    record_evidence: DELETION_REQUEST_APPLICABILITY_DECISION

uses_core_abilities:
  - Memory   # recall the item's full lifecycle history, all stage evidence and the validity decision
uses_skills:
  - refraction        # lifecycle / learning reflection on what expired / was deleted and why; also surfaces a broken provenance chain
  - bayesian-update   # revise staleness expectation from observed expiry/deletion outcomes
uses_tools:
  - expiration_scanner       # scan for items at their review horizon (allowed_callers: memory_expiration_agent)
  - retrieval_profile_writer # retire expired / deleted memory from retrieval (allowed_callers incl. memory_expiration_agent)
  - provenance_recorder      # record the expiration / deletion outcome + finalize provenance (side-effect: governance + trace)
  - evidence_writer          # write stage evidence / gate result (side-effect: governance + trace)
uses_governance_profiles:
  - validity_window_required_gate
  - memory_source_governance
uses_audit_schemas:
  - memory_provenance_schema   # evidence schema (the outcome + the completeness rollup attach to provenance)
  - stage_gate_trace_schema    # trace schema (distinct from evidence)
uses_model_provider_profiles:
  - knowledge_reasoning_profile
uses_context_memory_profiles:
  - knowledge_run_context
  - retrieval_profile_context_pack

inputs:
  - RETRIEVAL_PROFILE_UPDATE_REPORT   # the current retrieval state for the item
  - VALIDITY_WINDOW_DECISION          # the window whose horizon triggers review
  - MEMORY_PROVENANCE_RECORD          # the cumulative provenance chain to finalize / audit
  - DELETION_REQUEST                  # CONDITIONAL — present only when deletion / RTBF is requested

outputs:
  - MEMORY_EXPIRATION_REVIEW_REPORT          # per-item outcome (refreshed / re-validated / downgraded / expired / deleted)
  - DELETION_REQUEST_APPLICABILITY_DECISION  # conditional path applicability record
  - MEMORY_LIFECYCLE_PROVENANCE_AUDIT        # the end-to-end provenance-chain completeness audit (from the sub-agent)
  - EXPIRATION_REVIEW_GATE_RESULT            # binary terminal gate result for this stage

evidence:
  - MEMORY_EXPIRATION_REVIEW_REPORT
  - MEMORY_LIFECYCLE_PROVENANCE_AUDIT
  - DELETION_REQUEST_APPLICABILITY_DECISION
  - EXPIRATION_REVIEW_GATE_RESULT
trace:
  - memory_expiration_review_trace
  - lifecycle_provenance_audit_trace   # sub-agent chain-assembly + integrity-audit activity
  - skill_activation_trace
  - gate_decision_trace

# md §2.6 key gates + the added provenance-completeness rollup (always) and RTBF (conditional).
# expired_memory_retired_from_retrieval is a conditional blocker (required_when: outcome == expired).
gates:
  - expiration_outcome_recorded                  # every reviewed item gets an explicit outcome
  - memory_provenance_evidence_complete          # ALWAYS: the item's end-to-end provenance chain is unbroken
  - expired_memory_retired_from_retrieval        # CONDITIONAL — required_when outcome == expired
  - right_to_be_forgotten_honored_if_requested   # CONDITIONAL — required_when deletion / RTBF requested

# md §2.6 on_pass: pipeline run complete (memory provenance evidence is finalized).
on_pass: done
on_fail: validity_window_assignment
rework_route: validity_window_assignment

blocking_conditions:
  - expiration_outcome_not_recorded
  - provenance_record_incomplete
  - expired_memory_not_retired_from_retrieval
  - deletion_requested_but_not_honored
optional_conditions:
  - deletion_requested
  - right_to_be_forgotten_requested
conditional_required_gates:
  # md §2.6: expired_memory_retired_from_retrieval (blocker) — required_when outcome == expired.
  - gate_id: expired_memory_retired_from_retrieval
    required_when: >-
      outcome == expired
  # Added RTBF (blocker) — required_when a deletion / right-to-be-forgotten request is present.
  - gate_id: right_to_be_forgotten_honored_if_requested
    required_when: >-
      deletion_requested == true or right_to_be_forgotten_requested == true

max_iterations: 3
