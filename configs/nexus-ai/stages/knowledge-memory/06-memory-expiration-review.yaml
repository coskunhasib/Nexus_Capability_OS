# Nexus AI Orchestration Model — Knowledge / Memory Pipeline
# Stage #6 of 6: memory_expiration_review
# Machine-readable stage contract. Transcribed (not invented) from
#   docs/nexus-ai-orchestration-model/legacy/pipeline-catalog/knowledge-memory-pipeline.md §2.6.
# Field set mirrors configs/nexus-ai/stages/sdlc/04-requirements.yaml.
# Pipeline: knowledge_memory_pipeline. owner_agent is a snake_case Agent role under knowledge_team.
# refraction = lifecycle/learning reflection on what expired and why; bayesian-update = revise
#   staleness expectation (md §2.6). This is the recurring "knowledge does not silently rot" stage.
version: draft-0.1
stage_id: memory_expiration_review
name: Memory Expiration Review
purpose: >-
  Review memories whose validity window has reached its horizon: decide refresh, re-validate,
  downgrade, or expire/retire — and feed lifecycle learning back into how windows are set.
  This is the recurring "knowledge does not silently rot" stage.
owner_team: knowledge_team
team_lead: knowledge_team_lead
owner_agent: memory_expiration_agent
sub_agents: []

uses_core_abilities:
  - Memory
uses_skills:
  - refraction        # lifecycle / learning reflection on what expired and why
  - bayesian-update   # revise staleness expectation
uses_tools:
  - expiration_scanner
  - retrieval_profile_writer
  - provenance_recorder
  - evidence_writer
uses_governance_profiles:
  - validity_window_required_gate
  - memory_source_governance
uses_audit_schemas:
  - memory_provenance_schema
  - stage_gate_trace_schema
uses_model_provider_profiles:
  - knowledge_reasoning_profile
uses_context_memory_profiles:
  - knowledge_run_context
  - retrieval_profile_context_pack

inputs:
  - RETRIEVAL_PROFILE_UPDATE_REPORT
  - VALIDITY_WINDOW_DECISION
outputs:
  - MEMORY_EXPIRATION_REVIEW_REPORT

evidence:
  - MEMORY_EXPIRATION_REVIEW_REPORT
trace:
  - memory_expiration_review_trace
  - gate_decision_trace

# md §2.6 key gates. expired_memory_retired_from_retrieval is a conditional blocker
# (required_when: outcome == expired) — see conditional_required_gates.
gates:
  - expiration_outcome_recorded
  - expired_memory_retired_from_retrieval

# md §2.6 on_pass: pipeline run complete (memory provenance evidence is finalized).
on_pass: done
on_fail: validity_window_assignment
rework_route: validity_window_assignment

blocking_conditions:
  - expiration_outcome_not_recorded
  - expired_memory_not_retired_from_retrieval
optional_conditions: []
conditional_required_gates:
  # md §2.6: expired_memory_retired_from_retrieval (blocker) — required_when outcome == expired.
  - expired_memory_retired_from_retrieval

max_iterations: 3
