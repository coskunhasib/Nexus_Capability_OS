# Skill Governance Pipeline — Stage Contract 06: skill_activation_decision
# Transcribed from: docs/nexus-ai-orchestration-model/legacy/pipeline-catalog/skill-governance-pipeline.md (§2.6)
# Format mirror: configs/nexus-ai/stages/sdlc/04-requirements.yaml
# Conforms to: docs/nexus-ai-orchestration-model/legacy/07-pipeline-contract-standard.md §4 (Stage Contract)
# Pipeline: skill_governance_pipeline. Stage #6 of 7. Stage class: always-on.
# Review independence: decider (skill_runtime_safety_agent) != proposer (skill_librarian_agent) -> no self-approval.
version: draft-0.1
stage_id: skill_activation_decision
name: Skill Activation Decision
purpose: >-
  Skill'in aktive edileceğine, beklemeye alınacağına (hold) veya deprecate/update
  edileceğine dair kararı kaydeder. Karar evidence'a dayanır ve self-approval
  yapılamaz; öneren ile karar veren ayrışır (no_self_approval_policy).
owner_team: skill_governance_team
team_lead: skill_governance_team_lead
owner_agent: skill_runtime_safety_agent   # approves/rejects skill_librarian_agent's proposal (review independence)
sub_agents: []

uses_core_abilities:
  - Memory
  - Supervisor

uses_skills:
  - calibrate     # confidence on the activate/hold/deprecate decision
  - llm-council   # multi-perspective review of the activation decision

uses_tools:
  - artifact_writer
  - evidence_writer

uses_governance_profiles:
  - skill_governance_pipeline_governance
  - skill_activation_decision_gate
  - locked_semantics_enforcement_policy
  - no_self_approval_policy
  - evidence_required_policy

uses_audit_schemas:
  - skill_binding_decision_schema
  - skill_governance_trace_schema

uses_model_provider_profiles:
  - skill_governance_reasoning_profile
  - supervisor_routing_model

uses_context_memory_profiles:
  - skill_governance_run_context
  - skill_registry_context_pack

inputs:
  - SKILL_BINDING_PROPOSAL
  - SKILL_SEMANTIC_EXTRACT
  - SKILL_MISUSE_WARNINGS
outputs:
  - SKILL_ACTIVATION_DECISION

evidence:
  - SKILL_ACTIVATION_DECISION
trace:
  - skill_activation_decision_trace
  - gate_evaluation_trace

# key gates: skill_activation_decision_gate (blocker) — cannot pass with missing evidence or
# self_approval_of_activation_decision; locked_semantics_enforcement_policy (blocker) re-evaluated.
gates:
  - skill_activation_decision_gate
  - locked_semantics_enforcement_policy

# on_pass: skill_deprecation_update (lifecycle tracking) OR pipeline exit (activate -> exit_criteria met)
on_pass: skill_deprecation_update
on_fail: skill_binding_proposal
rework_route: skill_binding_proposal

blocking_conditions:
  - self_approval_of_activation_decision
  - required_evidence_missing_or_inconsistent
  - locked_semantics_violation
optional_conditions: []
conditional_required_gates: []

max_iterations: 3
