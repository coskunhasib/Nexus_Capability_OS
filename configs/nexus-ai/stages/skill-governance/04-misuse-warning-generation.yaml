# Skill Governance Pipeline — Stage Contract 04: misuse_warning_generation
# Transcribed from: docs/nexus-ai-orchestration-model/legacy/pipeline-catalog/skill-governance-pipeline.md (§2.4)
# Format mirror: configs/nexus-ai/stages/sdlc/04-requirements.yaml
# Conforms to: docs/nexus-ai-orchestration-model/legacy/07-pipeline-contract-standard.md §4 (Stage Contract)
# Pipeline: skill_governance_pipeline. Stage #4 of 7. Stage class: always-on.
version: draft-0.1
stage_id: misuse_warning_generation
name: Misuse Warning Generation
purpose: >-
  Semantik ve script denetimine dayanarak skill için açık misuse_warnings üretir
  (ör. "prism karar vermez", "verification-loop release garantisi değildir",
  "bu skill bug-finding için değildir"). Bu uyarılar binding ve aktivasyonun ön
  koşuludur. sentinel ile yanlış-kullanım senaryoları premortem edilir.
owner_team: skill_governance_team
team_lead: skill_governance_team_lead
owner_agent: skill_runtime_safety_agent
sub_agents: []

uses_core_abilities:
  - Memory
  - OS

uses_skills:
  - sentinel   # premortem misuse scenarios

uses_tools:
  - artifact_writer
  - evidence_writer

uses_governance_profiles:
  - skill_governance_pipeline_governance
  - misuse_warning_required_gate
  - evidence_required_policy

uses_audit_schemas:
  - skill_misuse_warning_schema
  - skill_governance_trace_schema

uses_model_provider_profiles:
  - skill_governance_reasoning_profile

uses_context_memory_profiles:
  - skill_governance_run_context
  - skill_registry_context_pack

inputs:
  - SKILL_SEMANTIC_EXTRACT
  - SCRIPT_REFERENCE_AUDIT_REPORT
outputs:
  - SKILL_MISUSE_WARNINGS

evidence:
  - SKILL_MISUSE_WARNINGS
trace:
  - misuse_warning_generation_trace
  - gate_evaluation_trace

# key gate: misuse_warning_required_gate (blocker) — cannot pass with empty/missing misuse-warning;
# at least one not_for warning required for each locked-semantics skill.
gates:
  - misuse_warning_required_gate

on_pass: skill_binding_proposal
on_fail: script_reference_audit
rework_route: script_reference_audit

blocking_conditions:
  - missing_misuse_warnings
optional_conditions: []
conditional_required_gates: []

max_iterations: 3
