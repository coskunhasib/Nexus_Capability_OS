# ===========================================================================
# REGISTRY-LEVEL VALIDATION SUMMARY (doc 17 §11 / §13) — self-check assertions.
# ===========================================================================
validation:
  expected_core_ability_count: 8
  actual_core_ability_count: 8
  every_item_has_status: true
  every_item_has_display_name: true              # R11: all 8 carry a capitalized display_name; lowercase id stays canonical
  display_name_is_alias_not_new_identity: true   # R11: name-form alias only — no new agent/tool/caller created
  every_item_has_used_by_or_is_candidate: true   # all 8 carry used_by (min anchor: nexus_ai_capability_system)
  no_core_ability_is_an_agent: true              # never_agent: true on all 8
