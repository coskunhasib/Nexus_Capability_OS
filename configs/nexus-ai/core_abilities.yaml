      configs/nexus-ai/context_memory_profiles.yaml.

  # -------------------------------------------------------------------------
  # 7. WEB — web access capability. Higher default risk (external network egress).
  #    Exposes the canonical web tools (task-mandated).
  # -------------------------------------------------------------------------
  - id: web
    name: Web
    display_name: Web                     # R11: capitalized reference form; canonical id is the lowercase `web` (see name_form_convention)
    type: core_ability
    category: core_ability
    status: canonical
    never_agent: true
    default_risk_level: high            # external network egress -> higher default risk than pure-reasoning abilities (task rule)
    purpose: >-
      External web access capability: search, fetch, and scrape external sources for product/domain
      context, advisories, license metadata, standards, and consumer interface expectations. Web is
      a Core Ability (K-011); its callable operations are tools in the Tools Registry. External
      egress makes Web a higher-risk ability than pure-reasoning abilities.
    owner_domain: external_web_access
    model_provider_profiles: []         # Web is an access ability; reasoning over fetched content uses the calling stage's model profile (e.g. sdlc_reasoning_profile), not a Web-owned model.
    exposed_tools:                      # task-mandated Web tools — owned by the Tools Registry, referenced here
      - web_search                      # query external search (network egress)
      - web_fetch                       # fetch a specific external URL (network egress)
      - web_scrape                      # extract structured content from fetched pages (network egress)
    governance_profiles:
      - web_access_governance           # canonical core-ability governance (doc 03 §7) — HIGHER default risk
      - no_secret_read                  # canonical policy — outbound requests may not leak secrets/credentials
    audit_schemas:
      - core_ability_invocation_trace_schema   # candidate: Trace family
      - source_fetch_trace_schema              # candidate: external fetch provenance (Trace family; research_pipeline source-fetch trace)
    allowed_callers:
      - product_requirements_agent
      - architecture_agent
      - security_privacy_agent
      - security_validation_agent
      - compliance_agent
      - contract_validation_agent
      - accessibility_ux_agent
      - operations_readiness_agent
      - research_intake_agent
      - knowledge_memory_agents
    allowed_usage:
      - search_fetch_and_scrape_external_context_advisories_standards_and_specs
      - resolve_license_metadata_and_package_reputation_sources
      - source_current_attack_techniques_and_accessibility_criteria
    forbidden_usage:
      - being_declared_as_an_agent_owner_agent_or_sub_agent
      - transmitting_secrets_credentials_or_pii_in_outbound_requests
      - performing_unsandboxed_or_untraced_network_egress
      - treating_fetched_content_as_trusted_without_provenance_trace
    used_by:
      pipelines:
        - sdlc_pipeline
        - research_pipeline
        - activation_pipeline
        - operations_pipeline
        - skill_governance_pipeline
        - knowledge_memory_pipeline
      stages:                           # SDLC stage_ids whose uses_core_abilities lists Web
        - intake
        - domain_risk_profile
        - requirements
        - architecture
        - architecture_review
        - security_privacy_design
        - supply_chain_sbom_license
        - ai_agent_safety_evaluation
        - api_contract_compatibility_validation
        - domain_regulatory_compliance_validation_if_applicable
        - accessibility_ux_validation_if_applicable
        - operations_readiness
      capability_systems:
        - nexus_ai_capability_system
    notes: >-
      Web carries a HIGHER default risk than pure-reasoning abilities (Supervisor/Coder/Vision)
      because it performs external network egress (task rule). Its tools require sandbox/trace and
      a no-secret-leak posture. Web is the headline example of K-011 / D-014 (ability name in the
      registry; web_search/web_fetch/web_scrape in the Tools Registry).

  # -------------------------------------------------------------------------
  # 8. OS — operating-system / execution capability. HIGHEST default risk
  #    (filesystem + shell + process). Exposes the canonical OS tools (task-mandated).
  # -------------------------------------------------------------------------
  - id: os
    name: OS
    display_name: OS                      # R11: capitalized reference form; canonical id is the lowercase `os` (see name_form_convention)
    type: core_ability
    category: core_ability
    status: canonical
    never_agent: true
    default_risk_level: high            # filesystem write + shell + process execution -> highest default risk (task rule)
    purpose: >-
      Operating-system and execution capability: read/write files and run shell commands / processes
      in the (sandboxed) build environment to drive test runners, scanners, eval harnesses, migration
      checks, and artifact/evidence I/O. OS is a Core Ability (K-011); its callable operations are
      tools in the Tools Registry. It is the highest-risk ability and provides the side-effecting
      tools that Coder/Vision reasoning requests.
    owner_domain: system_execution
    model_provider_profiles: []         # OS is an execution ability; it runs tools and does not own a reasoning model. Interpretation of results uses the calling stage's model profile.
    exposed_tools:                      # task-mandated OS tools — owned by the Tools Registry, referenced here
      - file_read                       # read a file from the environment (read-only)
      - file_write                      # side-effect: write/modify a file -> governance + trace + sandbox required
      - shell_exec                      # side-effect: execute a shell command -> sandbox + timeout + trace required (doc 03 §9)
      - process_run                     # side-effect: run a process / harness -> sandbox + timeout + trace required
    governance_profiles:
      - system_access_governance        # canonical core-ability governance (doc 03 §7) — HIGHEST default risk
      - sandbox_execution_governance    # canonical (doc 03 §9): sandbox + timeout + trace required for shell_exec/process_run
      - no_silent_mutation              # canonical policy (doc 06 §3) — no env/repo mutation without explicit tool + trace
      - no_destructive_action_without_gate   # canonical policy (doc 06 §3) — destructive tools require explicit policy + evidence
      - no_secret_read                  # canonical policy (doc 06 §3) — execution may not read/emit raw secrets
    audit_schemas:
      - core_ability_invocation_trace_schema   # candidate: Trace family
      - code_change_trace_schema               # canonical: file/repo mutation provenance (SDLC 11/12) — Trace family
      - evidence_integrity_report_schema       # canonical: integrity of evidence written via OS tools (SDLC 18/28) — Evidence family
    allowed_callers:
      - skill_librarian_agent
      - engineering_agent
      - code_reviewer_agent
      - qa_agent
      - security_validation_agent
      - privacy_agent
      - data_migration_agent
      - accessibility_ux_agent
      - performance_resilience_agent
      - operations_readiness_agent
      - evidence_graph_agent
      - refraction_learning_agent
    allowed_usage:
      - read_and_write_files_in_the_sandboxed_build_environment
      - run_test_runners_scanners_eval_harnesses_and_migration_checks
      - exercise_backup_restore_rollback_and_runbook_steps_in_a_recovery_environment
      - drive_artifact_and_evidence_io_for_pipeline_stages
    forbidden_usage:
      - being_declared_as_an_agent_owner_agent_or_sub_agent
      - executing_shell_or_processes_outside_a_sandbox_or_without_timeout_and_trace
      - performing_destructive_actions_without_an_explicit_policy_gate_and_evidence
      - mutating_the_environment_or_repository_silently
      - reading_or_emitting_raw_secrets
      - performing_a_production_deploy
    used_by:
      pipelines:
        - sdlc_pipeline
        - activation_pipeline
        - operations_pipeline
        - skill_governance_pipeline
      stages:                           # SDLC stage_ids whose uses_core_abilities lists OS
        - skill_semantic_extraction
        - implementation
        - code_review
        - test_execution
        - verification_loop_bug_finding
        - security_validation
        - supply_chain_sbom_license
        - ai_agent_safety_evaluation
        - privacy_data_lifecycle_validation
        - data_migration_validation_if_applicable
        - accessibility_ux_validation_if_applicable
        - performance_resilience
        - cost_resource_governance
        - backup_restore_dr_validation_if_applicable
        - operations_readiness
        - evidence_graph_build
        - refraction_learning
      capability_systems:
        - nexus_ai_capability_system
    notes: >-
      OS is the HIGHEST-risk ability (filesystem write + shell + process execution) and therefore
      carries the strictest governance stack: system_access_governance + sandbox_execution_governance
      plus the no_silent_mutation / no_destructive_action_without_gate / no_secret_read blocker
      policies. Per K-011/D-014 the filesystem/shell tools (file_read/file_write/shell_exec/
      process_run) and the engineering tools that Coder reasons with (repo_reader/repo_writer/
      test_runner) are OS-provided in the Tools Registry, keeping tool ownership single-sourced.

