# =============================================================================
# Nexus AI — Agent Role Catalog
# =============================================================================
# Phase D / doc 18 (docs/nexus-ai-orchestration-model/legacy/18-team-agent-subagent-catalog-plan.md).
#
# This catalog defines ONE Agent role per distinct `owner_agent` discovered by
# reading ALL 31 SDLC stage contracts (configs/nexus-ai/stages/sdlc/*.yaml),
# PLUS the Agent roles defined by the 5 non-SDLC pipeline catalog entries
# (docs/nexus-ai-orchestration-model/legacy/pipeline-catalog/*.md). Field shape per doc 18 §6.
#
# AUTHORITATIVE SOURCES
#   - SDLC owner_agent + sub_agents: the 31 files in configs/nexus-ai/stages/sdlc/
#   - Non-SDLC rosters: docs/nexus-ai-orchestration-model/legacy/pipeline-catalog/*.md (§2 per-stage)
#   - uses_* references resolve against:
#       core_abilities.yaml, skills_registry.yaml, tools_registry.yaml,
#       governance_profiles.yaml, audit_schemas.yaml,
#       model_provider_profiles.yaml, context_memory_profiles.yaml
#
# LOCKED BOUNDARY RULES (doc 18 §11; doc 18-plan task header)
#   - Plugin cancelled — no plugin field anywhere.
#   - Core Abilities [Supervisor, Coder, Vision, Audio, Creative, Memory, Web,
#     OS] are a separate capability layer. They MUST NOT appear as Agents here;
#     agents reference them only via `uses_core_abilities`.
#   - Supervisor is never a Team Lead and is never an owner_agent.
#   - sdlc_team_lead owns the two SDLC review-gate stages (requirements_review,
#     architecture_review) as the no-self-approval fallback. It is a TEAM LEAD,
#     NOT an Agent — so it is intentionally ABSENT from this file (it lives in
#     team_lead_roles.yaml). The same holds for every *_team_lead role.
#   - An Agent cannot approve its own work; a reviewer cannot mutate the
#     reviewed artifact; Release Manager cannot bypass a failed governance gate.
#   - Skill != Tool; Governance != Audit; Evidence != Trace.
#   - Sub-agents are catalogued in sub_agent_roles.yaml; here they are only
#     referenced by `sub_agents`. A sub-agent is never an Agent role.
#
# GOVERNANCE NAMING NOTE
#   Stage/pipeline contracts spell the two global policies as
#   `no_self_approval_policy` / `evidence_required_policy`. These are registered
#   naming variants (aliases) of canonical `no_self_approval` / `evidence_required`
#   in governance_profiles.yaml (governance_alias_reconciliation). Both forms are
#   valid registry references; this catalog keeps the `_policy` spelling used by
#   the source contracts.
# =============================================================================

catalog_id: nexus_ai_agent_roles
version: draft-0.1
status: draft
category: agent_role
phase: D
doc_ref: docs/nexus-ai-orchestration-model/legacy/18-team-agent-subagent-catalog-plan.md

# -----------------------------------------------------------------------------
# Invariants asserted by this catalog (checked against the source contracts and
# the shared registries during authoring).
# -----------------------------------------------------------------------------
invariants:
  - id: every_sdlc_owner_agent_has_a_role
    statement: >-
      Every distinct owner_agent across the 31 SDLC stage contracts appears as
      an agent_id here, EXCEPT sdlc_team_lead (a Team Lead, owns the two review
      gates). 24 SDLC Agent roles result.
  - id: no_core_ability_as_agent
    statement: >-
      None of [Supervisor, Coder, Vision, Audio, Creative, Memory, Web, OS]
      appears as an agent_id. Core Abilities are referenced via uses_core_abilities.
  - id: no_team_lead_as_agent
    statement: >-
      No *_team_lead role appears as an agent_id. Team Leads orchestrate; Agents
      own stages.
  - id: uses_items_resolve_to_registries
    statement: >-
      Every uses_* token resolves to an id in the corresponding shared registry
      (or a registered alias). Unresolved tokens are listed in open_questions.
  - id: sub_agents_reference_only
    statement: >-
      sub_agents lists reference ids defined in sub_agent_roles.yaml; no Agent is
      its own sub-agent.
  - id: reviewer_not_author
    statement: >-
      reviewed_by never equals agent_id for authoring stages; review-gate owners
      are distinct from the authoring agent (no-self-approval).
  - id: one_canonical_id_per_logical_agent
    statement: >-
      A logical agent that serves more than one team has exactly ONE canonical
      agent_id; secondary team bindings are recorded inline via `also_serves` and
      any legacy per-team spelling is recorded as an `aliases` entry + an
      `alias_of` stub — never as a divergent second role (R12). Canonical example:
      skill_librarian_agent (sdlc_team + skill_governance_team; alias
      skill_librarian_agent_skill_governance).

# -----------------------------------------------------------------------------
# Distinct SDLC owner_agent -> stage(s) coverage map (from the 31 contracts).
# sdlc_team_lead (requirements_review, architecture_review) is a Team Lead, not
# an Agent, and is therefore NOT a key below.
# -----------------------------------------------------------------------------
sdlc_owner_agent_coverage:
  product_requirements_agent: [intake, requirements]
  domain_risk_agent: [domain_risk_profile]
  skill_librarian_agent: [skill_semantic_extraction]
  architecture_agent: [architecture]
  security_privacy_agent: [security_privacy_design]
  risk_agent: [premortem_fmea]
  planning_agent: [planning]
  engineering_agent: [implementation]
  code_reviewer_agent: [code_review]
  qa_agent: [test_generation, test_execution, verification_loop_bug_finding]
  security_validation_agent: [security_validation]
  supply_chain_agent: [supply_chain_sbom_license]
  agentic_safety_agent: [ai_agent_safety_evaluation]
  privacy_agent: [privacy_data_lifecycle_validation]
  contract_validation_agent: [api_contract_compatibility_validation]
  compliance_agent: [domain_regulatory_compliance_validation_if_applicable]
  data_migration_agent: [data_migration_validation_if_applicable]
  ux_accessibility_agent: [accessibility_ux_validation_if_applicable]
  performance_resilience_agent: [performance_resilience]
  cost_resource_agent: [cost_resource_governance]
  operations_readiness_agent: [backup_restore_dr_validation_if_applicable, operations_readiness]
  evidence_graph_agent: [evidence_graph_build]
  release_manager_agent: [development_completion, release_candidate]
  memory_curator_agent: [refraction_learning]

# =============================================================================
# AGENT ROLES
# =============================================================================
agents:

  # ===========================================================================
  # SDLC TEAM (team_id: sdlc_team, lead: sdlc_team_lead) — 24 Agent roles
  # ===========================================================================

  - agent_id: product_requirements_agent
    team_id: sdlc_team
    pipeline_id: sdlc_pipeline
    mission: >-
      Capture the user goal into a faithful product brief and scoped, traceable
      requirements with NFRs and acceptance criteria. Front-of-pipeline product
      ownership.
    owned_stages:
      - intake
      - requirements
    inputs:
      - USER_GOAL
      - PRODUCT_BRIEF
      - INITIAL_SCOPE
      - SUCCESS_METRICS
      - DOMAIN_PROFILE_DECISION
      - RISK_PROFILE
      - SKILL_SEMANTIC_CATALOG
    outputs:
      - PRODUCT_BRIEF
      - INITIAL_SCOPE
      - SUCCESS_METRICS
      - INTAKE_GATE_RESULT
      - REQUIREMENTS_SPEC
      - NFR_CATALOG
      - ACCEPTANCE_CRITERIA
      - REQUIREMENTS_TRACE_START
    sub_agents: []
    uses_core_abilities: [Memory, Web]
    uses_skills: [prism, prompt-fidelity, gap-audit]
    uses_tools: [artifact_writer, evidence_writer, requirements_trace_checker]
    uses_governance_profiles:
      - sdlc_pipeline_governance
      - evidence_required_policy
      - intake_scope_gate
      - requirements_acceptance_gate
    uses_audit_schemas:
      - sdlc_pipeline_evidence_schema
      - stage_gate_trace_schema
    uses_model_provider_profiles: [sdlc_reasoning_profile]
    uses_context_memory_profiles: [sdlc_run_context, requirements_context_pack]
    permissions:
      - read_user_goal_and_upstream_context
      - write_product_and_requirements_artifacts
      - write_stage_evidence_and_trace
      - emit_intake_and_requirements_gate_results
    forbidden_actions:
      - approve_own_requirements_at_the_requirements_review_gate
      - mutate_artifacts_owned_by_downstream_agents
      - alter_prism_or_verification_loop_locked_semantics
      - bypass_a_failed_blocking_gate
    blocking_conditions:
      - missing_product_goal
      - unbounded_scope
      - missing_success_metrics
      - requirements_not_traceable
      - acceptance_criteria_absent
    reviewed_by: sdlc_team_lead   # requirements_review gate (no-self-approval)

  - agent_id: domain_risk_agent
    team_id: sdlc_team
    pipeline_id: sdlc_pipeline
    mission: >-
      Select the domain profile and risk profile for the run and initialize the
      conditional-gate flags that drive which if-applicable stages activate.
    owned_stages:
      - domain_risk_profile
    inputs:
      - PRODUCT_BRIEF
      - INITIAL_SCOPE
      - SUCCESS_METRICS
    outputs:
      - DOMAIN_PROFILE_DECISION
      - RISK_PROFILE
      - CONDITIONAL_GATE_FLAGS
    sub_agents: []
    uses_core_abilities: [Memory, Web]
    uses_skills: [fermi-decompose, calibrate, gap-audit]
    uses_tools: [artifact_writer, evidence_writer]
    uses_governance_profiles:
      - domain_risk_governance
      - evidence_required_policy
      - domain_risk_profile_gate
    uses_audit_schemas:
      - domain_risk_evidence_schema
      - stage_gate_trace_schema
    uses_model_provider_profiles: [sdlc_reasoning_profile]
    uses_context_memory_profiles: [sdlc_run_context, domain_risk_context_pack]
    permissions:
      - read_product_brief_and_scope
      - select_domain_and_risk_profile
      - initialize_conditional_gate_flags
      - write_stage_evidence_and_trace
    forbidden_actions:
      - approve_own_profile_decision_as_a_review_gate
      - mutate_downstream_validation_artifacts
      - bypass_a_failed_blocking_gate
    blocking_conditions:
      - unknown_domain
      - unresolved_risk_class
      - conditional_gate_flags_uninitialized
    reviewed_by: sdlc_team_lead

  - agent_id: skill_librarian_agent
    team_id: sdlc_team
    pipeline_id: sdlc_pipeline
    mission: >-
      Produce the per-run skill semantic catalog, misuse warnings, and skill→stage
      binding proposal so the pipeline only activates skills whose semantics are
      known. Custodian of locked skill semantics (prism = divergence,
      verification-loop = bug/defect finding).
    owned_stages:
      - skill_semantic_extraction
    inputs:
      - DOMAIN_PROFILE_DECISION
      - RISK_PROFILE
      - SKILL_PACKAGES
    outputs:
      - SKILL_SEMANTIC_CATALOG
      - SKILL_MISUSE_WARNINGS
      - SKILL_STAGE_BINDING_PROPOSAL
      - SKILL_SEMANTIC_EXTRACTION_GATE_RESULT
    sub_agents:
      - skill_semantic_extractor_subagent
    uses_core_abilities: [Memory, OS]
    uses_skills: [skill-architect, gap-audit]
    uses_tools: [skill_package_reader, artifact_writer, evidence_writer]
    uses_governance_profiles:
      - skill_governance
      - skill_semantic_extraction_gate
      - evidence_required_policy
      - no_self_approval_policy
    uses_audit_schemas:
      - skill_semantic_evidence_schema
      - stage_gate_trace_schema
    uses_model_provider_profiles: [sdlc_reasoning_profile]
    uses_context_memory_profiles: [skill_semantic_context_pack]
    permissions:
      - read_skill_packages_and_domain_risk_context
      - extract_skill_semantics_and_misuse_warnings
      - propose_skill_stage_bindings
      - write_stage_evidence_and_trace
    forbidden_actions:
      - alter_prism_or_verification_loop_locked_semantics
      - bind_a_skill_to_a_stage_without_extracted_semantics
      - self_approve_its_own_binding_proposal
      - bypass_a_failed_blocking_gate
    blocking_conditions:
      - unknown_skill_semantics
      - misuse_warnings_absent
      - skill_binding_proposed_without_semantics
      - skill_semantic_confidence_below_threshold
    reviewed_by: sdlc_team_lead
    # R12: skill_librarian_agent is THE single canonical id for this logical agent across all files
    #   (team_lead_roles.yaml, team_templates.yaml, skills_registry.yaml, the SDLC stage contract, and
    #   the pipeline docs all spell it this way). The former divergent role-instance id
    #   `skill_librarian_agent_skill_governance` is recorded as an explicit alias (below) instead of a
    #   second, separately-maintained role. Its skill-governance cross-team binding is captured inline
    #   here under `also_serves` so team_id/pipeline_id on THIS entry stay single-valued (sdlc_team).
    aliases:
      - skill_librarian_agent_skill_governance   # per-team instance spelling; same logical agent (alias, not a separate role)
    also_serves:
      # Secondary cross-team binding (skill_governance_team / skill_governance_pipeline). Same agent_id;
      # listed here rather than as a divergent role so there is exactly one skill_librarian_agent.
      - team_id: skill_governance_team
        pipeline_id: skill_governance_pipeline
        instance_alias: skill_librarian_agent_skill_governance
        owned_stages:
          - skill_intake
          - skill_binding_proposal
          - skill_deprecation_update
        sub_agents:
          - skill_semantic_extractor_subagent   # parented to skill_librarian_agent
        uses_core_abilities: [Supervisor, Memory, OS, Coder, Web]
        uses_skills: [gap-audit, prism, llm-council, calibrate]
        uses_tools:
          - skill_package_reader
          - skill_binding_proposer
          - artifact_writer
          - evidence_writer
        uses_governance_profiles:
          - skill_governance_pipeline_governance
          - skill_binding_proposal_gate
          - skill_deprecation_required_gate
          - locked_semantics_enforcement_policy
          - no_self_approval_policy
          - evidence_required_policy
        uses_audit_schemas:
          - skill_governance_evidence_schema
          - skill_binding_decision_schema
          - skill_governance_trace_schema
        uses_model_provider_profiles: [skill_governance_reasoning_profile, supervisor_routing_model]
        uses_context_memory_profiles: [skill_governance_run_context, skill_registry_context_pack]
        reviewed_by: skill_runtime_safety_agent   # activation decision independent of the binding proposer (no self-approval)
    notes: >-
      Canonical, single-id shared role (R12). skill_librarian_agent owns skill_semantic_extraction on
      sdlc_team AND (via `also_serves`) skill_intake / skill_binding_proposal / skill_deprecation_update
      on skill_governance_team. The previously divergent `skill_librarian_agent_skill_governance` entry
      is now an explicit alias / secondary cross-team binding, not a separate role — so all files spell
      the agent identically. Custodian of locked skill semantics (prism = divergence, verification-loop =
      bug/defect finding). No-self-approval holds in both bindings: sdlc review-gate fallback is
      sdlc_team_lead; the skill-governance activation decision is owned by skill_runtime_safety_agent.

  - agent_id: architecture_agent
    team_id: sdlc_team
    pipeline_id: sdlc_pipeline
    mission: >-
      Generate the system architecture, capture every major decision as an ADR,
      and ensure NFR/requirement coverage. Authoring stage; reviewed downstream.
    owned_stages:
      - architecture
    inputs:
      - REQUIREMENTS_SPEC
      - NFR_CATALOG
      - ACCEPTANCE_CRITERIA
      - DOMAIN_PROFILE_DECISION
      - REQUIREMENTS_REVIEW_REPORT
    outputs:
      - ARCHITECTURE_DOC
      - SYSTEM_CONTEXT_DIAGRAM
      - ADR_INDEX
    sub_agents:
      - api_design_subagent
      - data_model_subagent
    uses_core_abilities: [Coder, Memory, Web]
    uses_skills: [prism, llm-council, adr-builder, gap-audit, sentinel]
    uses_tools: [artifact_writer, evidence_writer, diagram_generator, repo_reader]
    uses_governance_profiles:
      - sdlc_pipeline_governance
      - evidence_required_policy
      - architecture_design_governance
      - adr_required_gate
    uses_audit_schemas:
      - architecture_evidence_schema
      - architecture_decision_trace_schema
      - stage_gate_trace_schema
    uses_model_provider_profiles: [architecture_reasoning_model]
    uses_context_memory_profiles: [architecture_context_pack]
    permissions:
      - read_requirements_and_review_context
      - author_architecture_and_adrs
      - generate_system_context_diagram
      - write_stage_evidence_and_trace
    forbidden_actions:
      - approve_own_architecture_at_the_architecture_review_gate
      - mutate_requirements_owned_by_product_requirements_agent
      - bypass_a_failed_blocking_gate
    blocking_conditions:
      - major_decision_without_adr
      - nfr_or_requirement_not_covered_by_design
    reviewed_by: sdlc_team_lead   # architecture_review gate (no-self-approval)

  - agent_id: security_privacy_agent
    team_id: sdlc_team
    pipeline_id: sdlc_pipeline
    mission: >-
      Produce the threat model, security requirements, data inventory, and
      privacy risk register from the reviewed architecture so security and
      privacy are designed in, not bolted on.
    owned_stages:
      - security_privacy_design
    inputs:
      - ARCHITECTURE_DOC
      - SYSTEM_CONTEXT_DIAGRAM
      - ADR_INDEX
      - ARCHITECTURE_REVIEW_REPORT
      - REQUIREMENTS_SPEC
      - NFR_CATALOG
      - DOMAIN_PROFILE_DECISION
      - RISK_PROFILE
    outputs:
      - THREAT_MODEL
      - SECURITY_REQUIREMENTS
      - DATA_INVENTORY
      - PRIVACY_RISK_REGISTER
      - SECURITY_PRIVACY_DESIGN_GATE_RESULT
    sub_agents:
      - threat_modeling_subagent
    uses_core_abilities: [Memory, Web, Coder]
    uses_skills: [sentinel, fmea, gap-audit]
    uses_tools: [repo_reader, policy_query, artifact_writer, evidence_writer]
    uses_governance_profiles:
      - sdlc_pipeline_governance
      - no_self_approval_policy
      - evidence_required_policy
      - privacy_lifecycle_governance
      - security_privacy_governance
      - threat_model_required_gate
    uses_audit_schemas:
      - threat_model_evidence_schema
      - privacy_evidence_schema
      - stage_gate_trace_schema
    uses_model_provider_profiles: [security_analysis_model]
    uses_context_memory_profiles: [security_context_pack]
    permissions:
      - read_architecture_and_review_context
      - author_threat_model_and_security_requirements
      - author_data_inventory_and_privacy_risk_register
      - write_stage_evidence_and_trace
    forbidden_actions:
      - self_approve_its_own_threat_model_as_the_validation_gate
      - mutate_architecture_owned_by_architecture_agent
      - bypass_a_failed_blocking_gate
    blocking_conditions:
      - threat_model_absent
      - unaddressed_critical_security_or_privacy_risk
    reviewed_by: security_validation_agent

  - agent_id: risk_agent
    team_id: sdlc_team
    pipeline_id: sdlc_pipeline
    mission: >-
      Run premortem and FMEA over the architecture, threat model, and privacy
      register; produce the risk register with owned mitigations and no
      unaccepted critical risk.
    owned_stages:
      - premortem_fmea
    inputs:
      - ARCHITECTURE_DOC
      - ADR_INDEX
      - THREAT_MODEL
      - PRIVACY_RISK_REGISTER
      - SECURITY_REQUIREMENTS
    outputs:
      - SENTINEL_PREMORTEM
      - FMEA_RISK_REGISTER
    sub_agents: []
    uses_core_abilities: [Memory]
    uses_skills: [sentinel, prism, fmea, gap-audit]
    uses_tools: [evidence_reader, artifact_writer, evidence_writer]
    uses_governance_profiles:
      - sdlc_pipeline_governance
      - risk_review_governance
      - fmea_required_gate
      - no_self_approval_policy
      - evidence_required_policy
    uses_audit_schemas:
      - risk_register_schema
      - premortem_evidence_schema
      - stage_gate_trace_schema
    uses_model_provider_profiles: [sdlc_reasoning_profile]
    uses_context_memory_profiles: [architecture_context_pack]
    permissions:
      - read_architecture_threat_and_privacy_artifacts
      - author_premortem_and_fmea_risk_register
      - assign_mitigation_owners
      - write_stage_evidence_and_trace
    forbidden_actions:
      - self_approve_its_own_risk_acceptance
      - mutate_threat_model_owned_by_security_privacy_agent
      - bypass_a_failed_blocking_gate
    blocking_conditions:
      - unaccepted_critical_risk
      - missing_mitigation_owner
      - failure_mode_not_traced_to_architecture
    reviewed_by: sdlc_team_lead

  - agent_id: planning_agent
    team_id: sdlc_team
    pipeline_id: sdlc_pipeline
    mission: >-
      Decompose the reviewed design and risk picture into an implementation plan,
      task breakdown, and complete executor handoff packets where every task
      traces to a requirement.
    owned_stages:
      - planning
    inputs:
      - REQUIREMENTS_SPEC
      - NFR_CATALOG
      - ACCEPTANCE_CRITERIA
      - ARCHITECTURE_DOC
      - ADR_INDEX
      - THREAT_MODEL
      - SECURITY_REQUIREMENTS
      - SENTINEL_PREMORTEM
      - FMEA_RISK_REGISTER
    outputs:
      - IMPLEMENTATION_PLAN
      - TASK_BREAKDOWN
      - HANDOFF_PACKETS
      - EXECUTOR_WORKPACKAGE_DRAFTS
    sub_agents: []
    uses_core_abilities: [Supervisor, Memory, Coder]
    uses_skills: [fermi-decompose, prism, gap-audit, handoff-designer, context-pack-builder]
    uses_tools: [evidence_reader, requirements_trace_checker, artifact_writer, evidence_writer]
    uses_governance_profiles:
      - sdlc_pipeline_governance
      - evidence_required_policy
      - planning_handoff_completeness_gate
    uses_audit_schemas:
      - sdlc_pipeline_evidence_schema
      - stage_gate_trace_schema
    uses_model_provider_profiles: [sdlc_reasoning_profile]
    uses_context_memory_profiles:
      - sdlc_run_context
      - requirements_context_pack
      - architecture_context_pack
      - implementation_context_pack
    permissions:
      - read_requirements_architecture_and_risk_artifacts
      - author_plan_breakdown_and_handoff_packets
      - seed_implementation_context_pack
      - write_stage_evidence_and_trace
    forbidden_actions:
      - author_the_code_changeset_itself
      - approve_own_plan_as_a_review_gate
      - bypass_a_failed_blocking_gate
    blocking_conditions:
      - task_not_traceable_to_a_requirement
      - incomplete_handoff_packet
    reviewed_by: sdlc_team_lead

  - agent_id: engineering_agent
    team_id: sdlc_team
    pipeline_id: sdlc_pipeline
    mission: >-
      Author the code changeset for the planned scope, run baseline local build /
      smoke verification, and emit the if-applicable downstream signals (data
      model, migrations, API contracts, UI, resource usage, tool/context policy).
    owned_stages:
      - implementation
    inputs:
      - IMPLEMENTATION_PLAN
      - TASK_BREAKDOWN
      - HANDOFF_PACKETS
    outputs:
      - CODE_CHANGESET_SUMMARY
      - IMPLEMENTATION_NOTES
      - LOCAL_BUILD_RESULT
      - DATA_MODEL_CHANGE_REPORT_IF_APPLICABLE
      - MIGRATION_FILES_IF_APPLICABLE
      - API_CONTRACTS_IF_APPLICABLE
      - UI_CHANGESET_SUMMARY_IF_APPLICABLE
      - RESOURCE_USAGE_DATA_IF_APPLICABLE
      - TOOL_PERMISSION_MAP
      - CONTEXT_POLICY
    sub_agents: []
    uses_core_abilities: [Coder, Memory, OS]
    uses_skills: [context-pack-builder, gap-audit]
    uses_tools: [repo_reader, repo_writer, test_runner, artifact_writer, evidence_writer]
    uses_governance_profiles:
      - sdlc_pipeline_governance
      - evidence_required_policy
      - implementation_governance
      - no_out_of_scope_change_gate
    uses_audit_schemas:
      - implementation_evidence_schema
      - code_change_trace_schema
      - stage_gate_trace_schema
    uses_model_provider_profiles: [coder_engineering_model]
    uses_context_memory_profiles: [implementation_context_pack]
    permissions:
      - read_plan_and_existing_code
      - author_code_changeset_via_repo_writer
      - run_baseline_local_build_and_smoke_tests
      - write_stage_evidence_and_trace
    forbidden_actions:
      - approve_own_changeset_at_code_review_or_bug_finding_gates
      - make_out_of_scope_changes_beyond_the_plan
      - bypass_a_failed_blocking_gate
    blocking_conditions:
      - out_of_scope_change_detected
      - local_build_broken
    reviewed_by: code_reviewer_agent

  - agent_id: code_reviewer_agent
    team_id: sdlc_team
    pipeline_id: sdlc_pipeline
    mission: >-
      Independently review the changeset against requirements, architecture, and
      security requirements; calibrate finding severity; gate on review pass.
      Distinct from the changeset author (no-self-approval).
    owned_stages:
