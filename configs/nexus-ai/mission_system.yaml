# Nexus AI Orchestration Model — Mission System
#
# Scope: blueprint/config only. No runtime implementation is authorized by this file.

mission_system_id: nexus_ai_mission_system
mission_system_version: draft-0.1
status: draft
scope: blueprint_only
no_runtime_code_authorized: true
no_plugin: true

purpose: >-
  Define Mission as the user-facing managed work container that can own one or more Pipeline Runs,
  teams, shared state, validation contracts, handoffs, Mission Control and analytics.
  Product delivery lifecycle is owned by main_product_pipeline; Mission is the container that
  holds the conversation, approvals, selected pipeline runs, evidence and trace.

position_in_model:
  top_structure: nexus_ai_orchestration_model
  concept_family: mission_system
  mission_is_not_pipeline_run: true
  mission_is_not_single_agent_session: true
  plain_language: >-
    A Mission is the managed work created from a user goal. Product work follows
    main_product_pipeline after owner-approved entry; Pipeline Runs execute inside the Mission.

user_facing_names:
  mission: Çalışma
  mission_control: Çalışma Merkezi
  mission_orchestrator: Süreç Yöneticisi
  worker: Üreten Uzman
  validator: Kontrol Uzmanı
  validation_contract: Başarı Kriterleri
  structured_handoff: Teslim Raporu
  mission_shared_state: Ortak Çalışma Durumu
  serial_execution: Sıralı Çalışma
  parallel_execution: Paralel Yardımcı Çalışma
  mission_analytics: Çalışma Özeti
  continuous_learning: Öğrenme ve İyileştirme

pipeline_lifecycle_boundary:
  product_lifecycle_owner: main_product_pipeline
  mission_role: managed_user_work_container
  note: >-
    Do not introduce a separate Mission Lifecycle as the product journey. Mission lifecycle below is
    container state only: conversation, approval, execution tracking, validation, completion and learning.

mission_lifecycle:
  - mission_intake
  - mission_scoping
  - mission_plan
  - validation_contract_authoring
  - owner_plan_approval
  - mission_execution
  - mission_validation_loop
  - mission_control_monitoring
  - mission_completion_decision
  - mission_learning

mission_user_flow:
  - describe_goal
  - scope_through_conversation
  - approve_plan
  - mission_handles_execution

pre_pipeline_idea_handling:
  owner: mission_orchestrator
  before_pipeline_run: true
  applies_when:
    - user_appears_to_be_discussing_a_raw_or_partially_mature_idea_or_work_intent
    - user_asks_whether_an_idea_is_worth_building
    - user_compares_solution_directions_before_committing_to_build
  required_behavior:
    - inform_user_that_nexus_detected_an_idea_and_is_maturing_it_before_pipeline_entry
    - interactively_mature_the_idea_until_problem_scope_value_risk_and_success_criteria_are_clear_enough
    - summarize_the_matured_intent_and_remaining_risks
    - recommend_the_best_matching_pipeline_for_the_matured_intent
    - ask_for_owner_approval_before_starting_the_selected_pipeline
  handoff_to_pipeline:
    pipeline_id: selected_pipeline_after_maturation
    allowed_pipeline_ids:
      - main_product_pipeline
      - product_discovery_pipeline
      - research_pipeline
      - activation_pipeline
      - operations_pipeline
      - skill_governance_pipeline
      - knowledge_memory_pipeline
      - sdlc_pipeline
      - content_pipeline
      - data_processing_pipeline
      - model_inference_pipeline
      - customer_support_pipeline
      - business_strategy_pipeline
    required_inputs:
      - OWNER_APPROVAL_RECORD
      - IDEA_MATURITY_ASSESSMENT
      - MATURED_INTENT_BRIEF
  mature_idea_policy:
    - selected_pipeline_may_recheck_maturity
    - mature_idea_must_not_be_forced_through_extra_discovery
    - product_building_idea_routes_to_main_product_pipeline
    - research_idea_routes_to_research_pipeline
    - operations_idea_routes_to_operations_pipeline
    - activation_idea_routes_to_activation_pipeline
    - skill_change_idea_routes_to_skill_governance_pipeline
    - memory_or_knowledge_idea_routes_to_knowledge_memory_pipeline
    - content_idea_routes_to_content_pipeline
    - data_processing_idea_routes_to_data_processing_pipeline
    - model_inference_idea_routes_to_model_inference_pipeline
    - customer_support_idea_routes_to_customer_support_pipeline
    - business_strategy_idea_routes_to_business_strategy_pipeline
    - ambiguous_idea_returns_to_owner_choice_with_candidates

mission_required_fields:
  - mission_id
  - mission_goal
  - user_visible_title
  - mission_scope
  - assumptions
  - constraints
  - owner_decisions
  - mission_plan
  - milestones
  - features
  - selected_pipelines
  - pipeline_runs
  - assigned_teams
  - mission_orchestrator
  - workers
  - validators
  - validation_contract
  - mission_shared_state
  - structured_handoffs
  - mission_control_view
  - mission_analytics
  - evidence_index
  - trace_timeline
  - risk_register
  - open_issues
  - completion_decision
  - learning_record

three_role_architecture:
  orchestrator:
    technical_role: mission_orchestrator
    user_facing_name: Süreç Yöneticisi
    not_core_ability_supervisor: true
    responsibilities:
      - scope_goal
      - create_plan
      - know_available_main_specialist_and_blueprint_pipelines_after_integration
      - route_or_redirect_work_to_the_best_matching_pipeline_when_needed
      - maintain_validation_contract
      - spawn_workers_and_validators
      - review_handoffs
      - accept_reject_or_rescope_work
      - update_shared_state
      - request_owner_decisions
      - protect_serial_first_scheduling
      - summarize_progress
    post_integration_pipeline_routing_rule:
      status: post_integration_required
      catalog_source: configs/nexus-ai/pipeline_catalog.yaml
      selection_contract: configs/nexus-ai/pipeline_selection_contract.yaml
      required_behavior:
        - know_all_available_main_specialist_and_blueprint_pipeline_ids
        - evaluate_matured_intent_against_pipeline_selection_rules
        - redirect_to_the_more_appropriate_pipeline_when_needed
        - preserve_owner_visible_rationale_and_required_owner_approval
      forbidden_behavior:
        - assume_every_idea_belongs_to_main_product_pipeline
        - silently_route_or_switch_pipeline_without_trace
  workers:
    user_facing_name: Üreten Uzmanlar
    responsibilities:
      - implement_features
      - produce_artifacts
      - perform_scoped_research
      - write_handoff_reports
      - avoid_self_approval
  validators:
    user_facing_name: Kontrol Uzmanları
    adversarial_by_design: true
    fresh_context_where_practical: true
    responsibilities:
      - validate_against_validation_contract
      - run_checks
      - perform_adversarial_review
      - simulate_user_flows
      - report_findings
      - return_findings_to_orchestrator

mission_shared_state:
  not_shared_registry: true
  plain_language: Mission Shared State is what is happening in this Mission; Shared Registry is what exists in the system.
  candidate_files:
    - mission.json
    - mission-plan.md
    - features.json
    - milestones.json
    - handoffs.jsonl
    - validation-contract.md
    - progress-log.jsonl
    - issues.jsonl
    - decisions.md
    - evidence-index.json
    - trace-index.json
    - agent-skills.json
    - model-role-map.json

mission_completion_states:
  - completed
  - completed_with_accepted_risk
  - blocked
  - needs_owner_decision
  - needs_rework
  - cancelled
  - superseded

completion_requires:
  - validation_contract_status
  - required_gate_rollup
  - handoff_summary
  - evidence_index
  - trace_timeline
  - open_risks
  - owner_decisions
  - learning_record

pipeline_relationship:
  mission_can_own_multiple_pipeline_runs: true
  examples:
    - mission: Build AI-assisted decision-tracking SaaS
      pipeline_runs:
        - main_product_pipeline_run
        - delegated_research_pipeline_run_if_needed
        - delegated_sdlc_pipeline_run
        - delegated_activation_pipeline_run_if_requested
        - delegated_operations_pipeline_run_if_needed
        - delegated_knowledge_memory_pipeline_run
        - delegated_content_pipeline_run_if_needed
        - delegated_data_processing_pipeline_run_if_needed
        - delegated_model_inference_pipeline_run_if_needed
        - delegated_customer_support_pipeline_run_if_needed
        - delegated_business_strategy_pipeline_run_if_needed

stop_rule:
  runtime_implementation_requires_separate_owner_approval: true
  forbidden_without_approval:
    - runtime_implementation
    - product_refactor
    - connector_integration
    - nexus_publish
    - deploy
    - main_branch_merge
    - plugin_registry
    - production_readiness_claim
