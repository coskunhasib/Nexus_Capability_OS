# Nexus AI — Shared Registry: Model / Provider Profiles
# Phase C / doc 17 (17-shared-registry-formalization-plan.md §9).
#
# Scope: this file is the machine-readable Model / Provider Profiles registry — the
# single answer to "which model/provider/inference profiles exist in Nexus AI?".
# It is a documentation/blueprint artifact. NO runtime code, NO merge, NO deploy.
#
# A Model / Provider Profile names the model, provider, and inference behaviour used by a
# Core Ability or by a pipeline role/stage. It is NOT a Core Ability, NOT an Agent, NOT a
# team member, NOT a Skill, NOT a Tool. Core Abilities [Supervisor, Coder, Vision, Audio,
# Creative, Memory, Web, OS] *consume* these profiles; they are never listed here as items.
#
# Item contract (doc 17 §3) — every item carries:
#   id, name, type, status, purpose, owner_domain, allowed_usage, forbidden_usage,
#   governance_profiles, audit_schemas, notes
# plus the category-specific fields (doc 17 §9):
#   used_by, provider_type, model_family, capability_scope, resource_limits, fallback_policy
# plus (doc 17 §13) used_by so the usage-mapping rule is enforceable from registry data,
# and (where applicable) aliases for reconciled *_policy / *_model / *_profile name variants.
#
# STATUS vocabulary:
#   canonical   — locked/established (the 8 SDLC model/provider profiles).
#   candidate   — referenced by a pipeline/stage but not yet ratified (the new pipeline profiles).
#   deprecated  — superseded; kept only for traceability.
#
# SOURCES SCANNED:
#   - configs/nexus-ai/stages/sdlc/*.yaml (31 SDLC stage contracts; uses_model_provider_profiles
#     + inline NON-CANONICAL reconciliation annotations) — authoritative per-stage used_by.
#   - configs/nexus-ai/sdlc_pipeline.yaml (pipeline-level uses_model_provider_profiles).
#   - docs/ai-sdlc-factory/08-sdlc-pipeline-contract.md §uses_model_provider_profiles.
#   - docs/ai-sdlc-factory/TRACEABILITY_OVERVIEW.md §7.6 (canonical 8-profile registry + the
#     19 finer-grained legacy names that collapse onto the canonical set).
#   - docs/ai-sdlc-factory/01-nexus-ai-operating-model.md §11 (Core Ability -> profile binding).
#   - docs/ai-sdlc-factory/05-shared-registry-and-usage-mapping.md §11.
#   - docs/ai-sdlc-factory/pipeline-catalog/{research,activation,operations,skill-governance,
#     knowledge-memory}.md (markdown = authoritative per pipeline-catalog-review F-1) and
#     configs/nexus-ai/pipeline_catalog.yaml definition_contract blocks (divergent YAML variants
#     recorded under aliases per F-1).
#   - docs/ai-sdlc-factory/reviews/pipeline-catalog-review.md §4.4 (consolidated new profiles).
#
# LOCKED DECISIONS honoured: Plugin cancelled (no plugin profiles, ever). Core Abilities are NOT
# items here. owner_domain is a domain label, never a Core Ability. Skill != Tool, Governance !=
# Audit, Evidence != Trace.

registry_id: nexus_ai_model_provider_profiles
category: model_provider_profile
version: draft-0.1
status: draft
owner: nexus_ai_shared_registry
purpose: >-
  Canonical and candidate Model / Provider Profiles used across the Nexus AI Orchestration Model
  (SDLC pipeline + the 5 non-SDLC catalog pipelines). One profile = one named model/provider/
  inference behaviour consumed by a Core Ability or a pipeline role/stage.

naming_rules:
  case: snake_case
  note: >-
    Two suffix families occur in source: `*_reasoning_profile` (broad reasoning behaviour, often
    pipeline-wide) and `*_model` (narrower task-specialised behaviour). Both are valid Model /
    Provider Profile ids. Where a source used a divergent `*_profile`/`*_model` variant of a
    registered id, the variant is recorded under `aliases` (see doc 17 NAMING RECONCILIATION and
    pipeline-catalog-review F-1), and the markdown catalog name is treated as authoritative.

# Engine-agnostic by design: provider_type / model_family below are abstract capability classes,
# NOT vendor SKUs. Concrete vendor binding is a later (Phase E+/runtime) concern and is out of
# scope for this blueprint registry.
provider_type_vocabulary: [reasoning_llm, code_llm, vision_llm, routing_llm]

# ---------------------------------------------------------------------------------------------
# CANONICAL profiles (the locked 8). Source of truth: TRACEABILITY_OVERVIEW.md §7.6 +
# sdlc_pipeline.yaml + the 31 stage contracts.
# ---------------------------------------------------------------------------------------------
profiles:

  - id: sdlc_reasoning_profile
    name: SDLC General Reasoning Profile
    type: model_provider_profile
    status: canonical
    purpose: >-
      General-purpose SDLC reasoning and gate-decision profile for stages that are not
      code-, security-, architecture-, release-, defect- or vision-specialised.
    owner_domain: sdlc
    provider_type: reasoning_llm
    model_family: general_reasoning
    capability_scope:
      - general_reasoning
      - requirement_and_scope_analysis
      - gate_decision
      - reflection_and_calibration
    resource_limits:
      context_window: standard
      max_output_tokens: standard
      tool_use: enabled
      concurrency: pipeline_default
    fallback_policy:
      on_unavailable: queue_and_retry
      degraded_mode: none      # general reasoning has no specialised substitute; do not silently downgrade
      escalation: supervisor_routing_model
    governance_profiles:
      - sdlc_pipeline_governance
      - model_invocation_governance
    audit_schemas:
      - model_invocation_trace_schema   # TRACE: model invocation history (Evidence != Trace)
    allowed_usage:
      - general SDLC stage reasoning and gate decisions
      - post-run reflection / learning (refraction_learning)
    forbidden_usage:
      - standing in for a code/security/vision-specialised profile where one is required
      - being treated as a Core Ability, Agent, Skill or Tool
    used_by:
      pipelines: [sdlc_pipeline]
      stages:
        - intake
        - domain_risk_profile
        - skill_semantic_extraction
        - requirements
        - requirements_review
        - premortem_fmea
        - planning
        - code_review
        - api_contract_compatibility_validation
        - domain_regulatory_compliance_validation_if_applicable
        - accessibility_ux_validation_if_applicable
        - performance_resilience
        - cost_resource_governance
        - refraction_learning
      core_abilities: []
    aliases:
      # Legacy NON-CANONICAL stage model names reconciled onto sdlc_reasoning_profile
      # (per the 31 stage headers + TRACEABILITY_OVERVIEW.md §7.6).
      - planning_reasoning_model            # stage 10 planning (legacy doc 05)
      - performance_analysis_model          # stage 24 performance_resilience
      - cost_resource_analysis_model        # stage 25 cost_resource_governance
      - compliance_reasoning_model          # stage 21 (also -> security_analysis_model)
      - contract_analysis_model             # stage 20 (also -> architecture_reasoning_model)
      - ux_accessibility_model              # stage 23 (also -> vision_model)
      - learning_reflection_model           # stage 31 refraction_learning (NOTE: SAME name is a NEW operations-pipeline profile; see candidate entry + open_questions)
      - risk_reasoning_model                # TRACEABILITY_OVERVIEW §7.6 finer-grained list
    notes: >-
      Most-used canonical profile (14 SDLC stages). Many legacy finer-grained `*_analysis_model`
      names collapse onto it (see aliases). The legacy SDLC stage-31 name `learning_reflection_model`
      was reconciled HERE, but a DISTINCT candidate profile of the same name is introduced by the
      operations pipeline — these are tracked as two entries and flagged for de-duplication in
      open_questions (potential naming collision).

  - id: coder_engineering_model
    name: Coder Engineering Model
    type: model_provider_profile
    status: canonical
    purpose: >-
      Code-domain reasoning: authoring, code review, test generation/execution analysis,
      data-migration and code-level performance reasoning. The profile consumed by the Coder
      Core Ability.
    owner_domain: engineering
    provider_type: code_llm
    model_family: code_reasoning
    capability_scope:
      - code_generation
      - code_review_reasoning
      - test_authoring_and_analysis
      - migration_and_data_change_reasoning
      - code_level_performance_reasoning
    resource_limits:
      context_window: large            # large code/diff context
      max_output_tokens: large
      tool_use: enabled
      concurrency: pipeline_default
    fallback_policy:
      on_unavailable: queue_and_retry
      degraded_mode: none
      escalation: sdlc_reasoning_profile   # generic reasoning fallback for non-code-critical steps only
    governance_profiles:
      - sdlc_pipeline_governance
      - code_generation_governance
      - model_invocation_governance
    audit_schemas:
      - model_invocation_trace_schema
    allowed_usage:
      - code authoring, review, test generation/execution analysis, migration reasoning
      - consumed by the Coder Core Ability
    forbidden_usage:
      - security adjudication where security_analysis_model is required
      - being listed/used as a Core Ability, Agent, Skill or Tool
    used_by:
      pipelines: [sdlc_pipeline]
      stages:
        - implementation
        - code_review
        - test_generation
        - test_execution
        - data_migration_validation_if_applicable
        - performance_resilience
      core_abilities: [Coder]
    aliases:
      - code_review_model                   # stage 12 code_review (legacy)
      - test_generation_model               # stage 13 test_generation (legacy)
      - test_analysis_model                 # stage 14 test_execution (legacy)
      - data_migration_analysis_model       # stage 22 data_migration_validation (legacy)
    notes: >-
      Bound to the Coder Core Ability (01-nexus-ai-operating-model.md §11). Four legacy
      stage-specific model names collapse onto it (see aliases).

  - id: supervisor_routing_model
    name: Supervisor Routing Model
    type: model_provider_profile
    status: canonical
    purpose: >-
      Routing / orchestration reasoning consumed by the Supervisor Core Ability to dispatch and
      sequence work across pipelines and stages. Pipeline-level, not a per-stage analyst profile.
    owner_domain: orchestration
    provider_type: routing_llm
    model_family: routing_orchestration
    capability_scope:
      - task_routing
      - stage_sequencing
      - delegation_decisioning
    resource_limits:
      context_window: standard
      max_output_tokens: small        # routing decisions are compact
      tool_use: enabled
      concurrency: high               # routes many flows
    fallback_policy:
      on_unavailable: queue_and_retry
      degraded_mode: conservative_routing   # prefer safe/no-op routing over speculative dispatch
      escalation: human_owner               # routing failure is orchestration-critical
    governance_profiles:
      - global_governance
      - model_invocation_governance
    audit_schemas:
      - model_invocation_trace_schema
    allowed_usage:
      - Supervisor Core Ability routing and orchestration across all pipelines
    forbidden_usage:
      - being treated as a team_lead (Supervisor is a Core Ability, NOT any *_team_lead)
      - performing domain analysis it does not own (it routes, it does not adjudicate artifacts)
    used_by:
      pipelines:
        - sdlc_pipeline
        - research_pipeline
        - activation_pipeline
        - operations_pipeline
        - skill_governance_pipeline
        - knowledge_memory_pipeline
      stages: []                       # pipeline-level routing, not a single stage
      core_abilities: [Supervisor]
    aliases: []
    notes: >-
      Bound to the Supervisor Core Ability. Reused (not re-owned) by all 5 new catalog pipelines —
      each markdown catalog entry lists it under uses_model_provider_profiles as an EXISTING shared
      profile (research §297-300; knowledge-memory §305-309). Supervisor != team_lead is preserved.

  - id: architecture_reasoning_model
    name: Architecture Reasoning Model
    type: model_provider_profile
    status: canonical
    purpose: >-
      Architecture / interface / contract design reasoning and option trade-off analysis.
    owner_domain: architecture
    provider_type: reasoning_llm
    model_family: architecture_reasoning
    capability_scope:
      - architecture_option_reasoning
      - interface_and_contract_design
      - trade_off_analysis
    resource_limits:
      context_window: large
      max_output_tokens: standard
      tool_use: enabled
      concurrency: pipeline_default
    fallback_policy:
      on_unavailable: queue_and_retry
      degraded_mode: none
      escalation: sdlc_reasoning_profile
    governance_profiles:
      - sdlc_pipeline_governance
      - model_invocation_governance
    audit_schemas:
      - model_invocation_trace_schema
    allowed_usage:
      - architecture design/review and API/contract compatibility reasoning
    forbidden_usage:
      - code authoring where coder_engineering_model is the correct profile
      - being listed/used as a Core Ability, Agent, Skill or Tool
    used_by:
      pipelines: [sdlc_pipeline]
      stages:
        - architecture
        - architecture_review
        - api_contract_compatibility_validation
      core_abilities: []
    aliases:
      - architecture_review_model           # TRACEABILITY_OVERVIEW §7.6 finer-grained list
    notes: >-
      Used by both architecture stages and (paired with sdlc_reasoning_profile) by API contract
      compatibility validation. Legacy `contract_analysis_model` partly reconciled here (also onto
      sdlc_reasoning_profile).

  - id: security_analysis_model
    name: Security Analysis Model
    type: model_provider_profile
    status: canonical
    purpose: >-
      Security / privacy / adversarial-safety / regulatory-control reasoning across the SDLC
      security and validation surfaces.
    owner_domain: security
    provider_type: reasoning_llm
    model_family: security_reasoning
    capability_scope:
      - threat_and_privacy_reasoning
      - supply_chain_and_sbom_reasoning
      - adversarial_safety_reasoning
      - regulatory_control_judgement
    resource_limits:
      context_window: large
      max_output_tokens: standard
      tool_use: enabled
      concurrency: pipeline_default
    fallback_policy:
      on_unavailable: queue_and_retry
      degraded_mode: none        # security reasoning must not silently downgrade
      escalation: human_owner    # security-critical: escalate rather than degrade
    governance_profiles:
      - sdlc_pipeline_governance
      - security_validation_gate
      - model_invocation_governance
    audit_schemas:
      - model_invocation_trace_schema
    allowed_usage:
      - security/privacy design, security validation, supply-chain, agentic-safety, regulatory reasoning
    forbidden_usage:
      - substituting for defect_analysis_model on pure bug/defect sweeps where that profile is required
      - being listed/used as a Core Ability, Agent, Skill or Tool
    used_by:
      pipelines: [sdlc_pipeline]
      stages:
        - security_privacy_design
        - security_validation
        - supply_chain_sbom_license
        - ai_agent_safety_evaluation
        - privacy_data_lifecycle_validation
        - domain_regulatory_compliance_validation_if_applicable
      core_abilities: []
    aliases:
      - security_reasoning_model            # TRACEABILITY_OVERVIEW §7.6 finer-grained list
      - supply_chain_analysis_model         # stage 17 supply_chain_sbom_license (legacy)
      - agentic_safety_eval_model           # stage 18 (legacy; also -> defect_analysis_model)
      - privacy_analysis_model              # stage 19 privacy_data_lifecycle_validation (legacy)
      - compliance_reasoning_model          # stage 21 (legacy; also -> sdlc_reasoning_profile)
    notes: >-
      Broadest security profile; absorbs five legacy stage-specific security/privacy/compliance
      model names (see aliases). On stage 18 it pairs with defect_analysis_model.

  - id: release_reasoning_model
    name: Release Reasoning Model
    type: model_provider_profile
    status: canonical
