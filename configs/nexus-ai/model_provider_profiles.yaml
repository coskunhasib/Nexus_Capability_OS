        - ai_agent_safety_evaluation
      core_abilities: []
    aliases: []
    notes: >-
      Defect-specialised; on stage 18 it pairs with security_analysis_model. The incident-triage
      candidate profile (operations pipeline) overlaps this profile — see that entry's overlap note.

  - id: vision_model
    name: Vision Model
    type: model_provider_profile
    status: canonical
    purpose: >-
      Visual reasoning over rendered UI for accessibility/UX validation. The profile consumed by
      the Vision Core Ability.
    owner_domain: vision
    provider_type: vision_llm
    model_family: vision_reasoning
    capability_scope:
      - visual_ui_reasoning
      - accessibility_visual_assessment
    resource_limits:
      context_window: standard
      max_output_tokens: standard
      tool_use: enabled
      image_input: enabled
      concurrency: pipeline_default
    fallback_policy:
      on_unavailable: queue_and_retry
      degraded_mode: none        # no non-visual substitute for visual a11y assessment
      escalation: sdlc_reasoning_profile
    governance_profiles:
      - sdlc_pipeline_governance
      - model_invocation_governance
    audit_schemas:
      - model_invocation_trace_schema
    allowed_usage:
      - visual accessibility / UX reasoning over rendered UI (consumed by Vision Core Ability)
    forbidden_usage:
