        - evidence_graph_build
        - development_completion
        - release_candidate
      core_abilities: []
    aliases:
      - operations_analysis_model           # stages 26 & 27 (legacy SDLC reconciliation). NOTE: SAME name is a NEW operations-pipeline profile; see candidate entry + open_questions.
      - evidence_graph_model                # stage 28 evidence_graph_build (legacy; dropped/reconciled)
    notes: >-
      Used by the five release/operations-readiness SDLC stages. The legacy SDLC name
      `operations_analysis_model` was reconciled HERE (stages 26/27), but the operations pipeline
      introduces a DISTINCT candidate profile of the same name — flagged for de-duplication in
      open_questions (naming collision).

  - id: defect_analysis_model
    name: Defect Analysis Model
    type: model_provider_profile
    status: canonical
    purpose: >-
      Bug/defect-finding reasoning for the verification loop and adversarial defect sweeps
