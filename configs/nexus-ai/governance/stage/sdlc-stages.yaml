        required_when: always
        pass_condition: development_completion_pass == true
        fail_condition: development_completion_not_passed
        on_fail: development_completion
        rework_route: development_completion
        evidence_required: [sdlc_pipeline_evidence_schema]
        trace_required: [stage_gate_trace_schema]
      - rule_id: release_candidate_evidence_complete
        description: Every required (and applicable-conditional) release evidence item must be present.
        severity: blocker
        required_when: always
        pass_condition: release_candidate_evidence_complete == true
        fail_condition: incomplete_release_evidence
        on_fail: development_completion
        rework_route: development_completion
        evidence_required: [sdlc_pipeline_evidence_schema]
        trace_required: [stage_gate_trace_schema]
      - rule_id: release_evidence_internally_consistent
        description: The sealed release package must agree with the evidence graph / traceability matrix.
        severity: blocker
        required_when: always
        pass_condition: release_evidence_internally_consistent == true
        fail_condition: release_evidence_inconsistent
        on_fail: development_completion
        rework_route: development_completion
        evidence_required: [sdlc_pipeline_evidence_schema]
        trace_required: [stage_gate_trace_schema]
      - rule_id: release_candidate_no_blocking_policy_failure
