        severity: blocker
        required_when: stage_applicable == true
        pass_condition: gate_decision_has_evidence_record == true
        fail_condition: gate_decision_without_evidence
        on_fail: planning
        rework_route: planning
        evidence_required: [backup_restore_evidence_schema, dr_validation_schema, rollback_validation_schema]
        trace_required: [stage_gate_trace_schema]

