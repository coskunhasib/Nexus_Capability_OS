    escalation:
      gate_failure: sdlc_team_lead
      policy_bypass_attempt: policy_and_evidence_engine
    rules:
      - rule_id: code_changes_present
        description: A non-empty code changeset must be present.
        severity: blocker
        required_when: always
        pass_condition: code_changes_present == true
        fail_condition: no_code_changes_present
        on_fail: implementation
        rework_route: implementation
        evidence_required: [implementation_evidence_schema]
        trace_required: [code_change_trace_schema, stage_gate_trace_schema]
      - rule_id: implementation_scope_clean
        description: The changeset must stay within the planned scope.
        severity: blocker
        required_when: always
        pass_condition: implementation_scope_clean == true
        fail_condition: out_of_scope_change
        on_fail: implementation
        rework_route: implementation
        evidence_required: [implementation_evidence_schema]
        trace_required: [code_change_trace_schema, stage_gate_trace_schema]
      - rule_id: no_out_of_scope_changes
        description: No changes outside the planned scope are permitted.
        severity: blocker
        required_when: always
        pass_condition: no_out_of_scope_changes == true
        fail_condition: out_of_scope_change
        on_fail: implementation
        rework_route: implementation
        evidence_required: [implementation_evidence_schema]
        trace_required: [code_change_trace_schema, stage_gate_trace_schema]
      - rule_id: local_build_pass
        description: The local build must pass.
        severity: blocker
        required_when: always
        pass_condition: local_build_pass == true
        fail_condition: local_build_failure
        on_fail: implementation
        rework_route: implementation
        evidence_required: [implementation_evidence_schema]
        trace_required: [code_change_trace_schema, stage_gate_trace_schema]
      - rule_id: implementation_evidence_required
        description: No implementation gate may pass without an implementation evidence record.
        severity: blocker
        required_when: always
        pass_condition: gate_decision_has_evidence_record == true
        fail_condition: gate_decision_without_evidence
        on_fail: implementation
        rework_route: implementation
        evidence_required: [implementation_evidence_schema]
        trace_required: [code_change_trace_schema, stage_gate_trace_schema]

