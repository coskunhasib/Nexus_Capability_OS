        description: API contract compatibility must pass when an API/public interface changed (conditional re-check at RC).
        severity: blocker
        required_when: api_changed == true or public_interface_changed == true
        pass_condition: api_contract_compatibility_pass_if_applicable == true
        fail_condition: incomplete_release_evidence
        on_fail: development_completion
        rework_route: development_completion
        evidence_required: [sdlc_pipeline_evidence_schema]
        trace_required: [stage_gate_trace_schema]
      - rule_id: release_candidate_data_migration_pass_if_applicable
        description: Data migration must pass when the data model or migration changed (conditional re-check at RC).
        severity: blocker
        required_when: data_model_changed == true or migration_changed == true
        pass_condition: data_migration_pass_if_applicable == true
        fail_condition: incomplete_release_evidence
        on_fail: development_completion
        rework_route: development_completion
        evidence_required: [sdlc_pipeline_evidence_schema]
        trace_required: [stage_gate_trace_schema]
      - rule_id: release_candidate_backup_restore_dr_pass_if_applicable
        description: Backup/restore/DR must pass when persistent data or a stateful service is present (conditional re-check at RC).
        severity: blocker
        required_when: persistent_data == true or stateful_service == true
        pass_condition: backup_restore_dr_pass_if_applicable == true
        fail_condition: incomplete_release_evidence
        on_fail: development_completion
        rework_route: development_completion
        evidence_required: [sdlc_pipeline_evidence_schema]
        trace_required: [stage_gate_trace_schema]
      - rule_id: release_candidate_accessibility_pass_if_applicable
        description: Accessibility must pass when the product has a UI (conditional re-check at RC; major severity per stage contract).
        severity: major
        required_when: product_has_ui == true
        pass_condition: accessibility_pass_if_applicable == true
        fail_condition: incomplete_release_evidence
        on_fail: development_completion
        rework_route: development_completion
        evidence_required: [sdlc_pipeline_evidence_schema]
        trace_required: [stage_gate_trace_schema]
      - rule_id: release_candidate_cost_resource_pass_if_applicable
        description: Cost/resource governance must pass when a resource/cost budget is defined (conditional re-check at RC; major severity per stage contract).
        severity: major
        required_when: resource_or_cost_budget_defined == true
