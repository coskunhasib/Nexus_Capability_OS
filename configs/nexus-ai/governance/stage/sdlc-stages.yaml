        pass_condition: producer_agent_id != approver_agent_id
        fail_condition: self_approval_detected
        on_fail: development_completion
        rework_route: development_completion
        evidence_required: [sdlc_pipeline_evidence_schema]
        trace_required: [stage_gate_trace_schema]
      - rule_id: release_candidate_evidence_required
        description: The release-candidate decision must be backed by an SDLC evidence record.
        severity: blocker
        required_when: always
        pass_condition: gate_decision_has_evidence_record == true
        fail_condition: gate_decision_without_evidence
        on_fail: development_completion
        rework_route: development_completion
        evidence_required: [sdlc_pipeline_evidence_schema]
        trace_required: [stage_gate_trace_schema]

  # ---------------------------------------------------------------------------
  # Stage 31 — refraction_learning  (always-on; binds no_self_approval; non-blocking self-completeness)
  # on_fail: refraction_learning ; rework_route: refraction_learning ; on_pass: done
  # NOTE: blocking_conditions is empty in the stage; the single gate is treated as
  #       a non-blocking self-completeness gate (advisory) per the stage header.
  # ---------------------------------------------------------------------------
  - governance_profile_id: refraction_learning_stage_governance
    scope: stage
    purpose: >-
      Stage-scope governance for SDLC stage 31 (refraction_learning): a learning
      record must be produced over the run's evidence, and project-memory updates are
      proposals — not direct mutation (memory_update_governance). memory_curator_agent
      authors learning over OTHER stages' evidence, so the self-completeness gate is
      non-blocking (advisory); no-self-approval is bound as a standing guard.
    applies_to:
      - sdlc_stage:refraction_learning
    severity_default: advisory     # stage 31 has empty blocking_conditions; its sole gate is a non-blocking self-completeness gate
    source_governance_tokens:
      - sdlc_pipeline_governance
      - no_self_approval_policy
      - evidence_required_policy
      - learning_record_gate
      - memory_update_governance
    uses_governance_profiles:
      - sdlc_pipeline_governance
      - no_self_approval
      - evidence_required
      - learning_record_gate
      - memory_update_governance
    required_evidence:
      - sdlc_pipeline_evidence_schema
    required_trace:
      - stage_gate_trace_schema
    owner: memory_curator_agent
    escalation:
      gate_failure: sdlc_team_lead
      policy_bypass_attempt: policy_and_evidence_engine
    rules:
      - rule_id: learning_record_present
        description: A learning record must be produced over the run's evidence (non-blocking self-completeness gate — stage 31 has no blocking_conditions).
        severity: advisory
        required_when: always
        pass_condition: learning_record_present == true
        fail_condition: learning_record_absent
        on_fail: refraction_learning
        rework_route: refraction_learning
        evidence_required: [sdlc_pipeline_evidence_schema]
        trace_required: [stage_gate_trace_schema]
      - rule_id: memory_update_is_proposal_not_mutation
        description: Project-memory updates must be proposals, never direct mutation (memory_update_governance; aligns with global no_silent_mutation).
        severity: blocker
        required_when: always
        pass_condition: memory_update_is_proposal == true
        fail_condition: direct_memory_mutation_attempted
        on_fail: refraction_learning
        rework_route: refraction_learning
        evidence_required: [sdlc_pipeline_evidence_schema]
        trace_required: [stage_gate_trace_schema]
      - rule_id: refraction_learning_no_self_approval
        description: Learning authored over other stages' evidence must not be self-approved where it adjudicates another stage (producer != approver).
        severity: advisory
        required_when: always
        pass_condition: producer_agent_id != approver_agent_id
        fail_condition: self_approval_detected
        on_fail: refraction_learning
        rework_route: refraction_learning
        evidence_required: [sdlc_pipeline_evidence_schema]
        trace_required: [stage_gate_trace_schema]
      - rule_id: refraction_learning_evidence_required
        description: The learning record must be backed by an SDLC evidence record.
        severity: advisory
        required_when: always
        pass_condition: gate_decision_has_evidence_record == true
        fail_condition: gate_decision_without_evidence
        on_fail: refraction_learning
        rework_route: refraction_learning
        evidence_required: [sdlc_pipeline_evidence_schema]
        trace_required: [stage_gate_trace_schema]

