        trace_required: [stage_gate_trace_schema]
      - rule_id: no_critical_review_finding
        description: No critical code-review finding may remain.
        severity: blocker
        required_when: always
        pass_condition: no_critical_review_finding == true
        fail_condition: critical_review_finding
        on_fail: implementation
        rework_route: implementation
        evidence_required: [code_review_evidence_schema]
        trace_required: [stage_gate_trace_schema]
      - rule_id: architecture_violation_absent
        description: The changeset must not violate the approved architecture.
        severity: blocker
        required_when: always
        pass_condition: architecture_violation_absent == true
        fail_condition: architecture_violation
        on_fail: implementation
        rework_route: implementation
        evidence_required: [code_review_evidence_schema]
        trace_required: [stage_gate_trace_schema]
      - rule_id: changed_behavior_has_required_tests
        description: Changed behavior must be covered by required tests.
        severity: blocker
        required_when: always
        pass_condition: changed_behavior_has_required_tests == true
        fail_condition: missing_required_tests_for_changed_behavior
        on_fail: implementation
        rework_route: implementation
        evidence_required: [code_review_evidence_schema]
        trace_required: [stage_gate_trace_schema]
      - rule_id: code_review_pass
        description: The code review verdict must pass.
        severity: blocker
        required_when: always
