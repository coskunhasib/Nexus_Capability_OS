# =============================================================================
# Nexus AI — STAGE-SCOPE Governance Config: SDLC Stages
# =============================================================================
# Phase E / doc 19 (19-governance-audit-readiness-plan.md). Documentation /
# blueprint ONLY — NO runtime code, NO merge, NO deploy.
#
# WHAT THIS FILE IS
#   This is the *applicable* stage-scope governance LAYER for the SDLC pipeline:
#   ONE stage-scope governance profile per SDLC stage (31 stages, read from
#   configs/nexus-ai/stages/sdlc/*.yaml). The Phase C registry
#   (configs/nexus-ai/governance_profiles.yaml) is the CATALOG of *what exists*
#   (105 profiles by scope); THIS file makes the stage layer *evaluable from
#   config*: each profile carries concrete rules (doc 19 §5) derived from that
#   stage's gates + uses_governance_profiles, with on_fail / rework_route wired
#   from the stage contract. Reading these 31 profiles answers, per stage:
#   "which gates are blocking, what makes them pass/fail, where does a failure
#   route, and what evidence/trace must back the decision?" — so the SDLC
#   required gates can be evaluated from configs (doc 19 §15 exit criterion).
#
# RELATIONSHIP TO THE REGISTRY (no duplication of catalog truth)
#   - The registry lists each stage's *_governance / *_gate profile ids as the
#     catalog of what exists. Here, each of the 31 stage profiles REFERENCES
#     those registry ids in `uses_governance_profiles` (re-show under usage,
#     per the usage-mapping rule) and TURNS THEM INTO RULES. The registry id is
#     the authority for existence; this file is the authority for applicability.
#   - The two cross-cutting GLOBAL policies every stage binds are referenced by
#     their FIRST-CLASS canonical ids `no_self_approval` and `evidence_required`
#     (doc 19 reconciliation (a)); the per-stage spellings
#     `no_self_approval_policy` / `evidence_required_policy` are recorded under
#     `source_governance_tokens` on each profile as the literal stage-file token,
#     and globally under `governance_token_aliases` below. Neither spelling is
#     broken.
#
# LOCKED DECISIONS HONORED
#   - Plugin CANCELLED: no plugin concept, field, or stage anywhere.
#   - Governance != Audit: this file holds GOVERNANCE (policy/gates/risk rules)
#     only. It REFERENCES audit schema ids (required_evidence / required_trace /
#     per-rule evidence_required / trace_required) but defines NO schema here.
#   - Evidence != Trace: required_evidence draws ONLY from evidence-family schema
#     ids; required_trace draws ONLY from trace-family schema ids. They are never
#     merged. (Evidence schemas vs trace schemas also live in SEPARATE dirs:
#     configs/nexus-ai/audit/evidence_schemas/ vs .../audit/trace_schemas/.)
#   - Core Abilities are NOT agents: owner/escalation values are snake_case Agent
#     roles, the *_team_lead orchestrator, or the policy/evidence engine — NEVER
#     a Core Ability (Supervisor, Coder, Vision, Audio, Creative, Memory, Web, OS)
#     and the Supervisor is never a *_team_lead.
#   - Supervisor != team lead. prism = brainstorming/divergence;
#     verification-loop = bug/defect finding (locked semantics, not re-defined
#     here; stage 03 + stage 15 governance enforce them).
#
# CONTRACTS
#   Governance profile contract (doc 19 §4):
#     governance_profile_id, scope, purpose, applies_to, severity_default,
#     rules, required_evidence, required_trace, owner, escalation
#   Rule contract (doc 19 §5):
#     rule_id, description, severity, required_when, pass_condition,
#     fail_condition, on_fail, rework_route, evidence_required, trace_required
#
# DERIVATION METHOD (how each stage's rules were produced — auditable)
#   For every stage S in configs/nexus-ai/stages/sdlc/*.yaml:
#     1. severity_default := blocker (every SDLC stage gate is blocking unless a
#        conditional_required_gates entry declares severity: major).
#     2. One rule per ALWAYS-REQUIRED gate in S.gates that is not listed under
#        S.conditional_required_gates:
#          required_when: always
#          pass_condition: <gate> == true
#          fail_condition: derived from the matching S.blocking_conditions entry
#          severity: blocker
#     3. One rule per CONDITIONAL gate (gate appears in
#        S.conditional_required_gates):
#          required_when: copied verbatim from the stage's required_when
#          severity: copied from the stage (major where declared, else blocker)
#          pass/fail as above; when the applicability predicate is false the gate
#          is not_applicable (vacuously satisfied) — captured in required_when.
#     4. One no_self_approval rule IFF S.uses_governance_profiles lists
#        no_self_approval_policy (producer_agent_id != approver_agent_id).
#     5. One evidence_required rule (every stage binds evidence_required_policy):
#          no gate may pass without an evidence record of the right schema.
#     6. on_fail / rework_route on EVERY rule := S.on_fail / S.rework_route
#        verbatim (the stage contract is the single source of routing truth;
#        re-stated per rule so a rule is self-contained and evaluable).
#     7. required_evidence := S.uses_audit_schemas entries whose registry `type`
#        is an Evidence-family schema (evidence_schema / decision_record_schema /
#        gate_result_schema). required_trace := S.uses_audit_schemas entries
#        whose `type` is trace_schema. (Evidence != Trace, split by type.)
#     8. owner := S.owner_agent ; escalation := S.team_lead (sdlc_team_lead) then
#        the policy_and_evidence_engine for a no_policy_bypass breach (a Team Lead
#        cannot override a blocking gate — global no_policy_bypass).
#
# SEVERITY vocabulary (configs/nexus-ai/pipeline_contract_standard.yaml
#   severity_values; doc 19 §5): blocker | major | advisory | informational.
# REWORK-ROUTE values are canonical SDLC stage_ids or routing terminals
#   (done | relevant_failed_stage), validated by
#   sdlc_pipeline_runtime_rules.yaml routing_invariants.
# =============================================================================

config_id: nexus_ai_governance_stage_sdlc
config_name: Nexus AI — SDLC Stage-Scope Governance Profiles
config_version: draft-0.1
config_status: draft
scope: stage
pipeline: sdlc_pipeline
layer: stage_governance
no_plugin: true
governance_audit_separation: enforced   # Governance != Audit; Evidence != Trace
profile_count: 31

# ----- provenance ------------------------------------------------------------
canonical_sources:
  - configs/nexus-ai/stages/sdlc/*.yaml                 # 31 stage contracts: gates, uses_governance_profiles, on_fail, rework_route, conditional_required_gates (PRIMARY)
  - configs/nexus-ai/governance_profiles.yaml           # Phase C registry: the *_governance / *_gate / global profile ids referenced here
  - configs/nexus-ai/audit_schemas.yaml                 # Phase C registry: evidence-family vs trace-family schema ids (Evidence != Trace split)
  - configs/nexus-ai/sdlc_pipeline.yaml                 # SDLC pipeline-level uses_governance_profiles
  - configs/nexus-ai/sdlc_pipeline_runtime_rules.yaml   # rework_route allowlist + routing invariants + locked guards
  - configs/nexus-ai/pipeline_contract_standard.yaml    # severity_values; allowed_rework_routes
  - docs/ai-sdlc-factory/03-governance-and-audit-layering.md   # §6 stage governance (concept)
  - docs/ai-sdlc-factory/06-governance-policy-evidence.md      # canonical no_self_approval / evidence_required / no_policy_bypass
  - docs/ai-sdlc-factory/19-governance-audit-readiness-plan.md # §4 profile contract, §5 rule contract, §14 validation

# ----- closed vocabularies (doc 19 §14 validation) ---------------------------
scope_vocabulary: [global, pipeline, team, stage, core_ability, skill, tool]
severity_vocabulary: [blocker, major, advisory, informational]
rework_route_terminals: [done, relevant_failed_stage]

# ----- governance-token alias reconciliation (doc 19 reconciliation (a)) -----
# The stage files spell the two global policies with a `_policy` suffix. The
# FIRST-CLASS ids are the bare names (registered canonical in the registry); the
# suffixed spellings are aliases. Both are preserved.
governance_token_aliases:
  no_self_approval:
    canonical_id: no_self_approval
    aliases: [no_self_approval_policy]
  evidence_required:
    canonical_id: evidence_required
    aliases: [evidence_required_policy]

# ----- enforceable invariants for this layer (doc 19 §14) --------------------
config_rules:
  - Exactly one stage-scope governance profile per SDLC stage (31 total).
  - Every profile.scope == stage and every applies_to entry is a known SDLC stage_id.
  - Every rule has a severity drawn from severity_vocabulary.
  - Every blocker rule has an on_fail behavior (on_fail + rework_route) — no
    blocking rule is left without failure handling (doc 19 §14).
  - required_evidence references ONLY evidence-family audit schema ids;
    required_trace references ONLY trace-family audit schema ids (Evidence != Trace).
  - on_fail / rework_route values equal the source stage's on_fail / rework_route
    (configs/nexus-ai/stages/sdlc/*.yaml) and resolve to a canonical stage_id or
    a rework_route_terminal.
  - owner / escalation are snake_case Agent roles or sdlc_team_lead or the
    policy_and_evidence_engine — never a Core Ability; Supervisor is never a team lead.
  - No plugin concept is introduced.

# =============================================================================
# THE 31 STAGE-SCOPE GOVERNANCE PROFILES
# Ordered by SDLC stage number. Each profile id is `<stage_id>_stage_governance`.
# =============================================================================
profiles:

  # ---------------------------------------------------------------------------
  # Stage 01 — intake  (always-on)
  # source gates: product_goal_present, initial_scope_bounded, success_metrics_present
  # on_fail: intake ; rework_route: intake
  # ---------------------------------------------------------------------------
  - governance_profile_id: intake_stage_governance
    scope: stage
    purpose: >-
      Stage-scope governance for SDLC stage 01 (intake): the product goal must be
      present, the initial scope bounded, and success metrics present — backed by
      evidence — before intake hands off to domain_risk_profile. Intake authors the
      brief; it does not decide domain/risk class and does not produce requirements.
    applies_to:
      - sdlc_stage:intake
    severity_default: blocker
    source_governance_tokens:        # verbatim uses_governance_profiles from the stage file
      - sdlc_pipeline_governance
      - evidence_required_policy
      - intake_scope_gate
    uses_governance_profiles:        # registry ids re-shown under this usage (first-class spellings)
      - sdlc_pipeline_governance
      - evidence_required
      - intake_scope_gate
    required_evidence:               # evidence-family schemas only (Evidence != Trace)
      - sdlc_pipeline_evidence_schema
    required_trace:                  # trace-family schemas only
      - stage_gate_trace_schema
    owner: product_requirements_agent
    escalation:
      gate_failure: sdlc_team_lead
      policy_bypass_attempt: policy_and_evidence_engine   # no_policy_bypass: Team Lead cannot override a blocking gate
    rules:
      - rule_id: intake_product_goal_present
        description: A bounded product goal must be captured from USER_GOAL before handoff.
        severity: blocker
        required_when: always
        pass_condition: product_goal_present == true
        fail_condition: missing_product_goal
        on_fail: intake
        rework_route: intake
        evidence_required: [sdlc_pipeline_evidence_schema]
        trace_required: [stage_gate_trace_schema]
      - rule_id: intake_initial_scope_bounded
        description: In-scope vs out-of-scope must be explicitly bounded.
        severity: blocker
        required_when: always
        pass_condition: initial_scope_bounded == true
        fail_condition: unbounded_scope
        on_fail: intake
        rework_route: intake
        evidence_required: [sdlc_pipeline_evidence_schema]
        trace_required: [stage_gate_trace_schema]
      - rule_id: intake_success_metrics_present
        description: Success metrics must be present so downstream stages inherit measurable intent.
        severity: blocker
        required_when: always
        pass_condition: success_metrics_present == true
        fail_condition: missing_success_metrics
        on_fail: intake
        rework_route: intake
        evidence_required: [sdlc_pipeline_evidence_schema]
        trace_required: [stage_gate_trace_schema]
      - rule_id: intake_evidence_required
        description: No intake gate may pass without an SDLC evidence record (evidence_required, not trace).
        severity: blocker
        required_when: always
        pass_condition: gate_decision_has_evidence_record == true
        fail_condition: gate_decision_without_evidence
        on_fail: intake
        rework_route: intake
        evidence_required: [sdlc_pipeline_evidence_schema]
        trace_required: [stage_gate_trace_schema]

  # ---------------------------------------------------------------------------
  # Stage 02 — domain_risk_profile  (always-on)
  # gates: domain_profile_selected, risk_profile_selected, conditional_gate_flags_initialized
  # on_fail: intake ; rework_route: intake
  # ---------------------------------------------------------------------------
  - governance_profile_id: domain_risk_profile_stage_governance
    scope: stage
    purpose: >-
      Stage-scope governance for SDLC stage 02 (domain_risk_profile): govern the
      domain classification and risk-class decision and the initialization of the
      conditional-gate flags, so every downstream conditional gate inherits a
      governed risk class and applicability decision.
    applies_to:
      - sdlc_stage:domain_risk_profile
    severity_default: blocker
    source_governance_tokens:
      - domain_risk_governance
      - evidence_required_policy
      - domain_risk_profile_gate
    uses_governance_profiles:
      - domain_risk_governance
      - evidence_required
      - domain_risk_profile_gate
    required_evidence:
      - domain_risk_evidence_schema
    required_trace:
      - stage_gate_trace_schema
    owner: domain_risk_agent
    escalation:
      gate_failure: sdlc_team_lead
      policy_bypass_attempt: policy_and_evidence_engine
    rules:
      - rule_id: domain_profile_selected
        description: A domain profile decision must be recorded.
        severity: blocker
        required_when: always
        pass_condition: domain_profile_selected == true
        fail_condition: unknown_domain
        on_fail: intake
        rework_route: intake
        evidence_required: [domain_risk_evidence_schema]
        trace_required: [stage_gate_trace_schema]
      - rule_id: risk_profile_selected
        description: A risk class calibrating pipeline rigor must be selected.
        severity: blocker
        required_when: always
        pass_condition: risk_profile_selected == true
        fail_condition: unresolved_risk_class
        on_fail: intake
        rework_route: intake
        evidence_required: [domain_risk_evidence_schema]
        trace_required: [stage_gate_trace_schema]
      - rule_id: conditional_gate_flags_initialized
        description: All downstream conditional-gate applicability flags must be initialized.
        severity: blocker
        required_when: always
        pass_condition: conditional_gate_flags_initialized == true
        fail_condition: conditional_gate_flags_uninitialized
        on_fail: intake
        rework_route: intake
        evidence_required: [domain_risk_evidence_schema]
        trace_required: [stage_gate_trace_schema]
      - rule_id: domain_risk_evidence_required
        description: The domain/risk decision must be backed by a domain-risk evidence record.
        severity: blocker
        required_when: always
        pass_condition: gate_decision_has_evidence_record == true
        fail_condition: gate_decision_without_evidence
        on_fail: intake
        rework_route: intake
        evidence_required: [domain_risk_evidence_schema]
        trace_required: [stage_gate_trace_schema]

  # ---------------------------------------------------------------------------
  # Stage 03 — skill_semantic_extraction  (always-on)
  # binds no_self_approval_policy. Locks prism=divergence, verification-loop=bug-finding.
  # on_fail: skill_semantic_extraction ; rework_route: skill_semantic_extraction
  # ---------------------------------------------------------------------------
  - governance_profile_id: skill_semantic_extraction_stage_governance
    scope: stage
    purpose: >-
      Stage-scope governance for SDLC stage 03 (skill_semantic_extraction): no skill
      may be bound into the pipeline before its semantics are extracted and verified;
      misuse warnings must be present; and the two high-risk locked semantics are
      enforced — prism = divergence/brainstorming, verification-loop = bug/defect
      finding. The semantic extraction must be produced under no-self-approval.
    applies_to:
      - sdlc_stage:skill_semantic_extraction
    severity_default: blocker
    source_governance_tokens:
      - skill_governance
      - skill_semantic_extraction_gate
      - evidence_required_policy
      - no_self_approval_policy
    uses_governance_profiles:
      - skill_governance
      - skill_semantic_extraction_gate
      - evidence_required
      - no_self_approval
    required_evidence:
      - skill_semantic_evidence_schema
    required_trace:
      - stage_gate_trace_schema
    owner: skill_librarian_agent
    escalation:
      gate_failure: sdlc_team_lead
      policy_bypass_attempt: policy_and_evidence_engine
    rules:
      - rule_id: all_selected_skills_have_semantics
        description: Every selected skill must have an extracted semantic record before binding (no_unread_skill_binding).
        severity: blocker
        required_when: always
        pass_condition: all_selected_skills_have_semantics == true
        fail_condition: unknown_skill_semantics
        on_fail: skill_semantic_extraction
        rework_route: skill_semantic_extraction
        evidence_required: [skill_semantic_evidence_schema]
        trace_required: [stage_gate_trace_schema]
      - rule_id: misuse_warnings_present
        description: Misuse warnings must be present for the extracted skills.
        severity: blocker
        required_when: always
        pass_condition: misuse_warnings_present == true
        fail_condition: missing_misuse_warning
        on_fail: skill_semantic_extraction
        rework_route: skill_semantic_extraction
        evidence_required: [skill_semantic_evidence_schema]
        trace_required: [stage_gate_trace_schema]
      - rule_id: prism_bound_as_divergence
        description: prism must be classified as divergence/brainstorming — never as bug-finding or a readiness gate (locked semantics).
        severity: blocker
        required_when: always
        pass_condition: prism_bound_as_divergence == true
        fail_condition: prism_misclassified_as_bug_finding_or_readiness_gate
        on_fail: skill_semantic_extraction
        rework_route: skill_semantic_extraction
        evidence_required: [skill_semantic_evidence_schema]
        trace_required: [stage_gate_trace_schema]
      - rule_id: verification_loop_bound_as_bug_finding
        description: verification-loop must be classified as bug/defect finding — never as a generic readiness checklist (locked semantics).
        severity: blocker
        required_when: always
        pass_condition: verification_loop_bound_as_bug_finding == true
        fail_condition: verification_loop_misclassified_as_readiness_checklist
        on_fail: skill_semantic_extraction
        rework_route: skill_semantic_extraction
        evidence_required: [skill_semantic_evidence_schema]
        trace_required: [stage_gate_trace_schema]
      - rule_id: skill_stage_binding_proposed
        description: A skill-to-stage binding proposal must be produced.
        severity: blocker
        required_when: always
        pass_condition: skill_stage_binding_proposed == true
        fail_condition: skill_stage_binding_missing
        on_fail: skill_semantic_extraction
        rework_route: skill_semantic_extraction
        evidence_required: [skill_semantic_evidence_schema]
        trace_required: [stage_gate_trace_schema]
      - rule_id: skill_semantic_confidence_above_threshold
        description: Semantic-extraction confidence must be at or above threshold.
        severity: blocker
        required_when: always
        pass_condition: skill_semantic_confidence_above_threshold == true
        fail_condition: skill_semantic_confidence_below_threshold
        on_fail: skill_semantic_extraction
        rework_route: skill_semantic_extraction
        evidence_required: [skill_semantic_evidence_schema]
        trace_required: [stage_gate_trace_schema]
      - rule_id: skill_semantic_no_self_approval
        description: The semantic-extraction author must not be the sole approver of the binding proposal (producer != approver).
        severity: blocker
        required_when: always
        pass_condition: producer_agent_id != approver_agent_id
        fail_condition: self_approval_detected
        on_fail: skill_semantic_extraction
        rework_route: skill_semantic_extraction
        evidence_required: [skill_semantic_evidence_schema]
        trace_required: [stage_gate_trace_schema]
      - rule_id: skill_semantic_evidence_required
        description: No skill-extraction gate may pass without a skill-semantic evidence record.
        severity: blocker
        required_when: always
        pass_condition: gate_decision_has_evidence_record == true
        fail_condition: gate_decision_without_evidence
        on_fail: skill_semantic_extraction
        rework_route: skill_semantic_extraction
        evidence_required: [skill_semantic_evidence_schema]
        trace_required: [stage_gate_trace_schema]

  # ---------------------------------------------------------------------------
  # Stage 04 — requirements  (always-on)
  # on_fail: requirements ; rework_route: intake
  # ---------------------------------------------------------------------------
  - governance_profile_id: requirements_stage_governance
    scope: stage
    purpose: >-
      Stage-scope governance for SDLC stage 04 (requirements): functional
      requirements, an NFR catalog, acceptance criteria, and requirements→source
      traceability must be present and traceable to the product goal — backed by
      evidence — before requirements hands off to the requirements_review gate.
    applies_to:
      - sdlc_stage:requirements
    severity_default: blocker
    source_governance_tokens:
      - sdlc_pipeline_governance
      - evidence_required_policy
      - requirements_acceptance_gate
    uses_governance_profiles:
      - sdlc_pipeline_governance
      - evidence_required
      - requirements_acceptance_gate
    required_evidence:
      - sdlc_pipeline_evidence_schema
    required_trace:
      - stage_gate_trace_schema
    owner: product_requirements_agent
    escalation:
      gate_failure: sdlc_team_lead
      policy_bypass_attempt: policy_and_evidence_engine
    rules:
      - rule_id: requirements_present
        description: Functional requirements must be present.
        severity: blocker
        required_when: always
        pass_condition: requirements_present == true
        fail_condition: unresolved_requirement_ambiguity
        on_fail: requirements
        rework_route: intake
        evidence_required: [sdlc_pipeline_evidence_schema]
        trace_required: [stage_gate_trace_schema]
      - rule_id: nfr_catalog_present
        description: A non-functional-requirements catalog must be present.
        severity: blocker
        required_when: always
        pass_condition: nfr_catalog_present == true
        fail_condition: nfr_catalog_missing
        on_fail: requirements
        rework_route: intake
        evidence_required: [sdlc_pipeline_evidence_schema]
        trace_required: [stage_gate_trace_schema]
      - rule_id: acceptance_criteria_present
        description: Testable acceptance criteria must be present.
        severity: blocker
        required_when: always
        pass_condition: acceptance_criteria_present == true
        fail_condition: missing_acceptance_criteria
        on_fail: requirements
        rework_route: intake
        evidence_required: [sdlc_pipeline_evidence_schema]
        trace_required: [stage_gate_trace_schema]
      - rule_id: requirements_traceable
        description: Every requirement must be traceable to the product goal.
        severity: blocker
        required_when: always
        pass_condition: requirements_traceable == true
        fail_condition: requirement_not_traceable_to_product_goal
        on_fail: requirements
        rework_route: intake
        evidence_required: [sdlc_pipeline_evidence_schema]
        trace_required: [stage_gate_trace_schema]
      - rule_id: requirements_evidence_required
        description: No requirements gate may pass without an SDLC evidence record.
        severity: blocker
        required_when: always
        pass_condition: gate_decision_has_evidence_record == true
        fail_condition: gate_decision_without_evidence
        on_fail: requirements
        rework_route: intake
        evidence_required: [sdlc_pipeline_evidence_schema]
        trace_required: [stage_gate_trace_schema]

  # ---------------------------------------------------------------------------
  # Stage 05 — requirements_review  (always-on, REVIEW gate; binds no_self_approval)
  # on_fail: requirements ; rework_route: requirements
  # ---------------------------------------------------------------------------
  - governance_profile_id: requirements_review_stage_governance
    scope: stage
    purpose: >-
      Stage-scope governance for SDLC stage 05 (requirements_review): an independent
      review-gate over the requirements outputs (prompt fidelity, requirement-gap,
      acceptance-criteria, traceability), performed by a non-author owner
      (sdlc_team_lead as the locked review-gate fallback) under no-self-approval.
    applies_to:
      - sdlc_stage:requirements_review
    severity_default: blocker
    source_governance_tokens:
      - no_self_approval_policy
      - evidence_required_policy
      - requirements_review_governance
      - prompt_fidelity_gate
    uses_governance_profiles:
      - no_self_approval
      - evidence_required
      - requirements_review_governance
      - prompt_fidelity_gate
    required_evidence:
      - requirements_review_evidence_schema
    required_trace:
      - stage_gate_trace_schema
    owner: sdlc_team_lead              # locked review-gate fallback; differs from product_requirements_agent (author)
    escalation:
      gate_failure: sdlc_team_lead
      policy_bypass_attempt: policy_and_evidence_engine
    rules:
      - rule_id: requirements_review_no_self_approval
        description: The reviewer must differ from the REQUIREMENTS_SPEC author (producer != approver).
        severity: blocker
        required_when: always
        pass_condition: producer_agent_id != approver_agent_id
        fail_condition: self_review_detected
        on_fail: requirements
        rework_route: requirements
        evidence_required: [requirements_review_evidence_schema]
        trace_required: [stage_gate_trace_schema]
      - rule_id: prompt_fidelity_pass
        description: Requirements must faithfully reflect the captured user intent (prompt-fidelity).
        severity: blocker
        required_when: always
        pass_condition: prompt_fidelity_pass == true
        fail_condition: prompt_fidelity_failure
        on_fail: requirements
        rework_route: requirements
        evidence_required: [requirements_review_evidence_schema]
        trace_required: [stage_gate_trace_schema]
      - rule_id: no_major_requirement_gap
        description: No major requirement coverage gap may remain.
        severity: blocker
        required_when: always
        pass_condition: no_major_requirement_gap == true
        fail_condition: major_requirement_gap
        on_fail: requirements
        rework_route: requirements
        evidence_required: [requirements_review_evidence_schema]
        trace_required: [stage_gate_trace_schema]
      - rule_id: acceptance_criteria_reviewed
        description: Acceptance criteria must be reviewed and judged sufficient.
        severity: blocker
        required_when: always
        pass_condition: acceptance_criteria_reviewed == true
        fail_condition: acceptance_criteria_insufficient
        on_fail: requirements
        rework_route: requirements
