        description: Cost estimate must stay within budget for compute/AI-heavy, provider-cost-relevant, or retry/parallel features (conditional gate).
        severity: blocker
        required_when: >-
          ai_or_compute_heavy_feature == true or external_provider_cost_relevant == true or
          retry_loop_or_parallel_execution_present == true
