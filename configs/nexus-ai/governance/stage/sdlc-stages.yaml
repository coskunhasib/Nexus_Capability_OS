        rework_route: planning
        evidence_required: [backup_restore_evidence_schema, dr_validation_schema]
        trace_required: [stage_gate_trace_schema]
      - rule_id: restore_test_pass_if_applicable
        description: A restore test must pass when persistent/production data is present (conditional gate).
        severity: blocker
        required_when: persistent_data_present == true or production_data_present == true
        pass_condition: restore_test_pass_if_applicable == true
        fail_condition: failed_restore_test
        on_fail: planning
        rework_route: planning
        evidence_required: [backup_restore_evidence_schema]
        trace_required: [stage_gate_trace_schema]
      - rule_id: backup_rollback_validation_pass_if_applicable
        description: Rollback validation must pass (RTO/RPO met) when the service is stateful or recovery objectives are defined (conditional gate).
        severity: blocker
        required_when: stateful_service == true or recovery_objectives_defined == true
        pass_condition: rollback_validation_pass_if_applicable == true
        fail_condition: missing_rollback_validation
