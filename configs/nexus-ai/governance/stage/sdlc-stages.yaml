  - governance_profile_id: backup_restore_dr_validation_if_applicable_stage_governance
    scope: stage
    purpose: >-
      Stage-scope governance for SDLC stage 26 (backup/restore/DR validation,
      conditional): when persistent/production data or a stateful service is present,
      backup/restore/DR must pass, restore tests must pass, and rollback validation
      must pass (RTO/RPO targets met, DR runbook present) — under no-self-approval.
    applies_to:
      - sdlc_stage:backup_restore_dr_validation_if_applicable
    conditional_stage: true
    severity_default: blocker
    source_governance_tokens:
      - sdlc_pipeline_governance
      - no_self_approval_policy
      - evidence_required_policy
      - backup_restore_governance
      - disaster_recovery_gate
      - rollback_required_gate
    uses_governance_profiles:
      - sdlc_pipeline_governance
      - no_self_approval
      - evidence_required
      - backup_restore_governance
      - disaster_recovery_gate
      - rollback_required_gate
    required_evidence:
      - backup_restore_evidence_schema
      - dr_validation_schema
      - rollback_validation_schema
    required_trace:
      - stage_gate_trace_schema
    owner: operations_readiness_agent
