  # ---------------------------------------------------------------------------
  - governance_profile_id: privacy_data_lifecycle_validation_stage_governance
    scope: stage
    purpose: >-
      Stage-scope governance for SDLC stage 19 (privacy_data_lifecycle_validation,
      conditional): when personal/sensitive/tenant data is processed, privacy
      lifecycle, data retention, and tenant isolation must pass — under
      no-self-approval. Each gate is required only when its applicability predicate
      holds; otherwise it is not_applicable (vacuously satisfied).
    applies_to:
      - sdlc_stage:privacy_data_lifecycle_validation
    conditional_stage: true
    severity_default: blocker
    source_governance_tokens:
      - sdlc_pipeline_governance
      - no_self_approval_policy
      - evidence_required_policy
      - privacy_lifecycle_governance
      - data_retention_gate
      - tenant_isolation_gate
    uses_governance_profiles:
      - sdlc_pipeline_governance
      - no_self_approval
      - evidence_required
      - privacy_lifecycle_governance
      - data_retention_gate
      - tenant_isolation_gate
    required_evidence:
      - privacy_evidence_schema
      - data_lifecycle_report_schema
      - tenant_isolation_report_schema
    required_trace:
      - stage_gate_trace_schema
    owner: privacy_agent
    escalation:
      gate_failure: sdlc_team_lead
      policy_bypass_attempt: policy_and_evidence_engine
    rules:
      - rule_id: privacy_lifecycle_pass_if_applicable
        description: Privacy lifecycle must pass when personal/sensitive data is processed or audit logs contain user data (conditional gate).
        severity: blocker
        required_when: >-
