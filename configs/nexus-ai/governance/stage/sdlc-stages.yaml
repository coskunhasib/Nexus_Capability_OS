  # ---------------------------------------------------------------------------
  # Stage 22 — data_migration_validation_if_applicable  (CONDITIONAL; no_self_approval)
  # NOTE: stage declares per-gate severity; migration_covers_data_model_delta = major.
  # on_fail: architecture ; rework_route: architecture
  # ---------------------------------------------------------------------------
  - governance_profile_id: data_migration_validation_if_applicable_stage_governance
    scope: stage
    purpose: >-
      Stage-scope governance for SDLC stage 22 (data/migration validation,
      conditional): when the data model or a migration changes, the migration must be
      safe, a tested rollback path must exist, data integrity must hold, and the
      migration must cover the declared schema delta — under no-self-approval
      (validator != migration author). Most gates are blocker; delta-coverage is major
      per the stage contract.
    applies_to:
      - sdlc_stage:data_migration_validation_if_applicable
    conditional_stage: true
    severity_default: blocker
    source_governance_tokens:
      - sdlc_pipeline_governance
      - no_self_approval_policy
      - evidence_required_policy
      - data_migration_governance
      - rollback_required_gate
      - data_integrity_gate
    uses_governance_profiles:
      - sdlc_pipeline_governance
      - no_self_approval
      - evidence_required
      - data_migration_governance
      - rollback_required_gate
      - data_integrity_gate
    required_evidence:
      - migration_evidence_schema
    required_trace:
      - stage_gate_trace_schema
    owner: data_migration_agent
    escalation:
      gate_failure: sdlc_team_lead
      policy_bypass_attempt: policy_and_evidence_engine
    rules:
      - rule_id: data_migration_pass_if_applicable
        description: The migration must be safe (not lossy/irreversible/out-of-order/non-idempotent) when the data model or migration changes (conditional gate).
        severity: blocker
        required_when: data_model_changed == true or migration_changed == true
        pass_condition: data_migration_pass_if_applicable == true
        fail_condition: unsafe_migration
        on_fail: architecture
        rework_route: architecture
        evidence_required: [migration_evidence_schema]
        trace_required: [stage_gate_trace_schema]
      - rule_id: rollback_validation_pass_if_applicable
        description: A tested rollback path must exist when a migration changes (conditional gate).
        severity: blocker
        required_when: migration_changed == true
        pass_condition: rollback_validation_pass_if_applicable == true
        fail_condition: rollback_missing
        on_fail: architecture
        rework_route: architecture
        evidence_required: [migration_evidence_schema]
        trace_required: [stage_gate_trace_schema]
      - rule_id: data_integrity_pass_if_applicable
        description: Post-migration data integrity must hold when the data model or migration changes (conditional gate).
        severity: blocker
        required_when: data_model_changed == true or migration_changed == true
        pass_condition: data_integrity_pass_if_applicable == true
        fail_condition: data_integrity_failure
        on_fail: architecture
        rework_route: architecture
        evidence_required: [migration_evidence_schema]
        trace_required: [stage_gate_trace_schema]
      - rule_id: migration_covers_data_model_delta_if_applicable
        description: The migration must cover the declared schema delta when both the data model and migration changed (conditional gate; major severity per stage contract).
        severity: major
        required_when: data_model_changed == true and migration_changed == true
        pass_condition: migration_covers_data_model_delta_if_applicable == true
        fail_condition: migration_does_not_cover_data_model_delta
        on_fail: architecture
        rework_route: architecture
        evidence_required: [migration_evidence_schema]
        trace_required: [stage_gate_trace_schema]
      - rule_id: data_migration_tenant_isolation_preserved
        description: The migration must not break tenant / data-ownership isolation.
        severity: blocker
        required_when: data_model_changed == true or migration_changed == true
        pass_condition: tenant_isolation_preserved == true
        fail_condition: tenant_isolation_break
        on_fail: architecture
        rework_route: architecture
        evidence_required: [migration_evidence_schema]
        trace_required: [stage_gate_trace_schema]
      - rule_id: data_migration_no_self_approval
        description: The migration validator must differ from the migration author (producer != approver).
        severity: blocker
        required_when: always
        pass_condition: producer_agent_id != approver_agent_id
        fail_condition: self_approval_detected
        on_fail: architecture
        rework_route: architecture
        evidence_required: [migration_evidence_schema]
        trace_required: [stage_gate_trace_schema]
      - rule_id: data_migration_evidence_required
        description: No applicable data-migration gate may pass without a migration evidence record.
        severity: blocker
        required_when: stage_applicable == true
        pass_condition: gate_decision_has_evidence_record == true
        fail_condition: gate_decision_without_evidence
        on_fail: architecture
        rework_route: architecture
        evidence_required: [migration_evidence_schema]
        trace_required: [stage_gate_trace_schema]

