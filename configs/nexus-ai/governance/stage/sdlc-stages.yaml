        description: Compliance must pass when the domain is regulated or compliance is contractually required (conditional re-check at RC).
        severity: blocker
        required_when: regulated_domain == true or contractual_compliance_required == true
        pass_condition: compliance_pass_if_applicable == true
        fail_condition: incomplete_release_evidence
        on_fail: development_completion
        rework_route: development_completion
        evidence_required: [sdlc_pipeline_evidence_schema]
        trace_required: [stage_gate_trace_schema]
      - rule_id: release_candidate_privacy_lifecycle_pass_if_applicable
        description: Privacy lifecycle must pass when personal data is processed (conditional re-check at RC).
        severity: blocker
        required_when: personal_data_processed == true
        pass_condition: privacy_lifecycle_pass_if_applicable == true
        fail_condition: incomplete_release_evidence
        on_fail: development_completion
        rework_route: development_completion
        evidence_required: [sdlc_pipeline_evidence_schema]
        trace_required: [stage_gate_trace_schema]
