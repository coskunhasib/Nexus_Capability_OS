        rework_route: architecture
        evidence_required: [threat_model_evidence_schema]
        trace_required: [stage_gate_trace_schema]
      - rule_id: security_privacy_design_complete
        description: The security/privacy design must be complete and decided under no-human governance.
        severity: blocker
        required_when: always
        pass_condition: security_privacy_design_complete == true
        fail_condition: security_privacy_design_incomplete
        on_fail: architecture
        rework_route: architecture
        evidence_required: [threat_model_evidence_schema, privacy_evidence_schema]
        trace_required: [stage_gate_trace_schema]
      - rule_id: security_privacy_design_no_self_approval
        description: The security/privacy design decision must be produced under no-self-approval (producer != approver).
        severity: blocker
        required_when: always
        pass_condition: producer_agent_id != approver_agent_id
        fail_condition: self_approval_detected
        on_fail: architecture
        rework_route: architecture
        evidence_required: [threat_model_evidence_schema]
        trace_required: [stage_gate_trace_schema]
      - rule_id: security_privacy_design_evidence_required
        description: No security/privacy design gate may pass without a threat-model/privacy evidence record.
        severity: blocker
        required_when: always
        pass_condition: gate_decision_has_evidence_record == true
        fail_condition: gate_decision_without_evidence
        on_fail: architecture
        rework_route: architecture
        evidence_required: [threat_model_evidence_schema, privacy_evidence_schema]
        trace_required: [stage_gate_trace_schema]

