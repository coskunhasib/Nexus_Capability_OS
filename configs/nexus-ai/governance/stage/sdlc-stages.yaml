        fail_condition: unresolved_architecture_risk
        on_fail: architecture
        rework_route: architecture
        evidence_required: [architecture_review_evidence_schema]
        trace_required: [stage_gate_trace_schema]
      - rule_id: rejected_options_documented
        description: Rejected options must be documented in the review.
        severity: blocker
        required_when: always
        pass_condition: rejected_options_documented == true
        fail_condition: rejected_options_not_documented
        on_fail: architecture
        rework_route: architecture
        evidence_required: [architecture_review_evidence_schema]
        trace_required: [stage_gate_trace_schema]
      - rule_id: nfr_tradeoffs_justified
        description: NFR trade-offs in the chosen design must be justified.
        severity: blocker
        required_when: always
        pass_condition: nfr_tradeoffs_justified == true
        fail_condition: missing_tradeoff_rationale
        on_fail: architecture
        rework_route: architecture
        evidence_required: [architecture_review_evidence_schema]
        trace_required: [stage_gate_trace_schema]
      - rule_id: architecture_review_pass
        description: The architecture review verdict must pass (no unaddressed NFR in the architecture).
        severity: blocker
        required_when: always
        pass_condition: architecture_review_pass == true
        fail_condition: unaddressed_nfr_in_architecture
        on_fail: architecture
        rework_route: architecture
        evidence_required: [architecture_review_evidence_schema]
        trace_required: [stage_gate_trace_schema]
      - rule_id: architecture_review_evidence_required
        description: The review verdict must be backed by an architecture-review evidence record.
        severity: blocker
        required_when: always
        pass_condition: gate_decision_has_evidence_record == true
        fail_condition: gate_decision_without_evidence
        on_fail: architecture
        rework_route: architecture
        evidence_required: [architecture_review_evidence_schema]
        trace_required: [stage_gate_trace_schema]

  # ---------------------------------------------------------------------------
  # Stage 08 — security_privacy_design  (always-on; binds no_self_approval)
  # has conditional_required_gates (privacy_risks_classified, data_lifecycle_visible)
  # on_fail: architecture ; rework_route: architecture
  # ---------------------------------------------------------------------------
  - governance_profile_id: security_privacy_design_stage_governance
    scope: stage
    purpose: >-
      Stage-scope governance for SDLC stage 08 (security_privacy_design): a threat
      model, classified privacy risks, an auth/authz strategy, a visible data
      lifecycle, and NFR-traced security requirements must be produced under
      no-self-approval before design completes. Privacy risk classification and
      data-lifecycle visibility are conditionally required when personal/tenant data
      is handled.
    applies_to:
      - sdlc_stage:security_privacy_design
    severity_default: blocker
    source_governance_tokens:
      - sdlc_pipeline_governance
      - no_self_approval_policy
      - evidence_required_policy
      - privacy_lifecycle_governance
      - security_privacy_governance
      - threat_model_required_gate
    uses_governance_profiles:
      - sdlc_pipeline_governance
      - no_self_approval
      - evidence_required
      - privacy_lifecycle_governance
      - security_privacy_governance
      - threat_model_required_gate
    required_evidence:
      - threat_model_evidence_schema
      - privacy_evidence_schema
    required_trace:
      - stage_gate_trace_schema
    owner: security_privacy_agent
    escalation:
      gate_failure: sdlc_team_lead
      policy_bypass_attempt: policy_and_evidence_engine
    rules:
      - rule_id: threat_model_present
        description: A threat model must be produced before design completion.
        severity: blocker
        required_when: always
        pass_condition: threat_model_present == true
        fail_condition: missing_threat_model
        on_fail: architecture
        rework_route: architecture
        evidence_required: [threat_model_evidence_schema]
        trace_required: [stage_gate_trace_schema]
      - rule_id: privacy_risks_classified
        description: Privacy risks must be classified when the product handles personal data (conditional gate).
        severity: blocker
        required_when: product_handles_personal_data == true
        pass_condition: privacy_risks_classified == true
        fail_condition: unclassified_privacy_risk
        on_fail: architecture
        rework_route: architecture
        evidence_required: [privacy_evidence_schema]
        trace_required: [stage_gate_trace_schema]
      - rule_id: authz_authn_strategy_present
        description: An authentication/authorization strategy must be present.
        severity: blocker
        required_when: always
        pass_condition: authz_authn_strategy_present == true
        fail_condition: missing_auth_strategy
        on_fail: architecture
        rework_route: architecture
        evidence_required: [threat_model_evidence_schema]
        trace_required: [stage_gate_trace_schema]
      - rule_id: data_lifecycle_visible
        description: The data lifecycle must be visible when personal data is handled or the product is multi-tenant (conditional gate).
        severity: blocker
        required_when: product_handles_personal_data == true or product_is_multi_tenant == true
        pass_condition: data_lifecycle_visible == true
        fail_condition: undefined_data_lifecycle
        on_fail: architecture
        rework_route: architecture
        evidence_required: [privacy_evidence_schema]
        trace_required: [stage_gate_trace_schema]
