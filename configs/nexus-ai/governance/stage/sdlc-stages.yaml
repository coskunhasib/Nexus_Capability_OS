  # ---------------------------------------------------------------------------
  # Stage 29 — development_completion  (AGGREGATE always-on; no_self_approval, release_candidate_governance)
  # always-required gates + conditional-required (evaluated when upstream applicability true)
  # on_fail: relevant_failed_stage ; rework_route: relevant_failed_stage
  # ---------------------------------------------------------------------------
  - governance_profile_id: development_completion_stage_governance
    scope: stage
    purpose: >-
      Stage-scope governance for SDLC stage 29 (development_completion): the aggregate
      completion gate. ALL always-required upstream gates must pass and EVERY
      applicable conditional gate must pass, with a complete evidence graph and no
      blocking policy failure, before a release candidate may be produced — under
      no-self-approval and the release_candidate_governance umbrella. The
      development-completion-requires-all-required-gates invariant.
    applies_to:
      - sdlc_stage:development_completion
    aggregate_stage: true
    severity_default: blocker
    source_governance_tokens:
      - sdlc_pipeline_governance
      - no_self_approval_policy
      - evidence_required_policy
      - release_candidate_governance
      - development_completion_gate
      - no_blocking_policy_failure_gate
    uses_governance_profiles:
      - sdlc_pipeline_governance
      - no_self_approval
      - evidence_required
      - release_candidate_governance
      - development_completion_gate
      - no_blocking_policy_failure_gate
    required_evidence:
      - sdlc_pipeline_evidence_schema
    required_trace:
      - stage_gate_trace_schema
    owner: release_manager_agent
    escalation:
      gate_failure: sdlc_team_lead
      policy_bypass_attempt: policy_and_evidence_engine
    rules:
      - rule_id: all_required_gates_pass
        description: Every always-required upstream gate (requirements, NFR, architecture, ADR, security/privacy design, risk register, scope, code review, tests, verification-loop, security validation, supply chain, license, SBOM, agentic safety, operations readiness, evidence graph) must pass.
        severity: blocker
        required_when: always
        pass_condition: all_required_gates_passed == true
        fail_condition: any_required_gate_failed
        on_fail: relevant_failed_stage
        rework_route: relevant_failed_stage
        evidence_required: [sdlc_pipeline_evidence_schema]
        trace_required: [stage_gate_trace_schema]
      - rule_id: applicable_conditional_gates_pass
        description: Every conditional gate whose upstream applicability decision is true (accessibility, data migration, privacy lifecycle, API contract, compliance, backup/restore/DR, cost/resource) must pass.
        severity: blocker
        required_when: any_conditional_gate_applicable == true
        pass_condition: all_applicable_conditional_gates_passed == true
        fail_condition: applicable_conditional_gate_failed
        on_fail: relevant_failed_stage
        rework_route: relevant_failed_stage
        evidence_required: [sdlc_pipeline_evidence_schema]
        trace_required: [stage_gate_trace_schema]
      - rule_id: development_completion_evidence_graph_complete
        description: The evidence graph must be complete with all required evidence present.
        severity: blocker
        required_when: always
        pass_condition: evidence_graph_complete == true
        fail_condition: missing_required_evidence
        on_fail: relevant_failed_stage
        rework_route: relevant_failed_stage
        evidence_required: [sdlc_pipeline_evidence_schema]
        trace_required: [stage_gate_trace_schema]
      - rule_id: no_blocking_policy_failure
        description: No unresolved blocking policy failure may remain (no_policy_bypass at the completion boundary).
        severity: blocker
        required_when: always
        pass_condition: no_blocking_policy_failure == true
        fail_condition: unresolved_blocker_finding
        on_fail: relevant_failed_stage
        rework_route: relevant_failed_stage
        evidence_required: [sdlc_pipeline_evidence_schema]
        trace_required: [stage_gate_trace_schema]
      - rule_id: accepted_risk_has_owner
        description: Every accepted risk must have a named owner.
        severity: blocker
        required_when: always
        pass_condition: accepted_risk_has_owner == true
        fail_condition: accepted_risk_without_owner
        on_fail: relevant_failed_stage
        rework_route: relevant_failed_stage
        evidence_required: [sdlc_pipeline_evidence_schema]
        trace_required: [stage_gate_trace_schema]
      - rule_id: development_completion_no_self_approval
        description: The completion decider must differ from the upstream artifact authors (producer != approver).
        severity: blocker
        required_when: always
        pass_condition: producer_agent_id != approver_agent_id
        fail_condition: self_approval_detected
        on_fail: relevant_failed_stage
        rework_route: relevant_failed_stage
        evidence_required: [sdlc_pipeline_evidence_schema]
        trace_required: [stage_gate_trace_schema]
      - rule_id: development_completion_evidence_required
        description: The completion decision must be backed by an SDLC evidence record (no completion without evidence).
        severity: blocker
        required_when: always
        pass_condition: gate_decision_has_evidence_record == true
        fail_condition: gate_decision_without_evidence
        on_fail: relevant_failed_stage
        rework_route: relevant_failed_stage
        evidence_required: [sdlc_pipeline_evidence_schema]
        trace_required: [stage_gate_trace_schema]

  # ---------------------------------------------------------------------------
  # Stage 30 — release_candidate  (always-on; LOCKED release_candidate_governance; no_self_approval)
