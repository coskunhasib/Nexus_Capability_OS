      candidate may not be produced before development_completion passes
      (re-attested by sdlc_team_lead under no-self-approval, differing from the
      stage-29 release_manager_agent author); release evidence must be complete and
      internally consistent with the evidence graph; and no blocking policy failure
      may remain. The release-candidate-requires-development-completion invariant.
    applies_to:
      - sdlc_stage:release_candidate
    severity_default: blocker
    source_governance_tokens:
      - sdlc_pipeline_governance
      - no_self_approval_policy
      - evidence_required_policy
      - release_candidate_governance
      - release_after_development_completion_gate
    uses_governance_profiles:
      - sdlc_pipeline_governance
      - no_self_approval
      - evidence_required
      - release_candidate_governance
      - release_after_development_completion_gate
    required_evidence:
      - sdlc_pipeline_evidence_schema
    required_trace:
      - stage_gate_trace_schema
    owner: release_manager_agent
    escalation:
      gate_failure: sdlc_team_lead
