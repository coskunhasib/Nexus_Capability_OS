    source_governance_tokens:
      - sdlc_pipeline_governance
      - no_self_approval_policy
      - evidence_required_policy
      - code_review_gate
    uses_governance_profiles:
      - sdlc_pipeline_governance
      - no_self_approval
      - evidence_required
      - code_review_gate
    required_evidence:
      - code_review_evidence_schema
    required_trace:
      - stage_gate_trace_schema
    owner: code_reviewer_agent          # dedicated reviewer; differs from engineering_agent (author)
    escalation:
      gate_failure: sdlc_team_lead
      policy_bypass_attempt: policy_and_evidence_engine
    rules:
      - rule_id: code_review_no_self_approval
        description: The reviewer must differ from the changeset author (producer != approver).
        severity: blocker
        required_when: always
        pass_condition: producer_agent_id != approver_agent_id
        fail_condition: self_review_detected
