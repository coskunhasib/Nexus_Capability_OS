  # ---------------------------------------------------------------------------
  # Stage 11 — implementation  (always-on)
  # on_fail: implementation ; rework_route: implementation
  # ---------------------------------------------------------------------------
  - governance_profile_id: implementation_stage_governance
    scope: stage
    purpose: >-
      Stage-scope governance for SDLC stage 11 (implementation): code changes must
      be present, contained to the planned scope (no out-of-scope changes), and pass
      a local build — backed by evidence — before code review. No silent mutation
      (every change has an explicit tool + trace, per the global trace policy).
