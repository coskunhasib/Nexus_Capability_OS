  # ---------------------------------------------------------------------------
  # Stage 07 — architecture_review  (always-on, REVIEW gate; binds no_self_approval)
  # on_fail: architecture ; rework_route: architecture
  # ---------------------------------------------------------------------------
  - governance_profile_id: architecture_review_stage_governance
    scope: stage
    purpose: >-
      Stage-scope governance for SDLC stage 07 (architecture_review): an independent
      review-gate that stress-tests architecture decisions, ADRs, NFR trade-offs and
      system boundaries; performed by a non-author owner (sdlc_team_lead as the
      locked review-gate fallback) under no-self-approval.
    applies_to:
      - sdlc_stage:architecture_review
    severity_default: blocker
    source_governance_tokens:
      - sdlc_pipeline_governance
      - no_self_approval_policy
      - evidence_required_policy
      - architecture_review_gate
    uses_governance_profiles:
      - sdlc_pipeline_governance
      - no_self_approval
      - evidence_required
      - architecture_review_gate
    required_evidence:
      - architecture_review_evidence_schema
    required_trace:
      - stage_gate_trace_schema
    owner: sdlc_team_lead              # locked review-gate fallback; differs from architecture_agent (author)
    escalation:
      gate_failure: sdlc_team_lead
      policy_bypass_attempt: policy_and_evidence_engine
    rules:
      - rule_id: architecture_review_no_self_approval
        description: The reviewer must differ from the ARCHITECTURE_DOC author (producer != approver).
        severity: blocker
        required_when: always
        pass_condition: producer_agent_id != approver_agent_id
        fail_condition: self_review_detected
        on_fail: architecture
        rework_route: architecture
        evidence_required: [architecture_review_evidence_schema]
        trace_required: [stage_gate_trace_schema]
      - rule_id: no_unresolved_architecture_risk
