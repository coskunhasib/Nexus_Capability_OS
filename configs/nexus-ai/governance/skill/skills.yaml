      - executor_handoff_authoring
    forbidden_usage:
      - bug_finding
      - making_the_plan_decision_by_itself
    rules:

      - rule_id: handoff_designer.not_sole_plan_decider
        description: handoff-designer authors handoff packets; the planning decision still has a distinct owner.
        severity: major
        required_when: gate.id == "sdlc:10-planning:planning_handoff_completeness_gate" AND gate.uses_skill == handoff-designer
        pass_condition: gate.owner_agent == planning_agent AND gate.sole_decider != skill:handoff-designer
        fail_condition: gate.sole_decider == skill:handoff-designer
        on_fail: block_gate_decision
        rework_route: sdlc:10-planning
        evidence_required:
          - skill_binding_decision_schema
        trace_required:
          - stage_gate_trace_schema

      - rule_id: handoff_designer.semantic_extraction_before_binding
        description: handoff-designer may only be bound after its semantic record exists (no_unread_skill_binding).
        severity: blocker
        required_when: skill_binding.skill_id == handoff-designer
        pass_condition: handoff-designer.semantic_extraction_status == complete
        fail_condition: handoff-designer.semantic_extraction_status != complete
        on_fail: block_binding
        rework_route: sdlc:03-skill-semantic-extraction
        evidence_required:
          - skill_semantic_extract_schema
        trace_required:
          - skill_governance_trace_schema
    required_evidence:
      - skill_semantic_extract_schema
    required_trace:
      - skill_activation_trace_schema
    notes: CANDIDATE. Produces HANDOFF_PACKETS at stage 10 (skills_registry used_by). remap_candidate fermi-decompose.

  # -------------------------------------------------------------------------
  # context-pack-builder — assembles scoped context packs (must honor retrieval).
  # -------------------------------------------------------------------------
  - governance_profile_id: gov.skill.context_pack_builder
    implements: skill_governance
    governance_profile_status: candidate
    scope: skill
    purpose: >-
      Govern the context-pack-builder skill that assembles the scoped context pack
      an executor/implementation stage needs. It MUST honor context/memory retrieval
      and redaction rules and is not a defect finder.
    applies_to:
      - skill:context-pack-builder
    severity_default: major
    owner: skill_librarian_agent
    escalation:
      - skill_governance_team_lead
      - owner_human_gate
    inherited_governance_profiles:
      - skill_governance
      - skill_must_have_semantic_extraction_before_binding
    allowed_usage:
      - context_pack_assembly
      - relevant_artifact_selection
      - executor_context_preparation
    forbidden_usage:
      - bug_finding
      - retrieval_policy_bypass                      # must honor retrieval & redaction rules
    rules:

      - rule_id: context_pack_builder.honors_retrieval_and_redaction
        description: >-
          context-pack-builder MUST honor context/memory retrieval scope and
          redaction rules; assembling a pack that bypasses redaction or pulls
          out-of-scope/sensitive artifacts is forbidden.
        severity: blocker
        required_when: activation.skill_id == context-pack-builder
        pass_condition: pack.retrieval_scope_respected == true AND pack.redaction_applied == true
        fail_condition: pack.retrieval_scope_respected == false OR pack.redaction_applied == false
        on_fail: block_activation
        rework_route: sdlc:10-planning                              # re-assemble within retrieval/redaction rules
        evidence_required:
          - skill_binding_decision_schema
        trace_required:
          - skill_activation_trace_schema

      - rule_id: context_pack_builder.semantic_extraction_before_binding
        description: context-pack-builder may only be bound after its semantic record exists (no_unread_skill_binding).
        severity: blocker
        required_when: skill_binding.skill_id == context-pack-builder
        pass_condition: context-pack-builder.semantic_extraction_status == complete
        fail_condition: context-pack-builder.semantic_extraction_status != complete
        on_fail: block_binding
        rework_route: sdlc:03-skill-semantic-extraction
        evidence_required:
          - skill_semantic_extract_schema
        trace_required:
          - skill_governance_trace_schema
    required_evidence:
      - skill_semantic_extract_schema
    required_trace:
      - skill_activation_trace_schema
    notes: >-
      CANDIDATE. Bridges into context_memory_profiles.yaml (stages 10 & 11;
      skills_registry used_by). Bound by retrieval/redaction governance.

  # -------------------------------------------------------------------------
  # scanner-result-normalizer — normalizes scanner output (NOT defect finding).
  # -------------------------------------------------------------------------
  - governance_profile_id: gov.skill.scanner_result_normalizer
    implements: skill_governance
    governance_profile_status: candidate
    scope: skill
    purpose: >-
      Govern the scanner-result-normalizer skill that normalizes/dedupes raw
      SAST/SCA/secret/IaC scanner output into a canonical findings set. It shapes
      existing findings; it MUST NOT itself find defects or decide severity alone.
    applies_to:
      - skill:scanner-result-normalizer
    severity_default: major
    owner: skill_librarian_agent
    escalation:
      - skill_governance_team_lead
      - owner_human_gate
    inherited_governance_profiles:
      - skill_governance
      - skill_must_have_semantic_extraction_before_binding
    allowed_usage:
      - scanner_output_normalization
      - finding_deduplication
      - severity_harmonization
    forbidden_usage:
      - bug_finding                                  # the defect sweep is verification-loop
      - severity_decision_by_itself                  # calibrate / the gate decide accepted risk
    rules:

      - rule_id: scanner_result_normalizer.not_defect_finding
        description: >-
          scanner-result-normalizer normalizes existing findings; it MUST NOT be
          bound as the defect-finding skill (that is verification-loop).
        severity: blocker
        required_when: stage.requires_defect_finding == true
        pass_condition: stage.bound_defect_skill == verification-loop
        fail_condition: stage.bound_defect_skill == skill:scanner-result-normalizer
        on_fail: block_activation
        rework_route: sdlc:15-verification-loop-bug-finding
        evidence_required:
          - skill_semantic_extract_schema
        trace_required:
          - skill_activation_trace_schema

      - rule_id: scanner_result_normalizer.not_sole_severity_decider
        description: severity/accepted-risk decisions are owned by calibrate + the gate, not the normalizer.
        severity: major
        required_when: gate.id == "sdlc:16-security-validation" AND gate.uses_skill == scanner-result-normalizer
        pass_condition: gate.severity_decider != skill:scanner-result-normalizer
        fail_condition: gate.severity_decider == skill:scanner-result-normalizer
        on_fail: block_gate_decision
        rework_route: sdlc:16-security-validation
        evidence_required:
          - skill_binding_decision_schema
        trace_required:
          - stage_gate_trace_schema

      - rule_id: scanner_result_normalizer.semantic_extraction_before_binding
        description: scanner-result-normalizer may only be bound after its semantic record exists (no_unread_skill_binding).
        severity: blocker
        required_when: skill_binding.skill_id == scanner-result-normalizer
        pass_condition: scanner-result-normalizer.semantic_extraction_status == complete
        fail_condition: scanner-result-normalizer.semantic_extraction_status != complete
        on_fail: block_binding
        rework_route: sdlc:03-skill-semantic-extraction
        evidence_required:
          - skill_semantic_extract_schema
        trace_required:
          - skill_governance_trace_schema
    required_evidence:
      - skill_semantic_extract_schema
    required_trace:
      - skill_activation_trace_schema
    notes: CANDIDATE. Data-shaping helper feeding security-validation triage at stage 16 (skills_registry used_by).

  # -------------------------------------------------------------------------
  # evidence-graph-builder — assembles the evidence DAG (NOT a defect sweep).
  # -------------------------------------------------------------------------
  - governance_profile_id: gov.skill.evidence_graph_builder
    implements: skill_governance
    governance_profile_status: candidate
    scope: skill
    purpose: >-
      Govern the evidence-graph-builder skill that assembles the requirement -> ...
      -> release evidence DAG and audits it for integrity/completeness. It is
      evidence/trace assembly — explicitly NOT a defect sweep — and may not fabricate
      evidence.
    applies_to:
      - skill:evidence-graph-builder
    severity_default: blocker
    owner: skill_librarian_agent
    escalation:
      - skill_governance_team_lead
      - owner_human_gate
    inherited_governance_profiles:
      - skill_governance
      - evidence_required                            # FIRST-CLASS id (alias: evidence_required_policy)
      - skill_must_have_semantic_extraction_before_binding
    allowed_usage:
      - evidence_graph_assembly
      - traceability_linking
      - evidence_integrity_audit
    forbidden_usage:
      - bug_finding                                  # explicitly NOT a defect sweep (stage 28)
      - evidence_fabrication
    rules:

      - rule_id: evidence_graph_builder.not_defect_finding
        description: >-
          evidence-graph-builder assembles/audits the evidence DAG; it MUST NOT be
          bound as the defect-finding skill (that is verification-loop).
        severity: blocker
        required_when: stage.requires_defect_finding == true
        pass_condition: stage.bound_defect_skill == verification-loop
        fail_condition: stage.bound_defect_skill == skill:evidence-graph-builder
        on_fail: block_activation
        rework_route: sdlc:15-verification-loop-bug-finding
        evidence_required:
          - skill_semantic_extract_schema
        trace_required:
          - skill_activation_trace_schema

      - rule_id: evidence_graph_builder.no_evidence_fabrication
        description: >-
          Every node in the evidence DAG MUST reference a real produced evidence
          record; fabricating or inferring missing evidence is forbidden.
        severity: blocker
        required_when: stage.id == "sdlc:28-evidence-graph-build"
        pass_condition: evidence_graph.all_nodes_reference_real_evidence == true
        fail_condition: evidence_graph.has_fabricated_or_unbacked_node == true
        on_fail: block_gate_decision
        rework_route: sdlc:28-evidence-graph-build
        evidence_required:
          - sdlc_pipeline_evidence_schema
        trace_required:
          - stage_gate_trace_schema

      - rule_id: evidence_graph_builder.semantic_extraction_before_binding
        description: evidence-graph-builder may only be bound after its semantic record exists (no_unread_skill_binding).
        severity: blocker
        required_when: skill_binding.skill_id == evidence-graph-builder
        pass_condition: evidence-graph-builder.semantic_extraction_status == complete
        fail_condition: evidence-graph-builder.semantic_extraction_status != complete
        on_fail: block_binding
        rework_route: sdlc:03-skill-semantic-extraction
        evidence_required:
          - skill_semantic_extract_schema
        trace_required:
          - skill_governance_trace_schema
    required_evidence:
      - skill_semantic_extract_schema
      - sdlc_pipeline_evidence_schema                # operates over the SDLC evidence set
    required_trace:
      - skill_activation_trace_schema
      - stage_gate_trace_schema
    notes: >-
      CANDIDATE. Bridges into audit_schemas.yaml at stage 28. Binds the FIRST-CLASS
      evidence_required (alias evidence_required_policy). Explicitly not a defect sweep.

  # -------------------------------------------------------------------------
  # release-readiness-judge — go/no-go adjudication (NOT a defect sweep; no self-approval).
  # -------------------------------------------------------------------------
  - governance_profile_id: gov.skill.release_readiness_judge
    implements: skill_governance
    governance_profile_status: candidate
    scope: skill
    purpose: >-
      Govern the release-readiness-judge skill: a deterministic readiness gate over
      assembled evidence (all required + applicable conditional gates passed,
      minimum evidence present). It is explicitly NOT a defect sweep, MUST NOT reuse
      verification-loop as a readiness checklist, and MUST NOT self-approve.
    applies_to:
      - skill:release-readiness-judge
    severity_default: blocker
    owner: skill_librarian_agent
    escalation:
      - skill_governance_team_lead
      - sdlc_team_lead                               # stages 29/30 route re-attestation to sdlc_team_lead
      - owner_human_gate
    inherited_governance_profiles:
      - skill_governance
      - no_self_approval                             # FIRST-CLASS id (alias: no_self_approval_policy)
      - skill_must_have_semantic_extraction_before_binding
    allowed_usage:
      - release_readiness_adjudication
      - gate_completeness_confirmation
      - go_no_go_judgement
    forbidden_usage:
      - bug_finding                                  # NOT a defect sweep (stages 29/30 bind gap-audit + calibrate)
      - reusing_verification_loop_as_a_readiness_checklist   # the exact locked anti-pattern
      - self_approval
    rules:

      - rule_id: release_readiness_judge.not_a_defect_sweep
        description: >-
          release-readiness-judge confirms gate/evidence completeness; it MUST NOT be
          bound as the defect-finding skill nor reuse verification-loop as a readiness
          checklist (the locked anti-pattern stages 29/30 refuse).
        severity: blocker
        required_when: stage.id in ["sdlc:29-development-completion", "sdlc:30-release-candidate"]
        pass_condition: >-
          stage.readiness_skill == release-readiness-judge
          AND stage.companion_skills includes [gap-audit, calibrate]
          AND verification-loop.not_bound_as(readiness_checklist)
        fail_condition: stage.readiness_skill == verification-loop OR stage.bound_defect_skill == skill:release-readiness-judge
        on_fail: block_gate_binding
        rework_route: skill_governance:skill_binding_proposal
        evidence_required:
          - release_evidence_schema
          - skill_binding_decision_schema
        trace_required:
          - stage_gate_trace_schema

      - rule_id: release_readiness_judge.no_self_approval
        description: >-
          The readiness verdict MUST NOT be self-approved by the producing agent;
          re-attestation routes to sdlc_team_lead (producer != approver).
        severity: blocker
        required_when: gate.kind == readiness_gate AND gate.uses_skill == release-readiness-judge
        pass_condition: gate.approver_agent != gate.producer_agent
        fail_condition: gate.approver_agent == gate.producer_agent
        on_fail: rework
        rework_route: sdlc:30-release-candidate                     # re-attestation by sdlc_team_lead
        evidence_required:
          - release_evidence_schema
        trace_required:
          - stage_gate_trace_schema

      - rule_id: release_readiness_judge.requires_all_required_gates
        description: >-
          A go verdict requires ALL required gates and ALL applicable conditional
          gates to have passed with the minimum evidence set present.
        severity: blocker
        required_when: stage.id == "sdlc:29-development-completion"
        pass_condition: required_gates.all_passed == true AND applicable_conditional_gates.all_passed == true AND minimum_evidence_set.present == true
        fail_condition: required_gates.any_failed == true OR applicable_conditional_gates.any_failed == true OR minimum_evidence_set.absent == true
        on_fail: block_gate_decision
        rework_route: sdlc:28-evidence-graph-build                  # close the missing gate/evidence first
        evidence_required:
          - release_evidence_schema
          - sdlc_pipeline_evidence_schema
        trace_required:
          - stage_gate_trace_schema

      - rule_id: release_readiness_judge.semantic_extraction_before_binding
        description: release-readiness-judge may only be bound after its semantic record exists (no_unread_skill_binding).
        severity: blocker
        required_when: skill_binding.skill_id == release-readiness-judge
        pass_condition: release-readiness-judge.semantic_extraction_status == complete
        fail_condition: release-readiness-judge.semantic_extraction_status != complete
        on_fail: block_binding
        rework_route: sdlc:03-skill-semantic-extraction
        evidence_required:
          - skill_semantic_extract_schema
        trace_required:
          - skill_governance_trace_schema
    required_evidence:
      - release_evidence_schema
      - skill_semantic_extract_schema
    required_trace:
      - skill_activation_trace_schema
      - stage_gate_trace_schema
    notes: >-
      CANDIDATE. Deliberately distinct from verification-loop: stages 29/30 refuse to
      reuse verification-loop as a readiness checklist and instead bind this judge +
      gap-audit + calibrate. Binds FIRST-CLASS no_self_approval (alias no_self_approval_policy).

# =============================================================================
# VALIDATION SELF-CHECK (doc 19 §14) — assertions a reviewer/linter can verify
# against this file. (Documentation aid; not runtime code.)
# =============================================================================
validation_self_check:
  every_profile_references_known_scope: true            # all scope == skill (in scope_vocabulary)
  every_rule_has_severity: true                          # every rule carries severity in severity_vocabulary
  every_blocker_rule_has_on_fail: true                   # every blocker rule sets on_fail
  evidence_trace_distinction_preserved: true             # required_evidence = evidence-family only; required_trace = trace-family only; never merged
  no_plugin_governance_introduced: true                  # no plugin concept anywhere
  locked_prism_semantics_enforced: true                  # gov.skill.prism forbids bug_finding (rules semantics_locked_divergence_only / not_a_bug_finder)
  locked_verification_loop_semantics_enforced: true      # gov.skill.verification_loop forbids general_readiness_checklist + replacing_test_execution
  first_class_policy_ids_used: true                      # no_self_approval / evidence_required used as ids; *_policy only as aliases
  authoritative_team_names_used: true                    # skill_governance_team (not knowledge_memory_team)
  no_core_ability_as_owner_or_skill: true                # owners/escalation are agents/teams; no Core Ability governed as a skill
  skill_not_tool: true                                   # every applies_to is a skill id

coverage_summary:
  scope: skill
  total_governed_skills: 18
  canonical_profiles: 12
  candidate_profiles: 6
  canonical_skill_ids:
    [prism, verification-loop, sentinel, llm-council, fmea, adr-builder,
     gap-audit, prompt-fidelity, calibrate, refraction, fermi-decompose, bayesian-update]
  candidate_skill_ids:
    [skill-architect, handoff-designer, context-pack-builder,
     scanner-result-normalizer, evidence-graph-builder, release-readiness-judge]
  locked_semantics_profiles:
    prism: gov.skill.prism                               # brainstorming/divergence ONLY (forbids bug finding)
    verification-loop: gov.skill.verification_loop       # bug/defect finding ONLY (forbids readiness checklist + test_execution replacement)

# =============================================================================
# OPEN QUESTIONS (carried for the Phase E governance-audit-readiness review)
# =============================================================================
open_questions:
  - id: OQ-GOV-SKILL-1
    question: >-
      Should the 6 candidate skill governance profiles
      (skill-architect, handoff-designer, context-pack-builder,
      scanner-result-normalizer, evidence-graph-builder, release-readiness-judge)
      be RATIFIED to canonical now, matching the skills_registry.yaml "recommend
      RATIFY" notes, or held as candidate until each skill's stage-03 open_question
      is resolved? This file marks them governance_profile_status: candidate.
  - id: OQ-GOV-SKILL-2
    question: >-
      The rework_route values point at SDLC stage ids (e.g. sdlc:15-verification-loop-
      bug-finding) and skill-governance pipeline stage tokens (e.g.
      skill_governance:skill_semantic_extraction). Phase E review should confirm the
      exact stage-id spelling to use for cross-pipeline rework routing (SDLC stage
      file ids vs skill-governance pipeline stage tokens) so the routes resolve uniformly.
  - id: OQ-GOV-SKILL-3
    question: >-
      Naming variant carry-over from OQ-GOV-1 (registry): this file uses the
      FIRST-CLASS ids no_self_approval / evidence_required and records the *_policy
      spellings as reconciliation_aliases. Phase E must confirm whether all skill
      bindings standardize on the bare canonical id (recommended) or also accept the
      *_policy alias at evaluation time.
