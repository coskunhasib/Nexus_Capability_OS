  # ===========================================================================
  # CANDIDATE SKILLS (status: candidate in skills_registry.yaml) — governed the
  # same way; each governance_profile_status is `candidate` pending ratification.
  # ===========================================================================

  # -------------------------------------------------------------------------
  # skill-architect — the meta-skill that performs semantic extraction itself.
  # -------------------------------------------------------------------------
  - governance_profile_id: gov.skill.skill_architect
    implements: skill_governance
    governance_profile_status: candidate
    scope: skill
    purpose: >-
      Govern the skill-architect meta-skill that reads a skill package and extracts
      its semantic identity (so other skills can be safely bound). It MUST NOT bind
      a skill without extraction and MUST NEVER alter the locked semantics of prism
      / verification-loop (it may record, never change them).
    applies_to:
      - skill:skill-architect
    severity_default: blocker
    owner: skill_librarian_agent
    escalation:
      - skill_governance_team_lead
      - owner_human_gate
    inherited_governance_profiles:
      - skill_governance
      - skill_semantic_required_gate                 # the gate this meta-skill produces evidence for
      - locked_semantics_enforcement_policy
      - skill_must_have_semantic_extraction_before_binding
    allowed_usage:
      - skill_semantic_extraction
      - skill_package_classification
      - misuse_warning_drafting
    forbidden_usage:
      - binding_a_skill_without_extraction
      - altering_locked_skill_semantics              # may record but never change prism/verification-loop
      - bug_finding
    rules:

      - rule_id: skill_architect.may_not_alter_locked_semantics
        description: >-
          skill-architect may RECORD a skill's semantics but MUST NOT emit an
          extraction that reclassifies prism (away from divergence) or
          verification-loop (away from defect finding).
        severity: blocker
        required_when: extraction.subject_skill in [prism, verification-loop]
        pass_condition: >-
          (extraction.subject_skill == prism AND extraction.semantic_category == divergence)
          OR (extraction.subject_skill == verification-loop AND extraction.semantic_category == verification_defect_discovery)
        fail_condition: >-
          (extraction.subject_skill == prism AND extraction.semantic_category != divergence)
          OR (extraction.subject_skill == verification-loop AND extraction.semantic_category != verification_defect_discovery)
        on_fail: block_extraction                    # the reclassifying extraction is refused
        rework_route: skill_governance:skill_semantic_extraction
        evidence_required:
          - skill_semantic_extract_schema
        trace_required:
          - skill_governance_trace_schema

      - rule_id: skill_architect.extraction_precedes_binding
        description: >-
          skill-architect performs extraction; binding is a separate later decision.
          A binding proposed without a completed extraction is forbidden.
        severity: blocker
        required_when: skill_binding.requested == true
        pass_condition: skill_binding.subject.semantic_extraction_status == complete
        fail_condition: skill_binding.subject.semantic_extraction_status != complete
        on_fail: block_binding
        rework_route: skill_governance:skill_semantic_extraction
        evidence_required:
          - skill_semantic_extract_schema
        trace_required:
          - skill_governance_trace_schema
    required_evidence:
      - skill_semantic_extract_schema
    required_trace:
      - skill_activation_trace_schema
      - skill_governance_trace_schema
    notes: >-
      CANDIDATE. The meta-skill that drives skill_semantic_extraction (SDLC stage 03
      and the skill-governance pipeline). Recommend RATIFY (no canonical equivalent).

