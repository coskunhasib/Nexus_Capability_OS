# =============================================================================
# Nexus AI — SKILL-SCOPE GOVERNANCE (applicable config layer)
# Phase E / doc 19 §9 (19-governance-audit-readiness-plan.md). Output of the
# Governance & Audit Implementation Readiness phase.
# Documentation / blueprint ONLY — NO runtime code, NO merge, NO deploy.
# =============================================================================
#
# WHAT THIS FILE IS
#   The APPLICABLE skill-scope governance layer. The Phase C registry
#   (configs/nexus-ai/governance_profiles.yaml, SCOPE: skill) is the CATALOG of
#   *what* skill-governance profiles exist. THIS file IMPLEMENTS them as granular,
#   per-skill governance_profiles with concrete, evaluatable RULES so the locked
#   skill semantics and the SDLC required gates can be evaluated from config.
#
#   Registry profile (catalog, WHAT exists)        -> implemented here AS
#   ---------------------------------------------     ----------------------------
#   brainstorming_skill_governance (prism)         -> gov.skill.prism
#   defect_finding_skill_governance (verifctn-loop)-> gov.skill.verification_loop
#   skill_governance (generic skill profile)       -> gov.skill.<each other skill>
#   locked_semantics_enforcement_policy            -> referenced by every profile;
#                                                     made evaluatable in prism +
#                                                     verification-loop rules
#   skill_must_have_semantic_extraction_before_    -> rule on EVERY profile
#     binding (== no_unread_skill_binding)
#
# CONTRACTS HONORED
#   governance_profile contract (doc 19 §4): governance_profile_id, scope, purpose,
#     applies_to, severity_default, rules, required_evidence, required_trace, owner,
#     escalation.
#   rule contract (doc 19 §5): rule_id, description, severity, required_when,
#     pass_condition, fail_condition, on_fail, rework_route, evidence_required,
#     trace_required.
#
# LOCKED DECISIONS honored
#   - Plugin CANCELLED: no plugin concept anywhere; no skill is a plugin.
#   - Governance != Audit: this file is GOVERNANCE only. It REFERENCES audit
#     schemas by id (they live in configs/nexus-ai/audit_schemas.yaml) but defines
#     none. required_evidence / required_trace point at those schema ids.
#   - Evidence != Trace: required_evidence lists EVIDENCE-family schema ids only;
#     required_trace lists TRACE-family schema ids only. They are NEVER merged and
#     the two schema families live in SEPARATE dirs
#     (configs/nexus-ai/audit/evidence_schemas/ vs .../audit/trace_schemas/).
#   - Skill != Tool: every applies_to here is a SKILL id from skills_registry.yaml.
#     No Core Ability, Tool, Agent, Sub-agent, or Plugin appears as a governed item.
#   - Core Abilities are NOT agents and NOT skills: they never appear as a governed
#     skill or as an owner. Owners/escalation targets are Agent roles / the skill
#     governance team — never a Core Ability, never the Supervisor.
#   - Supervisor != team lead. prism = brainstorming/divergence; verification-loop
#     = bug/defect finding. These boundaries are ENFORCED in rules below.
#
# LOCKED SKILL SEMANTICS — ENFORCED HERE (doc 03 §1/§5/§8; doc 19 §9; runtime
#   rules sdlc_pipeline_runtime_rules.yaml prism_as_non_divergence /
#   verification_loop_replaces_test_execution / concept_boundary_collapse):
#     * prism             = brainstorming / divergence ONLY.
#                           FORBIDDEN: bug finding (and any defect-discovery use).
#     * verification-loop = bug / defect finding ONLY.
#                           FORBIDDEN: general readiness checklist;
#                                      replacing test_execution (stage 14).
#
# RECONCILIATION (doc 19 RECONCILIATION INPUTS, applied consistently):
#   (a) no_self_approval and evidence_required are FIRST-CLASS governance_profile
#       ids (global scope, governance_profiles.yaml). The *_policy spellings are
#       recorded as ALIASES (see reconciliation_aliases below) — never as the
#       primary id.
#   (b) Authoritative TEAM names are used: skill_governance_team, knowledge_team
#       (NOT knowledge_memory_team), activation_team, operations_team.
#   (c) Core Abilities are referenced by lowercase REGISTRY id where a skill rule
#       must name one (e.g. a skill may not invoke the `os` ability); the
#       capitalized Name is kept only as a human label. (No skill here needs a
#       Core Ability reference except as a forbidden target; none is introduced.)
#
# AUTHORITATIVE SOURCES (read from disk for this file)
#   - configs/nexus-ai/skills_registry.yaml            # the 12 canonical + 6 candidate skills, allowed/forbidden_usage, used_by
#   - configs/nexus-ai/governance_profiles.yaml        # SCOPE: skill catalog profiles being implemented
#   - configs/nexus-ai/audit_schemas.yaml              # evidence/trace schema ids referenced by required_evidence/required_trace
#   - configs/nexus-ai/sdlc_pipeline_runtime_rules.yaml# locked anti-patterns (prism_as_non_divergence, etc.)
#   - configs/nexus-ai/stages/sdlc/*.yaml              # gate/on_fail/rework routes the rework_route fields align to
#   - docs/ai-sdlc-factory/03-governance-and-audit-layering.md  # §8 skill governance
#   - docs/ai-sdlc-factory/19-governance-audit-readiness-plan.md# §4/§5/§9 contracts + locked semantics
# =============================================================================

config_id: nexus_ai_governance_skill_scope
config_kind: governance_layer
scope: skill
layer: applicable                       # implements the Phase C catalog profiles
version: draft-0.1
status: draft
phase: E
source_doc: docs/ai-sdlc-factory/19-governance-audit-readiness-plan.md
implements_registry: configs/nexus-ai/governance_profiles.yaml#scope=skill
no_plugin: true

# ----- closed vocabularies (mirror the registries) ---------------------------
severity_vocabulary: [blocker, major, advisory, informational]   # doc 19 §5 rule severities
scope_vocabulary: [global, pipeline, team, stage, core_ability, skill, tool]

# ----- governance ownership & escalation defaults for the skill layer ---------
# Owners/escalation are Agent roles / the skill governance TEAM — NEVER a Core
# Ability, NEVER the Supervisor (locked). skill_governance_team is the
# authoritative team name (reconciliation (b)).
skill_layer_defaults:
  owner: skill_librarian_agent                     # authors/maintains skill semantics + governance bindings
  decision_owner: skill_runtime_safety_agent       # decides activate/hold/deprecate (proposer != decider)
  escalation:
    - skill_governance_team_lead                   # team-lead orchestrates; cannot bypass a blocking gate (no_policy_bypass)
    - owner_human_gate                             # human/owner authority for unresolved blocker semantics violations
  governing_team: skill_governance_team            # authoritative team name (NOT knowledge_memory_team)
  # Profiles that EVERY skill profile inherits (catalog ids from the Phase C registry):
  inherited_governance_profiles:
    - skill_governance                             # generic skill-level governance umbrella (registry, stage-03 + class default)
    - locked_semantics_enforcement_policy          # repo-wide locked semantics (registry, skill scope)
    - skill_must_have_semantic_extraction_before_binding   # == no_unread_skill_binding (doc 06 §3); gated by skill_semantic_required_gate
  # Cross-cutting global policies re-shown at the skill layer (first-class ids;
  # see reconciliation_aliases for the *_policy spellings):
  cross_cutting_policies:
    - evidence_required                            # every gate decision needs evidence (alias: evidence_required_policy)
    - trace_required                               # every governed skill activation emits a trace
    - no_policy_bypass                             # no actor may pass a blocking skill gate

# ----- reconciliation: first-class ids vs *_policy alias spellings (doc 19 (a)) -
reconciliation_aliases:
  - canonical: no_self_approval                    # FIRST-CLASS id (global scope)
    alias: no_self_approval_policy                 # spelling recorded as alias only
  - canonical: evidence_required                   # FIRST-CLASS id (global scope)
    alias: evidence_required_policy
  - canonical: skill_must_have_semantic_extraction_before_binding
    alias: no_unread_skill_binding                 # doc 06 §3 spelling

# ----- audit schema families referenced below (defined in audit_schemas.yaml) --
# Listed so a reader can confirm Evidence and Trace are kept in SEPARATE families
# (and, at rest, SEPARATE dirs). This file references them by id only.
referenced_audit_schemas:
  evidence_family:                                 # -> configs/nexus-ai/audit/evidence_schemas/
    - bug_finding_evidence_schema                  # verification-loop defect evidence (stage 15)
    - skill_semantic_extract_schema                # skill semantic-extraction evidence
    - script_audit_evidence_schema                 # script/reference safety-audit evidence
    - skill_misuse_warning_schema                  # misuse-warning evidence
    - skill_binding_decision_schema                # binding/activation decision proof
    - sdlc_pipeline_evidence_schema                # SDLC decision-evidence set (gap/coverage skills feed it)
    - release_evidence_schema                      # release minimum evidence set
    - source_evidence_schema                       # research source evidence
  trace_family:                                    # -> configs/nexus-ai/audit/trace_schemas/
    - skill_activation_trace_schema                # EVERY skill activation emits this (skill_class_defaults)
    - skill_governance_trace_schema                # skill-governance pipeline trace
    - stage_gate_trace_schema                      # gate-evaluation provenance
    - decision_trace_schema                        # multi-perspective decision history

# =============================================================================
# SKILL-SCOPE GOVERNANCE PROFILES
#   One profile per skill. Canonical 12 first, then the 6 candidates.
#   prism + verification-loop carry the LOCKED-semantics enforcement rules.
# =============================================================================
governance_profiles:

  # ===========================================================================
  # CANONICAL 12
  # ===========================================================================

  # -------------------------------------------------------------------------
  # prism — brainstorming / divergence ONLY (LOCKED). Implements the registry
  # profile `brainstorming_skill_governance`.
  # -------------------------------------------------------------------------
  - governance_profile_id: gov.skill.prism
    implements: brainstorming_skill_governance       # Phase C registry catalog id
    scope: skill
    purpose: >-
      Govern the prism skill so it is used for brainstorming / divergent thinking
      ONLY. prism widens the option space and never decides, gates readiness, or
      finds defects. Enforces the locked semantic boundary (prism != defect
      finding) and the no-binding-before-semantics rule.
    applies_to:
      - skill:prism                                  # registry id; label "Prism"
    severity_default: blocker
    owner: skill_librarian_agent
    escalation:
      - skill_governance_team_lead
      - owner_human_gate
    inherited_governance_profiles:
      - skill_governance
      - locked_semantics_enforcement_policy
      - skill_must_have_semantic_extraction_before_binding
    allowed_usage:                                   # mirror of skills_registry.yaml (governance view)
      - divergent_exploration
      - option_space_expansion
      - brainstorming
      - requirement_elicitation
      - candidate_architecture_generation
      - failure_mode_and_abuse_case_ideation
      - subskill_of_llm_council_or_sentinel
    forbidden_usage:
      - bug_finding                                  # LOCKED
      - defect_finding
      - general_readiness_gate
      - final_release_approval
      - decision_making
    rules:

      - rule_id: prism.semantics_locked_divergence_only
        description: >-
          prism MUST be activated only for brainstorming / divergence (option-space
          expansion). Its semantic_category must remain `divergence`; any binding or
          extraction that reclassifies prism (e.g. to defect finding or a readiness
          gate) is a locked-semantics violation.
        severity: blocker
        required_when: skill_activation.skill_id == prism
        pass_condition: >-
          activation.intended_use in prism.allowed_usage
          AND prism.semantic_category == divergence
          AND activation.intended_use not in [bug_finding, defect_finding,
              general_readiness_gate, decision_making, final_release_approval]
        fail_condition: >-
          activation.intended_use in [bug_finding, defect_finding,
          general_readiness_gate, decision_making, final_release_approval]
          OR prism.semantic_category != divergence
        on_fail: block_activation                    # the activation is refused; no divergence-skill reuse for defect/readiness
        rework_route: skill_governance:skill_semantic_extraction   # re-extract/correct semantics before any binding
        evidence_required:
          - skill_semantic_extract_schema            # evidence the semantic record still says divergence
        trace_required:
          - skill_activation_trace_schema
          - skill_governance_trace_schema

      - rule_id: prism.not_a_bug_finder
        description: >-
          prism MUST NOT be substituted for verification-loop or used to produce a
          defect/bug report. Defect discovery is verification-loop's exclusive role.
        severity: blocker
        required_when: stage.requires_defect_finding == true OR activation.intended_use == bug_finding
        pass_condition: stage.bound_defect_skill == verification-loop AND activation.skill_id != prism_for_defects
        fail_condition: activation.skill_id == prism AND activation.intended_use in [bug_finding, defect_finding]
        on_fail: block_activation
        rework_route: sdlc:15-verification-loop-bug-finding         # defect finding belongs to the verification-loop stage/skill
        evidence_required:
          - skill_semantic_extract_schema
        trace_required:
          - skill_activation_trace_schema

      - rule_id: prism.not_a_readiness_or_decision_gate
        description: >-
          prism output is options, never a decision or a readiness verdict. It must
          not stand in as a readiness/coverage gate or a release approval.
        severity: blocker
        required_when: gate.kind in [readiness_gate, release_gate, decision_gate]
        pass_condition: gate.bound_skill != prism
        fail_condition: gate.bound_skill == prism
        on_fail: block_gate_binding
        rework_route: skill_governance:skill_binding_proposal       # re-propose with an appropriate skill (gap-audit/calibrate/judge)
        evidence_required:
          - skill_binding_decision_schema
        trace_required:
          - stage_gate_trace_schema

      - rule_id: prism.semantic_extraction_before_binding
        description: >-
          prism may only be bound to a stage after skill_semantic_extraction has
          produced its semantic record (no_unread_skill_binding).
        severity: blocker
        required_when: skill_binding.skill_id == prism
        pass_condition: prism.semantic_extraction_status == complete
        fail_condition: prism.semantic_extraction_status != complete
        on_fail: block_binding
        rework_route: sdlc:03-skill-semantic-extraction
        evidence_required:
          - skill_semantic_extract_schema
        trace_required:
          - skill_governance_trace_schema
    required_evidence:                               # EVIDENCE-family schema ids only (separate dir)
      - skill_semantic_extract_schema
    required_trace:                                  # TRACE-family schema ids only (separate dir)
      - skill_activation_trace_schema
      - skill_governance_trace_schema
    notes: >-
      Implements registry brainstorming_skill_governance. Enforced cross-file by
      sdlc_pipeline_runtime_rules.yaml `prism_as_non_divergence`. Correctly absent
      from every review/validation/readiness stage (skills_registry used_by).

  # -------------------------------------------------------------------------
  # verification-loop — bug / defect finding ONLY (LOCKED). Implements the
  # registry profile `defect_finding_skill_governance`.
  # -------------------------------------------------------------------------
  - governance_profile_id: gov.skill.verification_loop
    implements: defect_finding_skill_governance      # Phase C registry catalog id
    scope: skill
    purpose: >-
      Govern the verification-loop skill so it is used for bug / defect finding
      ONLY. It performs a rigorous defect sweep and emits a defect report + a
      blocking gate result with residual risk — it is NOT a general readiness
      checklist and is NOT a replacement for stage 14 test_execution.
    applies_to:
      - skill:verification-loop                      # registry id; label "Verification-loop"
    severity_default: blocker
    owner: skill_librarian_agent
    escalation:
      - skill_governance_team_lead
      - owner_human_gate
    inherited_governance_profiles:
      - skill_governance
      - locked_semantics_enforcement_policy
      - skill_must_have_semantic_extraction_before_binding
    allowed_usage:
      - bug_finding
      - defect_finding
      - verification_sweep
      - adversarial_defect_discovery
      - migration_defect_finding
      - script_defect_sweep
      - post_fix_regression_review
    forbidden_usage:
      - general_readiness_checklist                  # LOCKED
      - replacing_test_execution                     # LOCKED
      - ideation
      - architecture_brainstorming
      - bug_free_guarantee
    rules:

      - rule_id: verification_loop.semantics_locked_defect_only
        description: >-
          verification-loop MUST be activated only for bug/defect finding. Its
          semantic_category must remain `verification_defect_discovery`; any binding
          or extraction that reclassifies it (e.g. to a readiness checklist or
          ideation) is a locked-semantics violation.
        severity: blocker
        required_when: skill_activation.skill_id == verification-loop
        pass_condition: >-
          activation.intended_use in verification-loop.allowed_usage
          AND verification-loop.semantic_category == verification_defect_discovery
          AND activation.intended_use not in [general_readiness_checklist,
              replacing_test_execution, ideation, architecture_brainstorming]
        fail_condition: >-
          activation.intended_use in [general_readiness_checklist,
          replacing_test_execution, ideation, architecture_brainstorming]
          OR verification-loop.semantic_category != verification_defect_discovery
        on_fail: block_activation
        rework_route: skill_governance:skill_semantic_extraction
        evidence_required:
          - skill_semantic_extract_schema
        trace_required:
          - skill_activation_trace_schema
          - skill_governance_trace_schema

      - rule_id: verification_loop.not_a_test_execution_replacement
        description: >-
          verification-loop MUST NOT replace stage 14 test_execution. test_execution
          runs the suite; verification-loop sweeps for defects beyond what the suite
          caught. A run that skips test_execution and uses verification-loop in its
          place is forbidden.
        severity: blocker
        required_when: stage.id == "sdlc:14-test-execution" OR activation.intended_use == replacing_test_execution
        pass_condition: >-
          test_execution.executed == true
          AND verification-loop.not_bound_as(test_execution_substitute)
        fail_condition: >-
          activation.intended_use == replacing_test_execution
          OR (test_execution.executed == false AND stage.bound_skill == verification-loop)
        on_fail: block_activation
        rework_route: sdlc:14-test-execution                       # run the suite first; verification-loop is stage 15
        evidence_required:
          - bug_finding_evidence_schema              # stage-15 defect evidence (distinct from test results)
        trace_required:
          - skill_activation_trace_schema

      - rule_id: verification_loop.not_a_readiness_checklist
        description: >-
          verification-loop MUST NOT be reused as a general readiness/coverage
          checklist (the exact locked anti-pattern stages 29/30 refuse). Readiness
          adjudication uses gap-audit + calibrate + release-readiness-judge.
        severity: blocker
        required_when: gate.kind == readiness_gate OR activation.intended_use == general_readiness_checklist
        pass_condition: gate.bound_skill != verification-loop
        fail_condition: gate.bound_skill == verification-loop AND gate.kind == readiness_gate
        on_fail: block_gate_binding
        rework_route: skill_governance:skill_binding_proposal       # bind a readiness skill instead (gap-audit/judge)
        evidence_required:
          - skill_binding_decision_schema
        trace_required:
          - stage_gate_trace_schema

      - rule_id: verification_loop.defect_evidence_required
        description: >-
          A verification-loop defect sweep MUST emit a defect report and a blocking
          gate result (blocker bug count == 0 to pass). It produces residual risk,
          never a bug-free guarantee.
        severity: blocker
        required_when: stage.id == "sdlc:15-verification-loop-bug-finding"
        pass_condition: bug_finding_report.present == true AND defect_gate.blocker_bug_count == 0
        fail_condition: bug_finding_report.absent == true OR defect_gate.blocker_bug_count > 0
        on_fail: rework                              # defects route back to fix; the gate blocks
        rework_route: sdlc:11-implementation                       # fix the defects, then re-run 14 -> 15
        evidence_required:
          - bug_finding_evidence_schema
        trace_required:
          - skill_activation_trace_schema
          - stage_gate_trace_schema

      - rule_id: verification_loop.semantic_extraction_before_binding
        description: >-
          verification-loop may only be bound to a stage after skill_semantic_
          extraction has produced its semantic record (no_unread_skill_binding).
        severity: blocker
        required_when: skill_binding.skill_id == verification-loop
        pass_condition: verification-loop.semantic_extraction_status == complete
        fail_condition: verification-loop.semantic_extraction_status != complete
        on_fail: block_binding
        rework_route: sdlc:03-skill-semantic-extraction
        evidence_required:
          - skill_semantic_extract_schema
        trace_required:
          - skill_governance_trace_schema
    required_evidence:
      - bug_finding_evidence_schema
      - skill_semantic_extract_schema
    required_trace:
      - skill_activation_trace_schema
      - skill_governance_trace_schema
      - stage_gate_trace_schema
    notes: >-
      Implements registry defect_finding_skill_governance. Enforced cross-file by
      sdlc_pipeline_runtime_rules.yaml `verification_loop_replaces_test_execution`
      and the `concept_boundary_collapse` guard. Stage 29 explicitly refuses to
      reuse it as a readiness checklist.

  # -------------------------------------------------------------------------
  # sentinel — premortem / risk foresight (informs a gate; never sole approver).
  # -------------------------------------------------------------------------
  - governance_profile_id: gov.skill.sentinel
    implements: skill_governance                     # generic skill-level governance (registry)
    scope: skill
    purpose: >-
      Govern the sentinel skill as pre-commitment stress test / premortem / risk
      foresight. sentinel surfaces hidden assumptions and failure paths; it informs
      a gate but is never the sole approver, and it is not a defect finder.
    applies_to:
      - skill:sentinel
    severity_default: major
    owner: skill_librarian_agent
    escalation:
      - skill_governance_team_lead
      - owner_human_gate
    inherited_governance_profiles:
      - skill_governance
      - locked_semantics_enforcement_policy
      - skill_must_have_semantic_extraction_before_binding
    allowed_usage:
      - premortem
      - risk_surfacing
      - hidden_assumption_surfacing
      - adversarial_foresight
      - pre_commitment_review
      - misuse_scenario_premortem
    forbidden_usage:
      - implementation
      - final_approval_by_itself
      - bug_finding                                  # defect discovery is verification-loop
    rules:

      - rule_id: sentinel.not_sole_approver
        description: >-
          sentinel may inform a readiness/validation gate but MUST NOT be recorded as
          the sole approver of that gate (no_self_approval / owner-decision still applies).
        severity: blocker
        required_when: gate.kind in [readiness_gate, decision_gate, validation_gate]
        pass_condition: gate.owner_agent != null AND gate.sole_approver != skill:sentinel
        fail_condition: gate.sole_approver == skill:sentinel
        on_fail: block_gate_binding
        rework_route: skill_governance:skill_binding_proposal
        evidence_required:
          - skill_binding_decision_schema
        trace_required:
          - stage_gate_trace_schema
          - decision_trace_schema

      - rule_id: sentinel.not_a_bug_finder
        description: >-
          sentinel performs foresight, not defect discovery. It must not be bound as
          the defect-finding skill (that is verification-loop).
        severity: blocker
        required_when: stage.requires_defect_finding == true
        pass_condition: stage.bound_defect_skill == verification-loop
        fail_condition: stage.bound_defect_skill == skill:sentinel
        on_fail: block_activation
        rework_route: sdlc:15-verification-loop-bug-finding
        evidence_required:
          - skill_semantic_extract_schema
        trace_required:
          - skill_activation_trace_schema

      - rule_id: sentinel.semantic_extraction_before_binding
        description: sentinel may only be bound after its semantic record exists (no_unread_skill_binding).
        severity: blocker
        required_when: skill_binding.skill_id == sentinel
        pass_condition: sentinel.semantic_extraction_status == complete
        fail_condition: sentinel.semantic_extraction_status != complete
        on_fail: block_binding
        rework_route: sdlc:03-skill-semantic-extraction
        evidence_required:
          - skill_semantic_extract_schema
        trace_required:
          - skill_governance_trace_schema
    required_evidence:
      - skill_semantic_extract_schema
    required_trace:
      - skill_activation_trace_schema
    notes: >-
      Generic skill_governance + locked-semantics. Bound across design/risk/pre-
      commitment surfaces (skills_registry used_by). Activation, operations bind it
      as foresight; prism/verification-loop are intentionally NOT bound in activation.

  # -------------------------------------------------------------------------
  # llm-council — multi-perspective adjudication (informs; does not replace owner).
  # -------------------------------------------------------------------------
  - governance_profile_id: gov.skill.llm_council
    implements: skill_governance
    scope: skill
    purpose: >-
      Govern the llm-council skill as multi-perspective decision review / verdict
      synthesis for genuinely contested judgement. It informs a decision; it MUST
      NOT replace the single recorded owner decision, execute code, or bypass policy.
    applies_to:
      - skill:llm-council
    severity_default: major
    owner: skill_librarian_agent
    escalation:
      - skill_governance_team_lead
      - owner_human_gate
    inherited_governance_profiles:
      - skill_governance
      - locked_semantics_enforcement_policy
      - skill_must_have_semantic_extraction_before_binding
    allowed_usage:
      - multi_perspective_review
      - verdict_synthesis
      - contested_judgement_adjudication
      - option_scoring
      - severity_adjudication
      - binding_proposal_review
    forbidden_usage:
      - direct_code_execution
      - policy_bypass
      - replacing_a_single_owner_decision_record
    rules:

      - rule_id: llm_council.does_not_replace_owner_decision
        description: >-
          llm-council informs a decision gate; the gate MUST still record a single
          owner decision (producer != approver preserved). The council verdict is
          not itself the recorded owner decision.
        severity: blocker
        required_when: gate.kind == decision_gate AND gate.uses_skill == llm-council
        pass_condition: gate.owner_decision_record.present == true AND gate.owner_agent != null
        fail_condition: gate.owner_decision_record.absent == true AND gate.sole_basis == skill:llm-council
        on_fail: block_gate_decision
        rework_route: skill_governance:skill_activation_decision
        evidence_required:
          - skill_binding_decision_schema
