# =============================================================================
# Nexus AI — Team-Scope Governance (APPLICABLE LAYER): skill_governance_team
# =============================================================================
# Phase E / doc 19. DEDICATED team-scope governance profile CREATED here — the
# Phase C registry had team-scope profiles ONLY for sdlc_team and research_team;
# skill_governance_team lacked one (doc 19 reconciliation input c). This profile
# expresses the skill_governance_team's role-separation rules per §4/§5 so the
# skill-governance pipeline's required gates can be evaluated from config.
#
# Documentation / blueprint ONLY. NO runtime code. NO merge. NO deploy.
#
# LOCKED DECISIONS honored: plugin cancelled (no plugin field); Governance !=
# Audit; Evidence != Trace (required_evidence vs required_trace never merged);
# Core Abilities are not agents (Supervisor != skill_governance_team_lead); a Team
# is a passive boundary, the team_lead orchestrates and never owns a stage /
# bypasses a gate. Skill != Tool. LOCKED SEMANTICS: prism = brainstorming/
# divergence, verification-loop = bug/defect finding — never redefined.
#
# NAMING RECONCILIATION: no_self_approval / evidence_required are first-class ids;
# *_policy spellings are aliases. Authoritative team name: skill_governance_team.
# skill_librarian_agent is shared with sdlc_team; skill_semantic_extractor_subagent
# is PARENTED to skill_librarian_agent (no orphan).
#
# AUTHORITATIVE SOURCES (read from disk)
#   - configs/nexus-ai/governance_profiles.yaml  # skill_governance_pipeline_governance; skill_semantic_required_gate; script_reference_audit_gate; misuse_warning_required_gate; skill_binding_proposal_gate; skill_activation_decision_gate; locked_semantics_enforcement_policy; global no_self_approval / no_policy_bypass / evidence_required / trace_required
#   - configs/nexus-ai/team_templates.yaml       # skill_governance_team roster (2 agents + 1 parented sub-agent) + team_lead + forbidden_actions (binding_proposed_without_semantics, skill_activated_without_misuse_warnings, locked_semantics_violation, self_approval_of_activation_decision)
#   - configs/nexus-ai/team_lead_roles.yaml      # skill_governance_team_lead forbidden_actions / blocking_limits
#   - configs/nexus-ai/audit_schemas.yaml        # skill_governance_evidence_schema; skill_semantic_extract_schema; skill_misuse_warning_schema; skill_binding_decision_schema; skill_governance_trace_schema
#   - docs/ai-sdlc-factory/03-governance-and-audit-layering.md §8  # locked prism/verification-loop semantics
# =============================================================================

version: draft-0.1
config_kind: team_scope_governance_profile
status: candidate                      # NEW dedicated team-scope profile (reconciliation input c)
no_plugin: true
registry_ref: null
composes_pipeline_profile: skill_governance_pipeline_governance

governance_id_aliases:
  no_self_approval: [no_self_approval_policy]
  evidence_required: [evidence_required_policy]

# =============================================================================
# GOVERNANCE PROFILE (doc 19 §4)
# =============================================================================
governance_profile_id: skill_governance_team_governance
scope: team
purpose: >-
  Intra-team role-separation governance for the skill_governance_team: the agent
  that proposes a skill binding (skill_librarian_agent) cannot be the agent that
  decides activation (skill_runtime_safety_agent) — proposer != decider, no
  self-approval of one's own binding; no skill is bound before its semantics are
  extracted; no skill is activated before misuse warnings exist and an unsafe
  script is mitigated; the locked semantics of prism (brainstorming/divergence)
  and verification-loop (bug/defect finding) are never altered; and the
  skill_governance_team_lead orchestrates but is not the Supervisor Core Ability
  and may never bypass a gate. Makes the semantics -> audit -> misuse -> binding
  -> activation separation evaluable from config.
applies_to:
  team: skill_governance_team
  team_lead: skill_governance_team_lead
  pipeline: skill_governance_pipeline
  agents:
    - skill_librarian_agent           # skill_intake, skill_binding_proposal, skill_deprecation_update (binding PROPOSER) [also in sdlc_team]
    - skill_runtime_safety_agent      # script_reference_audit, misuse_warning_generation, skill_activation_decision (DECIDER)
  sub_agents:
    - skill_semantic_extractor_subagent   # owns skill_semantic_extraction (#2); PARENTED to skill_librarian_agent (no orphan)
  stages:
    - skill_semantic_extraction
    - script_reference_audit
    - misuse_warning_generation
    - skill_binding_proposal
    - skill_activation_decision
severity_default: blocker
owner: skill_governance_team_lead      # orchestrator/escalation owner; NOT a stage owner, NOT Supervisor
escalation:
  on_blocker: halt_pipeline_and_record_gate_failure
  notify: skill_governance_team_lead
  forbidden_resolution:
    - team_lead_override_of_failed_gate
    - supervisor_core_ability_acts_as_team_lead
    - binding_proposer_self_approves_activation_decision
    - locked_semantics_redefinition

required_evidence:                     # EVIDENCE family — audit/evidence_schemas/
  - skill_governance_evidence_schema
  - skill_semantic_extract_schema
  - skill_misuse_warning_schema
  - skill_binding_decision_schema
required_trace:                        # TRACE family — audit/trace_schemas/
  - skill_governance_trace_schema
  - stage_gate_trace_schema

composes_governance_profiles:
  - no_self_approval
  - no_policy_bypass
  - evidence_required
  - trace_required
  - skill_governance_pipeline_governance   # pipeline-scope umbrella re-shown in team context
  - skill_semantic_required_gate
  - script_reference_audit_gate
  - misuse_warning_required_gate
  - skill_binding_proposal_gate
  - skill_activation_decision_gate
  - locked_semantics_enforcement_policy

# =============================================================================
# RULES (doc 19 §5)
# =============================================================================
rules:

  - rule_id: skillgov_proposer_ne_activation_decider
    description: >-
      The binding proposer (skill_librarian_agent) cannot own the
      skill_activation_decision gate: activation is decided by
      skill_runtime_safety_agent, distinct from the proposer (proposer != decider;
      no self-approval of one's own binding). Direct expression of skill-governance
      forbidden_action self_approval_of_activation_decision.
    severity: blocker
    required_when: stage == skill_activation_decision
    pass_condition: >-
      skill_activation_decision.owner_agent == skill_runtime_safety_agent AND
      skill_activation_decision.owner_agent != skill_binding_proposal.owner_agent
    fail_condition: skill_activation_decision.owner_agent == skill_binding_proposal.owner_agent
    on_fail: block_skill_activation_decision_and_reassign_to_distinct_decider
    rework_route: skill_binding_proposal
    evidence_required:
      - skill_binding_decision_schema
    trace_required:
      - skill_governance_trace_schema

  - rule_id: skillgov_no_binding_without_semantics
    description: >-
      No skill binding may be proposed before its semantic extraction exists
      (skill_semantic_required_gate). Direct expression of skill-governance
      forbidden_action binding_proposed_without_semantics and the runtime
      anti-pattern skill_binding_without_semantic_extraction.
    severity: blocker
    required_when: stage == skill_binding_proposal
    pass_condition: skill_semantic_extraction_present == true
    fail_condition: skill_semantic_extraction_present == false
    on_fail: block_skill_binding_proposal
    rework_route: skill_semantic_extraction
    evidence_required:
      - skill_semantic_extract_schema
    trace_required:
      - skill_governance_trace_schema

  - rule_id: skillgov_no_activation_without_misuse_warnings_and_safe_scripts
    description: >-
      No skill is activated before misuse warnings exist
      (misuse_warning_required_gate) and any unsafe script is mitigated
      (script_reference_audit_gate). Direct expression of skill-governance
      forbidden_action skill_activated_without_misuse_warnings.
    severity: blocker
    required_when: stage == skill_activation_decision
    pass_condition: >-
      misuse_warnings_present == true AND
      unsafe_script_findings_unmitigated == 0
    fail_condition: >-
      misuse_warnings_present == false OR
      unsafe_script_findings_unmitigated > 0
    on_fail: block_skill_activation_decision
    rework_route: misuse_warning_generation
    evidence_required:
      - skill_misuse_warning_schema
    trace_required:
      - skill_governance_trace_schema

  - rule_id: skillgov_locked_semantics_enforcement
    description: >-
      The locked semantics of prism (brainstorming/divergence) and
      verification-loop (bug/defect finding) may never be redefined by any binding,
      misuse warning, or activation decision (locked_semantics_enforcement_policy).
      Direct expression of skill-governance forbidden_action
      locked_semantics_violation.
    severity: blocker
    required_when: a_binding_or_activation_touches_prism_or_verification_loop
    pass_condition: >-
      prism_semantics == brainstorming_divergence AND
      verification_loop_semantics == bug_defect_finding
    fail_condition: >-
      prism_semantics != brainstorming_divergence OR
      verification_loop_semantics != bug_defect_finding
    on_fail: reject_binding_or_activation_violating_locked_semantics
    rework_route: skill_semantic_extraction
    evidence_required:
      - skill_semantic_extract_schema
    trace_required:
      - skill_governance_trace_schema

  - rule_id: skillgov_no_failed_gate_bypass
    description: >-
      No actor in the skill_governance_team — including the
      skill_governance_team_lead — may override, skip, or pass a blocking
      governance gate (global no_policy_bypass re-shown in team context).
    severity: blocker
    required_when: any_blocking_gate_is_evaluated
    pass_condition: blocking_gate_satisfied_before_progression == true
    fail_condition: blocking_gate_overridden_without_satisfaction == true
    on_fail: halt_pipeline_and_record_policy_bypass_attempt
    rework_route: return_to_blocking_gate_owner_stage
    evidence_required:
      - skill_governance_evidence_schema
    trace_required:
      - skill_governance_trace_schema

  - rule_id: skillgov_team_lead_role_separation
    description: >-
      The skill_governance_team_lead orchestrates only: it never owns a stage,
      never lets the binding proposer self-approve the activation decision, never
      alters locked semantics, is never the Supervisor Core Ability, and never
      bypasses a gate (supervisor_as_team_lead and team_as_stage_owner
      anti-patterns).
    severity: blocker
    required_when: skill_governance_team_lead_acts_on_a_gate_or_stage
    pass_condition: >-
      skill_governance_team_lead != supervisor_core_ability AND
      skill_governance_team_lead_owns_no_stage == true AND
      skill_governance_team_lead_did_not_allow_proposer_self_approval == true AND
      skill_governance_team_lead_did_not_alter_locked_semantics == true AND
      skill_governance_team_lead_did_not_bypass_any_gate == true
    fail_condition: >-
      skill_governance_team_lead_is_supervisor_core_ability == true OR
      skill_governance_team_lead_owns_a_stage == true OR
      skill_governance_team_lead_allowed_proposer_self_approval == true OR
      skill_governance_team_lead_altered_locked_semantics == true OR
      skill_governance_team_lead_bypassed_a_gate == true
    on_fail: reject_team_lead_action_and_reassign
    rework_route: reassign_to_compliant_owner_or_distinct_decider
    evidence_required:
      - skill_governance_evidence_schema
    trace_required:
      - skill_governance_trace_schema

# =============================================================================
# VALIDATION SELF-CHECK (doc 19 §14)
# =============================================================================
validation_self_check:
  scope_is_known: true
  every_rule_has_severity: true
  every_blocker_rule_has_on_fail: true
  evidence_and_trace_kept_distinct: true
  no_plugin_governance_introduced: true
  core_ability_is_not_an_agent: true                # Supervisor != skill_governance_team_lead
notes: >-
  NEW dedicated team-scope governance for skill_governance_team (reconciliation
  input c). Layered over the pipeline-scope skill_governance_pipeline_governance
  and the gate profiles skill_semantic_required_gate / script_reference_audit_gate
  / misuse_warning_required_gate / skill_binding_proposal_gate /
  skill_activation_decision_gate / locked_semantics_enforcement_policy. prism and
  verification-loop semantics are LOCKED and never redefined.
