# =============================================================================
# Nexus AI — Audit / EVIDENCE Schemas — SDLC Pipeline
# =============================================================================
# Phase E / doc 19 §12 output. Documentation/blueprint ONLY — NO runtime code,
# NO merge, NO deploy.
#
# This file MATERIALIZES the `type: evidence_schema` items whose owner_domain is
# `sdlc` from the Phase C catalog (configs/nexus-ai/audit_schemas.yaml) into the
# applicable, per-scope audit-schema config layer required by doc 19 §13:
#     configs/nexus-ai/audit/evidence_schemas/*.yaml
#
# -----------------------------------------------------------------------------
# LOCKED DECISIONS honored
# -----------------------------------------------------------------------------
#   - Plugin CANCELLED: no plugin schema/registry/concept appears anywhere.
#   - Audit != Governance: this is an AUDIT file; governance profiles live in
#     configs/nexus-ai/governance/** and the registry
#     configs/nexus-ai/governance_profiles.yaml.
#   - Evidence != Trace (locked K-008; doc 03 §10–§12; doc 19 §11): EVIDENCE ONLY
#     lives here. Trace schemas live in the SEPARATE directory
#     configs/nexus-ai/audit/trace_schemas/ and are NEVER merged in.
#       * This file therefore contains ONLY type: evidence_schema items.
#       * decision_record_schema and gate_result_schema are Evidence-FAMILY but
#         are a DISTINCT `type` (doc 19 §12 type vocabulary); they are NOT
#         emitted here. See OPEN QUESTIONS in the index file.
#   - Core Abilities [Supervisor, Coder, Vision, Audio, Creative, Memory, Web, OS]
#     are NOT agents: they never appear as a `producer` or `consumer`. Those are
#     always snake_case Agent roles, a gate id, or the policy/evidence engine.
#     Supervisor != any *_team_lead.
#
# -----------------------------------------------------------------------------
# AUDIT SCHEMA CONTRACT (doc 19 §12) — every item below carries EXACTLY:
#   audit_schema_id, type, applies_to, required_fields, producer, consumer,
#   retention, redaction_rules
# Field values are transcribed verbatim from the catalog so this applicable layer
# stays in lock-step with the single registry catalog (doc 19 §15: "SDLC required
# gates can be evaluated from configs"). Two non-contract labels are kept for
# traceability and break nothing downstream:
#   - registry_id : the catalog id (identical to audit_schema_id here) — anchor.
#   - name        : the human-facing Name label from the catalog.
# -----------------------------------------------------------------------------

version: draft-0.1
layer_id: nexus_ai_audit_evidence_schemas_sdlc
family: audit
audit_kind: evidence            # Evidence family ONLY (Evidence != Trace)
scope: pipeline
applies_to_pipeline: sdlc_pipeline
source_registry: configs/nexus-ai/audit_schemas.yaml
contract_ref: docs/ai-sdlc-factory/19-governance-audit-readiness-plan.md#12
purpose: >-
  Applicable per-scope EVIDENCE (decision-proof) audit-schema config for the SDLC
  pipeline. Each item is one type: evidence_schema record shape that an SDLC stage
  emits as decision proof. Trace (process history) is excluded by design and lives
  under configs/nexus-ai/audit/trace_schemas/.

