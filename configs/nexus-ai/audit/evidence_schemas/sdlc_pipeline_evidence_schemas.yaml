      - evidence_id
      - type
      - produced_by
      - related_pipeline
      - related_run
      - related_stage
      - related_agent
      - related_sub_agent
      - related_gate
      - source_artifacts
      - summary
      - status
      - created_at
    producer: stage_owner_agent
    consumer: evidence_graph_agent
    retention: retain_with_release_evidence
    redaction_rules:
      - no_raw_secret_exposure
      - raw_credential_redaction
      - redact_pii_in_source_artifacts

