# =============================================================================
# Nexus AI — Trace Schema (Audit / Trace family) — TRACE ONLY
# =============================================================================
# Phase E / doc 19 §12 materialization of ONE `type: trace_schema` item from the
# Phase C registry (configs/nexus-ai/audit_schemas.yaml). Documentation/blueprint
# only — NO runtime code, NO merge, NO deploy.
#
# STATUS: candidate — NEW schema introduced by the activation pipeline (doc 16 /
# pipeline-catalog-review §4.2). Referenced but not yet ratified; confirmed in
# Phase E. Do not treat as locked.
#
# LOCKED DECISIONS honored here:
#   - Audit != Governance. Governance profiles live in
#     configs/nexus-ai/governance_profiles.yaml (a SEPARATE file).
#   - Evidence != Trace (K-008 / doc 03 §10–§12; doc 19 §11). This is a TRACE
#     schema = operation/process history. It proves the PRODUCTION PATH of
#     evidence but is NEVER itself evidence and is NEVER merged with any
#     evidence_schema. Evidence schemas live in the SEPARATE sibling directory
#     configs/nexus-ai/audit/evidence_schemas/ — this directory holds traces only.
#   - Plugin cancelled: no plugin* key appears anywhere.
#   - Core Abilities are NOT agents; they never appear as producer or consumer.
# =============================================================================

version: draft-0.1
schema_family: trace            # Trace family ONLY (never evidence)
source_registry: configs/nexus-ai/audit_schemas.yaml
materializes: activation_transition_trace_schema

# ----- doc 19 §12 audit schema contract (authoritative) ----------------------
audit_schema_id: activation_transition_trace_schema
type: trace_schema
applies_to:
  - activation_pipeline
  - activation_transition_provenance
required_fields:
  - trace_id
  - type
  - actor
  - action
  - related_stage
  - from_phase
  - to_phase
  - input_refs
  - output_refs
  - status
  - timestamp
producer: activation_manager_agent   # snake_case Agent role; never a Core Ability
consumer: evidence_graph_agent
retention: retain_with_activation_record
redaction_rules:
  - no_raw_secret_exposure
  - redact_cohort_user_identifiers

# ----- registry context (doc 17 §3 contract — preserved for traceability) ----
registry_context:
  name: Activation Transition Trace Schema
  status: candidate
  owner_domain: activation_and_release_operations
  purpose: >-
    Trace record for activation stage transitions — the operation history of
    moving between activation phases (e.g. owner_decision_trace,
    rollback_drill_trace).
  allowed_usage:
    - Record activation stage-transition / phase-change lineage.
  forbidden_usage:
    - Used as an activation decision proof itself (that is
      activation_decision_evidence_schema — an evidence_schema, kept distinct).
    - Merged with any evidence_schema record (Evidence != Trace).
  notes: >-
    NEW (activation). The single NEW trace schema for activation; process history
    that supports — but is distinct from — activation evidence.

# ----- governance binding (Governance != Audit; ids live in the SEPARATE file) -
# Source registry binds `global_trace_required_policy` (alias of canonical
# `trace_required`) plus the pipeline governance `activation_pipeline_governance`.
governance_profiles:
  - trace_required                # canonical id (governance_profiles.yaml)
  - activation_pipeline_governance
governance_profile_aliases:
  trace_required:
    - global_trace_required_policy  # spelling used in audit_schemas.yaml

# ----- co-emitted audit schemas (SELF-CATEGORY cross-reference, doc 17 §8) -----
companion_evidence_schemas:
  - activation_evidence_schema             # activation evidence whose path this traces
  - activation_decision_evidence_schema    # activation decision proof (kept distinct)

# ----- usage mapping (doc 17 §13) ---------------------------------------------
used_by:
  pipelines:
    - activation_pipeline
  stages:
    - activation_intake
    - superadmin_preview
    - pilot_activation
    - pilot_evidence_review
    - public_activation_decision
    - rollback_readiness
    - activation_completion
  agents:
    - activation_manager_agent
