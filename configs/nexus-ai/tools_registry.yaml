# Nexus AI — Tools Registry
# Phase C / doc 17 (§6 Tools Registry). Output of the Shared Registry Formalization plan
#   docs/nexus-ai-orchestration-model/legacy/17-shared-registry-formalization-plan.md.
#
# WHAT THIS FILE IS
#   The single machine-readable answer to "what tools exist in the system?" (Shared Registry =
#   ownership/existence, per docs/nexus-ai-orchestration-model/legacy/05-shared-registry-and-usage-mapping.md §3 and
#   00a-shared-registry-decisions.md D-011/D-012). The *usage* relationship ("who/which stage/agent
#   uses a tool") is ALSO carried here per-item via `used_by`, so the usage-mapping rule is
#   enforceable from registry data alone (doc 17 §13 exit criterion). The same tools are additionally
#   shown under each stage's `uses_tools:` block in configs/nexus-ai/stages/sdlc/*.yaml and each
#   pipeline catalog entry — that repetition is usage, not re-ownership (05 §5, D-014).
#
# BLUEPRINT-ONLY. No runtime code, no merge, no deploy. Tool definitions are contracts, not
#   executables. `input_schema` / `output_schema` are logical shapes for later formalization.
#
# LOCKED-DECISION BOUNDARIES (carried verbatim from the task and the decision log):
#   - Plugin is cancelled and never reintroduced. There is no plugin registry and no plugin tool.
#   - Core Abilities [Supervisor, Coder, Vision, Audio, Creative, Memory, Web, OS] are NOT agents and
#     NOT team members; they live only in the Core Abilities registry. A Tool MAY be *provided_by* a
#     Core Ability (D-014: "Core Ability sub-operations appear as Tools"), but a Core Ability is never
#     itself a tool and never an `allowed_caller` value (callers are Agent roles / team leads).
#   - Skill != Tool. None of the canonical skills (prism, verification-loop, sentinel, llm-council,
#     fmea, adr-builder, gap-audit, prompt-fidelity, calibrate, refraction, fermi-decompose,
#     bayesian-update) and none of the 6 undeclared skills from
#     reviews/claude-code-skill-agent-review.md §8 (skill-architect, handoff-designer,
#     context-pack-builder, scanner-result-normalizer, evidence-graph-builder, release-readiness-judge)
#     are registered here — they belong in configs/nexus-ai/skills_registry.yaml.
#   - Governance != Audit; Evidence != Trace. `governance_profiles` reference the Governance Profiles
#     registry (configs/nexus-ai/governance_profiles.yaml, Phase E); `audit_schemas` reference the
#     Audit Schemas registry (configs/nexus-ai/audit_schemas.yaml, Phase E). Both are referenced by
#     id here; their definitions are NOT inlined.

registry_id: nexus_ai_tools_registry
version: draft-0.1
category: tool
owner_doc: docs/nexus-ai-orchestration-model/legacy/17-shared-registry-formalization-plan.md
applies_rule: docs/nexus-ai-orchestration-model/legacy/05-shared-registry-and-usage-mapping.md   # Shared Registry + Usage Mapping

# STATUS VOCABULARY (doc 17 §3 / task)
status_vocabulary:
  canonical: Locked/established — present in the Phase A canonical SDLC stage contracts and/or the
             shared-registry usage example (05 §3). Ratified.
  candidate: Referenced by a stage or pipeline but not yet ratified into the canonical shared set.
             All NON-CANONICAL inline SDLC tools and all newly pipeline-introduced tools are candidate.
  deprecated: Superseded; retained only so existing references resolve. (None defined yet — superseded
              legacy tool names are recorded as `aliases` on the canonical tool that absorbed them,
              not as standalone deprecated items.)

# ITEM CONTRACT (doc 17 §3 + §6 category fields). EVERY tool below carries, at minimum:
#   §3 base:     id, name, type, status, purpose, owner_domain, allowed_usage, forbidden_usage,
#                governance_profiles, audit_schemas, notes
#   §6 category: category(=tool), provided_by_core_ability, input_schema, output_schema, side_effects,
#                risk_level, requires_sandbox, governance_profiles, audit_schemas, allowed_callers
#   usage-map:   used_by  (pipelines/stages/agents that reference it; doc 17 §13)
#   plus:        aliases  (only where a *_variant / dropped legacy name reconciles to this canonical id)
item_contract_fields:
  base: [id, name, type, status, purpose, owner_domain, allowed_usage, forbidden_usage, governance_profiles, audit_schemas, notes]
  category: [category, provided_by_core_ability, input_schema, output_schema, side_effects, risk_level, requires_sandbox, governance_profiles, audit_schemas, allowed_callers]
  usage_mapping: [used_by]
  reconciliation: [aliases]

# SIDE-EFFECT RULE (task + 03-governance-and-audit-layering.md §9 Tool Governance):
#   Any side-effect tool (shell_exec-class, repo_writer, *_executor, *_runner, persistent writers,
#   and any tool that runs/executes code or scanners or mutates state) MUST set:
#     requires_sandbox: true
#     governance_profiles: include `tool_call_governance` and `sandbox_execution_governance`
#     audit_schemas: include `tool_call_trace_schema`  (the trace requirement)
#   Side-effect-free analysis/query/read tools set requires_sandbox: false and side_effects: none.
side_effect_rule:
  side_effecting_requires:
    requires_sandbox: true
    governance_profiles_include: [tool_call_governance, sandbox_execution_governance]
    audit_schemas_include: [tool_call_trace_schema]   # trace requirement
  side_effect_free_default:
    requires_sandbox: false
    side_effects: none

# Shared governance/audit ids referenced by tools below. Defined in Phase E registries; listed here
# only so the references are discoverable. Governance != Audit kept distinct.
referenced_governance_profiles:
  - global_no_secret_policy          # global: no secret leakage / no raw credential exposure (03 §3)
  - high_risk_action_default_deny    # global: high-risk action default deny (03 §3)
  - tool_call_governance             # tool-layer: permission scoping for any tool call (03 §9)
  - sandbox_execution_governance     # tool-layer: sandbox + timeout required for side-effecting tools (03 §9)
  - evidence_required_policy         # blocker family: gate decisions require evidence (canonical: evidence_required)
referenced_audit_schemas:
  - tool_call_trace_schema           # trace: tool-call provenance (Trace, not Evidence) (03 §12)
  - evidence_item_schema             # evidence record shape (see configs/nexus-ai/artifact_registry.yaml)

# NAMING RECONCILIATION (doc 17): legacy tool names that were dropped/folded into a canonical tool
# during the Phase A SDLC contract reconciliation are recorded as `aliases` on the absorbing tool —
# never as separate entries (verified in-file in the stage YAML headers):
#   secret_scanner        -> folded into scanner_runner (16-security-validation.yaml header)
#   scanner_report_reader -> reconciled to evidence_reader (16 header)
#   schema_diff_checker   -> folded into migration_checker (22 header)
#   data_integrity_checker-> dropped; covered by test_runner + evidence_consistency_checker (22 header)
#   runbook_checker       -> covered by dr_runbook_checker (27 header)
# NOTE on *_policy variants: the no_self_approval_policy / evidence_required_policy naming variants
#   flagged in reviews/pipeline-catalog-review.md §4.7 are GOVERNANCE PROFILE names, not tools; their
#   alias reconciliation belongs in configs/nexus-ai/governance_profiles.yaml (Phase E), not here.

tools:

  # =====================================================================================
  # GROUP A — Canonical cross-cutting evidence / artifact / trace tooling
  # Side-effect-free readers vs. side-effecting writers are split. Used by nearly every SDLC stage.
  # provided_by_core_ability: null — these are pipeline-substrate tools, not a single Core Ability's
  #   sub-operation. (Listing them under a Core Ability would misattribute ownership.)
  # =====================================================================================

  - id: artifact_writer
    name: Artifact Writer
    type: tool
    category: tool
    status: canonical
    purpose: >-
      Persist a named pipeline artifact (canonical UPPER_SNAKE artifact id per
      configs/nexus-ai/artifact_registry.yaml) produced by a stage — e.g. PRODUCT_BRIEF,
      CODE_CHANGESET_SUMMARY, COMPLIANCE_MATRIX, RELEASE_CANDIDATE_REPORT.
    owner_domain: shared_platform
    provided_by_core_ability: null
    input_schema:
      artifact_id: string                # canonical artifact name
      content: object                    # artifact body (shape per artifact contract)
      related_pipeline: string
      related_run: string
      related_stage: string
    output_schema:
      artifact_ref: string
      written: boolean
    side_effects: writes_artifact_store
    risk_level: medium
    requires_sandbox: true               # side-effect tool -> governance + trace required
    governance_profiles: [tool_call_governance, sandbox_execution_governance, global_no_secret_policy]
    audit_schemas: [tool_call_trace_schema, evidence_item_schema]
    allowed_callers: [any_stage_owner_agent]   # authored by the stage owner_agent of each stage that lists it
    allowed_usage:
      - Persist canonical-named artifacts under a stage's own scope with provenance.
    forbidden_usage:
      - Writing outside the sandboxed artifact store.
      - Emitting raw secrets/credentials into an artifact (global_no_secret_policy).
    used_by:
      pipelines: [sdlc_pipeline, research_pipeline, activation_pipeline, operations_pipeline, skill_governance_pipeline, knowledge_memory_pipeline]
      sdlc_stages: [intake, domain_risk_profile, skill_semantic_extraction, requirements, requirements_review, architecture, architecture_review, security_privacy_design, premortem_fmea, planning, implementation, code_review, test_generation, test_execution, verification_loop_bug_finding, security_validation, supply_chain_sbom_license, ai_agent_safety_evaluation, privacy_data_lifecycle_validation, api_contract_compatibility_validation, domain_regulatory_compliance_validation_if_applicable, data_migration_validation_if_applicable, accessibility_ux_validation_if_applicable, performance_resilience, cost_resource_governance, backup_restore_dr_validation_if_applicable, operations_readiness, evidence_graph_build, development_completion, release_candidate, refraction_learning]
    notes: >-
      Present in all 31 SDLC stage contracts and every pipeline catalog entry. Distinct from
      evidence_writer: artifact_writer persists the deliverable; evidence_writer persists the
      decision evidence about it (Evidence != Trace and artifact != evidence boundaries).

  - id: evidence_writer
    name: Evidence Writer
    type: tool
    category: tool
    status: canonical
    purpose: >-
      Persist stage evidence items and gate results (evidence_item_schema shape) that prove what a
      gate decided and on what basis — the Evidence half of the Audit family (03 §11).
    owner_domain: shared_platform
    provided_by_core_ability: null
    input_schema:
      evidence_id: string
      artifact_id: string
      related_gate: string
      producer: string
      summary: string
      trace_refs: [string]
    output_schema:
      evidence_ref: string
      written: boolean
    side_effects: writes_evidence_store
    risk_level: medium
    requires_sandbox: true
    governance_profiles: [tool_call_governance, sandbox_execution_governance, evidence_required_policy, global_no_secret_policy]
    audit_schemas: [tool_call_trace_schema, evidence_item_schema]
    allowed_callers: [any_stage_owner_agent]
    allowed_usage:
      - Persist evidence records / gate results with trace_refs back to the producing operation.
    forbidden_usage:
      - Recording a gate result without backing evidence (evidence_required_policy).
      - Storing trace history in place of evidence (Evidence != Trace).
    used_by:
      pipelines: [sdlc_pipeline, research_pipeline, activation_pipeline, operations_pipeline, skill_governance_pipeline, knowledge_memory_pipeline]
      sdlc_stages: [intake, domain_risk_profile, skill_semantic_extraction, requirements, requirements_review, architecture, architecture_review, security_privacy_design, premortem_fmea, planning, implementation, code_review, test_generation, test_execution, verification_loop_bug_finding, security_validation, supply_chain_sbom_license, ai_agent_safety_evaluation, privacy_data_lifecycle_validation, api_contract_compatibility_validation, domain_regulatory_compliance_validation_if_applicable, data_migration_validation_if_applicable, accessibility_ux_validation_if_applicable, performance_resilience, cost_resource_governance, backup_restore_dr_validation_if_applicable, operations_readiness, evidence_graph_build, development_completion, release_candidate, refraction_learning]
    notes: Present in all 31 SDLC stage contracts and every pipeline catalog entry.

  - id: evidence_reader
    name: Evidence Reader
    type: tool
    category: tool
    status: canonical
    purpose: >-
      Read upstream evidence items, gate results, and prior-stage artifacts so a downstream stage can
      adjudicate without re-producing them (read-only). Absorbs the legacy scanner_report_reader.
    owner_domain: shared_platform
    provided_by_core_ability: null
    input_schema:
      query: object                      # {related_run, related_stage?, artifact_id?, evidence_id?}
    output_schema:
      evidence_items: [object]
    side_effects: none
    risk_level: low
    requires_sandbox: false
    governance_profiles: [tool_call_governance]
    audit_schemas: [tool_call_trace_schema]
    allowed_callers: [any_stage_owner_agent]
    allowed_usage:
      - Read-only retrieval of already-persisted evidence/artifacts within the run scope.
    forbidden_usage:
      - Mutating or re-attesting evidence (that is evidence_writer under separate ownership).
    aliases: [scanner_report_reader]     # 16-security-validation.yaml: legacy scanner_report_reader -> evidence_reader
    used_by:
      pipelines: [sdlc_pipeline, research_pipeline, activation_pipeline, operations_pipeline]
      sdlc_stages: [requirements_review, architecture_review, premortem_fmea, planning, security_validation, privacy_data_lifecycle_validation, domain_regulatory_compliance_validation_if_applicable, accessibility_ux_validation_if_applicable, performance_resilience, cost_resource_governance, backup_restore_dr_validation_if_applicable, operations_readiness, evidence_graph_build, development_completion, release_candidate, refraction_learning]
    notes: >-
      Used by 16 SDLC stages and the research/activation/operations pipelines (research
      claim_evidence_mapping/cross_validation/synthesis/completion; activation/operations evidence
      reviews). Read-only — no sandbox.

  # =====================================================================================
  # GROUP B — Coder/OS repository & build tooling (provided_by_core_ability: Coder / OS)
  # =====================================================================================

  - id: repo_reader
    name: Repository Reader
    type: tool
    category: tool
    status: canonical
    purpose: Read existing source, specs, manifests, and markup for context before authoring/analysis.
    owner_domain: engineering
    provided_by_core_ability: Coder
    input_schema:
      path_or_glob: string
      ref: string
    output_schema:
      files: [object]
    side_effects: none
    risk_level: low
    requires_sandbox: false
    governance_profiles: [tool_call_governance]
    audit_schemas: [tool_call_trace_schema]
    allowed_callers: [architecture_agent, security_privacy_agent, engineering_agent, code_reviewer_agent, qa_agent, supply_chain_agent, contract_validation_agent, ux_accessibility_agent, performance_resilience_agent]
    allowed_usage: [Read-only inspection of repository content.]
    forbidden_usage: [Writing to the repository (use repo_writer).]
    used_by:
      pipelines: [sdlc_pipeline]
      sdlc_stages: [architecture, security_privacy_design, implementation, code_review, test_execution, supply_chain_sbom_license, api_contract_compatibility_validation, accessibility_ux_validation_if_applicable, performance_resilience]
    notes: Read-only counterpart to repo_writer.

  - id: repo_writer
    name: Repository Writer
    type: tool
    category: tool
    status: canonical
    purpose: Author the code changeset within the planned scope (the only repository-mutating tool).
    owner_domain: engineering
    provided_by_core_ability: Coder
    input_schema:
      changeset: object                  # files + diffs, bounded by IMPLEMENTATION_PLAN/TASK_BREAKDOWN
    output_schema:
      change_summary_ref: string
      files_written: [string]
    side_effects: writes_repository
    risk_level: high
    requires_sandbox: true               # side-effect tool -> sandbox + governance + trace required
    governance_profiles: [tool_call_governance, sandbox_execution_governance, high_risk_action_default_deny, global_no_secret_policy]
    audit_schemas: [tool_call_trace_schema, evidence_item_schema]
    allowed_callers: [engineering_agent]
    allowed_usage: [Author in-scope code changes during the implementation stage only.]
    forbidden_usage:
      - Out-of-scope changes (implementation_scope_clean / no_out_of_scope_change_gate).
      - Merge or deploy (no merge, no deploy — repo_writer authors a changeset only).
      - Committing secrets/credentials (global_no_secret_policy).
    used_by:
      pipelines: [sdlc_pipeline]
      sdlc_stages: [implementation]
    notes: >-
      Single-stage, high-risk side-effect tool. Authoring only; no-self-approval is enforced
      downstream by the separate code_review stage (owner_agent: code_reviewer_agent).

  - id: repo_diff_reader
    name: Repository Diff Reader
    type: tool
    category: tool
    status: canonical
    purpose: Read the changeset diff (changed lines/files) to target review, test generation, and defect sweeps.
    owner_domain: engineering
    provided_by_core_ability: Coder
    input_schema:
      base_ref: string
      head_ref: string
    output_schema:
      diff: object
    side_effects: none
    risk_level: low
    requires_sandbox: false
    governance_profiles: [tool_call_governance]
    audit_schemas: [tool_call_trace_schema]
    allowed_callers: [code_reviewer_agent, qa_agent, contract_validation_agent]
    allowed_usage: [Read-only retrieval of changeset diffs.]
    forbidden_usage: [Mutating the diff or repository.]
    used_by:
      pipelines: [sdlc_pipeline]
      sdlc_stages: [code_review, test_generation, verification_loop_bug_finding, api_contract_compatibility_validation]
    notes: Read-only; distinct from repo_reader (whole-file context) by targeting the diff.

  - id: test_runner
    name: Test Runner
    type: tool
    category: tool
    status: canonical
    purpose: >-
      Execute build/compile/lint smoke checks and test suites; reproduce/confirm suspected defects;
      run data-integrity/migration assertions. Executes code -> side-effecting.
    owner_domain: engineering
    provided_by_core_ability: OS
    input_schema:
      target: string                     # suite / build target / assertion set
      config: object
    output_schema:
      result: string                     # pass | fail
      report_ref: string
      logs_ref: string
    side_effects: executes_code_in_sandbox
    risk_level: high
    requires_sandbox: true               # *_runner side-effect tool -> sandbox + governance + trace required
    governance_profiles: [tool_call_governance, sandbox_execution_governance, high_risk_action_default_deny]
    audit_schemas: [tool_call_trace_schema, evidence_item_schema]
    allowed_callers: [engineering_agent, qa_agent, data_migration_agent]
    allowed_usage: [Execute builds/tests/assertions inside the sandbox and emit results as evidence.]
    forbidden_usage: [Executing outside the sandbox; deploying; mutating production state.]
    aliases: [data_integrity_checker]    # 22: data_integrity_checker integrity assertions executed via test_runner (+ evidence_consistency_checker)
    used_by:
      pipelines: [sdlc_pipeline]
      sdlc_stages: [implementation, test_execution, verification_loop_bug_finding, data_migration_validation_if_applicable]
    notes: >-
      Covers baseline local build (stage 11), suite execution (14), defect reproduction (15), and
      migration/integrity assertions (22). The dropped legacy data_integrity_checker is recorded as an
      alias (integrity assertions run via test_runner + evidence_consistency_checker).

  - id: test_writer
    name: Test Writer
    type: tool
    category: tool
    status: canonical
    purpose: Author/generate test cases derived from changed behavior and acceptance criteria.
    owner_domain: engineering
    provided_by_core_ability: Coder
    input_schema:
      changed_behavior: object
      acceptance_criteria: object
    output_schema:
      generated_tests_ref: string
    side_effects: writes_test_files
    risk_level: medium
    requires_sandbox: true               # authors test files -> side-effect tool
    governance_profiles: [tool_call_governance, sandbox_execution_governance]
    audit_schemas: [tool_call_trace_schema, evidence_item_schema]
    allowed_callers: [qa_agent]
    allowed_usage: [Generate test artifacts for the changeset under test.]
    forbidden_usage: [Modifying production source; executing tests (that is test_runner).]
    used_by:
      pipelines: [sdlc_pipeline]
      sdlc_stages: [test_generation]
    notes: Authors tests only; execution is test_runner.

  - id: coverage_parser
    name: Coverage Parser
    type: tool
    category: tool
    status: canonical
    purpose: Parse coverage output and map planned/generated tests against critical-path & regression scope.
    owner_domain: engineering
    provided_by_core_ability: Coder
    input_schema:
      coverage_report: object
      scope: object
    output_schema:
      coverage_summary: object
    side_effects: none
    risk_level: low
    requires_sandbox: false
    governance_profiles: [tool_call_governance]
    audit_schemas: [tool_call_trace_schema]
    allowed_callers: [qa_agent]
    allowed_usage: [Read-only parsing/mapping of coverage data for the coverage_policy_pass gate.]
    forbidden_usage: [Executing tests or mutating coverage data.]
    used_by:
      pipelines: [sdlc_pipeline]
      sdlc_stages: [test_generation, test_execution]
    notes: Side-effect-free analysis tool.

  - id: defect_tracker
    name: Defect Tracker
    type: tool
    category: tool
    status: canonical
    purpose: Record, triage, and correlate found defects and rework for bug/decision pattern mining.
    owner_domain: engineering
    provided_by_core_ability: null
    input_schema:
      defect: object
    output_schema:
      defect_id: string
      defect_records: [object]
    side_effects: writes_defect_store
    risk_level: medium
    requires_sandbox: true               # records/triages defects -> state mutation
    governance_profiles: [tool_call_governance, sandbox_execution_governance]
    audit_schemas: [tool_call_trace_schema, evidence_item_schema]
    allowed_callers: [qa_agent, memory_curator_agent]
    allowed_usage: [Record/triage defects (stage 15); read/correlate defects for learning (stage 31).]
    forbidden_usage: [Closing defects without evidence; altering defect history silently.]
    used_by:
      pipelines: [sdlc_pipeline]
      sdlc_stages: [verification_loop_bug_finding, refraction_learning]
    notes: >-
      Write/triage at stage 15 (qa_agent); read/correlate at stage 31 (memory_curator_agent). Bound to
      the verification-loop bug-finding semantic, not a general readiness check.

  # =====================================================================================
  # GROUP C — Policy / traceability / diagram tooling
  # =====================================================================================

  - id: policy_query
    name: Policy Query
    type: tool
    category: tool
    status: canonical
    purpose: >-
      Query policy-as-data (forbidden/allowed licenses, breaking-change/deprecation policy, retention,
      quota/cost-cap, observability/on-call/SLO, governance/regulatory obligations) for gate decisions.
    owner_domain: governance
    provided_by_core_ability: null
    input_schema:
      policy_domain: string
      subject: object
    output_schema:
      policy_result: object              # allowed | blocked | obligations[]
    side_effects: none
    risk_level: low
    requires_sandbox: false
    governance_profiles: [tool_call_governance]
    audit_schemas: [tool_call_trace_schema]
    allowed_callers: [sdlc_team_lead, security_privacy_agent, code_reviewer_agent, supply_chain_agent, privacy_agent, contract_validation_agent, compliance_agent, cost_resource_agent, operations_readiness_agent, release_manager_agent, activation_team_lead, operations_team_lead]
    allowed_usage: [Read-only evaluation of policy-as-data; Governance != Audit (this reads governance, it does not write audit).]
    forbidden_usage: [Mutating policy; bypassing a blocking policy result.]
    used_by:
      pipelines: [sdlc_pipeline, activation_pipeline, operations_pipeline]
      sdlc_stages: [architecture_review, security_privacy_design, code_review, supply_chain_sbom_license, privacy_data_lifecycle_validation, api_contract_compatibility_validation, domain_regulatory_compliance_validation_if_applicable, cost_resource_governance, operations_readiness, development_completion, release_candidate]
    notes: >-
      Used by 11 SDLC stages plus activation/operations pipelines. Side-effect-free policy read; the
      decision it informs is recorded via evidence_writer (Governance != Audit boundary).

  - id: requirements_trace_checker
    name: Requirements Trace Checker
    type: tool
    category: tool
    status: canonical
    purpose: >-
      Seed and validate requirement->artifact->test traceability (REQUIREMENTS_TRACE_START linkage,
      tasks_trace_to_requirements, obligation->requirement->control coverage).
    owner_domain: requirements
    provided_by_core_ability: null
    input_schema:
      trace_graph: object
      requirements: object
    output_schema:
      trace_coverage: object
      gaps: [object]
    side_effects: none
    risk_level: low
    requires_sandbox: false
    governance_profiles: [tool_call_governance]
    audit_schemas: [tool_call_trace_schema]
    allowed_callers: [product_requirements_agent, sdlc_team_lead, planning_agent, code_reviewer_agent, compliance_agent, evidence_graph_agent]
    allowed_usage: [Read-only traceability validation supporting trace-coverage gates.]
    forbidden_usage: [Fabricating trace links not backed by artifacts.]
    used_by:
      pipelines: [sdlc_pipeline]
      sdlc_stages: [requirements, requirements_review, planning, code_review, domain_regulatory_compliance_validation_if_applicable, evidence_graph_build]
    notes: Used across 6 SDLC stages. Side-effect-free.

  - id: diagram_generator
    name: Diagram Generator
    type: tool
    category: tool
    status: canonical
    purpose: Render architecture/system-context and evidence-graph artifacts as diagram outputs.
    owner_domain: architecture
    provided_by_core_ability: null
    input_schema:
      graph_or_model: object
      diagram_type: string
    output_schema:
      diagram_artifact_ref: string
    side_effects: writes_artifact_store
    risk_level: low
    requires_sandbox: true               # renders & persists a diagram artifact -> side-effecting writer
    governance_profiles: [tool_call_governance, sandbox_execution_governance]
    audit_schemas: [tool_call_trace_schema, evidence_item_schema]
    allowed_callers: [architecture_agent, evidence_graph_agent]
    allowed_usage: [Render SYSTEM_CONTEXT_DIAGRAM (stage 6) and EVIDENCE_GRAPH (stage 28).]
    forbidden_usage: [Persisting outside the artifact store.]
