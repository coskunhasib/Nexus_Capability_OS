    purpose: >-
      Propose (not decide) which agents/sub-agents and stages a skill may bind to
      (allowed_as_subskill_of, used_by_agents, used_in_stages).
    owner_domain: skill_governance
    provided_by_core_ability: null
    input_schema:
      skill_semantic_extract: object
      script_audit_findings: object
      misuse_warnings: object
    output_schema:
      skill_binding_proposal_ref: string
    side_effects: writes_artifact_store
    risk_level: medium
    requires_sandbox: true
    governance_profiles: [tool_call_governance, sandbox_execution_governance]
    audit_schemas: [tool_call_trace_schema, evidence_item_schema]
    allowed_callers: [skill_librarian_agent]
    allowed_usage: [Produce SKILL_BINDING_PROPOSAL (skill_binding_proposal) after semantics+audit+misuse-warnings exist.]
    forbidden_usage:
      - Binding without semantics (skill_binding_proposal_gate; anti-pattern: binding_proposed_without_semantics).
      - Making the activation decision (that is the separate skill_activation_decision stage; no_self_approval_policy).
    used_by:
      pipelines: [skill_governance_pipeline]
      pipeline_stages: [skill_governance_pipeline.skill_binding_proposal]
    notes: NEW (skill governance) per review §4.3. Produces a proposal only; activation decision is a distinct owner.

  # =====================================================================================
  # GROUP N — Knowledge / Memory pipeline NEW tools (candidate)
  # =====================================================================================

  - id: memory_ingestor
    name: Memory Ingestor
    type: tool
    category: tool
    status: candidate
    purpose: Normalize a candidate memory item plus its origin reference into a candidate record (MEMORY_INTAKE_RECORD).
    owner_domain: knowledge_management
    provided_by_core_ability: Memory
    input_schema:
      candidate_item: object
      origin_reference: object
    output_schema:
      memory_intake_record_ref: string
    side_effects: writes_memory_store
    risk_level: medium
    requires_sandbox: true
    governance_profiles: [tool_call_governance, sandbox_execution_governance, global_no_secret_policy]
    audit_schemas: [tool_call_trace_schema, evidence_item_schema]
    allowed_callers: [knowledge_intake_agent]
    allowed_usage: [Ingest a candidate memory item at memory_intake.]
    forbidden_usage: [Ingesting without an origin reference / provenance seed.]
    used_by:
      pipelines: [knowledge_memory_pipeline]
      pipeline_stages: [knowledge_memory_pipeline.memory_intake]
    notes: NEW (knowledge/memory) per review §4.3. Sub-operation of Memory (D-014); Memory stays a Core Ability.

  - id: source_classifier
    name: Source Classifier
    type: tool
    category: tool
    status: candidate
    purpose: Classify a memory candidate's source (origin type, trust tier, sensitivity, redaction-required).
    owner_domain: knowledge_management
    provided_by_core_ability: null
    input_schema:
      memory_candidate: object
    output_schema:
      source_classification: object
    side_effects: writes_artifact_store
    risk_level: medium
    requires_sandbox: true
    governance_profiles: [tool_call_governance, sandbox_execution_governance]
    audit_schemas: [tool_call_trace_schema, evidence_item_schema]
    allowed_callers: [source_classification_agent]
    allowed_usage: [Produce SOURCE_CLASSIFICATION_REPORT (source_classification).]
    forbidden_usage: [Proceeding without a trust tier and sensitivity classification.]
    used_by:
      pipelines: [knowledge_memory_pipeline]
      pipeline_stages: [knowledge_memory_pipeline.source_classification]
    notes: NEW (knowledge/memory) per review §4.3.

  - id: summary_writer
    name: Summary Writer
    type: tool
    category: tool
    status: candidate
    purpose: Produce a faithful, source-grounded MEMORY_SUMMARY of the classified/redacted memory item.
    owner_domain: knowledge_management
    provided_by_core_ability: null
    input_schema:
      classified_item: object
    output_schema:
      memory_summary_ref: string
    side_effects: writes_artifact_store
    risk_level: medium
    requires_sandbox: true
    governance_profiles: [tool_call_governance, sandbox_execution_governance]
    audit_schemas: [tool_call_trace_schema, evidence_item_schema]
    allowed_callers: [memory_summarization_agent]
    allowed_usage: [Produce the grounded MEMORY_SUMMARY (summary_generation).]
    forbidden_usage: [Adding unsupported content not grounded in the classified source.]
    used_by:
      pipelines: [knowledge_memory_pipeline]
      pipeline_stages: [knowledge_memory_pipeline.summary_generation]
    notes: NEW (knowledge/memory) per review §4.3. Uses summarization_model; calibrated by the calibrate skill.

  - id: validity_window_calculator
    name: Validity Window Calculator
    type: tool
    category: tool
    status: candidate
    purpose: Assign a validity window (start, expiry/review horizon, rationale) from trust tier and decay expectations.
    owner_domain: knowledge_management
    provided_by_core_ability: null
    input_schema:
      source_classification: object
      decay_model: object
    output_schema:
      validity_window_decision: object
    side_effects: writes_artifact_store
    risk_level: medium
    requires_sandbox: true
    governance_profiles: [tool_call_governance, sandbox_execution_governance]
    audit_schemas: [tool_call_trace_schema, evidence_item_schema]
    allowed_callers: [validity_window_agent]
    allowed_usage: [Produce VALIDITY_WINDOW_DECISION (validity_window_assignment).]
    forbidden_usage: [Leaving "no window" (validity_window_required_gate forbids it).]
    used_by:
      pipelines: [knowledge_memory_pipeline]
      pipeline_stages: [knowledge_memory_pipeline.validity_window_assignment]
    notes: NEW (knowledge/memory) per review §4.3.

  - id: retrieval_profile_writer
    name: Retrieval Profile Writer
    type: tool
    category: tool
    status: candidate
    purpose: Update the affected retrieval profile / context pack so curated memory becomes retrievable within bounded scope.
    owner_domain: knowledge_management
    provided_by_core_ability: Memory
    input_schema:
      memory_summary: object
      validity_window: object
      sensitivity: object
    output_schema:
      retrieval_profile_update_report_ref: string
    side_effects: writes_memory_store
    risk_level: high
    requires_sandbox: true
    governance_profiles: [tool_call_governance, sandbox_execution_governance, global_no_secret_policy]
    audit_schemas: [tool_call_trace_schema, evidence_item_schema]
    allowed_callers: [retrieval_profile_agent, memory_expiration_agent]
    allowed_usage: [Update retrieval profiles bound to a validity window (retrieval_profile_update; retire on expiry).]
    forbidden_usage:
      - Updating a profile for a memory with no validity window (retrieval_profile_update_without_validity_window).
      - Exposing sensitive memory beyond its classified sensitivity.
    used_by:
      pipelines: [knowledge_memory_pipeline]
      pipeline_stages: [knowledge_memory_pipeline.retrieval_profile_update, knowledge_memory_pipeline.memory_expiration_review]
    notes: NEW (knowledge/memory) per review §4.3. Sub-operation of Memory (D-014).

  - id: expiration_scanner
    name: Expiration Scanner
    type: tool
    category: tool
    status: candidate
    purpose: Scan for memories whose validity window has reached its horizon for refresh/re-validate/downgrade/expire review.
    owner_domain: knowledge_management
    provided_by_core_ability: Memory
    input_schema:
      now: string
      scope: object
    output_schema:
      expiring_items: [object]
    side_effects: none
    risk_level: low
    requires_sandbox: false
    governance_profiles: [tool_call_governance]
    audit_schemas: [tool_call_trace_schema]
    allowed_callers: [memory_expiration_agent]
    allowed_usage: [Read-only scan for items at/over their validity horizon (memory_expiration_review).]
    forbidden_usage: [Silently retaining expired memory (expiration_outcome_recorded must follow).]
    used_by:
      pipelines: [knowledge_memory_pipeline]
      pipeline_stages: [knowledge_memory_pipeline.memory_expiration_review]
    notes: NEW (knowledge/memory) per review §4.3. Read-only scan; retirement is via retrieval_profile_writer.

  - id: redaction_tool
    name: Redaction Tool
    type: tool
    category: tool
    status: candidate
    purpose: Redact sensitive content before summarization, storage, or retrieval exposure.
    owner_domain: knowledge_management
    provided_by_core_ability: null
    input_schema:
      content: object
      sensitivity_rules: object
    output_schema:
      redacted_content: object
    side_effects: writes_artifact_store
    risk_level: high
    requires_sandbox: true
    governance_profiles: [tool_call_governance, sandbox_execution_governance, global_no_secret_policy]
    audit_schemas: [tool_call_trace_schema, evidence_item_schema]
    allowed_callers: [source_classification_agent]
    allowed_usage: [Redact sensitive content when redaction_required_gate applies.]
    forbidden_usage: [Storing/exposing unredacted sensitive content (unredacted_sensitive_content_detected blocker).]
    used_by:
      pipelines: [knowledge_memory_pipeline]
      pipeline_stages: [knowledge_memory_pipeline.source_classification]
    notes: NEW (knowledge/memory) per review §4.3.

  - id: provenance_recorder
    name: Provenance Recorder
    type: tool
    category: tool
    status: candidate
    purpose: >-
      Record/extend the MEMORY_PROVENANCE_RECORD (origin reference, classification, summary linkage,
      validity window, retrieval changes, expiration outcome) across the memory lifecycle.
    owner_domain: knowledge_management
    provided_by_core_ability: Memory
    input_schema:
      memory_ref: string
      provenance_event: object
    output_schema:
      memory_provenance_record_ref: string
    side_effects: writes_evidence_store
    risk_level: medium
    requires_sandbox: true
    governance_profiles: [tool_call_governance, sandbox_execution_governance]
    audit_schemas: [tool_call_trace_schema, evidence_item_schema]
    allowed_callers: [knowledge_intake_agent, source_classification_agent, memory_summarization_agent, knowledge_reconciliation_agent, validity_window_agent, retrieval_profile_agent, memory_expiration_agent]
    allowed_usage: [Seed and extend the memory provenance record at every lifecycle stage.]
    forbidden_usage: [Proceeding past intake without a provenance seed (provenance_seed_recorded / provenance_record_missing).]
    used_by:
      pipelines: [knowledge_memory_pipeline]
      pipeline_stages: [knowledge_memory_pipeline.memory_intake, knowledge_memory_pipeline.source_classification, knowledge_memory_pipeline.summary_generation, knowledge_memory_pipeline.knowledge_conflict_resolution, knowledge_memory_pipeline.validity_window_assignment, knowledge_memory_pipeline.retrieval_profile_update, knowledge_memory_pipeline.memory_expiration_review]
    notes: >-
      NEW (knowledge/memory) per review §4.3. Records provenance evidence (uses memory_provenance_schema
      in the Audit registry); the MEMORY_PROVENANCE_RECORD is evidence, distinct from the *_trace items.

