  # ---- Core-Ability primitive sub-operations exposed by the CANONICAL Web/OS/Memory abilities ----
  # These are the exact `exposed_tools` declared on Web/OS/Memory in configs/nexus-ai/core_abilities.yaml
  # (web_scrape; file_read/file_write/shell_exec/process_run; memory_search/memory_summarize/
  # context_recall). They are CANONICAL because their exposing Core Ability is locked-canonical (K-003,
  # K-011/D-014). provided_by_core_ability is the exposing ability; the side-effect rule (§ side_effect_rule)
  # is applied verbatim — file_write/shell_exec/process_run are side-effecting/high-risk and carry
  # system_access_governance + sandbox_execution_governance + tool_call_trace_schema; file_read/web_scrape/
  # memory_search/memory_summarize/context_recall are read-only. used_by mirrors the exposing ability's
  # pipeline/SDLC-stage binding in core_abilities.yaml; allowed_callers are that ability's Agent-tier
  # callers (a Core Ability is never itself an allowed_caller).

  - id: web_scrape
    name: Web Scrape
    type: tool
    category: tool
    status: canonical
    purpose: Extract structured content from already-fetched external pages (DOM/markup -> structured fields), preserving provenance.
    owner_domain: web_access
    provided_by_core_ability: Web
    input_schema:
      content: object                    # fetched page content/markup
      extraction_rules: object
    output_schema:
      structured_content: object
      provenance: object
    side_effects: external_network_read
    risk_level: medium
    requires_sandbox: true               # external network egress -> sandboxed + governed (matches web_search/web_fetch)
    governance_profiles: [tool_call_governance, sandbox_execution_governance, global_no_secret_policy]
    audit_schemas: [tool_call_trace_schema]
    allowed_callers: [product_requirements_agent, architecture_agent, security_privacy_agent, security_validation_agent, compliance_agent, contract_validation_agent, accessibility_ux_agent, operations_readiness_agent, research_intake_agent, knowledge_memory_agents]
    allowed_usage: [Extract structured fields from fetched external content with provenance preserved.]
    forbidden_usage:
      - Transmitting secrets/credentials/PII in outbound requests (global_no_secret_policy).
      - Treating scraped content as trusted without a provenance trace.
    used_by:
      pipelines: [sdlc_pipeline, research_pipeline, knowledge_memory_pipeline]
      sdlc_stages: [intake, domain_risk_profile, requirements, architecture, architecture_review, security_privacy_design, supply_chain_sbom_license, ai_agent_safety_evaluation, api_contract_compatibility_validation, domain_regulatory_compliance_validation_if_applicable, accessibility_ux_validation_if_applicable, operations_readiness]
    notes: >-
      Exposed_tool of the canonical Web Core Ability (core_abilities.yaml web.exposed_tools; K-011/D-014).
      Same external-egress posture as web_search/web_fetch; used_by mirrors Web's pipeline + SDLC-stage
      binding in core_abilities.yaml.

