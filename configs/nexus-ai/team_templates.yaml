  # ===========================================================================
  # 2) RESEARCH TEAM — owns the research_pipeline (10 stages, no sub-agents).
  #    Roster + uses_* from docs/nexus-ai-orchestration-model/legacy/pipeline-catalog/research-pipeline.md §1–§2.
  #    No-self-approval is structural: cross_validation_agent is distinct from the
  #    producer agents (source_reliability / claim_extraction / claim_evidence).
  # ===========================================================================
  - team_id: research_team
    team_type: research_team
    pipeline_id: research_pipeline
    purpose: >-
      Run sourced research under no-human governance: capture the research goal, decompose it into
      bounded questions, discover candidate sources with recorded provenance, score source
      reliability, extract atomic checkable claims, map each load-bearing claim to supporting and
      contradicting evidence, independently cross-validate (distinct role), report residual
      uncertainty, and synthesize a fully-cited research output with an assembled evidence graph.
    team_lead_role: research_team_lead   # pipeline-specific; NOT Supervisor
    agents:
      - research_intake_agent            # owns: research_intake
      - research_scoping_agent           # owns: scope_and_questions (prism = divergence here)
      - source_discovery_agent           # owns: source_discovery
      - source_reliability_agent         # owns: source_reliability_assessment
      - claim_extraction_agent           # owns: claim_extraction
      - claim_evidence_agent             # owns: claim_evidence_mapping
      - cross_validation_agent           # owns: cross_validation — DISTINCT from producers (no self-approval)
      - uncertainty_reporting_agent      # owns: uncertainty_reporting
      - research_synthesis_agent         # owns: synthesis (citation_required_gate)
      - research_completion_agent        # owns: research_completion (final evidence-graph gate)
    direct_sub_agents: []   # research pipeline defines no sub-agents
    uses_core_abilities:
      - Web
      - Memory
      - Supervisor
    uses_skills:
      - prism                # divergence only (scope_and_questions)
      - llm-council          # multi-perspective cross-check (cross_validation)
      - calibrate
      - gap-audit
      - bayesian-update
    uses_tools:
      - web_search
      - web_fetch
      - source_reliability_checker
      - claim_mapper
      - artifact_writer
      - evidence_writer
      - evidence_reader
    uses_governance_profiles:
      - research_source_governance
      - citation_required_gate
      - no_self_approval_policy            # alias of canonical `no_self_approval`
      - evidence_required_policy           # alias of canonical `evidence_required`
    uses_audit_schemas:
      - source_evidence_schema
      - claim_evidence_schema
      - stage_gate_trace_schema
    uses_model_provider_profiles:
      - research_reasoning_profile
      - supervisor_routing_model
      - source_evaluation_model
    uses_context_memory_profiles:
      - research_run_context
      - source_corpus_context_pack
      - claim_evidence_context_pack
    permissions:
      - own_and_execute_research_stages
      - assign_stage_owner_agents
      - discover_and_fetch_sources_with_provenance
      - score_sources_and_map_claims_to_evidence
      - cross_validate_with_a_distinct_role
      - emit_cited_synthesis_with_evidence_graph
      - request_rework_along_allowed_routes
    forbidden_actions:
      - core_ability_as_team_member
      - supervisor_as_team_lead                # research_team_lead is the lead, never Supervisor
      - producer_role_is_sole_validator_of_own_source   # cross_validation must be a distinct agent
      - agent_approves_own_work
      - uncited_load_bearing_claim_in_synthesis
      - unscored_source_used_in_synthesis
      - team_lead_bypasses_blocking_gate
      - team_lead_owns_a_stage
      - orphan_sub_agent_without_parent_or_direct_call_flag
      - introduce_plugin

  # ===========================================================================
  # 3) ACTIVATION TEAM — owns the activation_pipeline (preview -> pilot -> public).
  #    Roster + uses_* from docs/nexus-ai-orchestration-model/legacy/pipeline-catalog/activation-pipeline.md §1–§3.
  #    activation_owner_decision_agent RECORDS a human/owner decision (not an autonomous
  #    approver). Reviewer/decision owners are distinct from pilot/activation owners.
  # ===========================================================================
  - team_id: activation_team
    team_type: activation_team
    pipeline_id: activation_pipeline
    purpose: >-
      Stage the activation of an already release-candidate artifact (produced by the SDLC pipeline)
      through preview -> pilot -> public, with mandatory rollback readiness and a human/owner
      decision gate before any public activation. Confirms release-candidate evidence on intake,
      runs a superadmin preview, executes a bounded pilot, independently reviews pilot evidence,
      records the owner's public-activation decision, validates rollback readiness, and completes
      activation with a full evidence package — under no-self-approval governance.
    team_lead_role: activation_team_lead   # pipeline-specific; NOT Supervisor
    agents:
      - activation_manager_agent          # owns: activation_intake, superadmin_preview, activation_completion
      - pilot_activation_agent            # owns: pilot_activation
      - activation_reviewer_agent         # owns: pilot_evidence_review — distinct from pilot owner (no self-approval)
      - activation_owner_decision_agent   # owns: public_activation_decision — RECORDS human/owner decision, not autonomous approver
      - rollback_readiness_agent          # owns: rollback_readiness
    direct_sub_agents: []   # activation pipeline defines no sub-agents
    uses_core_abilities:
      - Supervisor
      - Memory
      - OS
      - Web
    uses_skills:
      - sentinel             # premortem/foresight before activation steps
      - gap-audit
      - llm-council
      - calibrate
      - prompt-fidelity
      - refraction
    uses_tools:
      - activation_flag_controller
      - cohort_selector
      - rollback_executor
      - telemetry_reader
      - artifact_writer
      - evidence_writer
      - evidence_reader
      - policy_query
    uses_governance_profiles:
      - activation_pipeline_governance
      - no_self_approval_policy            # alias of canonical `no_self_approval`
      - evidence_required_policy           # alias of canonical `evidence_required`
      - preview_required_gate
      - pilot_evidence_gate
      - rollback_required_gate
      - owner_activation_decision_gate     # HUMAN/owner authority gate (distinct from autonomous self-approval)
    uses_audit_schemas:
      - activation_evidence_schema
      - activation_decision_evidence_schema
      - rollback_readiness_evidence_schema
      - stage_gate_trace_schema
      - activation_transition_trace_schema
    uses_model_provider_profiles:
      - supervisor_routing_model
      - activation_reasoning_model
      - risk_analysis_model
    uses_context_memory_profiles:
      - activation_run_context
      - preview_context_pack
      - pilot_evidence_context_pack
      - activation_decision_context_pack
    permissions:
      - own_and_execute_activation_stages
      - assign_stage_owner_agents
      - control_activation_flags_and_cohorts
      - execute_validated_rollback
      - record_owner_activation_decision
      - emit_activation_evidence_package
      - request_rework_along_allowed_routes
    forbidden_actions:
      - core_ability_as_team_member
      - supervisor_as_team_lead                # activation_team_lead is the lead, never Supervisor
      - self_approval_of_activation_decision   # decision/reviewer roles distinct from pilot/activation owners
      - agent_approves_own_work
      - public_activation_without_owner_decision
      - public_activation_without_validated_rollback_plan
      - pilot_activation_without_passing_preview
      - team_lead_bypasses_blocking_gate
      - team_lead_owns_a_stage
      - orphan_sub_agent_without_parent_or_direct_call_flag
      - introduce_plugin

  # ===========================================================================
  # 4) OPERATIONS TEAM — owns the operations_pipeline (live-incident lifecycle).
  #    Roster + uses_* from docs/nexus-ai-orchestration-model/legacy/pipeline-catalog/operations-pipeline.md §1–§3.
  #    Consumes SDLC operations-readiness artifacts; does not regenerate SDLC.
  # ===========================================================================
  - team_id: operations_team
    team_type: operations_team
    pipeline_id: operations_pipeline
    purpose: >-
      Run the live-operations lifecycle for released Nexus AI capabilities: intake and deduplicate
      incident signals, classify severity (mandatory before mitigation), build a mitigation plan,
      decide and execute rollback-or-fix backed by runbook/rollback evidence, run a mandatory
      postmortem for qualifying severities, and feed operational learning back into memory and the
      SDLC. Consumes SDLC operations-readiness artifacts (RUNBOOK, ROLLBACK_PLAN, OBSERVABILITY_PLAN,
      INCIDENT_RESPONSE_PLAN); references the SDLC pipeline rather than regenerating it.
    team_lead_role: operations_team_lead   # pipeline-specific; NOT Supervisor
    agents:
      - incident_intake_agent              # owns: incident_intake
      - severity_classification_agent      # owns: severity_classification
      - mitigation_planning_agent          # owns: mitigation_plan
      - incident_response_agent            # owns: rollback_or_fix
      - postmortem_agent                   # owns: postmortem
      - operational_learning_agent         # owns: learning_update
