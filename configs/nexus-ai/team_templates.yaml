  # ===========================================================================
  # 5) SKILL GOVERNANCE TEAM — owns the skill_governance_pipeline.
  #    Roster + uses_* from docs/nexus-ai-orchestration-model/legacy/pipeline-catalog/skill-governance-pipeline.md
  #    §1–§3 (reconciled with 04 §4.7). skill_librarian_agent is shared with sdlc_team.
  #    skill_semantic_extractor_subagent is a PARENTED sub-agent (parent: skill_librarian_agent).
  #    Anti-pattern blocked: binding without semantics. Activation decider (skill_runtime_safety_agent)
  #    is distinct from the binding proposer (skill_librarian_agent) -> no self-approval.
  # ===========================================================================
  - team_id: skill_governance_team
    team_type: skill_governance_team
    pipeline_id: skill_governance_pipeline
    purpose: >-
      Govern the skill lifecycle under no-human governance: inventory candidate skill packages,
      perform MANDATORY semantic extraction before any binding, run script/reference safety audit,
      generate misuse warnings, propose agent/stage bindings, and record the activate/hold/deprecate
      decision — enforcing locked semantics (prism = brainstorming/divergence, verification-loop =
      bug/defect finding) and the rule that no skill is bound or activated before its semantics and
      misuse warnings exist.
    team_lead_role: skill_governance_team_lead   # pipeline-specific; NOT Supervisor (D-006)
    agents:
      - skill_librarian_agent          # owns: skill_intake, skill_binding_proposal, skill_deprecation_update [also in sdlc_team]
      - skill_runtime_safety_agent     # owns: script_reference_audit, misuse_warning_generation, skill_activation_decision (review independence)
    # skill_semantic_extractor_subagent owns skill_semantic_extraction (#2) and is PARENTED to
    # skill_librarian_agent (sub_agent_roles.yaml) — not a team-lead-direct-call sub-agent.
    direct_sub_agents: []   # the one sub-agent is parented to skill_librarian_agent (no orphan)
    uses_core_abilities:
      - Supervisor
      - Memory
      - OS
      - Coder
      - Web
    uses_skills:
      - gap-audit
      - fmea
      - calibrate
      - llm-council
      - sentinel
      - prism                # divergence only (expand candidate categories/bindings)
      - verification-loop     # bug/defect-finding semantics only (script defect sweep)
    uses_tools:
      - skill_package_reader
      - skill_semantic_extractor
      - script_static_analyzer
      - reference_index_builder
      - skill_binding_proposer
      - artifact_writer
      - evidence_writer
    uses_governance_profiles:
      - skill_governance_pipeline_governance
      - skill_semantic_required_gate
      - script_reference_audit_gate
      - misuse_warning_required_gate
      - skill_binding_proposal_gate
      - skill_activation_decision_gate
      - locked_semantics_enforcement_policy   # prism=brainstorming, verification-loop=bug-finding
      - no_self_approval_policy               # alias of canonical `no_self_approval`
      - evidence_required_policy              # alias of canonical `evidence_required`
    uses_audit_schemas:
      - skill_governance_evidence_schema
      - skill_semantic_extract_schema
      - script_audit_evidence_schema
      - skill_misuse_warning_schema
      - skill_binding_decision_schema
      - skill_governance_trace_schema
    uses_model_provider_profiles:
      - skill_governance_reasoning_profile
      - skill_semantic_extraction_model
      - script_safety_analysis_model
      - supervisor_routing_model
    uses_context_memory_profiles:
      - skill_governance_run_context
      - skill_semantic_context_pack
      - skill_registry_context_pack
    permissions:
      - own_and_execute_skill_governance_stages
      - assign_stage_owner_agents
      - invoke_parented_sub_agents_via_their_parent_agent   # skill_semantic_extractor_subagent
      - inventory_and_read_skill_packages
      - perform_mandatory_semantic_extraction_before_binding
      - audit_scripts_and_references_for_safety
      - generate_misuse_warnings
      - propose_bindings_and_record_activation_decision
      - request_rework_along_allowed_routes
    forbidden_actions:
      - core_ability_as_team_member
      - supervisor_as_team_lead                # skill_governance_team_lead is the lead, never Supervisor
      - binding_proposed_without_semantics      # anti-pattern: binding before semantic extraction
      - skill_activated_without_misuse_warnings
      - locked_semantics_violation              # never redefine prism / verification-loop semantics
      - self_approval_of_activation_decision    # proposer (librarian) != decider (runtime_safety)
      - agent_approves_own_work
      - team_lead_bypasses_blocking_gate
      - team_lead_owns_a_stage
      - orphan_sub_agent_without_parent_or_direct_call_flag
      - introduce_plugin

  # ===========================================================================
  # 6) KNOWLEDGE TEAM — owns the knowledge_memory_pipeline.
  #    Roster + uses_* from docs/nexus-ai-orchestration-model/legacy/pipeline-catalog/knowledge-memory-pipeline.md §1–§3.
  #    Memory stays a Core Ability USED by these agents — it is never promoted to an agent/owner.
  # ===========================================================================
  - team_id: knowledge_team
    team_type: knowledge_team
    pipeline_id: knowledge_memory_pipeline
    purpose: >-
      Govern the knowledge/memory lifecycle: ingest candidate memory with provenance, classify its
      source (trust tier, sensitivity, redaction need), summarize it grounded in the source, assign
      an explicit validity window, update the affected retrieval profile bounded by sensitivity and
      validity, and review expiration so knowledge does not silently rot. Memory remains a Core
      Ability that agents USE; this pipeline curates what may be remembered, for how long, and how
      it is retrieved — it never turns Memory into an agent.
    team_lead_role: knowledge_team_lead   # pipeline-specific; NOT Supervisor
    agents:
      - knowledge_intake_agent             # owns: memory_intake
      - source_classification_agent        # owns: source_classification
      - memory_summarization_agent         # owns: summary_generation
      - validity_window_agent              # owns: validity_window_assignment
      - retrieval_profile_agent            # owns: retrieval_profile_update
      - memory_expiration_agent            # owns: memory_expiration_review
    direct_sub_agents: []   # knowledge pipeline defines no sub-agents
    uses_core_abilities:
      - Memory               # USED by the agents; never the owner / never an agent
      - Supervisor
      - Web
    uses_skills:
      - gap-audit
      - calibrate
      - refraction
      - bayesian-update
    uses_tools:
      - memory_ingestor
      - source_classifier
      - summary_writer
      - validity_window_calculator
      - retrieval_profile_writer
      - expiration_scanner
      - redaction_tool
      - provenance_recorder
      - artifact_writer
      - evidence_writer
    uses_governance_profiles:
      - memory_source_governance
      - validity_window_required_gate
      - redaction_required_gate
      # evidence/no-self-approval are honored via the shared registry; this pipeline's catalog
      # entry binds only the three profiles above at pipeline level (knowledge-memory-pipeline.md §1).
    uses_audit_schemas:
      - memory_provenance_schema
      - stage_gate_trace_schema
    uses_model_provider_profiles:
      - knowledge_reasoning_profile
      - summarization_model
      - supervisor_routing_model
    uses_context_memory_profiles:
      - knowledge_run_context
      - memory_candidate_context_pack
      - retrieval_profile_context_pack
    permissions:
      - own_and_execute_knowledge_memory_stages
      - assign_stage_owner_agents
      - ingest_classify_and_summarize_memory_with_provenance
      - assign_validity_windows
      - update_retrieval_profiles_bound_to_validity_and_sensitivity
      - review_and_record_expiration_outcomes
      - request_rework_along_allowed_routes
    forbidden_actions:
      - core_ability_as_team_member            # Memory (and the others) are abilities, never agents/owners
      - memory_core_ability_promoted_to_agent
      - supervisor_as_team_lead                # knowledge_team_lead is the lead, never Supervisor
      - retrieval_profile_update_without_validity_window
      - unredacted_sensitive_content_exposed
      - agent_approves_own_work
      - team_lead_bypasses_blocking_gate
      - team_lead_owns_a_stage
      - orphan_sub_agent_without_parent_or_direct_call_flag
      - introduce_plugin

