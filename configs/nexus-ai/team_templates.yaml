# Nexus AI — Team Templates Registry
# =============================================================================
# Phase D / doc 18 — Team / Agent / Sub-agent Catalog.
# Conforms to: docs/nexus-ai-orchestration-model/legacy/18-team-agent-subagent-catalog-plan.md §4
#   (Team Template Contract). One team_template per team; all 6 teams present.
#
# A Team is a PASSIVE ownership / policy boundary (04-team-agent-subagent-model.md §4,
#   §9) — NOT a runtime-active object. It declares which agents/sub-agents it owns and
#   which Shared Registry items the team is permitted to use. Agents own and execute
#   stages; the team_lead orchestrates (assigns agents, manages handoffs, routes rework)
#   but never owns a stage, never authors the reviewed artifact, and never bypasses a gate.
#
# AUTHORITATIVE SOURCES (read from disk, reconciled):
#   - configs/nexus-ai/stages/sdlc/*.yaml          — 31 SDLC stage contracts (owner_agent + sub_agents).
#   - docs/nexus-ai-orchestration-model/legacy/pipeline-catalog/*.md    — 5 non-SDLC pipeline definitions (rosters + uses_*).
#   - configs/nexus-ai/{core_abilities,skills_registry,tools_registry,governance_profiles,
#       audit_schemas,model_provider_profiles,context_memory_profiles}.yaml — Shared Registry.
#
# LOCKED DECISIONS / BOUNDARY RULES honored (doc 18 §11; 04 §8):
#   - Plugin cancelled — no plugin field anywhere.
#   - Core Abilities [Supervisor, Coder, Vision, Audio, Creative, Memory, Web, OS] are a
#     separate capability layer agents USE via uses_core_abilities; they MUST NOT appear as
#     team members (agents / direct_sub_agents). Encoded in every forbidden_actions block.
#   - Supervisor MUST NOT be a Team Lead. Every team_lead_role below is a pipeline-specific
#     *_team_lead role, never `Supervisor`.
#   - Every sub-agent has a parent_agent UNLESS team_lead_direct_call_allowed: true (no
#     orphans). All 8 distinct sub-agents in scope are PARENTED; `direct_sub_agents` is therefore []
#     for every team. (skill_semantic_extractor_subagent serves both the SDLC stage #3 and the
#     skill_governance pipeline stage #2, but is ONE sub-agent — not two.) Parent links live in
#     agent_roles.yaml / sub_agent_roles.yaml (doc 18 §6–§7).
#   - An Agent cannot approve its own work; a Reviewer cannot mutate the reviewed artifact;
#     Release Manager cannot bypass a failed governance gate. Encoded in forbidden_actions.
#   - Skill != Tool; Governance != Audit; Evidence != Trace (the uses_* groups are kept distinct).
#
# FIELD SEMANTICS (doc 18 §4):
#   team_id / team_type / pipeline_id / purpose / team_lead_role
#   agents                 — Agent roles (snake_case) owned by this team boundary.
#   direct_sub_agents      — sub-agents the team_lead may call directly
#                            (team_lead_direct_call_allowed: true). [] when all sub-agents are parented.
#   uses_*                 — Shared Registry items this team is permitted to use (union across the
#                            team's stages/agents). USAGE, not ownership (05-shared-registry-and-usage-mapping.md).
#   permissions            — coarse allow-list at the team boundary.
#   forbidden_actions      — boundary rules this team must never violate.
#
# REGISTRY VERIFICATION (performed against the 7 registries on disk):
#   - All SDLC uses_* items resolve: 18 skills, 45 tools, 68 governance profiles, 47 audit
#     schemas, 7 model/provider profiles, 10 context/memory profiles.
#   - All 5 non-SDLC pipelines' uses_* items resolve against the registries.
#   - `no_self_approval_policy` and `evidence_required_policy` are NAMING VARIANTS of the
#     canonical governance ids `no_self_approval` / `evidence_required`; the registry records
#     them under each policy's `aliases:` field (governance_profiles.yaml). The `_policy` spelling
#     used here matches every SDLC stage file and all 5 pipeline contracts. See open_questions.
#   - Core Abilities are referenced by their canonical NAME (Supervisor, Coder, ...); the registry
#     `id` is lowercase (supervisor, coder, ...). Names match the stage/pipeline contracts.

version: draft-0.1
registry_name: Nexus AI Orchestration Model — Team Templates
status: draft
total_teams: 6

# -----------------------------------------------------------------------------
# Cross-team invariants (apply to every team_template below).
# -----------------------------------------------------------------------------
boundary_invariants:
  - core_abilities_are_capabilities_not_team_members   # Supervisor/Coder/Vision/Audio/Creative/Memory/Web/OS
  - supervisor_is_never_team_lead
  - every_sub_agent_has_parent_or_team_lead_direct_call_allowed   # no orphan sub-agents
  - agent_cannot_approve_its_own_work
  - reviewer_cannot_mutate_reviewed_artifact
  - release_manager_cannot_bypass_failed_governance_gate
  - team_lead_cannot_bypass_blocking_gate
  - team_lead_is_never_a_stage_owner_agent
  - no_plugin_field
  - skill_is_not_tool_governance_is_not_audit_evidence_is_not_trace

core_abilities_layer:   # the capability layer agents USE; NEVER team members / agents
  - Supervisor
  - Coder
  - Vision
  - Audio
  - Creative
  - Memory
  - Web
  - OS

team_templates:

  # ===========================================================================
  # 1) SDLC TEAM — owns the 31-stage SDLC pipeline.
  #    Roster is AUTHORITATIVE from configs/nexus-ai/stages/sdlc/*.yaml owner_agent values.
  #    24 distinct owner_agents == the full roster below. The two review-gate stages
  #    (requirements_review #5, architecture_review #7) are owned by sdlc_team_lead as the
  #    no-self-approval fallback — sdlc_team_lead is the Team Lead, NOT an agents[] entry.
  # ===========================================================================
  - team_id: sdlc_team
    team_type: sdlc_team
    pipeline_id: sdlc_pipeline
    purpose: >-
      Own and execute the end-to-end 31-stage SDLC pipeline: intake, domain/risk profiling,
      skill semantic extraction, requirements + review, architecture + review, security/privacy
      design, premortem/FMEA, planning, implementation, code review, test generation/execution,
      verification-loop bug finding, and the full validation gate chain (security, supply chain,
      agentic safety, privacy, API contract, compliance, data migration, accessibility/UX,
      performance/resilience, cost/resource, backup/restore/DR, operations readiness), evidence
      graph build, development completion, release candidate, and refraction/learning. No merge,
      no deploy: the team produces a governed, fully-traceable release candidate plus evidence.
    team_lead_role: sdlc_team_lead   # NOT Supervisor; owns the review-gate stages as no-self-approval fallback
    agents:
      # --- exactly the 24 distinct SDLC stage owner_agents (verified zero-diff vs roster) ---
      - product_requirements_agent      # owns: intake (#1), requirements (#4)
      - domain_risk_agent               # owns: domain_risk_profile (#2)
      - skill_librarian_agent           # owns: skill_semantic_extraction (#3) [also in skill_governance_team]
      - architecture_agent              # owns: architecture (#6)
      - security_privacy_agent          # owns: security_privacy_design (#8)
      - risk_agent                      # owns: premortem_fmea (#9)
      - planning_agent                  # owns: planning (#10)
      - engineering_agent               # owns: implementation (#11)
      - code_reviewer_agent             # owns: code_review (#12) — reviewer; cannot mutate reviewed code
      - qa_agent                        # owns: test_generation (#13), test_execution (#14), verification_loop_bug_finding (#15)
      - security_validation_agent       # owns: security_validation (#16)
      - supply_chain_agent              # owns: supply_chain_sbom_license (#17)
      - agentic_safety_agent            # owns: ai_agent_safety_evaluation (#18)
      - privacy_agent                   # owns: privacy_data_lifecycle_validation (#19)
      - contract_validation_agent       # owns: api_contract_compatibility_validation (#20)
      - compliance_agent                # owns: domain_regulatory_compliance_validation_if_applicable (#21)
      - data_migration_agent            # owns: data_migration_validation_if_applicable (#22)
      - ux_accessibility_agent          # owns: accessibility_ux_validation_if_applicable (#23)
      - performance_resilience_agent    # owns: performance_resilience (#24)
      - cost_resource_agent             # owns: cost_resource_governance (#25)
      - operations_readiness_agent      # owns: backup_restore_dr_validation_if_applicable (#26), operations_readiness (#27)
      - evidence_graph_agent            # owns: evidence_graph_build (#28)
      - release_manager_agent           # owns: development_completion (#29), release_candidate (#30)
      - memory_curator_agent            # owns: refraction_learning (#31)
    # All 8 SDLC sub-agents are PARENTED to an agent (no orphans), so none are team-lead-direct-call.
    # Parent links (defined in sub_agent_roles.yaml):
    #   skill_semantic_extractor_subagent      -> skill_librarian_agent   (stage #3)
    #   api_design_subagent                     -> architecture_agent      (stage #6)
    #   data_model_subagent                     -> architecture_agent      (stage #6)
    #   threat_modeling_subagent                -> security_privacy_agent  (stage #8)
    #   test_generation_subagent                -> qa_agent                (stage #13)
    #   bug_hunter_subagent                     -> qa_agent                (stage #15)
    #   security_scan_interpreter_subagent      -> security_validation_agent (stage #16)
    #   evidence_trace_subagent                 -> evidence_graph_agent    (stage #28)
    direct_sub_agents: []   # none: every SDLC sub-agent has a parent_agent
