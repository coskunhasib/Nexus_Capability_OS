# Coverage / invariant summary (for the catalog reviewer):
#   - 8 distinct sub-agents = every distinct sub_agent referenced across the 31 SDLC stage YAMLs
#     (stages 3, 6 [x2], 8, 13, 15, 16, 28) plus the 5 pipeline docs (skill_governance reuses
#     skill_semantic_extractor_subagent; the other 4 pipelines declare no sub-agents).
#   - No orphans: every entry has a parent_agent and team_lead_direct_call_allowed: false.
#   - Every parent_agent is an SDLC agent_roles entry (skill_librarian_agent, architecture_agent,
#     security_privacy_agent, qa_agent, security_validation_agent, evidence_graph_agent) — none is a
#     Core Ability, none is a Team Lead.
#   - No Core Ability appears as a sub_agent. Skill != Tool, Governance != Audit, Evidence != Trace.
#   - No sub-agent decides a gate or approves its own work; each returns_to its parent_agent.
