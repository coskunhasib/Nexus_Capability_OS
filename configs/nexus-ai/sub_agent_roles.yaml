# Nexus AI Orchestration Model — Sub-agent Role Catalog
# Documentation / blueprint only — NO runtime code, NO merge, NO deploy.
#
# Scope: one role per DISTINCT sub_agent referenced across the authoritative sources:
#   - configs/nexus-ai/stages/sdlc/*.yaml  (31 SDLC stage contracts — AUTHORITATIVE for SDLC
#     owner_agent + sub_agents). Only 8 stages declare a non-empty `sub_agents:` list.
#   - configs/nexus-ai/stages/research/*.yaml  (11 research stage contracts). The Research Pipeline
#     was raised to professional-grade reliability (calibration exemplar); 3 of its stages now declare
#     a sub_agent for genuine decomposition: source_reliability_assessment (#5) ->
#     source_bias_screening_subagent, cross_validation (#8) -> independent_replication_subagent,
#     research_completion (#11) -> research_evidence_graph_subagent.
#   - docs/nexus-ai-orchestration-model/legacy/pipeline-catalog/*.md  (the other non-SDLC pipelines). Of these, only the
#     skill_governance pipeline references a sub-agent, and it REUSES the SDLC
#     `skill_semantic_extractor_subagent` (it owns stage 2.2 skill_semantic_extraction there,
#     parent: skill_librarian_agent). activation / operations / knowledge-memory pipelines declare
#     only Agents — no sub-agents. => 11 distinct sub-agents total (8 SDLC + 3 research).
#
# Contract shape: docs/nexus-ai-orchestration-model/legacy/18-team-agent-subagent-catalog-plan.md §7 (Sub-agent Role
#   Contract). Boundary rules: doc 18 §11 (and task LOCKED DECISIONS):
#   - Core Abilities [Supervisor, Coder, Vision, Audio, Creative, Memory, Web, OS] are a separate
#     capability LAYER that agents/sub-agents USE via uses_core_abilities; they are NEVER agents.
#   - Every sub-agent MUST have a parent_agent UNLESS team_lead_direct_call_allowed: true
#     (no orphans). All 8 here have a parent_agent (team_lead_direct_call_allowed: false).
#   - A reviewer cannot mutate the reviewed artifact; an agent cannot approve its own work.
#   - Skill != Tool; Governance != Audit; Evidence != Trace (honored throughout).
#
# Registry alignment (validated against the formalized Phase C/E registries on disk):
#   - uses_core_abilities use the PascalCase `name:` form (Memory, OS, Coder, Web) exactly as the
#     authoritative SDLC stage contracts reference them (core_abilities.yaml ids are lower-case:
#     memory/os/coder/web — same entities).
#   - uses_skills / uses_tools / uses_model_provider_profiles / uses_context_memory_profiles /
#     uses_audit_schemas reference canonical registry ids and were each verified to exist.
#   - uses_governance_profiles use CANONICAL governance_profiles.yaml ids. NOTE: several SDLC stage
#     contracts reference `_policy`-suffixed names (no_self_approval_policy, evidence_required_policy);
#     the canonical registry ids are `no_self_approval`, `evidence_required`, `trace_required`,
#     `skill_governance` (no `_policy` suffix). The canonical ids are used here; the suffix drift is
#     flagged in open_questions for stage-contract normalization.
#
# A sub-agent NEVER owns a stage gate decision and NEVER self-approves: it returns its work product
# to its parent_agent (returns_to), which (or whose independent reviewer) adjudicates the gate.

version: draft-0.1
catalog_id: nexus_ai_sub_agent_roles
category: sub_agent_role
status: draft
owner_doc: docs/nexus-ai-orchestration-model/legacy/18-team-agent-subagent-catalog-plan.md
contract_shape_ref: docs/nexus-ai-orchestration-model/legacy/18-team-agent-subagent-catalog-plan.md#7-sub-agent-role-contract
plugin_registry: false   # locked: no plugin registry, ever

# Convention applied to every entry:
#   team_lead_direct_call_allowed: false  -> a parent_agent is mandatory (no orphan).
#   Sub-agents are AUTHORS/ANALYSTS that hand a work product up; they do not decide gates.

sub_agents:

  # ---------------------------------------------------------------------------
  # 1) skill_semantic_extractor_subagent
  #    SDLC stage #3 (skill_semantic_extraction, owner: skill_librarian_agent).
  #    ALSO owns stage 2.2 of the skill_governance pipeline (parent still skill_librarian_agent).
  # ---------------------------------------------------------------------------
  - sub_agent_id: skill_semantic_extractor_subagent
    parent_agent: skill_librarian_agent
    team_lead_direct_call_allowed: false
    mission: >-
      Read each selected skill package (SKILL.md, scripts, references, assets, metadata) and extract
      its primary_purpose, semantic_category, trigger/anti-trigger (not_for) phrases, inputs/outputs,
      side effects, handoffs and a draft misuse-warning set, with a confidence score. Lock the two
      high-risk semantics — prism = divergence/brainstorming, verification-loop = bug/defect finding —
      so no skill is wired into a pipeline before its meaning is verified. Produces analysis only; the
      semantic gate and any binding/activation decision belong to the parent agent / reviewer.
    activation_conditions:
      - parent_agent_invokes_for_skill_semantic_extraction
      - selected_skill_package_present_and_readable
      - skill_semantics_unknown_or_stale_or_version_hash_changed
    inputs:
      - DOMAIN_PROFILE_DECISION
      - RISK_PROFILE
      - SKILL_PACKAGES
    outputs:
      - SKILL_SEMANTIC_CATALOG
      - SKILL_MISUSE_WARNINGS          # DRAFT only; final misuse-warning gate is the parent/reviewer's
      - SKILL_SEMANTIC_CONFIDENCE
    uses_core_abilities:
      - Memory   # recall prior skill semantics / registry state to detect drift
      - OS       # invoke the skill package reader / static analyzer over package files
    uses_skills:
      - skill-architect   # structure the extracted semantics into the catalog shape
      - gap-audit         # detect missing semantic fields / missing misuse warnings
    uses_tools:
      - skill_package_reader      # read SKILL.md / scripts / references / assets / metadata
      - skill_semantic_extractor  # derive primary_purpose / semantic_category / triggers (side-effect: governance + trace)
      - artifact_writer           # write SKILL_SEMANTIC_CATALOG (side-effect: governance + trace)
      - evidence_writer           # write semantic evidence (side-effect: governance + trace)
    uses_governance_profiles:
      - skill_governance                       # canonical
      - skill_semantic_extraction_gate         # stage-specific semantic gate profile
      - skill_semantic_required_gate           # semantics-before-binding enforcement
      - locked_semantics_enforcement_policy     # prism=divergence / verification-loop=defect-finding locked
      - evidence_required                       # canonical (stage contract used evidence_required_policy)
      - no_self_approval                        # canonical (stage contract used no_self_approval_policy)
    uses_audit_schemas:
      - skill_semantic_evidence_schema   # evidence schema (artifact this sub-agent authors)
      - skill_semantic_extract_schema    # evidence schema: the extracted-semantics record
      - skill_misuse_warning_schema      # evidence schema: the draft misuse warnings
      - stage_gate_trace_schema          # trace schema (distinct from evidence)
    uses_model_provider_profiles:
      - skill_semantic_extraction_model   # dedicated semantic-extraction reasoning profile
    uses_context_memory_profiles:
      - skill_semantic_context_pack
      - skill_registry_context_pack       # skill_governance-pipeline context for the binding surface
    permissions:
      - read_skill_packages
      - extract_skill_semantics
      - write_semantic_analysis_artifacts
      - write_evidence_and_trace
    forbidden_actions:
      - approve_or_block_the_skill_semantic_extraction_gate   # gate decision belongs to the parent/reviewer
      - propose_or_record_skill_binding                       # binding is a separate stage/role
      - record_skill_activation_decision                      # activation is skill_runtime_safety_agent's decision
      - reclassify_prism_or_verification_loop_locked_semantics
      - mutate_skill_package_source_files
      - bypass_a_blocking_governance_gate
    returns_to: skill_librarian_agent
    blocks_when:
      - unknown_skill_semantics
      - missing_misuse_warning_for_locked_semantics_skill
      - skill_semantic_confidence_below_threshold
      - prism_misclassified_as_bug_finding_or_readiness_gate
      - verification_loop_misclassified_as_readiness_or_test_execution

  # ---------------------------------------------------------------------------
  # 2) api_design_subagent
  #    SDLC stage #6 (architecture, owner: architecture_agent). Conditional engagement.
  # ---------------------------------------------------------------------------
  - sub_agent_id: api_design_subagent
    parent_agent: architecture_agent
    team_lead_direct_call_allowed: false
    mission: >-
      When the system exposes an external/public API surface, design the API contract for the chosen
      architecture: resources/operations, request/response shapes, versioning and compatibility
      strategy, error model and auth touchpoints — traceable to the requirements and NFRs — and feed
      it into the architecture document and ADRs. Authors the API design portion only; the
      architecture gate and architecture_review are decided elsewhere.
    activation_conditions:
      - parent_agent_invokes_during_architecture
      - api_surface_present   # optional_condition gate from stage #6 (external/public API exists)
    inputs:
      - REQUIREMENTS_SPEC
      - NFR_CATALOG
      - ACCEPTANCE_CRITERIA
      - ARCHITECTURE_DOC          # in-progress architecture context from the parent
    outputs:
      - API_DESIGN_PROPOSAL
      - API_DESIGN_ADR_INPUTS     # ADR material handed to architecture_agent (which owns ADR_INDEX)
    uses_core_abilities:
      - Coder    # express API contracts / schemas
      - Memory   # recall requirements, NFRs and prior API decisions
      - Web      # consult external API/protocol standards where needed
    uses_skills:
      - adr-builder   # capture API design decisions as structured ADR inputs
      - gap-audit     # verify the API surface covers required/NFR-driven capabilities
    uses_tools:
      - repo_reader        # read existing interface/code context
      - diagram_generator  # render API/interaction diagrams (side-effect: governance + trace)
      - artifact_writer    # write API_DESIGN_PROPOSAL (side-effect: governance + trace)
      - evidence_writer    # write design evidence (side-effect: governance + trace)
    uses_governance_profiles:
      - architecture_design_governance   # stage-specific design governance
      - adr_required_gate                # API decisions must be ADR-captured
      - evidence_required                # canonical
      - no_self_approval                 # canonical
    uses_audit_schemas:
      - architecture_evidence_schema        # evidence schema (design artifact)
      - api_contract_evidence_schema        # evidence schema: the API contract proposal
      - architecture_decision_trace_schema  # trace schema: ADR/decision provenance
      - stage_gate_trace_schema             # trace schema (distinct from evidence)
    uses_model_provider_profiles:
      - architecture_reasoning_model
    uses_context_memory_profiles:
      - architecture_context_pack
    permissions:
      - read_requirements_and_architecture_context
      - author_api_design_proposal
      - produce_adr_inputs
      - write_evidence_and_trace
    forbidden_actions:
      - approve_or_block_the_architecture_gate         # gate is decided by the architecture_review stage
      - finalize_the_architecture_doc_or_adr_index     # parent architecture_agent owns these artifacts
      - mutate_requirements_spec_or_nfr_catalog
      - implement_or_modify_production_code
      - bypass_a_blocking_governance_gate
    returns_to: architecture_agent
    blocks_when:
      - api_surface_undefined_while_external_api_present
      - api_contract_not_traceable_to_requirements_or_nfr
      - missing_adr_for_major_api_decision

  # ---------------------------------------------------------------------------
  # 3) data_model_subagent
  #    SDLC stage #6 (architecture, owner: architecture_agent). Conditional engagement.
  # ---------------------------------------------------------------------------
  - sub_agent_id: data_model_subagent
    parent_agent: architecture_agent
    team_lead_direct_call_allowed: false
    mission: >-
      When the system owns persistent data, design the data model for the chosen architecture:
      entities/relationships, ownership and tenancy boundaries, retention/lifecycle and integrity
      constraints — traceable to requirements and NFRs — and feed it into the architecture document
      and ADRs so that downstream privacy/data-migration validation has a concrete model. Authors the
      data-model portion only; gate adjudication and review happen elsewhere.
    activation_conditions:
      - parent_agent_invokes_during_architecture
      - persistent_data_model_present   # optional_condition gate from stage #6 (system owns persistent data)
    inputs:
      - REQUIREMENTS_SPEC
      - NFR_CATALOG
      - ACCEPTANCE_CRITERIA
      - DOMAIN_PROFILE_DECISION   # tenancy / regulated-data signals
      - ARCHITECTURE_DOC          # in-progress architecture context from the parent
    outputs:
      - DATA_MODEL_PROPOSAL
      - DATA_MODEL_ADR_INPUTS     # ADR material handed to architecture_agent (which owns ADR_INDEX)
    uses_core_abilities:
      - Coder    # express schemas / data structures
      - Memory   # recall requirements, NFRs, domain/tenancy decisions
    uses_skills:
      - adr-builder   # capture data-model decisions as structured ADR inputs
      - gap-audit     # verify the model covers required entities / retention / integrity NFRs
    uses_tools:
      - repo_reader        # read existing schema/code context
      - diagram_generator  # render ER / data-flow diagrams (side-effect: governance + trace)
      - artifact_writer    # write DATA_MODEL_PROPOSAL (side-effect: governance + trace)
      - evidence_writer    # write design evidence (side-effect: governance + trace)
    uses_governance_profiles:
      - architecture_design_governance   # stage-specific design governance
      - adr_required_gate                # data-model decisions must be ADR-captured
      - evidence_required                # canonical
      - no_self_approval                 # canonical
    uses_audit_schemas:
      - architecture_evidence_schema        # evidence schema (design artifact)
      - data_lifecycle_report_schema        # evidence schema: data model / retention / lifecycle
      - architecture_decision_trace_schema  # trace schema: ADR/decision provenance
      - stage_gate_trace_schema             # trace schema (distinct from evidence)
    uses_model_provider_profiles:
      - architecture_reasoning_model
    uses_context_memory_profiles:
      - architecture_context_pack
    permissions:
      - read_requirements_and_architecture_context
      - author_data_model_proposal
      - produce_adr_inputs
      - write_evidence_and_trace
    forbidden_actions:
      - approve_or_block_the_architecture_gate         # gate is decided by the architecture_review stage
      - finalize_the_architecture_doc_or_adr_index     # parent architecture_agent owns these artifacts
      - mutate_requirements_spec_or_nfr_catalog
      - implement_or_migrate_production_data
      - bypass_a_blocking_governance_gate
    returns_to: architecture_agent
    blocks_when:
      - persistent_data_model_undefined_while_system_owns_data
      - data_model_not_traceable_to_requirements_or_nfr
      - missing_retention_or_integrity_constraints_for_regulated_or_personal_data
      - missing_adr_for_major_data_decision

  # ---------------------------------------------------------------------------
  # 4) threat_modeling_subagent
  #    SDLC stage #8 (security_privacy_design, owner: security_privacy_agent).
  # ---------------------------------------------------------------------------
  - sub_agent_id: threat_modeling_subagent
    parent_agent: security_privacy_agent
    team_lead_direct_call_allowed: false
    mission: >-
      From the architecture and requirements, produce the threat model: trust boundaries, assets,
      entry points, attacker goals, threats (e.g. STRIDE-style) with likelihood/impact, and proposed
      mitigations mapped to security requirements/NFRs. Hands the threat model to the parent security
      agent, which assembles the full security/privacy design and owns the design gate. Authors the
      threat-model artifact only; it does not approve the gate.
    activation_conditions:
      - parent_agent_invokes_during_security_privacy_design
      - architecture_doc_available_for_threat_analysis
    inputs:
      - ARCHITECTURE_DOC
      - SYSTEM_CONTEXT_DIAGRAM
      - ADR_INDEX
      - REQUIREMENTS_SPEC
      - NFR_CATALOG
      - DOMAIN_PROFILE_DECISION
      - RISK_PROFILE
    outputs:
      - THREAT_MODEL
      - THREAT_MITIGATION_PROPOSALS   # mitigations mapped to SECURITY_REQUIREMENTS (parent owns final set)
    uses_core_abilities:
      - Memory   # recall architecture, prior threat models and the risk profile
      - Web      # consult known attack patterns / advisories
      - Coder    # reason over code/architecture entry points and data flows
    uses_skills:
      - sentinel    # premortem / surface hidden attack assumptions and trade-off risks
      - fmea        # enumerate failure/abuse modes and their effects
      - gap-audit   # detect uncovered assets / entry points / unmitigated threats
    uses_tools:
      - repo_reader      # read code/architecture to ground the trust boundaries
      - policy_query     # query security policy constraints (side-effect: governance + trace)
      - artifact_writer  # write THREAT_MODEL (side-effect: governance + trace)
      - evidence_writer  # write threat-model evidence (side-effect: governance + trace)
    uses_governance_profiles:
      - security_privacy_governance   # stage-specific security/privacy governance
      - threat_model_required_gate    # threat model is mandatory before progression
      - evidence_required             # canonical
      - no_self_approval              # canonical
    uses_audit_schemas:
      - threat_model_evidence_schema   # evidence schema (the threat model)
      - stage_gate_trace_schema        # trace schema (distinct from evidence)
    uses_model_provider_profiles:
      - security_analysis_model
    uses_context_memory_profiles:
      - security_context_pack
    permissions:
      - read_architecture_and_requirements_context
      - author_threat_model
      - propose_threat_mitigations
      - write_evidence_and_trace
    forbidden_actions:
      - approve_or_block_the_security_privacy_design_gate   # parent security_privacy_agent / review owns the gate
      - finalize_security_requirements_or_privacy_risk_register   # parent owns these artifacts
      - mutate_architecture_doc_or_requirements
      - implement_or_modify_production_code
      - bypass_a_blocking_governance_gate
    returns_to: security_privacy_agent
    blocks_when:
      - missing_threat_model
      - trust_boundaries_or_assets_undefined
      - threat_without_proposed_mitigation
      - mitigation_not_traceable_to_security_requirement_or_nfr

  # ---------------------------------------------------------------------------
  # 5) test_generation_subagent
  #    SDLC stage #13 (test_generation, owner: qa_agent).
  # ---------------------------------------------------------------------------
  - sub_agent_id: test_generation_subagent
    parent_agent: qa_agent
    team_lead_direct_call_allowed: false
    mission: >-
      Derive test COVERAGE from requirements, NFRs, the FMEA risk register, the code changeset and
      prior bug history: author the test plan and the generated/planned-test summary that cover
      critical paths, changed behavior and the regression surface, all traceable to requirements.
      This sub-agent does NOT run tests (that is test_execution, stage #14) and does NOT hunt defects
      (that is verification_loop_bug_finding, stage #15); it hands the plan up to qa_agent.
    activation_conditions:
      - parent_agent_invokes_during_test_generation
      - code_changeset_and_requirements_available_for_coverage_derivation
    inputs:
      - REQUIREMENTS_SPEC
      - NFR_CATALOG
      - ACCEPTANCE_CRITERIA
      - FMEA_RISK_REGISTER
      - CODE_CHANGESET_SUMMARY
      - CODE_REVIEW_REPORT
    outputs:
      - TEST_PLAN
      - GENERATED_TESTS_SUMMARY
    uses_core_abilities:
      - Coder    # author test code / scaffolding
      - Memory   # recall requirements, risk register, bug history and the changeset
    uses_skills:
      - gap-audit   # coverage-gap detection (critical paths / changed behavior lacking tests)
                    # NOTE: verification-loop is intentionally NOT bound (LOCKED: bug-finding only)
    uses_tools:
      - repo_diff_reader   # read the changeset to derive changed-behavior tests
      - test_writer        # author/generate test cases (side-effect: governance + trace)
      - coverage_parser    # map planned tests against critical-path & regression scope (side-effect: trace)
      - artifact_writer    # write TEST_PLAN / GENERATED_TESTS_SUMMARY (side-effect: governance + trace)
      - evidence_writer    # write stage evidence (side-effect: governance + trace)
    uses_governance_profiles:
      - test_coverage_completeness_gate   # stage-specific coverage gate
      - regression_scope_gate             # stage-specific regression-scope gate
      - evidence_required                 # canonical
      - no_self_approval                  # canonical
    uses_audit_schemas:
      - test_plan_evidence_schema   # evidence schema (the test plan)
      - stage_gate_trace_schema     # trace schema (distinct from evidence)
    uses_model_provider_profiles:
      - coder_engineering_model
    uses_context_memory_profiles:
      - implementation_context_pack   # consumed: changeset / implementation context
      - verification_context_pack     # produced/seeded for the downstream execution + bug-finding stages
    permissions:
      - read_changeset_and_requirements_context
      - author_test_plan_and_generated_tests
      - write_evidence_and_trace
    forbidden_actions:
      - execute_or_run_the_test_suite           # test_execution (stage #14) is a separate stage/role
      - perform_defect_or_bug_finding_sweep      # verification_loop_bug_finding (stage #15) is separate
      - approve_or_block_the_test_generation_gate   # gate decision belongs to parent qa_agent
      - mutate_production_code_or_requirements
      - bypass_a_blocking_governance_gate
    returns_to: qa_agent
    blocks_when:
      - missing_critical_path_tests
      - changed_behavior_without_tests
      - undefined_regression_scope
      - untraceable_test_to_requirement

  # ---------------------------------------------------------------------------
  # 6) bug_hunter_subagent
  #    SDLC stage #15 (verification_loop_bug_finding, owner: qa_agent).
  # ---------------------------------------------------------------------------
  - sub_agent_id: bug_hunter_subagent
    parent_agent: qa_agent
    team_lead_direct_call_allowed: false
    mission: >-
      Run a rigorous verification-loop defect sweep over the implemented changeset and its executed
      test results — multi-lens probing, invariant/mutation/regression red-teaming — to surface real
      defects beyond what the test suite caught, reproduce and triage each by severity, and hand a
      defect report to qa_agent. LOCKED semantics: this is defect FINDING only — not a readiness
      checklist and not a re-run of test_execution. The blocking gate decision belongs to qa_agent.
    activation_conditions:
      - parent_agent_invokes_during_verification_loop_bug_finding
      - implemented_changeset_and_test_execution_report_available
    inputs:
      - CODE_CHANGESET_SUMMARY
      - IMPLEMENTATION_NOTES
      - TEST_EXECUTION_REPORT
      - COVERAGE_REPORT
      - CODE_REVIEW_REPORT
      - REQUIREMENTS_SPEC
      - FMEA_RISK_REGISTER
    outputs:
      - BUG_FINDING_REPORT
      - TRIAGED_DEFECTS   # severity-classified defects handed to qa_agent for the gate decision
    uses_core_abilities:
      - Coder    # read/diff/reason over the changeset and probe defect hypotheses
      - Memory   # recall requirements, prior defects and the risk register for regression red-teaming
      - OS       # drive the test runner / repo tooling to reproduce and confirm defects
    uses_skills:
      - verification-loop   # LOCKED semantics: bug/defect finding ONLY (not readiness, not test_execution)
    uses_tools:
      - repo_diff_reader   # read the changeset under test to target the sweep
      - test_runner        # reproduce/confirm suspected defects (side-effect: governance + trace)
      - defect_tracker     # record and triage found defects (side-effect: governance + trace)
      - artifact_writer    # write BUG_FINDING_REPORT (side-effect: governance + trace)
      - evidence_writer    # write stage evidence (side-effect: governance + trace)
    uses_governance_profiles:
      - verification_loop_bug_gate   # stage-specific defect gate profile
      - defect_finding_skill_governance   # governs verification-loop used as defect-finding
      - locked_semantics_enforcement_policy   # verification-loop must stay defect-finding
      - evidence_required            # canonical
      - no_self_approval             # canonical (qa_agent != engineering_agent, the changeset author)
    uses_audit_schemas:
      - bug_finding_evidence_schema   # evidence schema (the defect report)
      - stage_gate_trace_schema       # trace schema (distinct from evidence)
    uses_model_provider_profiles:
      - defect_analysis_model
    uses_context_memory_profiles:
      - verification_context_pack
    permissions:
      - read_changeset_and_test_results
      - reproduce_and_triage_defects
      - author_bug_finding_report
      - write_evidence_and_trace
    forbidden_actions:
      - use_verification_loop_as_a_readiness_checklist   # LOCKED semantic boundary
      - re_run_test_suite_as_source_of_truth_replacing_test_execution
      - approve_or_block_the_bug_finding_gate   # gate decision belongs to parent qa_agent
      - mutate_the_reviewed_changeset_or_production_code   # reviewer must not mutate the reviewed artifact
      - bypass_a_blocking_governance_gate
    returns_to: qa_agent
    blocks_when:
      - open_blocker_bug_count_greater_than_zero
      - open_major_bug_count_above_threshold
      - untriaged_blocker_defect
      - blocker_defect_not_traced_to_changeset

  # ---------------------------------------------------------------------------
  # 7) security_scan_interpreter_subagent
  #    SDLC stage #16 (security_validation, owner: security_validation_agent).
  # ---------------------------------------------------------------------------
  - sub_agent_id: security_scan_interpreter_subagent
    parent_agent: security_validation_agent
    team_lead_direct_call_allowed: false
    mission: >-
      Run the application security scanner suite (SAST/SCA, secret, container, IaC) over the
      implemented changeset and normalize raw output into a deduplicated, severity-classified,
      false-positive-calibrated SECURITY_FINDINGS_NORMALIZED set with per-finding lineage. Hands the
      normalized findings to security_validation_agent, which decides the security gate. This
      sub-agent interprets findings; it does not approve the gate and does not hunt logic defects
      (that is verification_loop_bug_finding, stage #15).
    activation_conditions:
      - parent_agent_invokes_during_security_validation
      - implemented_changeset_available_for_scanning
    inputs:
      - CODE_CHANGESET_SUMMARY
      - IMPLEMENTATION_NOTES
      - TEST_EXECUTION_REPORT
      - THREAT_MODEL
      - SECURITY_REQUIREMENTS
    outputs:
      - SECURITY_SCAN_REPORT
      - SECURITY_FINDINGS_NORMALIZED
    uses_core_abilities:
      - Coder     # reason over code/dependency findings and map them to changed code
      - Memory    # recall the threat model, security requirements and prior accepted findings
      - OS        # invoke scanner tooling over the repository/build
    uses_skills:
      - calibrate                   # calibrate severity / true-positive confidence of raw findings
      - gap-audit                   # find scan-coverage gaps (unscanned paths / missing scanner classes)
      - scanner-result-normalizer   # normalize/dedupe raw scanner output into a single finding set
    uses_tools:
      - scanner_runner       # run SAST/SCA/secret/container/IaC scans (side-effect: governance + trace)
      - dependency_scanner   # dependency/SCA vulnerability findings (side-effect: governance + trace)
      - evidence_reader      # read upstream evidence (changeset, threat model, test report)
      - artifact_writer      # write SECURITY_SCAN_REPORT / normalized findings (side-effect: governance + trace)
      - evidence_writer      # write stage evidence (side-effect: governance + trace)
    uses_governance_profiles:
      - security_validation_gate   # stage-specific security gate profile
      - no_secret_leak_gate        # stage-specific secret-leak gate profile
      - evidence_required          # canonical
      - no_self_approval           # canonical
    uses_audit_schemas:
      - security_scan_evidence_schema   # evidence schema (the scan report / normalized findings)
      - security_finding_trace_schema   # trace schema: per-finding lineage (distinct from evidence)
      - stage_gate_trace_schema         # trace schema (distinct from evidence)
    uses_model_provider_profiles:
      - security_analysis_model
    uses_context_memory_profiles:
      - sdlc_run_context
      - security_context_pack
    permissions:
      - run_security_scanners_over_the_changeset
      - normalize_and_calibrate_findings
      - author_security_scan_report
      - write_evidence_and_trace
    forbidden_actions:
      - approve_or_block_the_security_validation_gate   # gate decision belongs to security_validation_agent
      - accept_or_waive_a_security_finding              # acceptance/waiver is an owned decision, not the interpreter's
      - perform_logic_defect_or_bug_finding_sweep       # that is verification_loop_bug_finding (stage #15)
      - mutate_the_reviewed_changeset_or_production_code
      - bypass_a_blocking_governance_gate
    returns_to: security_validation_agent
    blocks_when:
      - critical_security_finding_present
      - high_security_finding_without_owned_acceptance
      - secret_leak_detected
      - security_scan_coverage_incomplete

  # ---------------------------------------------------------------------------
  # 8) evidence_trace_subagent
  #    SDLC stage #28 (evidence_graph_build, owner: evidence_graph_agent).
  #    RESOLVED: team-model §6.8 originally listed parent_agent = release_manager_agent; the stage #28
  #    contract reconciled the owner to evidence_graph_agent (artifact-author / gate-decider separation),
  #    and team-model §6.8 has since been corrected to match. parent_agent here follows the stage
  #    contract (evidence_graph_agent); all three sources now agree.
  # ---------------------------------------------------------------------------
  - sub_agent_id: evidence_trace_subagent
    parent_agent: evidence_graph_agent
    team_lead_direct_call_allowed: false
    mission: >-
      Assemble the end-to-end evidence DAG and traceability matrix linking every requirement and NFR
      through design, implementation, tests, bug-finding, security/supply-chain/safety results,
      applicable product gates and operations-readiness artifacts up to the release-candidate
      evidence; verify the chain is complete, internally consistent and free of orphan critical
      artifacts or broken links. Hands EVIDENCE_GRAPH and TRACEABILITY_MATRIX to evidence_graph_agent.
      This is evidence/trace assembly and integrity auditing — NOT defect finding and NOT brainstorming.
    activation_conditions:
      - parent_agent_invokes_during_evidence_graph_build
      - upstream_stage_evidence_and_gate_results_available
    inputs:
      - REQUIREMENTS_SPEC
      - NFR_CATALOG
      - ARCHITECTURE_DOC
      - ADR_INDEX
      - THREAT_MODEL
      - FMEA_RISK_REGISTER
      - CODE_CHANGESET_SUMMARY
      - CODE_REVIEW_REPORT
      - TEST_EXECUTION_REPORT
      - BUG_FINDING_REPORT
      - SECURITY_SCAN_REPORT
      - SUPPLY_CHAIN_GATE_RESULT
      - AGENTIC_SAFETY_EVAL_REPORT
      - RUNBOOK
      - ROLLBACK_PLAN
      - OBSERVABILITY_PLAN
      - INCIDENT_RESPONSE_PLAN
    outputs:
      - EVIDENCE_GRAPH
      - TRACEABILITY_MATRIX
    uses_core_abilities:
      - Memory   # recall the full run history: requirements, design, gate results, prior evidence
      - OS       # invoke evidence/trace readers, checkers and the graph/diagram generator
    uses_skills:
      - evidence-graph-builder   # build the requirement -> ... -> release evidence DAG
      - gap-audit                # detect orphan critical artifacts, missing nodes and broken links
    uses_tools:
      - evidence_reader               # read all upstream evidence + gate results to build the graph
      - evidence_consistency_checker  # verify graph internal consistency (side-effect: governance + trace)
      - requirements_trace_checker    # verify requirement -> artifact traceability coverage (side-effect: trace)
      - diagram_generator             # render EVIDENCE_GRAPH as a graph artifact (side-effect: governance + trace)
      - artifact_writer               # write EVIDENCE_GRAPH / TRACEABILITY_MATRIX (side-effect: governance + trace)
      - evidence_writer               # write stage evidence (side-effect: governance + trace)
    uses_governance_profiles:
      - evidence_graph_gate          # stage-specific evidence-graph gate profile
      - traceability_required_gate   # stage-specific traceability gate profile
      - evidence_integrity_gate      # graph must be internally consistent / no contradictions
      - evidence_required            # canonical
      - no_self_approval             # canonical (author != downstream release decider)
    uses_audit_schemas:
      - sdlc_pipeline_evidence_schema     # evidence schema (base)
      - evidence_graph_evidence_schema    # evidence schema: the assembled graph
      - traceability_matrix_schema        # evidence schema: requirement -> artifact matrix
      - stage_gate_trace_schema           # trace schema (distinct from evidence)
    uses_model_provider_profiles:
      - release_reasoning_model   # canonical fit: assembles the release evidence chain pre-completion
    uses_context_memory_profiles:
      - sdlc_run_context
      - release_context_pack
    permissions:
      - read_all_upstream_evidence_and_gate_results
      - assemble_evidence_graph_and_traceability_matrix
      - run_consistency_and_traceability_checks
      - write_evidence_and_trace
    forbidden_actions:
      - approve_or_block_the_evidence_graph_gate   # gate decision belongs to parent evidence_graph_agent
      - make_the_development_completion_or_release_decision   # release_manager_agent owns those downstream
      - fabricate_or_alter_upstream_evidence_artifacts        # may link/audit, must not mutate sources
      - mutate_production_code
      - bypass_a_blocking_governance_gate
    returns_to: evidence_graph_agent
    blocks_when:
      - missing_required_evidence
      - orphan_critical_artifact
      - broken_traceability_link
      - inconsistent_evidence_graph

  # ---------------------------------------------------------------------------
  # 9) source_bias_screening_subagent
  #    RESEARCH stage #5 (source_reliability_assessment, owner: source_reliability_agent).
  #    NEW (research professional-grade calibration): decomposes bias / conflict-of-interest
  #    screening from core reliability scoring. The md §2.4 purpose names "bias signals" and the
  #    source_reliability_checker tool + source_evaluation_model both score bias/COI, but it was an
  #    un-decomposed facet; this sub-agent makes it an explicit analysis hand-up.
  # ---------------------------------------------------------------------------
  - sub_agent_id: source_bias_screening_subagent
    parent_agent: source_reliability_agent
    team_lead_direct_call_allowed: false
    mission: >-
      For each candidate source, screen for bias and conflict-of-interest signals — funding/ownership
      ties, advocacy or vendor stance, undisclosed sponsorship, self-citation loops, and independence
      from the parties the research bears on — and produce a per-source SOURCE_BIAS_CONFLICT_REPORT
      with rationale. Hands the screening up to source_reliability_agent, which folds it into the
      reliability score and decides the stage gate. This sub-agent screens and reports; it does not
      decide the gate and does not set the final reliability score.
    activation_conditions:
      - parent_agent_invokes_during_source_reliability_assessment
      - source_inventory_and_provenance_available_for_screening
    inputs:
      - SOURCE_INVENTORY
      - SOURCE_PROVENANCE_RECORD
      - SOURCE_RELIABILITY_RUBRIC      # the pre-registered rubric's bias/independence criteria
      - RESEARCH_CONDITIONAL_FLAGS     # conflict_of_interest_sensitive raises screening strictness
    outputs:
      - SOURCE_BIAS_CONFLICT_REPORT    # per-source bias / COI findings handed to the parent
    uses_core_abilities:
      - Memory   # recall the rubric, the corpus and prior independence assessments
      - Web      # consult ownership / funding / affiliation signals about a publisher
    uses_skills:
      - calibrate   # keep bias/COI findings rationale-backed and consistently calibrated
      - gap-audit   # detect sources lacking an independence/COI assessment
    uses_tools:
      - source_reliability_checker   # score bias signals (side-effect: governance + trace)
      - evidence_reader              # read provenance / inventory to ground the screening
      - artifact_writer              # write SOURCE_BIAS_CONFLICT_REPORT (side-effect: governance + trace)
      - evidence_writer              # write screening evidence (side-effect: governance + trace)
    uses_governance_profiles:
      - research_source_governance   # source admissibility / independence rules
      - evidence_required            # canonical (stage contract uses the _policy variant)
      - no_self_approval             # canonical (screening is independent of the producing discovery role)
    uses_audit_schemas:
      - source_evidence_schema       # evidence schema (the bias/COI findings attach to source evidence)
      - stage_gate_trace_schema      # trace schema (distinct from evidence)
    uses_model_provider_profiles:
      - source_evaluation_model      # capability_scope includes provenance_and_bias_assessment
    uses_context_memory_profiles:
      - source_corpus_context_pack
    permissions:
      - read_source_inventory_and_provenance
      - screen_bias_and_conflict_of_interest
      - author_bias_conflict_report
      - write_evidence_and_trace
    forbidden_actions:
      - approve_or_block_the_source_reliability_gate   # gate decision belongs to source_reliability_agent
      - set_the_final_reliability_score                # the parent owns the composite score
      - solely_validate_the_sources_it_screens         # cross_validation re-checks independently (no self-approval)
      - mutate_source_inventory_or_provenance
      - bypass_a_blocking_governance_gate
    returns_to: source_reliability_agent
    blocks_when:
      - undisclosed_conflict_of_interest_in_load_bearing_source
      - bias_assessment_missing_for_a_candidate_source
      - independence_not_assessed_for_a_load_bearing_source

  # ---------------------------------------------------------------------------
  # 10) independent_replication_subagent
  #     RESEARCH stage #8 (cross_validation, owner: cross_validation_agent).
  #     NEW (research professional-grade calibration): mirrors the SDLC bug_hunter_subagent pattern
  #     (a dedicated sub-agent under an independent gate stage). Independently RE-DERIVES reliability
  #     scores and claim->evidence mappings — the operational meaning of evidence-chain replicability
  #     by a separate role. NO-SELF-APPROVAL is intrinsic: parent cross_validation_agent is distinct
  #     from every producing agent.
  # ---------------------------------------------------------------------------
  - sub_agent_id: independent_replication_subagent
    parent_agent: cross_validation_agent
    team_lead_direct_call_allowed: false
    mission: >-
      Independently re-derive — without reusing the producers' working — the source-reliability scores
      and the claim->evidence mappings for load-bearing claims, then report every divergence from the
      producing stages (score deltas, mapping disagreements, uncorroborated single-source claims).
      This is an independent REPLICATION of the evidence chain by a separate role, handed up to
      cross_validation_agent, which adjudicates and decides the gate. The sub-agent replicates and
      reports; it does not decide the cross-validation gate and never validates work it produced.
    activation_conditions:
      - parent_agent_invokes_during_cross_validation
      - producing_stage_scores_and_mappings_available_for_independent_recheck
    inputs:
      - SOURCE_RELIABILITY_REPORT
      - CLAIM_EVIDENCE_MAP
      - SINGLE_SOURCE_CLAIM_FLAGS
      - CONTRADICTION_REGISTER
    outputs:
      - REPLICATION_DIVERGENCE_REPORT   # where independent re-derivation diverged from the producers
    uses_core_abilities:
      - Memory   # recall the producing stages' outputs and the source corpus
      - Web      # independently re-fetch source material to confirm support/contradiction
    uses_skills:
      - llm-council   # multi-perspective independent re-derivation / adjudication input
      - calibrate     # keep re-derived scores rationale-backed and consistently calibrated
    uses_tools:
      - source_reliability_checker   # independently re-score sources (side-effect: governance + trace)
      - evidence_reader              # read the producers' evidence to re-check it
      - artifact_writer              # write REPLICATION_DIVERGENCE_REPORT (side-effect: governance + trace)
      - evidence_writer              # write replication evidence (side-effect: governance + trace)
    uses_governance_profiles:
      - no_self_approval             # canonical (validator role distinct from producer roles)
      - research_source_governance
      - evidence_required            # canonical (stage contract uses the _policy variant)
    uses_audit_schemas:
      - claim_evidence_schema        # evidence schema (re-checked mappings)
      - source_evidence_schema       # evidence schema (re-checked scores)
      - stage_gate_trace_schema      # trace schema (distinct from evidence)
    uses_model_provider_profiles:
      - source_evaluation_model
    uses_context_memory_profiles:
      - claim_evidence_context_pack
    permissions:
      - independently_re_derive_scores_and_mappings
      - author_replication_divergence_report
      - write_evidence_and_trace
    forbidden_actions:
      - approve_or_block_the_cross_validation_gate     # gate decision belongs to cross_validation_agent
      - validate_scores_or_mappings_it_itself_produced  # it produced none; preserves producer != validator
      - mutate_the_producing_stages_evidence_artifacts
      - bypass_a_blocking_governance_gate
    returns_to: cross_validation_agent
    blocks_when:
      - material_replication_divergence_unresolved
      - single_source_load_bearing_claim_uncorroborated
      - critical_source_reliability_conflict_unresolved

  # ---------------------------------------------------------------------------
  # 11) research_evidence_graph_subagent
  #     RESEARCH stage #11 (research_completion, owner: research_completion_agent).
  #     NEW (research professional-grade calibration): the research analogue of the SDLC
  #     evidence_trace_subagent — assembles + integrity-audits the end-to-end research evidence graph
  #     and the reproducibility audit, and hands them up to research_completion_agent (which decides
  #     the terminal gate). Evidence/trace assembly + integrity audit, NOT a defect sweep.
  # ---------------------------------------------------------------------------
  - sub_agent_id: research_evidence_graph_subagent
    parent_agent: research_completion_agent
    team_lead_direct_call_allowed: false
    mission: >-
      Assemble the end-to-end research evidence DAG — goal -> research question -> pre-registered
      protocol -> source (+provenance) -> reliability score -> claim -> mapped evidence ->
      cross-validation -> uncertainty -> cited synthesis — and audit it for completeness, internal
      consistency, and reproducibility against the registered RESEARCH_PROTOCOL: no orphan
      load-bearing claim, no broken link, every used source scored, every load-bearing claim mapped
      and cited. Hands RESEARCH_EVIDENCE_GRAPH + REPRODUCIBILITY_AUDIT to research_completion_agent.
      This is evidence/trace assembly and integrity auditing — NOT defect finding and NOT synthesis.
    activation_conditions:
      - parent_agent_invokes_during_research_completion
      - upstream_stage_evidence_and_gate_results_available
    inputs:
      - RESEARCH_PROTOCOL
      - SOURCE_RELIABILITY_REPORT
      - CLAIM_EVIDENCE_MAP
      - CROSS_VALIDATION_REPORT
      - UNCERTAINTY_REPORT
      - RESEARCH_SYNTHESIS
      - CITATION_INDEX
      - CITATION_INTEGRITY_REPORT
      - ALL_STAGE_GATE_RESULTS
    outputs:
      - RESEARCH_EVIDENCE_GRAPH
      - REPRODUCIBILITY_AUDIT          # confirms the chain re-walks against the registered protocol
    uses_core_abilities:
      - Memory   # recall the full run history: questions, protocol, scores, mappings, gate results
      - Web      # spot-re-verify a cited source passage while auditing the chain
    uses_skills:
      - gap-audit   # detect orphan load-bearing claims, missing nodes and broken chain links
    uses_tools:
      - evidence_reader   # read all upstream evidence + gate results to build/audit the graph
      - artifact_writer   # write RESEARCH_EVIDENCE_GRAPH / REPRODUCIBILITY_AUDIT (side-effect: governance + trace)
      - evidence_writer   # write stage evidence (side-effect: governance + trace)
    uses_governance_profiles:
      - evidence_required            # canonical (stage contract uses the _policy variant)
      - citation_required_gate       # the graph must reflect a passing citation gate
      - no_self_approval             # canonical (author != the completion gate decider)
    uses_audit_schemas:
      - source_evidence_schema       # evidence schema (source nodes)
      - claim_evidence_schema        # evidence schema (claim->evidence nodes)
      - stage_gate_trace_schema      # trace schema (distinct from evidence)
    uses_model_provider_profiles:
      - research_reasoning_profile
    uses_context_memory_profiles:
      - research_run_context
    permissions:
      - read_all_upstream_evidence_and_gate_results
      - assemble_research_evidence_graph_and_reproducibility_audit
      - run_completeness_and_consistency_checks
      - write_evidence_and_trace
    forbidden_actions:
      - approve_or_block_the_research_completion_gate   # gate decision belongs to research_completion_agent
      - fabricate_or_alter_upstream_evidence_artifacts   # may link/audit, must not mutate sources
      - author_or_edit_the_research_synthesis            # synthesis is research_synthesis_agent's artifact
      - bypass_a_blocking_governance_gate
    returns_to: research_completion_agent
    blocks_when:
      - missing_required_evidence
      - orphan_load_bearing_claim
      - broken_evidence_chain_link
      - inconsistent_research_evidence_graph

  # ---------------------------------------------------------------------------
  # 12) activation_health_watch_subagent
  #     ACTIVATION stage #8 (post_activation_monitoring, owner: activation_manager_agent).
  #     NEW (activation professional-grade calibration): decomposes live health-signal evaluation
  #     over the soak window from the terminal gate decision. Watches post-activation telemetry vs
  #     HEALTH_BASELINE + ABORT_CRITERIA and returns a health verdict; the parent decides the gate.
  # ---------------------------------------------------------------------------
  - sub_agent_id: activation_health_watch_subagent
    parent_agent: activation_manager_agent
    team_lead_direct_call_allowed: false
    mission: >-
      Over the bounded post-activation monitoring/soak window, watch the activated target's live
      telemetry against the pre-exposure HEALTH_BASELINE and the pre-registered ABORT_CRITERIA:
      compute health-vs-baseline deltas, detect any abort-criterion breach, and judge whether the
      activation held stable for the full window. Hands a HEALTH_WATCH_VERDICT up to
      activation_manager_agent, which decides the terminal gate (and, on regression/breach, routes to
      rollback_readiness). This sub-agent observes and reports a verdict; it never decides the gate and
      never finalizes the activation.
    activation_conditions:
      - parent_agent_invokes_during_post_activation_monitoring
      - activation_executed_and_baseline_and_abort_criteria_available
    inputs:
      - ACTIVATION_COMPLETION_REPORT
      - HEALTH_BASELINE
      - ABORT_CRITERIA
    outputs:
      - HEALTH_WATCH_VERDICT          # soak-window health-vs-baseline + abort-breach + stability verdict
    uses_core_abilities:
      - OS       # observe the live activated target / drive the monitoring window
      - Memory   # recall the baseline and abort criteria to compare live signals against
    uses_skills:
      - gap-audit   # detect unobserved abort signals or incomplete soak coverage
      - calibrate   # keep the stability verdict rationale-backed against the baseline/window
    uses_tools:
      - telemetry_reader   # read live telemetry and compute health-vs-baseline deltas
      - evidence_reader    # read the activation evidence package to ground the watch
      - artifact_writer    # write HEALTH_WATCH_VERDICT (side-effect: governance + trace)
      - evidence_writer    # write watch evidence (side-effect: governance + trace)
    uses_governance_profiles:
      - activation_pipeline_governance   # activation-layer governance
      - evidence_required                # canonical (stage contract uses the _policy variant)
      - no_self_approval                 # canonical (verdict is independent of the gate decision)
    uses_audit_schemas:
      - activation_evidence_schema       # evidence schema (the health-watch verdict)
      - stage_gate_trace_schema          # trace schema (distinct from evidence)
    uses_model_provider_profiles:
      - risk_analysis_model              # evaluate post-activation signals as risk, not just raw metrics
    uses_context_memory_profiles:
      - activation_run_context
      - activation_decision_context_pack
    permissions:
      - observe_live_telemetry_over_the_soak_window
      - compute_health_vs_baseline_and_detect_abort_breach
      - author_health_watch_verdict
      - write_evidence_and_trace
    forbidden_actions:
      - approve_or_block_the_post_activation_monitoring_gate   # gate decision belongs to activation_manager_agent
      - finalize_or_close_the_activation                       # terminal closure is the parent's gate
      - trigger_rollback_itself                                # rollback execution is rollback_readiness's owned action
      - mutate_the_activation_evidence_package
      - bypass_a_blocking_governance_gate
    returns_to: activation_manager_agent
    blocks_when:
      - post_activation_health_regressed_beyond_baseline
      - post_activation_abort_criterion_breached
      - activation_unstable_during_monitoring_window

  # ---------------------------------------------------------------------------
  # 13) blast_radius_assessment_subagent
  #     OPERATIONS stage #2 (severity_classification, owner: severity_classification_agent).
  #     NEW (operations professional-grade calibration): decomposes customer/safety/data blast-radius
  #     impact analysis from the core severity scoring. Authors the IMPACT_ASSESSMENT_REPORT; the
  #     parent agent decides the severity and the gate.
  # ---------------------------------------------------------------------------
  - sub_agent_id: blast_radius_assessment_subagent
    parent_agent: severity_classification_agent
    team_lead_direct_call_allowed: false
    mission: >-
      Decompose the customer / safety / data blast-radius impact of the incident — who and what is
      affected, worst-credible impact, and the spread surface — and author an IMPACT_ASSESSMENT_REPORT
      with rationale that grounds the severity estimate. Hands the impact assessment up to
      severity_classification_agent, which assigns the severity level, binds the SLA/escalation, and
      decides the gate. This sub-agent assesses and reports impact; it does not assign severity and
      does not decide the gate.
    activation_conditions:
      - parent_agent_invokes_during_severity_classification
      - incident_record_and_initial_observations_available_for_impact_analysis
    inputs:
      - INCIDENT_RECORD
      - AFFECTED_CAPABILITY_REF
      - INITIAL_OBSERVATIONS
      - INCIDENT_CONDITIONAL_FLAGS     # safety_sensitive / customer_facing / regulated raise impact strictness
    outputs:
      - IMPACT_ASSESSMENT_REPORT       # decomposed customer/safety/data blast-radius impact handed to the parent
    uses_core_abilities:
      - Memory   # recall prior incidents on this capability and their realized impact
      - Web      # consult external blast-radius signals (dependency status, customer-facing surface)
    uses_skills:
      - fmea             # failure-mode and effect reasoning over the impact surface
      - sentinel         # adversarial blast-radius foresight (worst-credible-impact)
      - bayesian-update  # revise impact estimate as evidence arrives
    uses_tools:
      - monitoring_query_tool   # quantify current blast radius from live monitoring (side-effect: governance + trace)
      - evidence_reader         # read the incident record / observations to ground the assessment
      - artifact_writer         # write IMPACT_ASSESSMENT_REPORT (side-effect: governance + trace)
      - evidence_writer         # write assessment evidence (side-effect: governance + trace)
    uses_governance_profiles:
      - operations_pipeline_governance   # operations-layer governance
      - evidence_required                # canonical (stage contract uses the _policy variant)
      - no_self_approval                 # canonical (impact assessment independent of the severity decision)
    uses_audit_schemas:
      - severity_classification_evidence_schema   # evidence schema (the impact assessment)
      - stage_gate_trace_schema                   # trace schema (distinct from evidence)
    uses_model_provider_profiles:
      - incident_triage_model
    uses_context_memory_profiles:
      - operations_run_context
      - incident_context_pack
    permissions:
      - read_incident_record_and_observations
      - assess_customer_safety_and_data_blast_radius
      - author_impact_assessment_report
      - write_evidence_and_trace
    forbidden_actions:
      - assign_the_severity_level                       # severity is the parent's owned decision
      - approve_or_block_the_severity_classification_gate   # gate decision belongs to severity_classification_agent
      - bind_the_sla_or_escalation_threshold            # the parent binds SLA/escalation from policy
      - mutate_the_incident_record
      - bypass_a_blocking_governance_gate
    returns_to: severity_classification_agent
    blocks_when:
      - blast_radius_not_estimated_for_the_incident
      - customer_or_safety_impact_unassessed_for_a_customer_facing_or_safety_sensitive_incident

  # ---------------------------------------------------------------------------
  # 14) skill_abuse_redteam_subagent
  #     SKILL_GOVERNANCE stage #4 (skill_misuse_redteam, owner: skill_runtime_safety_agent).
  #     NEW (skill_governance professional-grade calibration): decomposes the adversarial abuse-probe
  #     sweep from the gate decision. Runs prompt-injection / tool-misuse / context-poisoning /
  #     locked-semantics-coercion probes and returns findings; the parent decides the gate.
  # ---------------------------------------------------------------------------
  - sub_agent_id: skill_abuse_redteam_subagent
    parent_agent: skill_runtime_safety_agent
    team_lead_direct_call_allowed: false
    mission: >-
      Adversarially probe the skill's runtime surface — can it be coerced outside its locked semantics
      (prism driven to a decision/readiness gate, verification-loop driven to a release guarantee),
      coerced into unsafe/over-privileged tool delegation, or used as a prompt-injection /
      context-poisoning vector — running the abuse-path defect sweep under verification-loop's LOCKED
      defect-finding discipline, and author a SKILL_MISUSE_REDTEAM_REPORT of findings with severity.
      Hands the findings up to skill_runtime_safety_agent, which decides the gate. This sub-agent
      red-teams and reports; it does not decide the gate.
    activation_conditions:
      - parent_agent_invokes_during_skill_misuse_redteam
      - skill_semantics_and_permission_scope_available_for_adversarial_probing
    inputs:
      - SKILL_SEMANTIC_EXTRACT          # the locked semantics / not_for to attack
      - SCRIPT_REFERENCE_AUDIT_REPORT   # static findings that scope the abuse surface
      - SKILL_PERMISSION_SCOPE_MAP      # the least-privilege scope the probes test against
    outputs:
      - SKILL_MISUSE_REDTEAM_REPORT     # adversarial findings: coercion / injection / tool-misuse / poisoning, with severity
    uses_core_abilities:
      - Coder        # drive injection / tool-misuse / poisoning probes against the skill surface
      - OS           # execute the eval / probe harness
      - Memory       # recall the threat surface, semantics and permission scope
      - Supervisor   # reason over the tool-delegation / multi-step abuse surface
    uses_skills:
      - verification-loop   # LOCKED bug/defect-finding: adversarial abuse-path defect sweep (NOT readiness)
      - sentinel            # premortem the skill against misuse / coercion / privilege-escalation paths
      - llm-council         # multi-perspective adjudication of finding severity / exploitability
      - calibrate           # calibrate finding severity / false-positive rate of the abuse probes
    uses_tools:
      - prompt_injection_tester   # probe: can the skill be prompt-injected past its semantics (side-effect: governance + trace)
      - tool_misuse_tester        # probe: can the skill be coerced into unsafe / over-privileged tool use (side-effect: governance + trace)
      - context_poisoning_tester  # probe: can the skill be used as a context-poisoning vector (side-effect: governance + trace)
      - agent_permission_auditor  # confirm probes respect / expose the audited permission scope
      - eval_runner               # run the adversarial misuse eval suite (side-effect: governance + trace)
      - artifact_writer           # write SKILL_MISUSE_REDTEAM_REPORT (side-effect: governance + trace)
      - evidence_writer           # write stage evidence (side-effect: governance + trace)
    uses_governance_profiles:
      - skill_governance_pipeline_governance   # skill-governance-layer governance
      - agentic_safety_governance              # adversarial agent/skill-behaviour safety
      - tool_misuse_governance                 # stage-specific tool-misuse gate profile
      - context_safety_governance              # stage-specific context-safety gate profile
      - locked_semantics_enforcement_policy    # re-checked adversarially: semantics must hold under coercion
      - evidence_required                      # canonical (stage contract uses the _policy variant)
      - no_self_approval                       # canonical (red-team findings independent of the gate decision)
    uses_audit_schemas:
      - agentic_eval_evidence_schema    # evidence schema: adversarial eval findings
      - prompt_injection_test_schema    # evidence schema: injection/coercion probe results
      - skill_governance_trace_schema   # trace schema (distinct from evidence)
    uses_model_provider_profiles:
      - script_safety_analysis_model    # adversarial safety reasoning over the skill surface
    uses_context_memory_profiles:
      - skill_governance_run_context
      - skill_semantic_context_pack
    permissions:
      - run_adversarial_abuse_probes_against_the_skill_surface
      - reproduce_and_triage_abuse_path_defects
      - author_skill_misuse_redteam_report
      - write_evidence_and_trace
    forbidden_actions:
      - use_verification_loop_as_a_readiness_checklist   # LOCKED semantic boundary
      - approve_or_block_the_skill_misuse_redteam_gate   # gate decision belongs to skill_runtime_safety_agent
      - record_the_skill_activation_decision             # activation is the parent's owned decision (separate stage)
      - run_adversarial_probes_against_production_or_non_sandboxed_targets
      - bypass_a_blocking_governance_gate
    returns_to: skill_runtime_safety_agent
    blocks_when:
      - locked_semantics_coercion_succeeded        # skill could be driven outside its locked semantics
      - unsafe_tool_delegation_via_skill            # skill coerced into unsafe / over-privileged tool use
      - skill_injection_or_poisoning_vector_found

  # ---------------------------------------------------------------------------
  # 15) sensitive_content_detection_subagent
  #     KNOWLEDGE/MEMORY stage #2 (source_classification, owner: source_classification_agent).
  #     NEW (knowledge professional-grade calibration): decomposes PII/secret/regulated-content
  #     detection from the classification decision. Detects + reports; the parent decides the gate
  #     (and applies redaction where detection requires it).
  # ---------------------------------------------------------------------------
  - sub_agent_id: sensitive_content_detection_subagent
    parent_agent: source_classification_agent
    team_lead_direct_call_allowed: false
    mission: >-
      Scan the candidate memory for sensitive content — personally identifiable information, secrets /
      credentials, and regulated content — and author a SENSITIVE_CONTENT_DETECTION_REPORT identifying
      the redactable spans and the sensitivity that each finding implies. Hands the detection up to
      source_classification_agent, which sets the sensitivity classification, applies redaction where
      required, and decides the gate. This sub-agent detects and reports; it does not set the
      classification, does not apply redaction, and does not decide the gate.
    activation_conditions:
      - parent_agent_invokes_during_source_classification
      - candidate_memory_available_for_sensitive_content_scan
    inputs:
      - MEMORY_INTAKE_RECORD       # the normalized candidate from intake (#1)
      - TARGET_KNOWLEDGE_SCOPE     # regulated scope -> stricter detection
      - INTAKE_SENSITIVITY_HINT    # the first-pass sensitivity signal from intake; pre-warns the detector
    outputs:
      - SENSITIVE_CONTENT_DETECTION_REPORT   # PII / secrets / regulated-content findings handed to the parent
    uses_core_abilities:
      - Memory   # recall the candidate record and prior sensitivity determinations of this source
      - Web      # consult origin / publisher signals that bear on regulated-content classification
    uses_skills:
      - gap-audit   # find candidate content lacking a sensitivity determination / undetected sensitive spans
    uses_tools:
      - source_classifier     # surface origin/sensitivity signals to ground detection (side-effect: governance + trace)
      - redaction_tool         # detect redactable spans (detection only; the parent applies redaction) (side-effect: governance + trace)
      - provenance_recorder    # record the detection result in the item's provenance chain (side-effect: governance + trace)
      - evidence_writer        # write detection evidence (side-effect: governance + trace)
    uses_governance_profiles:
      - memory_source_governance   # corpus admissibility / sensitivity rules
      - redaction_required_gate    # detection feeds the conditional redaction requirement
      - evidence_required          # canonical
      - no_self_approval           # canonical (detection independent of the classification decision)
    uses_audit_schemas:
      - memory_provenance_schema   # evidence schema (the detection attaches to provenance)
      - stage_gate_trace_schema    # trace schema (distinct from evidence)
    uses_model_provider_profiles:
      - knowledge_reasoning_profile
    uses_context_memory_profiles:
      - knowledge_run_context
      - memory_candidate_context_pack
    permissions:
      - scan_candidate_memory_for_pii_secrets_and_regulated_content
      - author_sensitive_content_detection_report
      - write_evidence_and_trace
    forbidden_actions:
      - set_the_sensitivity_classification          # classification is the parent's owned decision
      - apply_or_finalize_redaction                 # the parent applies redaction when required
      - approve_or_block_the_source_classification_gate   # gate decision belongs to source_classification_agent
      - mutate_the_memory_intake_record
      - bypass_a_blocking_governance_gate
    returns_to: source_classification_agent
    blocks_when:
      - sensitive_content_scan_not_run_for_a_candidate
      - undetected_sensitive_span_in_a_candidate_admitted_downstream

  # ---------------------------------------------------------------------------
  # 16) corpus_conflict_detection_subagent
  #     KNOWLEDGE/MEMORY stage #4 (knowledge_conflict_resolution, owner: knowledge_reconciliation_agent).
  #     NEW (knowledge professional-grade calibration): decomposes duplicate/contradiction detection
  #     against the existing corpus from the disposition decision. Detects + reports the conflict set;
  #     the parent decides the disposition (supersede/merge/coexist/reject) and the gate.
  # ---------------------------------------------------------------------------
  - sub_agent_id: corpus_conflict_detection_subagent
    parent_agent: knowledge_reconciliation_agent
    team_lead_direct_call_allowed: false
    mission: >-
      Compare the classified, redacted, summarized candidate against the memory the curated corpus
      already holds and detect duplicate or contradictory existing memories — overlapping coverage,
      double-counted evidence, and mutually-contradictory facts — authoring a CORPUS_CONFLICT_SET of
      the detected duplicates/contradictions with rationale. Hands the conflict set up to
      knowledge_reconciliation_agent, which decides each disposition (supersede / merge / coexist /
      reject) and the gate. This sub-agent detects and reports; it does not decide the disposition and
      does not decide the gate.
    activation_conditions:
      - parent_agent_invokes_during_knowledge_conflict_resolution
      - candidate_summary_and_existing_corpus_available_for_comparison
    inputs:
      - MEMORY_SUMMARY                 # the grounded summary from summary_generation (#3)
      - SOURCE_CLASSIFICATION_REPORT   # trust tier / sensitivity inform which source could win a conflict
      - MEMORY_PROVENANCE_RECORD       # the candidate's provenance to compare lineage against the corpus
    outputs:
      - CORPUS_CONFLICT_SET            # the duplicate/contradictory existing memories detected, handed to the parent
    uses_core_abilities:
      - Memory   # recall the existing curated corpus + this candidate to compare them
      - Web      # corroborate which of two conflicting sources is current/authoritative (independence signals)
    uses_skills:
      - gap-audit         # detect duplicate / overlapping / contradictory coverage against the corpus
      - bayesian-update   # weigh corroboration/recency/trust signals on each detected conflict (evidence, not decision)
    uses_tools:
      - provenance_recorder   # record the detection in the item's provenance chain (side-effect: governance + trace)
      - artifact_writer       # write CORPUS_CONFLICT_SET (side-effect: governance + trace)
      - evidence_writer       # write detection evidence (side-effect: governance + trace)
    uses_governance_profiles:
      - memory_source_governance   # corpus admissibility + trust-tier rules frame what counts as a conflict
      - evidence_required          # canonical
      - no_self_approval           # canonical (detection independent of the disposition decision)
    uses_audit_schemas:
      - memory_provenance_schema   # evidence schema (the detected conflict set attaches to provenance)
      - stage_gate_trace_schema    # trace schema (distinct from evidence)
    uses_model_provider_profiles:
      - knowledge_reasoning_profile
    uses_context_memory_profiles:
      - knowledge_run_context
      - memory_candidate_context_pack
      - retrieval_profile_context_pack   # the corpus/profile the candidate is compared against
    permissions:
      - compare_candidate_against_the_existing_corpus
      - detect_duplicate_and_contradictory_memories
      - author_corpus_conflict_set
      - write_evidence_and_trace
    forbidden_actions:
      - decide_the_conflict_disposition             # supersede/merge/coexist/reject is the parent's owned decision
      - approve_or_block_the_conflict_resolution_gate   # gate decision belongs to knowledge_reconciliation_agent
      - retire_or_supersede_an_existing_memory       # acting on a disposition is the parent's / downstream's role
      - mutate_an_existing_corpus_memory
      - bypass_a_blocking_governance_gate
    returns_to: knowledge_reconciliation_agent
    blocks_when:
      - corpus_conflict_scan_not_run
      - duplicate_or_contradiction_detected_but_unreported

  # ---------------------------------------------------------------------------
  # 17) memory_lifecycle_audit_subagent
  #     KNOWLEDGE/MEMORY stage #7 (memory_expiration_review, owner: memory_expiration_agent).
  #     NEW (knowledge professional-grade calibration): the knowledge analogue of the SDLC
  #     evidence_trace_subagent — assembles + integrity-audits the item's end-to-end provenance chain
  #     and hands the audit up to memory_expiration_agent (which decides the terminal gate).
  #     Evidence/trace assembly + integrity audit, NOT a defect sweep.
  # ---------------------------------------------------------------------------
  - sub_agent_id: memory_lifecycle_audit_subagent
    parent_agent: memory_expiration_agent
    team_lead_direct_call_allowed: false
    mission: >-
      Assemble the item's end-to-end provenance chain — intake -> classification (+sensitive-content
      detection) -> grounded summary -> conflict disposition -> validity window -> retrieval update ->
      expiration/deletion outcome — and audit it for completeness and integrity: no broken link, no
      missing lifecycle event, every disposition and window recorded. Author a
      MEMORY_LIFECYCLE_PROVENANCE_AUDIT and hand it up to memory_expiration_agent, which decides the
      terminal gate. This is provenance-chain assembly and integrity auditing — NOT defect finding and
      NOT a re-decision of any prior lifecycle outcome; the sub-agent assembles and reports.
    activation_conditions:
      - parent_agent_invokes_during_memory_expiration_review
      - item_lifecycle_history_and_provenance_record_available
    inputs:
      - MEMORY_PROVENANCE_RECORD          # the cumulative provenance chain to finalize / audit
      - MEMORY_EXPIRATION_REVIEW_REPORT   # the per-item outcome whose evidence the audit closes over
      - VALIDITY_WINDOW_DECISION          # the window whose horizon triggered review
    outputs:
      - MEMORY_LIFECYCLE_PROVENANCE_AUDIT   # the end-to-end provenance-chain completeness/integrity audit
    uses_core_abilities:
      - Memory   # recall the item's full lifecycle history and all stage evidence
      - OS       # invoke the provenance/evidence readers to walk and check the chain
    uses_skills:
      - gap-audit   # detect a broken provenance link, a missing lifecycle event or an orphan record
    uses_tools:
      - provenance_recorder   # finalize / annotate the audited provenance chain (side-effect: governance + trace)
      - evidence_reader       # read the full lifecycle evidence to assemble and check the chain
      - evidence_writer       # write audit evidence (side-effect: governance + trace)
    uses_governance_profiles:
      - memory_source_governance   # corpus/provenance governance
      - evidence_required          # canonical
      - no_self_approval           # canonical (author != the terminal gate decider)
    uses_audit_schemas:
      - memory_provenance_schema   # evidence schema (the assembled/audited provenance chain)
      - stage_gate_trace_schema    # trace schema (distinct from evidence)
    uses_model_provider_profiles:
      - knowledge_reasoning_profile
    uses_context_memory_profiles:
      - knowledge_run_context
      - retrieval_profile_context_pack
    permissions:
      - read_all_lifecycle_evidence_for_the_item
      - assemble_and_integrity_audit_the_provenance_chain
      - author_memory_lifecycle_provenance_audit
      - write_evidence_and_trace
    forbidden_actions:
      - approve_or_block_the_expiration_review_gate   # gate decision belongs to memory_expiration_agent
      - re_decide_any_prior_lifecycle_outcome         # classification/disposition/window/expiry are not re-opened here
      - fabricate_or_alter_recorded_provenance_events  # may finalize/annotate; must not mutate recorded history
      - bypass_a_blocking_governance_gate
    returns_to: memory_expiration_agent
    blocks_when:
      - provenance_chain_incomplete
      - broken_provenance_link_detected
      - missing_lifecycle_event_in_the_chain

# ---------------------------------------------------------------------------------------------------
# Coverage / invariant summary (for the catalog reviewer):
#   - 17 distinct sub-agents: the 8 SDLC sub-agents referenced across the 31 SDLC stage YAMLs
#     (stages 3, 6 [x2], 8, 13, 15, 16, 28; skill_governance reuses skill_semantic_extractor_subagent)
#     PLUS 3 research sub-agents added for professional-grade research calibration:
#       source_bias_screening_subagent (research #5, parent source_reliability_agent),
#       independent_replication_subagent (research #8, parent cross_validation_agent),
#       research_evidence_graph_subagent (research #11, parent research_completion_agent),
#     PLUS 6 NEW sub-agents for the activation / operations / skill_governance / knowledge-memory
#     pipeline upgrades:
#       activation_health_watch_subagent (activation #8, parent activation_manager_agent),
#       blast_radius_assessment_subagent (operations #2, parent severity_classification_agent),
#       skill_abuse_redteam_subagent (skill_governance #4, parent skill_runtime_safety_agent),
#       sensitive_content_detection_subagent (knowledge #2, parent source_classification_agent),
#       corpus_conflict_detection_subagent (knowledge #4, parent knowledge_reconciliation_agent),
#       memory_lifecycle_audit_subagent (knowledge #7, parent memory_expiration_agent).
#   - No orphans: every entry has a parent_agent and team_lead_direct_call_allowed: false.
#   - Every parent_agent is an agent_roles entry (SDLC: skill_librarian_agent, architecture_agent,
#     security_privacy_agent, qa_agent, security_validation_agent, evidence_graph_agent; RESEARCH:
#     source_reliability_agent, cross_validation_agent, research_completion_agent; ACTIVATION:
#     activation_manager_agent; OPERATIONS: severity_classification_agent; SKILL_GOVERNANCE:
#     skill_runtime_safety_agent; KNOWLEDGE: source_classification_agent, knowledge_reconciliation_agent,
#     memory_expiration_agent) — none is a Core Ability, none is a Team Lead. knowledge_reconciliation_agent
#     is the NEW knowledge_team Agent added to agent_roles.yaml alongside these.
#   - No Core Ability appears as a sub_agent. Skill != Tool, Governance != Audit, Evidence != Trace.
#   - No sub-agent decides a gate or approves its own work; each returns_to its parent_agent. The
#     research sub-agents preserve producer != validator: the bias screener does not validate its own
#     screening (cross_validation re-checks), the replication sub-agent produces nothing it later
#     validates, and the evidence-graph sub-agent assembles but does not decide the completion gate.
#     The 6 new sub-agents are likewise analysts/authors: the health watcher returns a verdict (parent
#     decides the terminal gate and rollback), the blast-radius assessor reports impact (parent assigns
#     severity), the abuse red-team reports findings (parent decides the gate; verification-loop stays
#     defect-finding-only), the sensitive-content + corpus-conflict detectors detect+report (parents
#     classify / decide disposition), and the lifecycle auditor assembles+audits the provenance chain
#     (parent decides the terminal gate).
