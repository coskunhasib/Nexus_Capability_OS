    retention: retain_with_release_evidence
    redaction_rules:
      - no_raw_secret_exposure
      - redact_prompt_completion_secrets
    used_by:
      pipelines:
        - sdlc_pipeline
        - research_pipeline
        - activation_pipeline
        - operations_pipeline
        - skill_governance_pipeline
        - knowledge_memory_pipeline
      registries:
        - model_provider_profiles      # ALL 22 profiles bind model_invocation_trace_schema
      agents:
        - all_model_invoking_agents

  - id: skill_activation_trace_schema
    name: Skill Activation Trace Schema
    type: trace_schema
    status: candidate
    purpose: >-
      Trace record shape for a skill activation — the operation history of which
      Skill was activated, by whom, with what inputs/outputs (doc 03 §12 "skill
