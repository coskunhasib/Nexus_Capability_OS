    owner_domain: nexus_global_governance
    allowed_usage:
      - Record skill-activation provenance for any Skill activation across any
        pipeline.
      - Serve as the trace requirement attached by every skill registry item
        (skill_class_defaults bind it so EVERY skill activation emits this).
    forbidden_usage:
      - Used as a decision proof (that is an evidence_schema record).
      - Merged with any evidence_schema record (Evidence != Trace).
      - Treated as a tool_call_trace_schema (Skill != Tool).
    governance_profiles:
      - global_trace_required_policy
      - skill_activation_governance
    audit_schemas:
      - stage_gate_trace_schema        # companion gate trace (kept distinct)
    notes: >-
      Field set binds to configs/nexus-ai/schemas/trace_item.schema.json
      (related_skill populated). Bound by EVERY item in configs/nexus-ai/
      skills_registry.yaml and governance/skill/skills.yaml. Skill != Tool is
      preserved: this is distinct from tool_call_trace_schema.
    applies_to:
      - all_pipelines
      - skill_activation_provenance
    required_fields:
      - trace_id
      - type
      - actor
      - action
      - related_skill
      - input_refs
      - output_refs
      - status
      - timestamp
    producer: activating_agent
    consumer: evidence_graph_agent
    retention: retain_with_release_evidence
    redaction_rules:
      - no_raw_secret_exposure
    used_by:
      pipelines:
        - sdlc_pipeline
        - research_pipeline
        - activation_pipeline
        - operations_pipeline
        - skill_governance_pipeline
        - knowledge_memory_pipeline
      registries:
        - skills_registry              # EVERY skill binds skill_activation_trace_schema
      agents:
        - all_skill_activating_agents

  - id: context_usage_trace_schema
    name: Context Usage Trace Schema
    type: trace_schema
    status: candidate
    purpose: >-
      Trace record shape for context-memory usage — the operation history of which
      stage read/wrote which context slice (doc 03 §12). Process history, never
      decision proof.
    owner_domain: nexus_global_governance
    allowed_usage:
      - Record context read/write provenance for any context_memory_profile.
      - Serve as the trace requirement attached by every context-memory profile.
    forbidden_usage:
      - Used as a decision proof (that is an evidence_schema record).
      - Merged with any evidence_schema record (Evidence != Trace).
    governance_profiles:
      - global_trace_required_policy
      - context_access_governance
    audit_schemas:
      - stage_gate_trace_schema        # companion gate trace (kept distinct)
    notes: >-
      Field set binds to configs/nexus-ai/schemas/trace_item.schema.json. Bound by
      the context packs in configs/nexus-ai/context_memory_profiles.yaml under
      audit_schemas. Memory is a Core Ability (capability layer) and is never the
      producer/consumer here.
    applies_to:
      - all_pipelines
      - context_usage_provenance
    required_fields:
      - trace_id
      - type
      - actor
      - action
      - related_stage
      - input_refs
      - output_refs
      - status
      - timestamp
    producer: context_consuming_agent
    consumer: evidence_graph_agent
    retention: retain_with_release_evidence
    redaction_rules:
      - no_raw_secret_exposure
      - redact_pii_in_context_slice
    used_by:
      pipelines:
        - sdlc_pipeline
        - research_pipeline
        - activation_pipeline
        - operations_pipeline
        - skill_governance_pipeline
        - knowledge_memory_pipeline
      registries:
        - context_memory_profiles      # context packs bind context_usage_trace_schema
      agents:
        - all_context_consuming_agents

  - id: core_ability_invocation_trace_schema
    name: Core Ability Invocation Trace Schema
    type: trace_schema
    status: candidate
    purpose: >-
      Trace record shape for a Core Ability invocation — the operation history of
      when a Core Ability (Supervisor/Coder/Vision/Audio/Creative/Memory/Web/OS)
      was invoked as a capability layer (doc 03 §12). Process history, never
      decision proof.
    owner_domain: nexus_global_governance
    allowed_usage:
      - Record Core-Ability invocation provenance as a capability-layer trace.
      - Serve as the trace requirement attached by Core Ability registry items.
    forbidden_usage:
      - Used as a decision proof (that is an evidence_schema record).
      - Merged with any evidence_schema record (Evidence != Trace).
      - Read as evidence that a Core Ability is an agent — it is NOT; the Core
        Ability appears only in related_core_ability (capability layer), never as
        producer/consumer/owner.
    governance_profiles:
      - global_trace_required_policy
    audit_schemas:
      - tool_call_trace_schema         # co-emitted when the ability is tool-backed (kept distinct)
    notes: >-
      Field set binds to configs/nexus-ai/schemas/trace_item.schema.json
      (related_core_ability populated from the locked closed set). Declared
      `owned_by: configs/nexus-ai/audit_schemas.yaml` by configs/nexus-ai/
      core_abilities.yaml; this is its defining home. producer/consumer are
      snake_case Agent roles, NEVER a Core Ability.
    applies_to:
      - all_pipelines
      - core_ability_invocation_provenance
    required_fields:
      - trace_id
      - type
      - actor
      - action
      - related_core_ability
      - input_refs
      - output_refs
      - status
      - timestamp
    producer: invoking_agent
    consumer: evidence_graph_agent
    retention: retain_with_release_evidence
    redaction_rules:
      - no_raw_secret_exposure
    used_by:
      pipelines:
        - sdlc_pipeline
        - research_pipeline
        - activation_pipeline
        - operations_pipeline
        - skill_governance_pipeline
        - knowledge_memory_pipeline
      registries:
        - core_abilities               # declares owned_by this registry; binds the trace
      agents:
        - all_core_ability_invoking_agents

  - id: source_fetch_trace_schema
    name: Source Fetch Trace Schema
    type: trace_schema
    status: candidate
    purpose: >-
      Trace record shape for an external source fetch — the operation history of a
      Web-backed external fetch and its provenance (research pipeline source-fetch
      trace; doc 03 §12). Process history, never decision proof.
    owner_domain: nexus_global_governance
    allowed_usage:
      - Record external-fetch provenance (URL/source, fetch outcome, provenance)
        for Web-backed fetches, primarily in the research pipeline.
    forbidden_usage:
      - Used as a decision proof (that is source_evidence_schema, an evidence_schema).
      - Merged with any evidence_schema record (Evidence != Trace).
      - Treating fetched content as trusted without an attached provenance trace.
    governance_profiles:
      - global_trace_required_policy
      - web_access_governance
    audit_schemas:
      - source_evidence_schema         # the source decision proof whose fetch path it traces (kept distinct)
      - tool_call_trace_schema
    notes: >-
      Field set binds to configs/nexus-ai/schemas/trace_item.schema.json
      (related_core_ability may be Web). Declared `owned_by: configs/nexus-ai/
      audit_schemas.yaml` by configs/nexus-ai/core_abilities.yaml; this is its
      defining home. Distinct from source_evidence_schema (Evidence != Trace).
    applies_to:
      - research_pipeline
      - source_fetch_provenance
    required_fields:
      - trace_id
      - type
      - actor
      - action
      - related_tool
      - related_core_ability
      - input_refs
      - output_refs
      - status
      - timestamp
    producer: source_reliability_agent
    consumer: evidence_graph_agent
    retention: retain_with_research_report
    redaction_rules:
      - no_raw_secret_exposure
      - redact_paywalled_source_content
    used_by:
      pipelines:
        - research_pipeline
      registries:
        - core_abilities               # Web ability declares owned_by this registry; binds the trace
      agents:
        - source_reliability_agent

  # ===========================================================================
  # NEW (candidate) SCHEMAS — introduced by the 5 non-SDLC pipelines
  # (doc 16 / pipeline-catalog-review §4.2). Referenced but not yet ratified;
  # to be confirmed in Phase E (doc 19). NEW = status: candidate.
  # ===========================================================================

  # ----- Research pipeline ---------------------------------------------------

  - id: source_evidence_schema
    name: Source Evidence Schema
    type: evidence_schema
    status: candidate
    purpose: >-
      Decision-proof record for a scored research source (provenance, reliability
      score + rationale, related claims).
    owner_domain: research_and_knowledge
    allowed_usage:
      - Record source-reliability decision-proof evidence in the research pipeline.
    forbidden_usage:
      - Used to record process history (trace_schema).
    governance_profiles:
      - evidence_required_policy   # canonical id evidence_required; bound under its _policy variant in the research pipeline
      - research_source_governance
      - citation_required_gate
    audit_schemas:
      - claim_evidence_schema
      - stage_gate_trace_schema
    notes: NEW (research). Reliability score must carry a rationale (advisory confidence_calibrated).
    applies_to:
      - research_pipeline
      - research_stage:source_reliability_assessment
    required_fields:
      - evidence_id
      - type
      - produced_by
      - related_stage
      - source_id
      - provenance
      - reliability_score
      - reliability_rationale
      - related_claims
      - status
      - created_at
    producer: source_reliability_agent
    consumer: cross_validation_agent
    retention: retain_with_research_report
    redaction_rules:
      - no_raw_secret_exposure
      - redact_paywalled_source_content
    used_by:
      pipelines: [research_pipeline]
      stages: [source_reliability_assessment]
      agents: [source_reliability_agent]

  - id: claim_evidence_schema
    name: Claim Evidence Schema
    type: evidence_schema
    status: candidate
    purpose: >-
      Decision-proof record for a claim→evidence mapping (claim, supporting/
      contradicting evidence, support strength, confidence).
    owner_domain: research_and_knowledge
    allowed_usage:
      - Record claim→evidence mapping decision proofs in the research pipeline.
    forbidden_usage:
      - Used to record process history (trace_schema).
    governance_profiles:
      - evidence_required_policy
      - research_source_governance
      - citation_required_gate
    audit_schemas:
      - source_evidence_schema
      - stage_gate_trace_schema
    notes: NEW (research). Each claim must map to supporting/contradicting evidence with a confidence value.
    applies_to:
      - research_pipeline
      - research_stage:claim_evidence_mapping
      - research_stage:cross_validation
    required_fields:
      - evidence_id
      - type
      - produced_by
      - related_stage
      - claim_id
      - supporting_evidence
      - contradicting_evidence
      - support_strength
      - confidence
      - status
      - created_at
    producer: claim_evidence_agent
    consumer: research_synthesis_agent
    retention: retain_with_research_report
    redaction_rules:
      - no_raw_secret_exposure
    used_by:
      pipelines: [research_pipeline]
      stages: [claim_evidence_mapping, cross_validation]
      agents: [claim_evidence_agent, cross_validation_agent]

  # ----- Product Discovery pipeline ------------------------------------------

  - id: discovery_evidence_schema
    name: Discovery Evidence Schema
    type: evidence_schema
    status: candidate
    purpose: >-
      Decision-proof record for a product-discovery artifact (IDEA_BRIEF, KILL_CRITERIA,
      PROBLEM_EVIDENCE_REPORT, ASSUMPTION_TEST_REPORT, FEASIBILITY_REPORT, BUSINESS_CASE,
      DISCOVERY_DECISION). Captures the decision reference, kill-criteria status, and source
      citations behind each load-bearing discovery claim.
    owner_domain: product_management
    allowed_usage:
      - Record discovery decision-proof evidence across the product discovery pipeline stages.
    forbidden_usage:
      - Used to record process history (trace_schema).
    governance_profiles:
      - evidence_required_policy   # canonical id evidence_required; bound under its _policy variant in the discovery pipeline
      - discovery_pipeline_governance
      - go_no_go_decision_gate
    audit_schemas:
      - stage_gate_trace_schema
    notes: >-
      NEW (product_discovery_pipeline plan §1b). Consumed by discovery_decision_agent at the GO/NO_GO
      decision and by sdlc intake on a GO handoff. Kill-criteria status must be recorded on every record.
    applies_to:
      - product_discovery_pipeline
      - discovery_stage:discovery_intake
      - discovery_stage:problem_evidence_validation
      - discovery_stage:assumption_and_demand_testing
      - discovery_stage:feasibility_assessment
      - discovery_stage:business_case_assembly
      - discovery_stage:go_no_go_decision
      - discovery_stage:discovery_handoff_and_closeout
    required_fields:
      - artifact_id
      - producing_stage
      - evidence_type
      - decision_reference
      - kill_criteria_status
      - source_citations
      - decision_timestamp
      - status
    producer: discovery_stage_owner_agents
    consumer: discovery_decision_agent
    retention: retain_with_discovery_decision
    redaction_rules:
      - no_raw_secret_exposure
      - redact_confidential_market_or_user_data
    used_by:
      pipelines: [product_discovery_pipeline]
      stages: [discovery_intake, problem_evidence_validation, assumption_and_demand_testing, feasibility_assessment, business_case_assembly, go_no_go_decision, discovery_handoff_and_closeout]
      agents: [discovery_intake_agent, problem_validation_agent, feasibility_assessment_agent, business_case_agent, discovery_decision_agent]

  # ----- Activation pipeline -------------------------------------------------

  - id: activation_evidence_schema
    name: Activation Evidence Schema
    type: evidence_schema
    status: candidate
    purpose: >-
      Decision-proof record for activation lifecycle artifacts (PREVIEW_RESULT,
      PILOT_RESULT, ACTIVATION_DECISION, ROLLBACK_PLAN). (doc 03 §13)
    owner_domain: activation_and_release_operations
    allowed_usage:
      - Record preview/pilot/activation decision-proof evidence.
    forbidden_usage:
      - Used to record activation stage-transition history (that is activation_transition_trace_schema).
    governance_profiles:
      - evidence_required_policy
      - activation_pipeline_governance
      - preview_required_gate
      - pilot_evidence_gate
    audit_schemas:
      - activation_decision_evidence_schema
      - rollback_readiness_evidence_schema
      - activation_transition_trace_schema
      - stage_gate_trace_schema
    notes: NEW (activation). Base activation evidence; superadmin preview required before pilot, pilot evidence required before public activation.
    aliases:
      - pilot_evidence_schema   # pipeline_catalog.yaml activation row headline evidence (preview/pilot ride on this base)
    applies_to:
      - activation_pipeline
      - activation_stage:superadmin_preview
      - activation_stage:pilot_activation
      - activation_stage:pilot_evidence_review
    required_fields:
      - evidence_id
      - type
      - produced_by
      - related_stage
      - activation_phase
      - source_artifacts
      - summary
      - status
      - created_at
    producer: activation_manager_agent
    consumer: activation_owner_decision_agent
    retention: retain_with_activation_record
    redaction_rules:
      - no_raw_secret_exposure
      - redact_cohort_user_identifiers
    used_by:
      pipelines: [activation_pipeline]
      stages: [superadmin_preview, pilot_activation, pilot_evidence_review]
      agents: [activation_manager_agent, pilot_activation_agent, activation_reviewer_agent]

  - id: activation_decision_evidence_schema
    name: Activation Decision Evidence Schema
    type: decision_record_schema
    status: candidate
    purpose: >-
      Decision-record (decision proof) for the public-activation go/no-go
      decision (ACTIVATION_DECISION). Evidence family, NOT trace.
    owner_domain: activation_and_release_operations
    allowed_usage:
      - Record the public-activation owner decision as a decision-proof record.
    forbidden_usage:
      - Used to record stage-transition history (that is activation_transition_trace_schema).
      - Self-approved by the proposing agent (the authorizing actor is the human owner; no_self_approval).
    governance_profiles:
      - evidence_required_policy
      - no_self_approval_policy
      - owner_activation_decision_gate
    audit_schemas:
      - activation_evidence_schema
      - activation_transition_trace_schema
      - stage_gate_trace_schema
    notes: >-
      NEW (activation). type decision_record_schema = a recorded decision PROOF
      (Evidence family), kept strictly distinct from the transition trace. The
      authorizing actor is the human owner (recorded/routed by
      activation_owner_decision_agent), not an autonomous agent.
    applies_to:
      - activation_pipeline
      - activation_stage:public_activation_decision
    required_fields:
      - evidence_id
      - type
      - produced_by
      - related_stage
      - related_gate
      - decision
      - decision_rationale
      - authorizing_actor
      - source_artifacts
      - status
      - created_at
    producer: activation_owner_decision_agent
    consumer: policy_and_evidence_engine
    retention: retain_with_activation_record
    redaction_rules:
      - no_raw_secret_exposure
    used_by:
      pipelines: [activation_pipeline]
      stages: [public_activation_decision]
      agents: [activation_owner_decision_agent]

  - id: rollback_readiness_evidence_schema
    name: Rollback Readiness Evidence Schema
    type: evidence_schema
    status: candidate
    purpose: Decision-proof record for activation rollback readiness (ROLLBACK_PLAN present and drilled).
    owner_domain: activation_and_release_operations
    allowed_usage:
      - Record activation rollback-readiness decision-proof evidence.
    forbidden_usage:
      - Used to record process history (trace_schema).
      - Confused with the SDLC rollback_validation_schema or the operations rollback_fix_evidence_schema.
    governance_profiles:
      - evidence_required_policy
      - activation_pipeline_governance
      - rollback_required_gate
    audit_schemas:
      - activation_evidence_schema
      - activation_transition_trace_schema
      - stage_gate_trace_schema
    notes: NEW (activation). Rollback plan must be present and drilled before public activation; distinct from SDLC/operations rollback schemas.
    applies_to:
      - activation_pipeline
      - activation_stage:rollback_readiness
    required_fields:
      - evidence_id
      - type
      - produced_by
      - related_stage
      - rollback_plan_present
      - rollback_drilled
      - source_artifacts
      - status
      - created_at
    producer: rollback_readiness_agent
    consumer: activation_owner_decision_agent
    retention: retain_with_activation_record
    redaction_rules:
      - no_raw_secret_exposure
    used_by:
      pipelines: [activation_pipeline]
      stages: [rollback_readiness]
      agents: [rollback_readiness_agent]

  - id: activation_transition_trace_schema
    name: Activation Transition Trace Schema
    type: trace_schema
    status: candidate
    purpose: >-
      Trace record for activation stage transitions — the operation history of
      moving between activation phases (e.g. owner_decision_trace,
      rollback_drill_trace).
    owner_domain: activation_and_release_operations
    allowed_usage:
      - Record activation stage-transition / phase-change lineage.
    forbidden_usage:
      - Used as an activation decision proof itself (that is activation_decision_evidence_schema).
    governance_profiles:
      - global_trace_required_policy
      - activation_pipeline_governance
    audit_schemas:
      - activation_evidence_schema
      - activation_decision_evidence_schema
    notes: NEW (activation). The single NEW trace schema for activation; process history that supports — but is distinct from — activation evidence.
    aliases:
      - activation_trace_schema   # pipeline_catalog.yaml activation row headline trace
    applies_to:
      - activation_pipeline
      - activation_transition_provenance
    required_fields:
      - trace_id
      - type
      - actor
      - action
      - related_stage
      - from_phase
      - to_phase
      - input_refs
      - output_refs
      - status
      - timestamp
    producer: activation_manager_agent
    consumer: evidence_graph_agent
    retention: retain_with_activation_record
    redaction_rules:
      - no_raw_secret_exposure
      - redact_cohort_user_identifiers
    used_by:
      pipelines: [activation_pipeline]
      stages: [activation_intake, superadmin_preview, pilot_activation, pilot_evidence_review, public_activation_decision, rollback_readiness, activation_completion]
      agents: [activation_manager_agent]

