# =============================================================================
# UNUSED TYPE — gate_result_schema (reconciliation sweep R14)
# =============================================================================
# The §12 / type_vocabulary list includes `gate_result_schema` (an Evidence-family
# type: a gate decision proof). DECISION (R14): keep it as an INTENTIONALLY-UNUSED
# type — the catalog defines NO first-class item of this type today, and NO file in
# configs/nexus-ai references a `gate_result_schema` *id* (verified: every
# occurrence is a type-vocabulary word or prose mention, never a `- gate_result_schema`
# id binding). Gate outcomes ride on the `related_gate` + count fields of the
# evidence_schema items and on release_evidence_schema, so introducing a standalone
# item would add an unreferenced (dangling-from-the-other-direction) registry entry.
# The type is retained in the vocabulary for forward-compatibility and to keep the
# Evidence-family taxonomy (evidence_schema | decision_record_schema |
# gate_result_schema) complete. This supersedes the open question in
# configs/nexus-ai/audit/evidence_schemas/_index.yaml (gate_result_schema): the
# embedded-on-evidence approach is the chosen one; no first-class item is added.
gate_result_schema_disposition:
  type: gate_result_schema
  family: evidence              # Evidence != Trace — a gate decision proof, never process history
  status: intentionally_unused
  first_class_item: false
  id_references_in_corpus: 0    # only type-vocabulary / prose mentions exist
  rationale: >-
    Gate outcomes are carried on related_gate + count fields of evidence_schema
    items and on release_evidence_schema; no standalone gate_result_schema item is
    referenced, so none is registered (avoids an unreferenced registry entry).

# =============================================================================
# MATERIALIZATION COVERAGE — catalog ↔ audit/ layer round-trip (R5)
# =============================================================================
# Reconciliation sweep R5 (the original 66-vs-64 gap):
#   The Phase C catalog's PIPELINE-MATERIALIZED set is 66 items (55 type:
#   evidence_schema + 9 type: trace_schema + 2 type: decision_record_schema). The
#   applicable layer under configs/nexus-ai/audit/ previously covered only 64 (the
#   55 evidence_schema in audit/evidence_schemas/ + the 9 trace_schema in
#   audit/trace_schemas/), leaving the 2 decision_record_schema items unplaced — the
#   66-vs-64 gap. PLACEMENT DECISION: the 2 decision-record items are Evidence
#   FAMILY (decision proofs) but a DISTINCT type, so they belong in a dedicated
#   configs/nexus-ai/audit/decision_records/ directory (the option recommended in
#   audit/evidence_schemas/_index.yaml open_questions) — NEVER under
#   audit/trace_schemas/ (Evidence != Trace). With that placement the pipeline-
#   materialized set round-trips 1:1: 66 = 55 + 9 + 2. (Materializing the
#   decision_records/*.yaml files is a Phase E step; this block records the binding
#   so the catalog is the single source the applicable layer must agree with.)
#
# Sweep R1 added 7 CROSS-CUTTING infrastructure schemas (tool_call_trace_schema,
# evidence_item_schema, model_invocation_trace_schema, skill_activation_trace_schema,
# context_usage_trace_schema, core_ability_invocation_trace_schema,
# source_fetch_trace_schema). These are generic base shapes bound at the
# capability/binding-registry level (tools/models/skills/context/core-abilities),
# NOT per-pipeline-stage, so they are a SEPARATE materialization class: their field
# sets bind directly to the locked JSON Schemas
# configs/nexus-ai/schemas/{trace_item,evidence_item}.schema.json rather than to a
# per-pipeline audit/ file. Grand catalog total is therefore 73 = 66 pipeline-
# materialized + 7 cross-cutting.
materialization_coverage:
  catalog_total: 73                  # all first-class items in this registry
  pipeline_materialized_total: 66    # R5 1:1 scope (55 evidence + 9 trace + 2 decision_record)
  cross_cutting_total: 7             # R1 infra schemas, bound to the locked JSON Schemas
  by_type:
    evidence_schema:
      count: 56                      # 55 pipeline-materialized + 1 cross-cutting (evidence_item_schema)
      pipeline_materialized: 55
      cross_cutting: 1               # evidence_item_schema
      materialized_in: configs/nexus-ai/audit/evidence_schemas/
      status: materialized
    trace_schema:
      count: 15                      # 9 pipeline-materialized + 6 cross-cutting
      pipeline_materialized: 9
      cross_cutting: 6               # tool_call / model_invocation / skill_activation / context_usage / core_ability_invocation / source_fetch
      materialized_in: configs/nexus-ai/audit/trace_schemas/
      status: materialized
    decision_record_schema:
      count: 2
      materialized_in: configs/nexus-ai/audit/decision_records/   # dedicated dir; NOT trace_schemas/ (Evidence != Trace)
      status: placement_decided_pending_phase_e
      items:
        - activation_decision_evidence_schema
        - skill_binding_decision_schema
    gate_result_schema:
      count: 0
      materialized_in: null
      status: intentionally_unused   # see gate_result_schema_disposition (R14)
  cross_cutting_schemas:
    bound_to_json_schema: true       # field sets bind to schemas/{trace_item,evidence_item}.schema.json
    items:
      - {id: evidence_item_schema, type: evidence_schema, binds: configs/nexus-ai/schemas/evidence_item.schema.json}
      - {id: tool_call_trace_schema, type: trace_schema, binds: configs/nexus-ai/schemas/trace_item.schema.json}
      - {id: model_invocation_trace_schema, type: trace_schema, binds: configs/nexus-ai/schemas/trace_item.schema.json}
      - {id: skill_activation_trace_schema, type: trace_schema, binds: configs/nexus-ai/schemas/trace_item.schema.json}
      - {id: context_usage_trace_schema, type: trace_schema, binds: configs/nexus-ai/schemas/trace_item.schema.json}
      - {id: core_ability_invocation_trace_schema, type: trace_schema, binds: configs/nexus-ai/schemas/trace_item.schema.json}
      - {id: source_fetch_trace_schema, type: trace_schema, binds: configs/nexus-ai/schemas/trace_item.schema.json}
  round_trip_1to1: true              # pipeline-materialized: 55 + 9 + 2 + 0 == 66; grand total 66 + 7 == 73
  evidence_family_total: 58          # 56 evidence_schema + 2 decision_record_schema (gate_result_schema unused)
  trace_family_total: 15
  note: >-
    Evidence family (58: 56 evidence_schema + 2 decision_record_schema) and Trace
    family (15 trace_schema) are kept strictly distinct; the pipeline-materialized
    halves live in physically separate directories and are NEVER merged. The 7
    cross-cutting items bind to the locked JSON Schemas. The decision_records/
    placement preserves Evidence != Trace.

# =============================================================================
# CROSS-FILE NOTES
# =============================================================================
cross_file_notes:
  - The base evidence/trace field sets mirror configs/nexus-ai/schemas/
    evidence_item.schema.json and configs/nexus-ai/schemas/trace_item.schema.json
    (the locked JSON Schemas). Stage-specific required_fields lists add only the
    domain-specific fields on top of the base contract.
  - Phase E (doc 19) will materialize per-schema files under
    configs/nexus-ai/audit/evidence_schemas/*.yaml and
    configs/nexus-ai/audit/trace_schemas/*.yaml. This registry is the single
    catalog those per-schema files must agree with.
  - Governance profile ids referenced in `governance_profiles` are defined in the
    SEPARATE configs/nexus-ai/governance_profiles.yaml (Governance != Audit).
  - producer/consumer agent roles are cataloged in Phase D
    (docs/nexus-ai-orchestration-model/legacy/18-* / configs team-agent catalogs); none is a Core
    Ability.
