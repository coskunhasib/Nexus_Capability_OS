# =============================================================================
# NAMING RECONCILIATION — *_policy variants
# =============================================================================
# The 5 non-SDLC pipelines bind two canonical policy families under a *_policy
# variant name. Per the task's naming-reconciliation rule these are recorded as
# aliases of the canonical governance ids (which live in governance_profiles.yaml,
# NOT here — those are governance, not audit). This block documents the mapping so
# the audit-schema `governance_profiles` references above remain traceable to a
# single canonical id during Phase E.
governance_profile_aliases:
  no_self_approval:
    canonical_id: no_self_approval        # doc 06 §3 (blocker)
    aliases: [no_self_approval_policy]
    used_by_pipelines: [activation_pipeline, operations_pipeline, skill_governance_pipeline]
  evidence_required:
    canonical_id: evidence_required       # doc 06 §3 (blocker)
    aliases: [evidence_required_policy]
    used_by_pipelines: [research_pipeline, activation_pipeline, operations_pipeline, skill_governance_pipeline, knowledge_memory_pipeline]

# =============================================================================
# AUDIT-SCHEMA-ID NAMING RECONCILIATION — variant spellings → canonical id
# =============================================================================
# Reconciliation sweep (R2 + catalog/context naming variants). Several files refer
# to an audit schema by a summary/variant spelling rather than the canonical
# registry id. Per the sweep's naming rule we RECORD AN ALIAS rather than mass-
# renaming the referring files. Every entry below is also mirrored on the canonical
# item's `aliases:` field, so the mapping is discoverable from either direction and
# the audit-id edge resolves to a first-class item. Evidence != Trace is preserved:
# each variant maps to a canonical id of the SAME family (an evidence variant never
# maps to a trace id and vice-versa).
audit_schema_aliases:

  # ----- R2: gate-decision trace -------------------------------------------
  stage_gate_decision_trace:
    canonical_id: stage_gate_trace_schema        # type: trace_schema
    family: trace
    note: >-
      The gate-DECISION flavor of the canonical gate-evaluation trace. Used in the
      `trace` list of the review-gate stage contracts (07 architecture_review,
      12 code_review, 20 api_contract_compatibility_validation,
      21 domain_regulatory_compliance_validation_if_applicable),
      configs/nexus-ai/sdlc_pipeline.yaml, and bound (alongside
      stage_gate_trace_schema) by the global_trace_required_policy in
      configs/nexus-ai/governance_profiles.yaml. It is the same Trace record shape;
      the gate outcome it traces is the decision proof (Evidence), kept distinct.
    referenced_in:
      - configs/nexus-ai/sdlc_pipeline.yaml
      - configs/nexus-ai/stages/sdlc/07-architecture-review.yaml
      - configs/nexus-ai/stages/sdlc/12-code-review.yaml
      - configs/nexus-ai/stages/sdlc/20-api-contract-compatibility-validation.yaml
      - configs/nexus-ai/stages/sdlc/21-domain-regulatory-compliance-validation-if-applicable.yaml
      - configs/nexus-ai/governance_profiles.yaml
      - configs/nexus-ai/governance/pipeline/sdlc.yaml
      - configs/nexus-ai/governance/pipeline/operations.yaml

  # ----- catalog/context summary-name variants → canonical ids --------------
  decision_trace_schema:
    canonical_id: stage_gate_trace_schema        # type: trace_schema
    family: trace
    note: Multi-perspective / release decision-history trace; the canonical gate trace.
    referenced_in:
      - configs/nexus-ai/context_memory_profiles.yaml
      - configs/nexus-ai/skills_registry.yaml
  research_trace_schema:
    canonical_id: stage_gate_trace_schema        # type: trace_schema
    family: trace
    note: Research pipeline catalog-row headline trace; reuses the canonical gate trace.
    referenced_in: [configs/nexus-ai/pipeline_catalog.yaml]
  operations_trace_schema:
    canonical_id: stage_gate_trace_schema        # type: trace_schema
    family: trace
    note: Operations pipeline catalog-row headline trace; reuses the canonical gate trace.
    referenced_in: [configs/nexus-ai/pipeline_catalog.yaml]
  memory_trace_schema:
    canonical_id: stage_gate_trace_schema        # type: trace_schema
    family: trace
    note: >-
      Knowledge/memory pipeline catalog-row headline trace; memory_provenance_schema
      binds stage_gate_trace_schema as its only trace, so the canonical gate trace.
    referenced_in: [configs/nexus-ai/pipeline_catalog.yaml]
  activation_trace_schema:
    canonical_id: activation_transition_trace_schema   # type: trace_schema
    family: trace
    note: Activation pipeline catalog-row headline trace.
    referenced_in: [configs/nexus-ai/pipeline_catalog.yaml]
  pilot_evidence_schema:
    canonical_id: activation_evidence_schema      # type: evidence_schema
    family: evidence
    note: Preview/pilot evidence rides on the base activation evidence schema.
    referenced_in: [configs/nexus-ai/pipeline_catalog.yaml]
  memory_ingestion_evidence_schema:
    canonical_id: memory_provenance_schema        # type: evidence_schema
    family: evidence
    note: Knowledge/memory intake evidence; the single knowledge/memory evidence schema.
    referenced_in: [configs/nexus-ai/pipeline_catalog.yaml]
  memory_validity_evidence_schema:
    canonical_id: memory_provenance_schema        # type: evidence_schema
    family: evidence
    note: Validity-window evidence; carried as the validity_window field/stage of memory_provenance_schema.
    referenced_in: [configs/nexus-ai/pipeline_catalog.yaml]
  skill_extraction_evidence_schema:
    canonical_id: skill_semantic_extract_schema   # type: evidence_schema
    family: evidence
    note: Skill-governance catalog-row headline extraction evidence.
    referenced_in: [configs/nexus-ai/pipeline_catalog.yaml]
  skill_safety_evidence_schema:
