  # ===========================================================================
  # CROSS-CUTTING (candidate) INFRASTRUCTURE SCHEMAS
  # ---------------------------------------------------------------------------
  # Registered here (reconciliation sweep R1) so every audit-id bound by the
  # capability/binding registries resolves to a first-class item:
  #   - tool_call_trace_schema           bound by configs/nexus-ai/tools_registry.yaml
  #     (EVERY tool) + governance/tool/tools.yaml + context_memory_profiles.yaml.
  #   - evidence_item_schema             bound by side-effecting tools that emit a
  #     gate-relevant result (tools_registry.yaml) + governance/tool/tools.yaml;
  #     field shape in configs/nexus-ai/artifact_registry.yaml.
  #   - model_invocation_trace_schema    bound by ALL 22 model profiles
  #     (configs/nexus-ai/model_provider_profiles.yaml).
  #   - skill_activation_trace_schema    bound by EVERY skill
  #     (configs/nexus-ai/skills_registry.yaml) + governance/skill/skills.yaml.
  #   - context_usage_trace_schema       bound by the context-memory profiles
  #     (configs/nexus-ai/context_memory_profiles.yaml).
  #   - core_ability_invocation_trace_schema and source_fetch_trace_schema are
  #     already declared `owned_by: configs/nexus-ai/audit_schemas.yaml`
  #     (status: candidate) by configs/nexus-ai/core_abilities.yaml; this is their
  #     defining home.
  # These are the generic Evidence/Trace base shapes; their field sets bind to the
  # locked JSON Schemas configs/nexus-ai/schemas/{trace_item,evidence_item}.schema.json.
  # Evidence != Trace is preserved: evidence_item_schema is the ONLY evidence-family
  # item here; the other six are trace_schema.
  # ===========================================================================

  - id: tool_call_trace_schema
    name: Tool Call Trace Schema
    type: trace_schema
    status: candidate
    purpose: >-
      Generic Trace record shape for a single tool call — the operation history of
      who called which tool, with what inputs/outputs and decision (doc 03 §12
      "tool call trace"). Process history, never decision proof. The trace
      requirement bound by EVERY tool in the Tools Registry.
    owner_domain: nexus_global_governance
    allowed_usage:
      - Record tool-call provenance (caller, tool, inputs, outputs, status, time)
        for any tool invocation across any pipeline.
      - Serve as the trace requirement attached by every tool registry item.
    forbidden_usage:
      - Used as the decision proof of a gate (that is an evidence_schema /
        gate-relevant evidence_item_schema record).
      - Merged with any evidence_schema record (Evidence != Trace).
    governance_profiles:
      - global_trace_required_policy   # alias of trace_required (governance_profiles.yaml)
      - tool_call_governance
    audit_schemas:
      - evidence_item_schema           # co-emitted by side-effecting tools that attach gate evidence (kept distinct)
    notes: >-
      Field set binds to configs/nexus-ai/schemas/trace_item.schema.json (related_tool
      populated). The single most widely bound trace requirement: every item in
      configs/nexus-ai/tools_registry.yaml lists it under audit_schemas. Bound as a
      capability-layer trace name, never owned/produced by a Core Ability.
    applies_to:
      - all_pipelines
      - tool_call_provenance
    required_fields:
      - trace_id
      - type
      - actor
      - action
      - related_tool
      - input_refs
      - output_refs
      - status
      - timestamp
    producer: invoking_agent          # the snake_case Agent role that called the tool
    consumer: evidence_graph_agent
    retention: retain_with_release_evidence
    redaction_rules:
      - no_raw_secret_exposure
      - redact_tool_call_arguments_containing_secrets
    used_by:
      pipelines:
        - sdlc_pipeline
        - research_pipeline
        - activation_pipeline
        - operations_pipeline
        - skill_governance_pipeline
        - knowledge_memory_pipeline
      registries:
        - tools_registry              # EVERY tool item binds tool_call_trace_schema
        - context_memory_profiles     # os_command_context binds it
        - core_abilities              # OS/Web tool-backed abilities bind it
      agents:
        - all_tool_invoking_agents

  - id: evidence_item_schema
    name: Evidence Item Schema
    type: evidence_schema
    status: candidate
    purpose: >-
      Generic Evidence record shape for a stage evidence item / gate result
      emitted directly by a side-effecting tool (e.g. evidence_writer). The
      base decision-proof shape; field set is the locked Evidence Contract.
    owner_domain: nexus_global_governance
    allowed_usage:
      - Record a generic stage evidence item / gate result attached by a
        side-effecting tool that emits gate-relevant evidence.
      - Serve as the evidence-record shape referenced by configs/nexus-ai/
        artifact_registry.yaml.
    forbidden_usage:
      - Used to record operation/process history (that is tool_call_trace_schema).
      - Merged with tool_call_trace_schema (Decision-Evidence != Tool-Trace).
    governance_profiles:
      - evidence_required
    audit_schemas:
      - tool_call_trace_schema         # the production-path trace it is co-emitted with (kept distinct)
    notes: >-
      Field set is the locked Evidence Contract — configs/nexus-ai/schemas/
      evidence_item.schema.json (07 §11) and the evidence_item_schema field block
      in configs/nexus-ai/artifact_registry.yaml. Generic base; specific SDLC/
      pipeline stages use their stage-specific evidence schemas above.
    applies_to:
      - all_pipelines
      - generic_tool_emitted_evidence
    required_fields:
      - evidence_id
      - type
      - produced_by
      - related_pipeline
      - related_run
      - related_stage
      - related_agent
      - related_sub_agent
      - related_gate
      - source_artifacts
      - summary
      - status
      - created_at
    producer: evidence_writer_invoking_agent   # snake_case Agent role driving the evidence_writer tool
    consumer: evidence_graph_agent
    retention: retain_with_release_evidence
    redaction_rules:
      - no_raw_secret_exposure
      - raw_credential_redaction
    used_by:
      pipelines:
        - sdlc_pipeline
        - research_pipeline
        - activation_pipeline
        - operations_pipeline
        - skill_governance_pipeline
        - knowledge_memory_pipeline
      registries:
        - tools_registry              # side-effecting tools that emit gate evidence bind it
        - artifact_registry           # evidence_item_schema field-shape definition
      agents:
        - all_evidence_emitting_agents

  - id: model_invocation_trace_schema
    name: Model Invocation Trace Schema
