# =============================================================================
# Nexus AI — Audit Schemas Registry
# =============================================================================
# Phase C / doc 17 §8 output. Documentation/blueprint only — NO runtime code,
# NO merge, NO deploy.
#
# This file is the single Shared-Registry source of truth for the AUDIT family
# (doc 03 §10, doc 05 §10, doc 06 §7/§10). It answers "what audit schemas exist
# in the system?". Per the usage-mapping rule (doc 05 §1, doc 17 §13) every item
# also carries `used_by` so the "shown again under each pipeline/stage/agent that
# uses it" relationship is enforceable from registry data alone — without parsing
# prose.
#
# -----------------------------------------------------------------------------
# LOCKED DECISIONS honored in this registry
# -----------------------------------------------------------------------------
#   - Plugin cancelled: no plugin registry, ever. No `plugin*` key appears.
#   - Audit != Governance. This file holds ONLY audit schemas (Evidence + Trace +
#     decision-record + gate-result). Governance profiles live in
#     configs/nexus-ai/governance_profiles.yaml (a SEPARATE file).
#   - Evidence != Trace (locked K-008 / doc 03 §10–§12; doc 19 §11). The two are
#     grouped under "Audit" but kept STRICTLY distinct and are NEVER merged:
#       * Evidence  = decision proof (karar kanıtı). type: evidence_schema.
#                     Also: decision_record_schema (a decision-proof record) and
#                     gate_result_schema (a gate decision-proof record) are
#                     evidence-family records — they are decision proofs, NOT
#                     process history.
#       * Trace     = operation/process history (işlem geçmişi). type:
#                     trace_schema. A trace proves the PRODUCTION PATH of evidence
#                     but is not itself evidence.
#     Decision proofs are type: evidence_schema (or decision_record_schema /
#     gate_result_schema). Trace records are type: trace_schema. See the
#     `type` field on every item.
#   - Core Abilities [Supervisor, Coder, Vision, Audio, Creative, Memory, Web, OS]
#     are NOT agents and NOT team members. They never appear as a `producer` or
#     `consumer` here (those are always snake_case Agent roles, gates, or the
#     policy/evidence engine). Supervisor != any *_team_lead.
#   - Skill != Tool.  Governance != Audit.  Evidence != Trace.
#
# -----------------------------------------------------------------------------
# REGISTRY ITEM CONTRACT (doc 17 §3) — every item carries:
#   id, name, type, status, purpose, owner_domain, allowed_usage,
#   forbidden_usage, governance_profiles, audit_schemas, notes
# PLUS category-specific fields (doc 17 §8 / doc 19 §12):
#   type (evidence_schema | trace_schema | decision_record_schema |
#         gate_result_schema), applies_to, required_fields, producer, consumer,
#   retention, redaction_rules
# PLUS:
#   used_by  — list of pipelines/stages/agents that reference this schema
#              (doc 17 §13: usage-mapping enforceable from registry data)
#   aliases  — (optional) variant names reconciled to this canonical id
#
# NOTE on `audit_schemas` contract field: for an *audit schema* item this field is
# the SELF-CATEGORY cross-reference (companion audit schemas it is co-emitted
# with). It does not introduce a new category; it keeps the §3 contract shape
# uniform across all registry files.
#
# -----------------------------------------------------------------------------
# STATUS vocabulary (doc 17 §3):
#   canonical   — locked / established (defined by SDLC or a locked concept doc)
#   candidate   — referenced by a pipeline but not yet ratified (NEW items)
#   deprecated  — retained for traceability; do not bind in new work
# Every item MUST have a status and at least one `used_by` entry (or status:
# candidate). NEW pipeline-introduced items are marked `candidate`.
# =============================================================================

version: draft-0.1
registry_id: nexus_ai_audit_schemas_registry
category: audit_schema
purpose: >-
  Canonical Shared-Registry catalog of all Nexus AI audit schemas (Evidence and
  Trace, kept strictly distinct), with usage mapping (used_by) so the
  shared-registry usage rule is enforceable from registry data. Documentation /
  blueprint only.

# ----- closed type vocabulary for this registry (doc 17 §8) -------------------
type_vocabulary:
  - evidence_schema          # decision proof (karar kanıtı) — Evidence family
  - trace_schema             # operation/process history (işlem geçmişi) — Trace family
  - decision_record_schema   # a recorded decision proof (Evidence family; not Trace)
  - gate_result_schema       # a gate decision proof (Evidence family; not Trace) — INTENTIONALLY UNUSED type (R14); see gate_result_schema_disposition

status_vocabulary:
  - canonical
  - candidate
  - deprecated

# ----- enforceable invariants (doc 17 §11/§13, doc 19 §14) -------------------
registry_rules:
  - Evidence and Trace are never merged; the `type` field on every item makes the
    distinction machine-checkable (evidence_schema/decision_record_schema/
    gate_result_schema are Evidence-family; trace_schema is Trace-family).
  - No plugin schema, plugin registry, or plugin concept exists anywhere.
  - producer and consumer are snake_case Agent roles, gate ids, or the
    policy/evidence engine — NEVER a Core Ability (Supervisor, Coder, Vision,
    Audio, Creative, Memory, Web, OS) and never a *_team_lead acting as approver
    of its own stage.
  - Every item has a status and at least one used_by entry (or status: candidate).
  - This file contains audit schemas only; governance profiles are a separate
    registry (Governance != Audit).
  - Every audit-schema id referenced anywhere in configs/nexus-ai resolves to a
    first-class item here OR to a recorded alias (audit_schema_aliases block); an
    alias always maps to a canonical id of the SAME family (Evidence != Trace is
    never crossed). gate_result_schema is an intentionally-unused type with no
    first-class item and no id references (gate_result_schema_disposition, R14).

# =============================================================================
# CANONICAL SCHEMAS
# =============================================================================
# These are locked/established. They are defined and produced by the existing
# SDLC pipeline (31 stage contracts in configs/nexus-ai/stages/sdlc/*.yaml and
# configs/nexus-ai/sdlc_pipeline.yaml) or by a locked concept doc.
# =============================================================================

audit_schemas:

  # ---------------------------------------------------------------------------
  # Cross-cutting canonical base schemas (the two pillars: 1 evidence, 1 trace)
  # ---------------------------------------------------------------------------

  - id: sdlc_pipeline_evidence_schema
    name: SDLC Pipeline Evidence Schema
    type: evidence_schema
    status: canonical
    purpose: >-
      Canonical base Evidence record shape for the SDLC pipeline — the
      decision-proof record that binds an artifact to a stage/agent/gate
      decision. Decision proof, never process history.
    owner_domain: sdlc
    allowed_usage:
      - Record decision-proof evidence for any SDLC stage that has no more
        specific stage evidence schema.
      - Serve as the base shape every stage-specific SDLC evidence schema extends.
    forbidden_usage:
      - Used to record operation/process history (that is a trace_schema).
      - Merged with stage_gate_trace_schema or any trace record.
    governance_profiles:
      - evidence_required
      - sdlc_development_completion_governance
    audit_schemas:
      - stage_gate_trace_schema   # co-emitted trace companion (kept distinct)
    notes: >-
      Field set is taken verbatim from configs/nexus-ai/schemas/
      evidence_item.schema.json (07 §11). Base evidence schema reused by the
      most SDLC stages.
    aliases:
      - requirements_evidence_schema   # requirements_run_context (context_memory_profiles.yaml) headline evidence for intake/requirements/planning
    # ---- category-specific fields (doc 17 §8 / doc 19 §12) ----
    applies_to:
      - sdlc_pipeline
      - sdlc_stage_evidence
    required_fields:
      - evidence_id
      - type
      - produced_by
      - related_pipeline
      - related_run
      - related_stage
      - related_agent
      - related_sub_agent
      - related_gate
      - source_artifacts
      - summary
      - status
      - created_at
    producer: stage_owner_agent          # the snake_case owner_agent of the emitting stage
    consumer: evidence_graph_agent        # consumed downstream into EVIDENCE_GRAPH (stage 28)
    retention: retain_with_release_evidence   # lifetime of the release package
    redaction_rules:
      - no_raw_secret_exposure
      - raw_credential_redaction
      - redact_pii_in_source_artifacts
    used_by:
      pipelines:
        - sdlc_pipeline
      stages:
        - intake
        - requirements
        - planning
        - supply_chain_sbom_license
        - cost_resource_governance
        - evidence_graph_build
        - development_completion
        - refraction_learning
      agents:
        - product_requirements_agent
        - release_manager_agent
        - evidence_graph_agent

  - id: stage_gate_trace_schema
    name: Stage Gate Trace Schema
    type: trace_schema
    status: canonical
    purpose: >-
      Canonical Trace record shape for gate-evaluation provenance — the
      operation history of how a stage gate was evaluated. Process history,
      never decision proof.
    owner_domain: sdlc
    allowed_usage:
      - Record the operation history of a stage gate evaluation (who/what ran,
        inputs, outputs, status, timestamp).
      - Reused cross-pipeline by every pipeline for gate-decision traces.
    forbidden_usage:
      - Used as the decision proof itself (that is a gate_result_schema /
        evidence_schema).
      - Merged with any evidence_schema record.
    governance_profiles:
      - global_trace_required_policy
    audit_schemas:
      - sdlc_pipeline_evidence_schema   # the evidence whose production path it traces
    notes: >-
      Field set from configs/nexus-ai/schemas/trace_item.schema.json (07 §12).
      The single most widely reused schema in the system: every SDLC stage and
      all 5 non-SDLC pipelines reuse it for gate-decision traces.
    aliases:
      # Variant spellings reconciled to this canonical id (reconciliation sweep
      # R2 + catalog/context naming variants). See audit_schema_aliases block.
      - stage_gate_decision_trace   # R2: gate-decision flavor used in review-gate stage `trace` lists
      - decision_trace_schema       # context_memory_profiles.yaml / skills_registry.yaml decision-history trace
      - research_trace_schema       # pipeline_catalog.yaml research row headline trace
      - operations_trace_schema     # pipeline_catalog.yaml operations row headline trace
      - memory_trace_schema         # pipeline_catalog.yaml knowledge/memory row headline trace
    applies_to:
      - all_pipelines
      - gate_evaluation
    required_fields:
      - trace_id
      - type
      - actor
      - action
      - related_pipeline
      - related_run
      - related_stage
      - related_skill
      - related_tool
      - related_core_ability
      - input_refs
      - output_refs
      - status
      - timestamp
    producer: stage_owner_agent
    consumer: evidence_graph_agent
    retention: retain_with_release_evidence
    redaction_rules:
      - no_raw_secret_exposure
      - raw_credential_redaction
      - redact_tool_call_arguments_containing_secrets
    used_by:
      pipelines:
        - sdlc_pipeline
        - research_pipeline
        - activation_pipeline
        - operations_pipeline
        - skill_governance_pipeline
        - knowledge_memory_pipeline
      stages:
        - ALL_SDLC_STAGES   # all 31 stage contracts list stage_gate_trace_schema
      agents:
        - all_stage_owner_agents

